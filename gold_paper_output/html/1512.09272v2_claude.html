<script>
window.KATEX_CONFIG = {

  throwOnError: false,

function typesetMath(el) {
  if (window.renderMathInElement) {
    try { renderMathInElement(el || document.body, window.KATEX_CONFIG); }

<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #fafafa; }
#header { background: #2c3e50; color: white; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; }
#header h1 { margin: 0; font-size: 18px; }
#header .hint { font-size: 12px; color: #aaa; font-style: italic; margin-left: 12px; }
#controls button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; background: #34495e; color: white; margin-left: 8px; }
#controls button:hover { background: #4a6785; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 24px; background: #f5f5f5; border-bottom: 1px solid #eee; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #777; }
#main { display: flex; height: calc(100vh - 82px); }
#svg-container { flex: 1; overflow: auto; padding: 10px; cursor: grab; }
#svg-container svg { transform-origin: 0 0; }
#detail-panel { width: 0; overflow-y: auto; background: white; border-left: 1px solid #ddd; transition: width 0.3s; }
#detail-panel.open { width: 380px; padding: 16px; }
.detail-section { margin-bottom: 12px; }
.detail-section h4 { margin: 0 0 6px; color: #444; font-size: 13px; text-transform: uppercase; }
.step-item { background: #f0f0f0; border-left: 3px solid #839192; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.step-arrow { text-align: center; color: #aaa; font-size: 14px; }
.eq-item { background: #d4e6f1; border-left: 3px solid #5dade2; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.orphan-item { background: #fef9e7; border-left: 3px solid #f39c12; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; }
#orphan-panel { position: fixed; bottom: 16px; right: 16px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-width: 350px; max-height: 400px; overflow-y: auto; display: none; padding: 12px; z-index: 100; }
#orphan-toggle { display: none; }
/* Hover effect on clickable node rects */
[id^="node_"]:hover { filter: brightness(0.90); }
.ghost-node { display: inline-block; margin: 4px 8px; padding: 8px 14px; background: #E0E0E0; border: 1.5px solid #757575; border-radius: 5px; font-size: 13px; color: #333; cursor: pointer; vertical-align: top; white-space: normal; max-width: 220px; }
.ghost-node:hover { background: #BDBDBD; }
.ghost-node .ghost-label { font-weight: bold; font-size: 13px; }
.ghost-node .ghost-refs { font-size: 11px; color: #666; margin-top: 3px; }
/* Toggle controls panel (Foundation, Examples & Remarks, Cited Results) */
.toggle-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: 12px; padding: 4px 8px; background: #ECEFF1; border: 1px solid #CFD8DC; border-radius: 6px; }
.toggle-panel .toggle-label { font-size: 11px; color: #555; font-weight: bold; text-transform: uppercase; margin-right: 4px; }
.toggle-btn { padding: 4px 12px; border: 1.5px solid #757575; border-radius: 4px; background: #E0E0E0; cursor: pointer; font-size: 12px; color: #333; }
.toggle-btn:hover { background: #BDBDBD; }
.toggle-btn[data-showing="1"] { background: #2E7D32; color: white; border-color: #1B5E20; }
.toggle-btn[disabled] { opacity: 0.4; cursor: not-allowed; background: #EEE; }
/* Hidden state — applied dynamically via JS */
.svg-hidden { display: none !important; }
/* Visual differentiation when shown */
.node-external-shown [stroke-dasharray] { }  /* no-op, see runtime tweak */
.node-aux-shown { opacity: 0.75; }
/* v2: `resolves` edges (theorem-like resolves an open_problem/conjecture) — dashed */
.edge-resolves path { stroke-dasharray: 5,3 !important; }
.edge-resolves { stroke-dasharray: 5,3 !important; }
</style>

var DETAILS = {"def_mahalanobis_distance": {"name": "Mahalanobis Distance", "type": "definition", "section": "3.1 Siamese and Triplet Networks (Sec. metric_learning)", "statement": "The squared Mahalanobis distance between points x_i and x_j is defined as d_W = (x_i - x_j)^T W (x_i - x_j), where W is a positive semi-definite matrix parameterising the metric.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "def_convnet": {"name": "Deep ConvNet Definition", "type": "definition", "section": "3.1 Siamese and Triplet Networks", "statement": "A deep ConvNet is defined as f(x, theta_f) = f_out composed with r_L composed with h_L composed with f_L ... composed with r_1 composed with h_1 composed with f_1(x), where f_l is the pre-activation function (linear transforms in convolutional layers), h_l is a normalisation function, and r_l is a non-linear activation function such as ReLU.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "def_siamese_network": {"name": "Siamese Network", "type": "definition", "section": "3.1 Siamese and Triplet Networks", "statement": "A siamese network consists of two identical deep ConvNets with tied weights, trained using pairs of labelled inputs. It can produce either a feature embedding or a pairwise similarity estimation depending on architecture and loss function.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "eq_pairwise_loss", "statement": "The pairwise loss for a siamese network producing an embedding is J_1^s(x_i, x_j, theta_f) = delta(y_i - y_j) ||f(x_i) - f(x_j)||_2 - (1 - delta(y_i - y_j)) ||f(x_i) - f(x_j)||_2, which minimises distance between same-class pairs and maximises distance between different-class pairs.", "section": "3.1 Siamese and Triplet Networks", "context": "", "parent_step": ""}, {"id": "eq_pairwise_similarity_loss", "statement": "The pairwise similarity loss for a siamese network is J_2^s(x_i, x_j, theta_g) = delta(y_i - y_j)(1/(kappa + g(x_i, x_j, theta_g))) + (1 - delta(y_i - y_j)) g(x_i, x_j, theta_g), where g returns a similarity score and kappa is a small positive constant.", "section": "3.1 Siamese and Triplet Networks", "context": "", "parent_step": ""}]}, "def_triplet_network": {"name": "Triplet Network", "type": "definition", "section": "3.1 Siamese and Triplet Networks", "statement": "The triplet network is an extension of the siamese network that is trained with triplets at the input (x, x^+, x^-), where x and x^+ belong to the same class and x^- belongs to a different class. It produces a feature embedding using three identical (weight-tied) ConvNet towers.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "eq_triplet_loss", "statement": "The triplet loss is J_1^t(x, x^+, x^-, theta_f) = max(0, 1 - ||f(x) - f(x^-)||_2 / (||f(x) - f(x^+)||_2 + m)), where m is a margin, x^+ is same-class as x, and x^- is a different class. It provides relative context by jointly considering similar and dissimilar pairs in each triplet.", "section": "3.1 Siamese and Triplet Networks", "context": "", "parent_step": ""}]}, "def_model_tnet_tloss": {"name": "Model 1: TNet, TLoss", "type": "definition", "section": "3.3 Proposed Models", "statement": "The first proposed model is a triplet network trained with the triplet loss J_1^t, which produces a feature embedding. Architecture: B(96,7,3)-P(2,2)-B(192,5,1)-P(2,2)-B(256,3,1)-B(256,1,1)-B(256,1,1), where B(n,k,s) is a block with convolution C(n,k,s) followed by batch normalisation and ReLU.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "eq_triplet_loss", "statement": "The triplet loss is J_1^t(x, x^+, x^-, theta_f) = max(0, 1 - ||f(x) - f(x^-)||_2 / (||f(x) - f(x^+)||_2 + m)), where m is a margin, x^+ is same-class as x, and x^- is a different class. It provides relative context by jointly considering similar and dissimilar pairs in each triplet.", "section": "3.1 Siamese and Triplet Networks", "context": "", "parent_step": ""}]}, "def_model_tnet_tgloss": {"name": "Model 2: TNet, TGLoss", "type": "definition", "section": "3.3 Proposed Models", "statement": "The second proposed model is a triplet network producing an embedding, trained with the combined triplet and global loss J_1^{tg}. It uses the same architecture as TNet-TLoss and is initialised from TNet-TLoss weights trained for 50 epochs, then trained for 50 more epochs with the combined loss.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "eq_combined_loss", "statement": "The combined loss is J_1^{tg} = gamma * sum_j J_1^t(x_j, x_j^+, x_j^-) + J_1^g({x_i}, {x_i^+}, {x_i^-}), combining the per-triplet triplet loss with the global embedding loss weighted by gamma.", "section": "3.3 Proposed Models", "context": "", "parent_step": ""}]}, "def_model_snet_gloss": {"name": "Model 3: SNet, GLoss", "type": "definition", "section": "3.3 Proposed Models", "statement": "The third proposed model is a siamese network producing a pairwise similarity estimation, trained with the global pairwise similarity loss J_2^g. Architecture: B(96,7,3)-P(2,2)-B(192,5,1)-P(2,2)-B(256,3,1)-B(256,1,1)-C(1,1,1).", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "eq_global_loss_pairwise", "statement": "The global loss for pairwise similarity estimation is J_2^g = (sigma^{2+} + sigma^{2-}) + lambda * max(0, m - (mu^+ - mu^-)), where mu^+ and sigma^{2+} are mean and variance of matching pair similarities, mu^- and sigma^{2-} are mean and variance of non-matching pair similarities. It minimises variance of both distributions, minimises mean non-matching similarity, and maximises mean matching similarity.", "section": "3.2 Global Loss Function", "context": "", "parent_step": ""}]}, "def_model_cssnet_gloss": {"name": "Model 4: CS SNet, GLoss", "type": "definition", "section": "3.3 Proposed Models", "statement": "The fourth proposed model is the central-surround siamese network producing pairwise similarity, trained with the global loss J_2^g. It uses a multi-resolution central-surround architecture: B(95,5,1)-P(2,2)-B(96,3,1)-P(2,2)-B(192,3,1)-B(192,3,1) for each stream, combined by B(768,2,1)-C(1,1,1).", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "eq_global_loss_pairwise", "statement": "The global loss for pairwise similarity estimation is J_2^g = (sigma^{2+} + sigma^{2-}) + lambda * max(0, m - (mu^+ - mu^-)), where mu^+ and sigma^{2+} are mean and variance of matching pair similarities, mu^- and sigma^{2-} are mean and variance of non-matching pair similarities. It minimises variance of both distributions, minimises mean non-matching similarity, and maximises mean matching similarity.", "section": "3.2 Global Loss Function", "context": "", "parent_step": ""}]}, "claim_triplet_better_siamese": {"name": "Triplet Network Improves Over Siamese for Descriptor Learning", "type": "claim", "section": "5.3 Results on UBC Benchmark Dataset", "statement": "The triplet network (TNet-TLoss) produces a more accurate embedding than the siamese network for local image descriptor learning on the UBC benchmark dataset.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Training and testing on the UBC benchmark dataset with six combinations of Liberty, Notredame, and Yosemite sets", "Comparison measured by FPR95 metric", "Feature embedding comparison using L2 norm distance"], "conclusions": ["TNet-TLoss achieves mean FPR95 of 9.63%, improving over Siam-l2 (13.45%) on the UBC dataset"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "claim_combined_loss_best_embedding": {"name": "Combined Triplet+Global Loss Produces Best Embedding", "type": "claim", "section": "5.3 Results on UBC Benchmark Dataset", "statement": "The combination of the triplet and global losses (TNet-TGLoss) produces the best feature embedding result in the field on the UBC dataset, with mean FPR95 of 8.8%.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Training and testing on UBC benchmark dataset", "TNet-TGLoss initialised from TNet-TLoss trained for 50 epochs then trained for 50 more epochs with combined loss", "Hyperparameters gamma=1, t=0.4, lambda=0.8 estimated via cross validation"], "conclusions": ["TNet-TGLoss achieves mean FPR95 of 8.8%, the best embedding result on the UBC dataset, improving over TNet-TLoss (9.63%) and siam-2stream-l2 (9.67%)", "TNet-TGLoss embedding outperforms even some pairwise similarity methods (Siam and 512d-F(512))"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "claim_global_loss_best_pairwise": {"name": "CS SNet with Global Loss Produces Best Pairwise Similarity Result", "type": "claim", "section": "5.3 Results on UBC Benchmark Dataset", "statement": "The central-surround siamese network trained with the global loss (CS SNet, GLoss) produces the best classification result on the UBC dataset in the pairwise similarity category, nearly halving the previous state-of-the-art FPR95.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Training and testing on UBC benchmark dataset", "Randomly initialised weights trained for 80 epochs", "Hyperparameters m=1, lambda=1 estimated via cross validation"], "conclusions": ["CS SNet GLoss achieves mean FPR95 of 2.71%, nearly halving the previous state-of-the-art (2ch-2stream at 4.19%)", "CS SNet GLoss achieves the best result on all six train/test combinations"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "claim_global_loss_robustness": {"name": "Global Loss is Robust to Outliers", "type": "claim", "section": "4 Toy Problem", "statement": "The global loss function is more robust to outliers than the standard triplet loss, as demonstrated on a 2D toy dataset with 5% label noise. The global loss gradient depends on training set statistics (mu^+, mu^-), which suppresses spurious gradients from outliers.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["2D toy dataset with 80 samples from two Gaussian distributions", "5% label noise (4 samples with switched labels)", "ConvNet mapping to 128-dimensional embedding with structure B(256,2,1)-B(512,1,1)-C(128,1,1)", "Evaluation by nearest-neighbour classification in embedding space"], "conclusions": ["Triplet loss alone overfits to outliers, producing incorrect labelling at outlier locations", "Combined triplet and global losses reduce labelling mistakes caused by outliers", "Global loss alone produces coherent label maps even at outlier locations"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "eq_triplet_loss", "statement": "The triplet loss is J_1^t(x, x^+, x^-, theta_f) = max(0, 1 - ||f(x) - f(x^-)||_2 / (||f(x) - f(x^+)||_2 + m)), where m is a margin, x^+ is same-class as x, and x^- is a different class. It provides relative context by jointly considering similar and dissimilar pairs in each triplet.", "section": "3.1 Siamese and Triplet Networks", "context": "", "parent_step": ""}, {"id": "eq_global_loss_embedding", "statement": "The proposed global loss for feature embedding is J_1^g = (sigma^{2+} + sigma^{2-}) + lambda * max(0, mu^+ - mu^- + t), where mu^+, sigma^{2+} are mean and variance of matching pair distances, mu^-, sigma^{2-} are mean and variance of non-matching pair distances, lambda balances the terms, and t is the margin. Distances are d_i^+ = ||f(x_i) - f(x_i^+)||_2^2 / 4 and d_i^- = ||f(x_i) - f(x_i^-)||_2^2 / 4, constrained to [0,1].", "section": "3.2 Global Loss Function", "context": "", "parent_step": ""}, {"id": "eq_global_loss_gradient", "statement": "The gradient of J_1^g with respect to f(x_i) depends on global statistics mu^+ and mu^- of the training set (not just the i-th triplet), which suppresses spurious gradients from outliers and improves generalisation compared to the triplet loss gradient which depends only on the i-th triplet.", "section": "3.2 Global Loss Function", "context": "", "parent_step": ""}]}, "claim_pairwise_better_embedding": {"name": "Pairwise Similarity Methods Outperform Embedding Methods", "type": "claim", "section": "5.3 Results on UBC Benchmark Dataset", "statement": "Siamese networks trained with pairwise similarity loss achieve better classification performance than feature embeddings produced by triplet loss, but at the cost of higher inference complexity since pairwise similarity requires a forward pass through the network for each comparison.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Comparison on UBC benchmark dataset", "Embedding comparison uses cosine distance (simplified L2 due to unit norm)", "Pairwise similarity requires the final fully connected layer for each pair"], "conclusions": ["Pairwise similarity methods (e.g., CS SNet GLoss at 2.71%) outperform embedding methods (e.g., TNet-TGLoss at 8.8%)", "However, TNet-TGLoss embedding (8.8%) outperforms some pairwise similarity methods like Siam (10.07%) and 512d-F(512) (9.82%)"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [], "foundation_links": ["Independent and Identically Distributed"]}};

  // Plain-text restatement (statement_clean) — shown above the formal statement
  if (d.statement_clean) {
    h += '<div class="detail-section"><h4>Plain-Text Summary</h4><div style="font-size:13px;color:#444;font-style:italic;">' + esc(d.statement_clean) + '</div></div>';
  }
  // Pre-build equation maps by context
  var eqsByCtx = {statement:[], assumption:[], conclusion:[], orphan:[]};
  var eqsByStep = {};
  if (d.equations) {
    d.equations.forEach(function(e) {
      if (e.parent_step) {
        if (!eqsByStep[e.parent_step]) eqsByStep[e.parent_step] = [];
        eqsByStep[e.parent_step].push(e);
      } else if (e.context && eqsByCtx[e.context]) {
        eqsByCtx[e.context].push(e);
      } else {
        eqsByCtx.orphan.push(e);
      }
    });
  }
  var eqTag = function(e) { return '<span style="color:#2471A3;font-size:11px;"> (' + e.id + ')</span>'; };
  var eqBlock = function(e) { return '<div style="margin:2px 0 2px 12px;padding:3px 8px;background:#EBF5FB;border-left:2px solid #5DADE2;font-size:12px;">' + esc(e.id) + ': ' + esc(e.statement) + '</div>'; };

  // Statement + inline statement equations
  if (d.statement) {
    h += '<div class="detail-section"><h4>Statement</h4><div style="font-size:14px;">' + esc(d.statement) + '</div>';
    eqsByCtx.statement.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Assumptions + inline assumption equations
  if ((d.assumptions && d.assumptions.length > 0) || eqsByCtx.assumption.length > 0) {
    h += '<div class="detail-section"><h4>Assumptions</h4>';
    if (d.assumptions) d.assumptions.forEach(function(a) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(a) + '</div>'; });
    eqsByCtx.assumption.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Conclusions + inline conclusion equations
  if ((d.conclusions && d.conclusions.length > 0) || eqsByCtx.conclusion.length > 0) {
    h += '<div class="detail-section"><h4>Conclusions</h4>';
    if (d.conclusions) d.conclusions.forEach(function(c) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(c) + '</div>'; });
    eqsByCtx.conclusion.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Proof strategy
  if (d.proof_info && d.proof_info.length > 0) {
    h += '<div class="detail-section"><h4>Proof Strategy</h4>';
    d.proof_info.forEach(function(p) {
      if (Array.isArray(p)) {
        p.forEach(function(item) { h += '<div style="font-size:13px;font-style:italic;">&bull; ' + esc(item) + '</div>'; });
      } else {
        h += '<div style="font-size:13px;font-style:italic;">' + esc(p) + '</div>';
      }
    });
    h += '</div>';
  }
  // v2: Step decomposition (proof_step children of a proof, or algorithm_step children of an algorithm)
  if (d.step_info && d.step_info.length > 0) {
    h += '<div class="detail-section"><h4>Decomposition (' + d.step_info.length + ' steps)</h4>';
    d.step_info.forEach(function(s, i) {
      var ord = (s.step_order || (i + 1));
      var label = s.name ? esc(s.name) : esc(s.id || ('Step ' + ord));
      h += '<div class="step-item"><strong>' + ord + '. ' + label + '</strong>';
      if (s.subclass) {
        h += ' <span style="font-size:11px;font-style:italic;color:#666;">[' + esc(s.subclass) + ']</span>';
      }
      var body = s.statement_clean || s.statement || '';
      if (body) {
        h += '<div style="font-size:12px;color:#444;margin-top:2px;">' + esc(body) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  // Algorithm input/output
  if (d.input && d.input.length > 0) {
    h += '<div class="detail-section"><h4>Input</h4>';
    d.input.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // (Legacy "Proof Steps" panel removed: same data now rendered above as
  // "Decomposition" via d.step_info. Both used to read from step_chains and
  // produced duplicate sections on click.)
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  typesetMath(panel);
}
function resetView() {
  document.getElementById("detail-panel").className = "";
  document.getElementById("detail-panel").innerHTML = "";
}
function toggleOrphans() {
  var p = document.getElementById("orphan-panel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  var h = "";
  ORPHANS.forEach(function(e) { h += '<div class="orphan-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>'; });
  document.getElementById("orphan-list").innerHTML = h;
  p.style.display = "block";
  typesetMath(p);
}
// Foundation toggle (ghost nodes — both mathlib/proofwiki ("ghost_") and
// book entries ("ghostbook_") are picked up by the [id^="ghost"] selector).
function toggleGhosts() {
  var svgEl = document.querySelector("#svg-container svg");
  var ghostEls = svgEl ? svgEl.querySelectorAll('[id^="ghost"]') : [];
  var btn = document.getElementById("ghost-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  if (!isShowing) {
    btn.dataset.showing = "1";
    ghostEls.forEach(function(el) { el.style.display = ""; });
  } else {
    btn.dataset.showing = "0";
    ghostEls.forEach(function(el) { el.style.display = "none"; });
  }
}

// Generic helper: hide/show a set of nodes (by id) and their incident edges.
function _setNodeVisibility(nodeIds, edgeGids, visible, extraClass) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  nodeIds.forEach(function(nid) {
    // Body rect
    var body = svgEl.querySelector('[id="node_' + nid + '"]');
    if (body) {
      body.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) body.classList.add(extraClass);
        else body.classList.remove(extraClass);
      }
    }
    // All sibling per-node elements (header rect, text labels, divider lines)
    var sibs = svgEl.querySelectorAll('[id^="node_' + nid + '__"]');
    sibs.forEach(function(el) {
      el.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) el.classList.add(extraClass);
        else el.classList.remove(extraClass);
      }
    });
  });
  edgeGids.forEach(function(gid) {
    var e = svgEl.querySelector('[id="' + gid + '"]');
    if (e) e.style.display = visible ? "" : "none";
  });
}

// Examples & Remarks toggle — hides nodes with type in {example, remark}
function toggleAux() {
  var btn = document.getElementById("aux-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  // Apply visual differentiation: lighter shade (opacity) when shown
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, nextShowing, "node-aux-shown");
  // Apply opacity styling on the body rect when shown
  AUX_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) body.style.opacity = nextShowing ? "0.75" : "";
  });
}

// Cited Results (External) toggle — hides nodes with origin === "external"
function toggleExternal() {
  var btn = document.getElementById("ext-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, nextShowing, "node-external-shown");
  // Apply dashed border on body rect when shown (visual differentiation)
  EXT_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) {
      // FancyBboxPatch is a <path>; modify its stroke-dasharray for a dashed look.
      var pathEl = body.tagName === "path" ? body : body.querySelector("path");
      if (pathEl) {
        if (nextShowing) {
          pathEl.setAttribute("stroke-dasharray", "6,3");
          pathEl.setAttribute("stroke-width", "2");
        } else {
          pathEl.removeAttribute("stroke-dasharray");
          pathEl.removeAttribute("stroke-width");
        }
      }
    }
  });
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements + aux + external elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all foundation ghost elements (mathlib/proofwiki AND book-derived).
    // The [id^="ghost"] selector covers both "ghost_*" and "ghostbook_*".
    var all = svgEl.querySelectorAll('[id^="ghost"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
  // Examples & Remarks: hidden by default (toggle starts in OFF state).
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, false, null);
  // Cited Results (External): hidden by default.
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, false, null);
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() { currentZoom = 1.0; applyZoom(); }

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
