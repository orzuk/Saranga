<script>
var DETAILS = {"def_snn": {"name": "Siamese Neural Network (SNN)", "type": "definition", "section": "2.2 Teacher-Student Simultaneous Training", "statement": "A Siamese Neural Network (SNN) consists of two identical weight-sharing classifier networks, a teacher and a student. The teacher receives a weakly augmented image and generates pseudo labels, while the student receives a strongly augmented image.", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": [{"id": "def_fixmatch_obj", "statement": "The FixMatch optimization problem is min_{theta} f(theta), where f(theta) = (1/2C) theta^T theta + (1/ell) sum_{i=1}^{ell} xi(theta; x^i, y^i), with C > 0 a regularization parameter, x^i the i-th input image, and y^i the one-hot label vector.", "section": "2.2 Teacher-Student Simultaneous Training", "context": "", "parent_step": ""}]}, "def_symmetric_loss": {"name": "Symmetric Loss Function", "type": "definition", "section": "3.3 Robust Loss Functions", "statement": "A loss function xi is called symmetric if it satisfies sum_{k=1}^{K} xi(f(x), e_k) = M for all x in X and all f, where K is the number of classes, X is the feature space, f maps input x to softmax output y, M is a constant, and e_k are standard basis vectors.", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}, "def_trusted_pseudo_label": {"name": "Trusted Pseudo Label Selection", "type": "definition", "section": "3.1 Trusted Pseudo Label Selection", "statement": "After the outer SNN is trained, pseudo labels are generated for unlabeled data. A threshold tau^{select} filters high-confidence predictions, then deep embedding clustering on latent representations selects unlabeled data whose clustering results are consistent with their predicted class. The chosen indices form the trusted set T_u.", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": [{"id": "def_fixmatch_filter", "statement": "The unlabeled loss uses a confidence threshold tau: 1(max(y_hat^i) >= tau) * xi_u(OHL(y_hat^i), f_theta(x^i_s)), where 1 is the indicator function and OHL maps the softmax pseudo label to its one-hot label vector. Only pseudo labels with confidence above tau are used.", "section": "2.2 Teacher-Student Simultaneous Training", "context": "", "parent_step": ""}]}, "def_merging_conflict": {"name": "Merging Conflict Pseudo Labels (Heuristic 1)", "type": "definition", "section": "3.2 Merging Conflict Pseudo Labels", "statement": "When both the outer and inner SNN provide trusted pseudo labels for the same image, conflicts are resolved by a priority heuristic: (1) if the inner SNN's pseudo label confidence exceeds tau^{inner}, use the inner SNN's label; (2) else if the index is in T_u, use the outer SNN's label; (3) otherwise, set the pseudo label to zero (no contribution).", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}, "alg_kd_fixmatch": {"name": "KD-FixMatch (Algorithm 1)", "type": "algorithm", "section": "3.4 Knowledge Distillation Siamese Neural Networks", "statement": "Given labeled data S_l and unlabeled data S_u: (1) Initialize and train an outer SNN f^{outer} with S_l and S_u by solving the FixMatch optimization problem; (2) Generate pseudo labels for S_u using the well-trained f^{outer}; (3) Select a trusted index subset T_u from S_u via confidence filtering and deep embedding clustering; (4) Choose CE or robust loss for xi^{inner}_u; (5) Initialize and train an inner SNN f^{inner} with labeled data, unlabeled data, and unlabeled data with trusted pseudo labels; (6) Return the well-trained f^{inner}.", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": [{"id": "def_fixmatch_obj", "statement": "The FixMatch optimization problem is min_{theta} f(theta), where f(theta) = (1/2C) theta^T theta + (1/ell) sum_{i=1}^{ell} xi(theta; x^i, y^i), with C > 0 a regularization parameter, x^i the i-th input image, and y^i the one-hot label vector.", "section": "2.2 Teacher-Student Simultaneous Training", "context": "", "parent_step": ""}, {"id": "def_fixmatch_loss", "statement": "The loss function xi(theta; x^i, y^i) is defined piecewise: xi_l(y^i, f_theta(x^i_w)) if i is in the labeled set S_l, and lambda_u * xi_u(y_hat^i, f_theta(x^i_s)) if i is in the unlabeled set S_u, where x^i_w and x^i_s are weak and strong augmentations, respectively.", "section": "2.2 Teacher-Student Simultaneous Training", "context": "", "parent_step": ""}, {"id": "def_fixmatch_filter", "statement": "The unlabeled loss uses a confidence threshold tau: 1(max(y_hat^i) >= tau) * xi_u(OHL(y_hat^i), f_theta(x^i_s)), where 1 is the indicator function and OHL maps the softmax pseudo label to its one-hot label vector. Only pseudo labels with confidence above tau are used.", "section": "2.2 Teacher-Student Simultaneous Training", "context": "", "parent_step": ""}]}, "claim_better_starting_point": {"name": "KD-FixMatch Has Better Starting Point", "type": "claim", "section": "1 Introduction", "statement": "KD-FixMatch has a better training starting point than directly applying FixMatch because the outer SNN is first well-trained and its network serves as a teacher for the inner SNN, producing pseudo labels with lower label noise especially in the early training stage.", "assumptions": ["The outer SNN is well-trained before generating pseudo labels for the inner SNN", "The percentage of label noise in pseudo labels generated by the well-trained outer SNN is lower than that of the immature teacher in standard FixMatch, especially in the early stage"], "conclusions": ["KD-FixMatch has a better training starting point than FixMatch", "The better starting point leads to improved model performance"], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}, "claim_single_training": {"name": "Single Training Pass Sufficiency", "type": "claim", "section": "1 Introduction", "statement": "Unlike self-training or Noisy Student where the neural network is re-trained multiple times when pseudo labels need updating, KD-FixMatch only requires training each of the outer and inner SNN once.", "assumptions": ["KD-FixMatch uses sequential then simultaneous teacher-student training", "The trusted pseudo label selection via confidence filtering and deep embedding clustering is performed once after the outer SNN training"], "conclusions": ["Each of the outer and inner SNN needs to be trained only once", "This is more efficient than iterative self-training approaches that re-train and re-generate pseudo labels multiple times"], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}, "claim_outperforms": {"name": "KD-FixMatch Outperforms FixMatch", "type": "claim", "section": "4 Experiments", "statement": "Experimental results on SVHN, CIFAR10, CIFAR100, and FOOD101 demonstrate that KD-FixMatch outperforms FixMatch in all tested cases, though the improvement diminishes with more labeled data.", "assumptions": ["Experiments are conducted on four public datasets (SVHN, CIFAR10, CIFAR100, FOOD101)", "EfficientNet-B0 pretrained on ImageNet is used as the backbone", "All methods use the same optimizer (Adam), batch size (128), and augmentation strategies", "tau = 0.95, tau^{select} = 0.80, tau^{inner} = 0.95, lambda_u = 1"], "conclusions": ["FixMatch outperforms supervised Baseline in all cases", "KD-FixMatch outperforms FixMatch in all cases", "The improvement of KD-FixMatch over FixMatch decreases as the amount of labeled data increases", "KD-FixMatch-SCE has slightly better performance than KD-FixMatch-CE in most cases"], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}, "claim_robust_loss_helps": {"name": "Robust Loss Functions Improve Performance", "type": "claim", "section": "4.1 Experiments on Four Public Data Sets", "statement": "KD-FixMatch-SCE (using symmetric cross-entropy as the unlabeled loss for the inner SNN) achieves slightly better model performance than KD-FixMatch-CE in most cases, even without grid search for the SCE parameters (alpha, beta).", "assumptions": ["SCE is used with alpha=1.0 and beta in {0.01, 0.1} without exhaustive parameter search", "SCE is applied only to the inner SNN's unlabeled loss xi^{inner}_u"], "conclusions": ["SCE-based KD-FixMatch slightly outperforms CE-based KD-FixMatch in most experimental settings"], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}, "claim_inner_snn_better": {"name": "Inner SNN Generalizes Better Than Outer SNN", "type": "claim", "section": "3.2 Merging Conflict Pseudo Labels", "statement": "The inner SNN intuitively has better generalization ability than the outer SNN because it has more reliable pseudo labels available in the early training stage, justifying the priority of the inner SNN's pseudo labels in the merging heuristic.", "assumptions": ["The inner SNN is trained with labeled data, unlabeled data, and additionally with trusted pseudo-labeled data from the outer SNN", "The trusted pseudo labels reduce label noise in the early stage of inner SNN training"], "conclusions": ["The inner SNN has better generalization ability than the outer SNN", "When pseudo label conflicts arise, the inner SNN's pseudo labels should take priority over the outer SNN's"], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}};
var ORPHANS = [];
var GHOSTS = {};
var CASE1 = {};

var _lastDetailNode = null;
function showDetail(nodeId) {
  var panel = document.getElementById("detail-panel");
  // Toggle: click same node again to close
  if (_lastDetailNode === nodeId && panel.className === "open") {
    panel.className = "";
    panel.innerHTML = "";
    _lastDetailNode = null;
    return;
  }
  _lastDetailNode = nodeId;
  // Special case: orphan/misc node
  if (nodeId === '__orphan__') {
    var h = '<h3 style="margin:0 0 8px;font-size:16px;">Misc: Unconnected Equations</h3>';
    h += '<div style="font-size:12px;color:#888;margin-bottom:10px;">Equations not linked to any theorem or proof step</div>';
    ORPHANS.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    if (ORPHANS.length === 0) h += '<div style="color:#888;">No orphan equations.</div>';
    panel.innerHTML = h;
    panel.className = "open";
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([panel]).catch(function(){});
    return;
  }
  var d = DETAILS[nodeId];
  if (!d) return;
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(nodeId) + ': ' + esc(d.name || d.type) + '</h3>';
  h += '<div style="font-size:12px;color:#888;margin-bottom:4px;">' + d.type + (d.section ? ' (Sec ' + d.section + ')' : '') + '</div>';
  // Foundation graph link badge (Case 1: known result)
  if (d.foundation_links && d.foundation_links.length > 0) {
    h += '<div style="display:inline-block;padding:2px 8px;background:#E3F2FD;border:1px solid #2471A3;border-radius:3px;font-size:11px;color:#2471A3;margin-bottom:8px;">&#128218; Known result: ' + d.foundation_links.map(esc).join(', ') + '</div>';
  }
  // Pre-build equation maps by context
  var eqsByCtx = {statement:[], assumption:[], conclusion:[], orphan:[]};
  var eqsByStep = {};
  if (d.equations) {
    d.equations.forEach(function(e) {
      if (e.parent_step) {
        if (!eqsByStep[e.parent_step]) eqsByStep[e.parent_step] = [];
        eqsByStep[e.parent_step].push(e);
      } else if (e.context && eqsByCtx[e.context]) {
        eqsByCtx[e.context].push(e);
      } else {
        eqsByCtx.orphan.push(e);
      }
    });
  }
  var eqTag = function(e) { return '<span style="color:#2471A3;font-size:11px;"> (' + e.id + ')</span>'; };
  var eqBlock = function(e) { return '<div style="margin:2px 0 2px 12px;padding:3px 8px;background:#EBF5FB;border-left:2px solid #5DADE2;font-size:12px;">' + esc(e.id) + ': ' + esc(e.statement) + '</div>'; };

  // Statement + inline statement equations
  if (d.statement) {
    h += '<div class="detail-section"><h4>Statement</h4><div style="font-size:14px;">' + esc(d.statement) + '</div>';
    eqsByCtx.statement.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Assumptions + inline assumption equations
  if ((d.assumptions && d.assumptions.length > 0) || eqsByCtx.assumption.length > 0) {
    h += '<div class="detail-section"><h4>Assumptions</h4>';
    if (d.assumptions) d.assumptions.forEach(function(a) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(a) + '</div>'; });
    eqsByCtx.assumption.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Conclusions + inline conclusion equations
  if ((d.conclusions && d.conclusions.length > 0) || eqsByCtx.conclusion.length > 0) {
    h += '<div class="detail-section"><h4>Conclusions</h4>';
    if (d.conclusions) d.conclusions.forEach(function(c) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(c) + '</div>'; });
    eqsByCtx.conclusion.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Proof strategy
  if (d.proof_info && d.proof_info.length > 0) {
    h += '<div class="detail-section"><h4>Proof Strategy</h4>';
    d.proof_info.forEach(function(p) {
      if (Array.isArray(p)) {
        p.forEach(function(item) { h += '<div style="font-size:13px;font-style:italic;">&bull; ' + esc(item) + '</div>'; });
      } else {
        h += '<div style="font-size:13px;font-style:italic;">' + esc(p) + '</div>';
      }
    });
    h += '</div>';
  }
  // Algorithm input/output
  if (d.input && d.input.length > 0) {
    h += '<div class="detail-section"><h4>Input</h4>';
    d.input.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // Proof steps with inline equations
  if (d.steps && d.steps.length > 0) {
    h += '<div class="detail-section"><h4>Proof Steps (' + d.steps.length + ')</h4>';
    d.steps.forEach(function(s, i) {
      h += '<div class="step-item"><strong>' + s.id + '</strong>: ' + esc(s.statement);
      if (eqsByStep[s.id]) {
        eqsByStep[s.id].forEach(function(e) { h += eqBlock(e); });
      }
      h += '</div>';
      if (i < d.steps.length - 1) h += '<div class="step-arrow">&#8595;</div>';
    });
    h += '</div>';
  }
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([panel]).catch(function(){});
}
function resetView() {
  document.getElementById("detail-panel").className = "";
  document.getElementById("detail-panel").innerHTML = "";
}
function toggleOrphans() {
  var p = document.getElementById("orphan-panel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  var h = "";
  ORPHANS.forEach(function(e) { h += '<div class="orphan-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>'; });
  document.getElementById("orphan-list").innerHTML = h;
  p.style.display = "block";
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([p]).catch(function(){});
}
// Ghost nodes (external dependencies)
function toggleGhosts() {
  var svgEl = document.querySelector("#svg-container svg");
  var ghostEls = svgEl ? svgEl.querySelectorAll('[id^="ghost_"]') : [];
  var btn = document.getElementById("ghost-btn");
  var isShowing = btn.dataset.showing === "1";
  if (!isShowing) {
    btn.dataset.showing = "1";
    btn.textContent = "Hide external dependencies";
    ghostEls.forEach(function(el) { el.style.display = ""; });
  } else {
    btn.dataset.showing = "0";
    btn.textContent = "Show external dependencies";
    ghostEls.forEach(function(el) { el.style.display = "none"; });
  }
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all ghost elements (boxes, headers, text, refs, edges)
    var all = svgEl.querySelectorAll('[id^="ghost_"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() { currentZoom = 1.0; applyZoom(); }

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
