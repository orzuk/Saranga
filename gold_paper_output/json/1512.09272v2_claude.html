<script>
var DETAILS = {"def_mahalanobis_distance": {"name": "Mahalanobis Distance", "type": "definition", "section": "3.1 Siamese and Triplet Networks (Sec. metric_learning)", "statement": "The squared Mahalanobis distance between points x_i and x_j is defined as d_W = (x_i - x_j)^T W (x_i - x_j), where W is a positive semi-definite matrix parameterising the metric.", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}, "def_convnet": {"name": "Deep ConvNet Definition", "type": "definition", "section": "3.1 Siamese and Triplet Networks", "statement": "A deep ConvNet is defined as f(x, theta_f) = f_out composed with r_L composed with h_L composed with f_L ... composed with r_1 composed with h_1 composed with f_1(x), where f_l is the pre-activation function (linear transforms in convolutional layers), h_l is a normalisation function, and r_l is a non-linear activation function such as ReLU.", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}, "def_siamese_network": {"name": "Siamese Network", "type": "definition", "section": "3.1 Siamese and Triplet Networks", "statement": "A siamese network consists of two identical deep ConvNets with tied weights, trained using pairs of labelled inputs. It can produce either a feature embedding or a pairwise similarity estimation depending on architecture and loss function.", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": [{"id": "eq_pairwise_loss", "statement": "The pairwise loss for a siamese network producing an embedding is J_1^s(x_i, x_j, theta_f) = delta(y_i - y_j) ||f(x_i) - f(x_j)||_2 - (1 - delta(y_i - y_j)) ||f(x_i) - f(x_j)||_2, which minimises distance between same-class pairs and maximises distance between different-class pairs.", "section": "3.1 Siamese and Triplet Networks", "context": "", "parent_step": ""}, {"id": "eq_pairwise_similarity_loss", "statement": "The pairwise similarity loss for a siamese network is J_2^s(x_i, x_j, theta_g) = delta(y_i - y_j)(1/(kappa + g(x_i, x_j, theta_g))) + (1 - delta(y_i - y_j)) g(x_i, x_j, theta_g), where g returns a similarity score and kappa is a small positive constant.", "section": "3.1 Siamese and Triplet Networks", "context": "", "parent_step": ""}]}, "def_triplet_network": {"name": "Triplet Network", "type": "definition", "section": "3.1 Siamese and Triplet Networks", "statement": "The triplet network is an extension of the siamese network that is trained with triplets at the input (x, x^+, x^-), where x and x^+ belong to the same class and x^- belongs to a different class. It produces a feature embedding using three identical (weight-tied) ConvNet towers.", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": [{"id": "eq_triplet_loss", "statement": "The triplet loss is J_1^t(x, x^+, x^-, theta_f) = max(0, 1 - ||f(x) - f(x^-)||_2 / (||f(x) - f(x^+)||_2 + m)), where m is a margin, x^+ is same-class as x, and x^- is a different class. It provides relative context by jointly considering similar and dissimilar pairs in each triplet.", "section": "3.1 Siamese and Triplet Networks", "context": "", "parent_step": ""}]}, "def_model_tnet_tloss": {"name": "Model 1: TNet, TLoss", "type": "definition", "section": "3.3 Proposed Models", "statement": "The first proposed model is a triplet network trained with the triplet loss J_1^t, which produces a feature embedding. Architecture: B(96,7,3)-P(2,2)-B(192,5,1)-P(2,2)-B(256,3,1)-B(256,1,1)-B(256,1,1), where B(n,k,s) is a block with convolution C(n,k,s) followed by batch normalisation and ReLU.", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": [{"id": "eq_triplet_loss", "statement": "The triplet loss is J_1^t(x, x^+, x^-, theta_f) = max(0, 1 - ||f(x) - f(x^-)||_2 / (||f(x) - f(x^+)||_2 + m)), where m is a margin, x^+ is same-class as x, and x^- is a different class. It provides relative context by jointly considering similar and dissimilar pairs in each triplet.", "section": "3.1 Siamese and Triplet Networks", "context": "", "parent_step": ""}]}, "def_model_tnet_tgloss": {"name": "Model 2: TNet, TGLoss", "type": "definition", "section": "3.3 Proposed Models", "statement": "The second proposed model is a triplet network producing an embedding, trained with the combined triplet and global loss J_1^{tg}. It uses the same architecture as TNet-TLoss and is initialised from TNet-TLoss weights trained for 50 epochs, then trained for 50 more epochs with the combined loss.", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": [{"id": "eq_combined_loss", "statement": "The combined loss is J_1^{tg} = gamma * sum_j J_1^t(x_j, x_j^+, x_j^-) + J_1^g({x_i}, {x_i^+}, {x_i^-}), combining the per-triplet triplet loss with the global embedding loss weighted by gamma.", "section": "3.3 Proposed Models", "context": "", "parent_step": ""}]}, "def_model_snet_gloss": {"name": "Model 3: SNet, GLoss", "type": "definition", "section": "3.3 Proposed Models", "statement": "The third proposed model is a siamese network producing a pairwise similarity estimation, trained with the global pairwise similarity loss J_2^g. Architecture: B(96,7,3)-P(2,2)-B(192,5,1)-P(2,2)-B(256,3,1)-B(256,1,1)-C(1,1,1).", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": [{"id": "eq_global_loss_pairwise", "statement": "The global loss for pairwise similarity estimation is J_2^g = (sigma^{2+} + sigma^{2-}) + lambda * max(0, m - (mu^+ - mu^-)), where mu^+ and sigma^{2+} are mean and variance of matching pair similarities, mu^- and sigma^{2-} are mean and variance of non-matching pair similarities. It minimises variance of both distributions, minimises mean non-matching similarity, and maximises mean matching similarity.", "section": "3.2 Global Loss Function", "context": "", "parent_step": ""}]}, "def_model_cssnet_gloss": {"name": "Model 4: CS SNet, GLoss", "type": "definition", "section": "3.3 Proposed Models", "statement": "The fourth proposed model is the central-surround siamese network producing pairwise similarity, trained with the global loss J_2^g. It uses a multi-resolution central-surround architecture: B(95,5,1)-P(2,2)-B(96,3,1)-P(2,2)-B(192,3,1)-B(192,3,1) for each stream, combined by B(768,2,1)-C(1,1,1).", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "equations": [{"id": "eq_global_loss_pairwise", "statement": "The global loss for pairwise similarity estimation is J_2^g = (sigma^{2+} + sigma^{2-}) + lambda * max(0, m - (mu^+ - mu^-)), where mu^+ and sigma^{2+} are mean and variance of matching pair similarities, mu^- and sigma^{2-} are mean and variance of non-matching pair similarities. It minimises variance of both distributions, minimises mean non-matching similarity, and maximises mean matching similarity.", "section": "3.2 Global Loss Function", "context": "", "parent_step": ""}]}, "claim_triplet_better_siamese": {"name": "Triplet Network Improves Over Siamese for Descriptor Learning", "type": "claim", "section": "5.3 Results on UBC Benchmark Dataset", "statement": "The triplet network (TNet-TLoss) produces a more accurate embedding than the siamese network for local image descriptor learning on the UBC benchmark dataset.", "assumptions": ["Training and testing on the UBC benchmark dataset with six combinations of Liberty, Notredame, and Yosemite sets", "Comparison measured by FPR95 metric", "Feature embedding comparison using L2 norm distance"], "conclusions": ["TNet-TLoss achieves mean FPR95 of 9.63%, improving over Siam-l2 (13.45%) on the UBC dataset"], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}, "claim_combined_loss_best_embedding": {"name": "Combined Triplet+Global Loss Produces Best Embedding", "type": "claim", "section": "5.3 Results on UBC Benchmark Dataset", "statement": "The combination of the triplet and global losses (TNet-TGLoss) produces the best feature embedding result in the field on the UBC dataset, with mean FPR95 of 8.8%.", "assumptions": ["Training and testing on UBC benchmark dataset", "TNet-TGLoss initialised from TNet-TLoss trained for 50 epochs then trained for 50 more epochs with combined loss", "Hyperparameters gamma=1, t=0.4, lambda=0.8 estimated via cross validation"], "conclusions": ["TNet-TGLoss achieves mean FPR95 of 8.8%, the best embedding result on the UBC dataset, improving over TNet-TLoss (9.63%) and siam-2stream-l2 (9.67%)", "TNet-TGLoss embedding outperforms even some pairwise similarity methods (Siam and 512d-F(512))"], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}, "claim_global_loss_best_pairwise": {"name": "CS SNet with Global Loss Produces Best Pairwise Similarity Result", "type": "claim", "section": "5.3 Results on UBC Benchmark Dataset", "statement": "The central-surround siamese network trained with the global loss (CS SNet, GLoss) produces the best classification result on the UBC dataset in the pairwise similarity category, nearly halving the previous state-of-the-art FPR95.", "assumptions": ["Training and testing on UBC benchmark dataset", "Randomly initialised weights trained for 80 epochs", "Hyperparameters m=1, lambda=1 estimated via cross validation"], "conclusions": ["CS SNet GLoss achieves mean FPR95 of 2.71%, nearly halving the previous state-of-the-art (2ch-2stream at 4.19%)", "CS SNet GLoss achieves the best result on all six train/test combinations"], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}, "claim_global_loss_robustness": {"name": "Global Loss is Robust to Outliers", "type": "claim", "section": "4 Toy Problem", "statement": "The global loss function is more robust to outliers than the standard triplet loss, as demonstrated on a 2D toy dataset with 5% label noise. The global loss gradient depends on training set statistics (mu^+, mu^-), which suppresses spurious gradients from outliers.", "assumptions": ["2D toy dataset with 80 samples from two Gaussian distributions", "5% label noise (4 samples with switched labels)", "ConvNet mapping to 128-dimensional embedding with structure B(256,2,1)-B(512,1,1)-C(128,1,1)", "Evaluation by nearest-neighbour classification in embedding space"], "conclusions": ["Triplet loss alone overfits to outliers, producing incorrect labelling at outlier locations", "Combined triplet and global losses reduce labelling mistakes caused by outliers", "Global loss alone produces coherent label maps even at outlier locations"], "proof_info": [], "input": [], "output": [], "steps": [], "equations": [{"id": "eq_triplet_loss", "statement": "The triplet loss is J_1^t(x, x^+, x^-, theta_f) = max(0, 1 - ||f(x) - f(x^-)||_2 / (||f(x) - f(x^+)||_2 + m)), where m is a margin, x^+ is same-class as x, and x^- is a different class. It provides relative context by jointly considering similar and dissimilar pairs in each triplet.", "section": "3.1 Siamese and Triplet Networks", "context": "", "parent_step": ""}, {"id": "eq_global_loss_embedding", "statement": "The proposed global loss for feature embedding is J_1^g = (sigma^{2+} + sigma^{2-}) + lambda * max(0, mu^+ - mu^- + t), where mu^+, sigma^{2+} are mean and variance of matching pair distances, mu^-, sigma^{2-} are mean and variance of non-matching pair distances, lambda balances the terms, and t is the margin. Distances are d_i^+ = ||f(x_i) - f(x_i^+)||_2^2 / 4 and d_i^- = ||f(x_i) - f(x_i^-)||_2^2 / 4, constrained to [0,1].", "section": "3.2 Global Loss Function", "context": "", "parent_step": ""}, {"id": "eq_global_loss_gradient", "statement": "The gradient of J_1^g with respect to f(x_i) depends on global statistics mu^+ and mu^- of the training set (not just the i-th triplet), which suppresses spurious gradients from outliers and improves generalisation compared to the triplet loss gradient which depends only on the i-th triplet.", "section": "3.2 Global Loss Function", "context": "", "parent_step": ""}]}, "claim_pairwise_better_embedding": {"name": "Pairwise Similarity Methods Outperform Embedding Methods", "type": "claim", "section": "5.3 Results on UBC Benchmark Dataset", "statement": "Siamese networks trained with pairwise similarity loss achieve better classification performance than feature embeddings produced by triplet loss, but at the cost of higher inference complexity since pairwise similarity requires a forward pass through the network for each comparison.", "assumptions": ["Comparison on UBC benchmark dataset", "Embedding comparison uses cosine distance (simplified L2 due to unit norm)", "Pairwise similarity requires the final fully connected layer for each pair"], "conclusions": ["Pairwise similarity methods (e.g., CS SNet GLoss at 2.71%) outperform embedding methods (e.g., TNet-TGLoss at 8.8%)", "However, TNet-TGLoss embedding (8.8%) outperforms some pairwise similarity methods like Siam (10.07%) and 512d-F(512) (9.82%)"], "proof_info": [], "input": [], "output": [], "steps": [], "equations": []}};

  if ((d.assumptions && d.assumptions.length > 0) || eqsByCtx.assumption.length > 0) {
    h += '<div class="detail-section"><h4>Assumptions</h4>';
    if (d.assumptions) d.assumptions.forEach(function(a) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(a) + '</div>'; });
    eqsByCtx.assumption.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Conclusions + inline conclusion equations
  if ((d.conclusions && d.conclusions.length > 0) || eqsByCtx.conclusion.length > 0) {
    h += '<div class="detail-section"><h4>Conclusions</h4>';
    if (d.conclusions) d.conclusions.forEach(function(c) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(c) + '</div>'; });
    eqsByCtx.conclusion.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Proof strategy
  if (d.proof_info && d.proof_info.length > 0) {
    h += '<div class="detail-section"><h4>Proof Strategy</h4>';
    d.proof_info.forEach(function(p) {
      if (Array.isArray(p)) {
        p.forEach(function(item) { h += '<div style="font-size:13px;font-style:italic;">&bull; ' + esc(item) + '</div>'; });
      } else {
        h += '<div style="font-size:13px;font-style:italic;">' + esc(p) + '</div>';
      }
    });
    h += '</div>';
  }
  // Algorithm input/output
  if (d.input && d.input.length > 0) {
    h += '<div class="detail-section"><h4>Input</h4>';
    d.input.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // Proof steps with inline equations
  if (d.steps && d.steps.length > 0) {
    h += '<div class="detail-section"><h4>Proof Steps (' + d.steps.length + ')</h4>';
    d.steps.forEach(function(s, i) {
      h += '<div class="step-item"><strong>' + s.id + '</strong>: ' + esc(s.statement);
      if (eqsByStep[s.id]) {
        eqsByStep[s.id].forEach(function(e) { h += eqBlock(e); });
      }
      h += '</div>';
      if (i < d.steps.length - 1) h += '<div class="step-arrow">&#8595;</div>';
    });
    h += '</div>';
  }
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([panel]).catch(function(){});
}
function resetView() {
  document.getElementById("detail-panel").className = "";
  document.getElementById("detail-panel").innerHTML = "";
}
function toggleOrphans() {
  var p = document.getElementById("orphan-panel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  var h = "";
  ORPHANS.forEach(function(e) { h += '<div class="orphan-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>'; });
  document.getElementById("orphan-list").innerHTML = h;
  p.style.display = "block";
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([p]).catch(function(){});
}
// Ghost nodes (external dependencies)
function toggleGhosts() {
  var svgEl = document.querySelector("#svg-container svg");
  var ghostEls = svgEl ? svgEl.querySelectorAll('[id^="ghost_"]') : [];
  var btn = document.getElementById("ghost-btn");
  var isShowing = btn.dataset.showing === "1";
  if (!isShowing) {
    btn.dataset.showing = "1";
    btn.textContent = "Hide external dependencies";
    ghostEls.forEach(function(el) { el.style.display = ""; });
  } else {
    btn.dataset.showing = "0";
    btn.textContent = "Show external dependencies";
    ghostEls.forEach(function(el) { el.style.display = "none"; });
  }
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all ghost elements (boxes, headers, text, refs, edges)
    var all = svgEl.querySelectorAll('[id^="ghost_"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() { currentZoom = 1.0; applyZoom(); }

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
