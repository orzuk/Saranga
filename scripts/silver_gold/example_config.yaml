# Example silver-gold pipeline config.
# Used by scripts/silver_gold/run_full_pipeline.py.
#
# Each model gets its own output suffix; gold<suffix>.json sits next to the
# existing gold.json (Opus) in each paper folder. Set skip_extraction: true
# to leave existing JSONs alone (e.g., the Opus extraction was done
# elsewhere and you only want downstream ops on it).
#
# To run: ensure each model's api_key_env variable is set in the shell.
# `base_url` is only meaningful for the openai-compatible providers
# (deepseek, openrouter, etc.).

models:
  # Existing Opus extraction — gold.json was produced by Or via Claude Code.
  # We only run downstream operations on it (link + visualize).
  - name: opus_4_7
    suffix: ""
    provider: anthropic
    model: claude-opus-4-7
    api_key_env: ANTHROPIC_API_KEY
    skip_extraction: true

  # DeepSeek-Reasoner via DeepSeek's first-party OpenAI-compatible endpoint.
  # 64K output cap, ~2-4 min/paper, ~$0.10/paper.
  - name: deepseek_r
    suffix: _deepseek_r
    provider: openai
    model: deepseek-reasoner
    base_url: https://api.deepseek.com/v1
    api_key_env: OPENAI_API_KEY
    max_tokens: 32768
    max_input_chars: 200000

  # Google Gemini 2.5 Pro via AI Studio (paid tier; free is too rate-limited).
  # 64K output, 1M context, ~30-90s/paper, ~$0.10/paper.
  # - name: gemini_pro
  #   suffix: _gemini
  #   provider: google
  #   model: gemini-2.5-pro
  #   api_key_env: GOOGLE_API_KEY
  #   max_tokens: 32768

  # Anthropic Sonnet 4.6 — same lab as Opus (less independent for silver-gold)
  # but reliable, 64K output, ~$0.25/paper.
  # - name: sonnet_4_6
  #   suffix: _sonnet
  #   provider: anthropic
  #   model: claude-sonnet-4-6
  #   api_key_env: ANTHROPIC_API_KEY
  #   max_tokens: 32768
