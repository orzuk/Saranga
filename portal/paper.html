<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Paper — SARANGA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
</head>
<body>
  <header class="site">
    <h1><a href="index.html" style="color:inherit;text-decoration:none">SARANGA Database</a></h1>
    <span class="crumbs">
      <a href="index.html">Home</a>
      &nbsp;&rsaquo;&nbsp;
      <a id="back-to-tier" href="#">Tier&hellip;</a>
    </span>
  </header>
  <main>
    <div style="margin:6px 0 10px">
      <a id="back-link" href="#" style="font-size:13px;color:#34495e;text-decoration:none">
        &larr; Back to <span id="back-link-tier">tier list</span>
      </a>
    </div>
    <h2 id="paper-title">Loading&hellip;</h2>
    <div id="paper-subtitle" style="color:#6a6a6a;margin-bottom:14px"></div>

    <div class="tab-bar">
      <button id="tabbtn-overview" class="active">Overview</button>
      <button id="tabbtn-nodes">Nodes</button>
      <button id="tabbtn-graph">Graph</button>
      <button id="tabbtn-raw">Raw JSON</button>
    </div>
    <div id="tab-overview" class="tab-pane active"></div>
    <div id="tab-nodes"    class="tab-pane"></div>
    <div id="tab-graph"    class="tab-pane">
      <div style="margin-bottom:8px;text-align:right">
        <a id="graph-newtab" href="#" target="_blank" rel="noopener"
           style="font-size:13px;color:#34495e;text-decoration:none;display:none">
          Open graph in new tab &#x2197;
        </a>
      </div>
      <iframe id="graph-iframe" src="about:blank"
              style="width:100%;height:calc(100vh - 260px);min-height:560px;border:1px solid var(--border);background:#fff;border-radius:4px"
              loading="lazy"></iframe>
    </div>
    <div id="tab-raw"      class="tab-pane"></div>
  </main>

  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/contrib/auto-render.min.js"></script>
  <script src="vendor/cytoscape/cytoscape.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/paper.js"></script>
</body>
</html>
