<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #fafafa; }
#header { background: #2c3e50; color: white; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; }
#header h1 { margin: 0; font-size: 18px; }
#header .hint { font-size: 12px; color: #aaa; font-style: italic; margin-left: 12px; }
#controls button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; background: #34495e; color: white; margin-left: 8px; }
#controls button:hover { background: #4a6785; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 24px; background: #f5f5f5; border-bottom: 1px solid #eee; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #777; }
#main { display: flex; height: calc(100vh - 82px); }
#svg-container { flex: 1; overflow: auto; padding: 10px; cursor: grab; }
#svg-container svg { transform-origin: 0 0; }
#detail-panel { width: 0; overflow-y: auto; background: white; border-left: 1px solid #ddd; transition: width 0.3s; }
#detail-panel.open { width: 380px; padding: 16px; }
.detail-section { margin-bottom: 12px; }
.detail-section h4 { margin: 0 0 6px; color: #444; font-size: 13px; text-transform: uppercase; }
.step-item { background: #f0f0f0; border-left: 3px solid #839192; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.step-arrow { text-align: center; color: #aaa; font-size: 14px; }
.eq-item { background: #d4e6f1; border-left: 3px solid #5dade2; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.orphan-item { background: #fef9e7; border-left: 3px solid #f39c12; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; }
#orphan-panel { position: fixed; bottom: 16px; right: 16px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-width: 350px; max-height: 400px; overflow-y: auto; display: none; padding: 12px; z-index: 100; }
#orphan-toggle { display: none; }
/* Hover effect on clickable node rects */
[id^="node_"]:hover { filter: brightness(0.90); }
.ghost-node { display: inline-block; margin: 4px 8px; padding: 8px 14px; background: #E0E0E0; border: 1.5px solid #757575; border-radius: 5px; font-size: 13px; color: #333; cursor: pointer; vertical-align: top; white-space: normal; max-width: 220px; }
.ghost-node:hover { background: #BDBDBD; }
.ghost-node .ghost-label { font-weight: bold; font-size: 13px; }
.ghost-node .ghost-refs { font-size: 11px; color: #666; margin-top: 3px; }
/* Toggle controls panel (Foundation, Examples & Remarks, Cited Results) */
.toggle-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: 12px; padding: 4px 8px; background: #ECEFF1; border: 1px solid #CFD8DC; border-radius: 6px; }
.toggle-panel .toggle-label { font-size: 11px; color: #555; font-weight: bold; text-transform: uppercase; margin-right: 4px; }
.toggle-btn { padding: 4px 12px; border: 1.5px solid #757575; border-radius: 4px; background: #E0E0E0; cursor: pointer; font-size: 12px; color: #333; }
.toggle-btn:hover { background: #BDBDBD; }
.toggle-btn[data-showing="1"] { background: #2E7D32; color: white; border-color: #1B5E20; }
.toggle-btn[disabled] { opacity: 0.4; cursor: not-allowed; background: #EEE; }
/* Hidden state — applied dynamically via JS */
.svg-hidden { display: none !important; }
/* Visual differentiation when shown */
.node-external-shown [stroke-dasharray] { }  /* no-op, see runtime tweak */
.node-aux-shown { opacity: 0.75; }
/* v2: `resolves` edges (theorem-like resolves an open_problem/conjecture) — dashed */
.edge-resolves path { stroke-dasharray: 5,3 !important; }
.edge-resolves { stroke-dasharray: 5,3 !important; }

t": [], "output": [], "equations": []}, "D3": {"name": "D3", "type": "definition", "section": "", "statement": "() Let T = (V,E,varphi) be a binary phylogenetic tree and let ab|cd in Q_T. An interior edge e of T is distinguished by ab|cd if e is the only edge that separates a and b from c and d.", "statement_clean": "() Let T = (V,E,varphi) be a binary phylogenetic tree and let ab|cd in Q_T. An interior edge e of T is distinguished by ab|cd if e is the only edge that separates a and b from c and d.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "D4": {"name": "D4", "type": "definition", "section": "", "statement": "(protect) A system of quartet trees, Q, is definitive, if up to isomorphism, there exists a unique binary phylogenetic tree T for which Q subseteq Q_T.", "statement_clean": "(protect) A system of quartet trees, Q, is definitive, if up to isomorphism, there exists a unique binary phylogenetic tree T for which Q subseteq Q_T.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "P1": {"name": "bocker2", "type": "proposition", "section": "", "statement": "(Example 3.7 of ) If T is a binary tree such that the interior edges of T are labeled E=\\e_1,...,e_n-3\\, and Q is a system of quartet trees such that each q_i in Q distinguishes a unique edge e_i in T with \\[|supp(q_i)backslash bigcup_j<i supp(q_j)|= 1\\] for i=2,...,n-3, then Q is definitive.", "statement_clean": "(Example 3.7 of ) If T is a binary tree such that the interior edges of T are labeled E=\\e_1,...,e_n-3\\, and Q is a system of quartet trees such that each q_i in Q distinguishes a unique edge e_i in T with \\[|supp(q_i)backslash bigcup_j<i supp(q_j)|= 1\\] for i=2,...,n-3, then Q is definitive.", "origin": "external", "origin_citation": "", "assumptions": [], "conclusions": ["(Example 3.7 of ) If T is a binary tree such that the interior edges of T are labeled E=\\e_1,...,e_n-3\\, and Q is a system of quartet trees such that each q_i in Q distinguishes a unique edge e_i in T with \\[|supp(q_i)backslash bigcup_j<i supp(q_j)|= 1\\] for i=2,...,n-3, then Q is definitive."], "proof_info": ["Let Q be a linked system of quartet trees on a tree T on a taxon set X. Linked systems are of size n-3 and each quartet tree distinguishes a unique edge in T. Let T be a binary phylogenetic tree on a taxon set X and let e_1 be an interior edge adjacent to a cherry. The tree is connected, which implies we can label the remaining interior edges \\e_2, cdots, e_n-3 \\ such that e_j is adjacent to some e_i with i <j. Moreover, because the support of each pair of quartet trees \\q_i,q_j\\ that distinguishes adjacent edges \\e_i,e_j\\ is five, each pair of quartet trees shares three taxa and each additional quartet tree in Q adds one new taxon to the support of Q. Thus, linked systems meet the criteria in Proposition and are definitive."], "step_info": [], "input": [], "output": [], "equations": [{"id": "E1", "statement": "|supp(q_i)backslash bigcup_j<i supp(q_j)|= 1", "section": "", "context": "", "parent_step": ""}]}, "D5": {"name": "order", "type": "definition", "section": "", "statement": "For a compatible system of n-3 quartet trees Q on a taxon set X, define the associated graph G_T(Q) with vertex set V and edge set E as follows: item The vertex set V is the set of all quartet trees q in Q which distinguish a unique edge in T. item Vertex pairs \\q_i,q_j\\ are connected by an edge e in E if the edge e_i that q_i distinguishes is adjacent to the edge e_j that q_j distinguishes and |supp(\\q_i,q_j\\)|=5.", "statement_clean": "For a compatible system of n-3 quartet trees Q on a taxon set X, define the associated graph G_T(Q) with vertex set V and edge set E as follows: item The vertex set V is the set of all quartet trees q in Q which distinguish a unique edge in T. item Vertex pairs \\q_i,q_j\\ are connected by an edge e in E if the edge e_i that q_i distinguishes is adjacent to the edge e_j that q_j distinguishes and |supp(\\q_i,q_j\\)|=5.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "D6": {"name": "linked", "type": "definition", "section": "", "statement": "Two quartet trees are linked if their vertices are connected in G_T(Q). The system of quartet trees Q, is a linked system if G_T(Q) is connected. See Figure protect for an example.", "statement_clean": "Two quartet trees are linked if their vertices are connected in G_T(Q). The system of quartet trees Q, is a linked system if G_T(Q) is connected. See Figure protect for an example.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "D13": {"name": "\\mathcal{S", "type": "definition", "section": "", "statement": "Let S be the collection of subsets of a set X of size four, we refer to all such subsets as quartets.", "statement_clean": "Let S be the collection of subsets of a set X of size four, we refer to all such subsets as quartets.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "D7": {"name": "phylogenetically decisive", "type": "definition", "section": "", "statement": "We say that S is phylogenetically decisive if it satisfies the following property: If T and T' are binary phylogenetic trees, with T|Y=T'|Y for all Y in S, then T=T'.", "statement_clean": "We say that S is phylogenetically decisive if it satisfies the following property: If T and T' are binary phylogenetic trees, with T|Y=T'|Y for all Y in S, then T=T'.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "T1": {"name": "hierarchy", "type": "theorem", "section": "", "statement": "Every linked system of quartet trees is definitive.", "statement_clean": "Every linked system of quartet trees is definitive.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": ["Every linked system of quartet trees is definitive."], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "Ex1": {"name": "Ex1", "type": "example", "section": "", "statement": "The system of quartet trees Q=\\12|36,23|45,24|56\\ meets the criteria established in Proposition , and is thus definitive. The graph G_T(Q) contains the three vertices q_1, q_2, and q_3, where q_2 and q_3 are connected by an edge and q_1 is an isolated vertex. Thus, Q is not a linked system.", "statement_clean": "The system of quartet trees Q=\\12|36,23|45,24|56\\ meets the criteria established in Proposition , and is thus definitive. The graph G_T(Q) contains the three vertices q_1, q_2, and q_3, where q_2 and q_3 are connected by an edge and q_1 is an isolated vertex. Thus, Q is not a linked system.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "D8": {"name": "D8", "type": "definition", "section": "", "statement": "() A caterpillar on n leaves is a binary phylogenetic tree for which there exists an induced subtree on a sequence of distinct interior vertices v_1,v_2,...,v_k such that, for all i in \\1,2,...,k-1\\, v_i and v_i+1 are adjacent.", "statement_clean": "() A caterpillar on n leaves is a binary phylogenetic tree for which there exists an induced subtree on a sequence of distinct interior vertices v_1,v_2,...,v_k such that, for all i in \\1,2,...,k-1\\, v_i and v_i+1 are adjacent.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "T2": {"name": "ge", "type": "theorem", "section": "", "statement": "The minimal number k(n) such that every collection of quartets S with |S| geq k is decisive is greater than n choose 4 - (n-3).", "statement_clean": "The minimal number k(n) such that every collection of quartets S with |S| geq k is decisive is greater than n choose 4 - (n-3).", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": ["The minimal number k(n) such that every collection of quartets S with |S| geq k is decisive is greater than n choose 4 - (n-3)."], "proof_info": ["Let \\a,b,c\\ be a subset of X. We define T_1, T_2, and T_3 to be three distinct caterpillar trees of size n geq 4 that differ only in the placement of three taxa a, b, and c, such that for each tree v_int(a), v_int(b) and v_int(c) are incident to e_1. Denote S the set of n-3 sets bigcup_i=1^n-3Y_i=\\a,b,c,y|y in X-\\a,b,c\\\\ and let S' be the complement of S. We observe that for all Yin S' we have T_1|Y=T_2|Y=T_3|Y, but T_1 neq T_2 neq T_3. Therefore, S' is not decisive. Since |S'|=n choose 4 - (n-3) the minimal number k(n) such that every collection S of quartets with |S| geq k is decisive is greater than n choose 4 - (n-3)."], "step_info": [], "input": [], "output": [], "equations": []}, "D9": {"name": "D9", "type": "definition", "section": "", "statement": "Let q=ij|kh be a quartet tree that distinguishes an edge e and let i in A_i, j in A_j, k in A_k, and h in A_h, where A_i, A_j, A_k, and A_h are partitions of X induced by e. For xin X - supp(q) define the quartet tree substitution q(x) to be the unique quartet tree in which the taxon x in A_n replaces the taxon in q that is in supp(q) cap A_n.", "statement_clean": "Let q=ij|kh be a quartet tree that distinguishes an edge e and let i in A_i, j in A_j, k in A_k, and h in A_h, where A_i, A_j, A_k, and A_h are partitions of X induced by e. For xin X - supp(q) define the quartet tree substitution q(x) to be the unique quartet tree in which the taxon x in A_n replaces the taxon in q that is in supp(q) cap A_n.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "D10": {"name": "D10", "type": "definition", "section": "", "statement": "Let the quartet tree q distinguish an edge e of a tree. Define the vine of q by v(q)=\\q\\ cup bigcup_xin X-supp(q)q(x). We refer to q as the seed of the vine.", "statement_clean": "Let the quartet tree q distinguish an edge e of a tree. Define the vine of q by v(q)=\\q\\ cup bigcup_xin X-supp(q)q(x). We refer to q as the seed of the vine.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "D11": {"name": "linked", "type": "definition", "section": "", "statement": "Two vines v(q_i) and v(q_j) are linked if for each q_i in v(q_i) there exists a unique q_j in v(q_j) such that q_i and q_j are linked.", "statement_clean": "Two vines v(q_i) and v(q_j) are linked if for each q_i in v(q_i) there exists a unique q_j in v(q_j) such that q_i and q_j are linked.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "T3": {"name": "linkedquartets", "type": "theorem", "section": "", "statement": "If q_i and q_j are linked quartet trees, then the associated vines v(q_i) and v(q_j) are linked.", "statement_clean": "If q_i and q_j are linked quartet trees, then the associated vines v(q_i) and v(q_j) are linked.", "origin": "paper", "origin_citation": "", "assumptions": ["If q_i and q_j are linked quartet trees"], "conclusions": ["then the associated vines v(q_i) and v(q_j) are linked."], "proof_info": ["Assume that \\q_i,q_j\\ are the seeds of the adjacent edges e_i and e_j and are linked in T. Let v(q_i) and v(q_j) be the associated vines. Because the supp(q_i,q_j)=5, each quartet tree contains one taxon that the other does not. Let z be the taxon in supp(q_j)-supp(q_i) and y be the taxon in supp(q_i)-supp(q_j). Use quartet tree substitution to construct the quartet trees q_i(z) and q_j(y). By construction, supp(q_i,q_j)=supp(q_i(z),q_j(y)) and q_i(z) and q_j(y) are linked. Use quartet tree substitution with each remaining taxon x in X-supp(q_i,q_j) on q_i and q_j to construct the remaining quartet trees in v(q_i) and v(q_j). In the construction of each \\q_i(x),q_j(x)\\ one taxon (Case 1) or two taxa (Case 2) are removed and one taxon x is introduced. Thus, for x in X - (supp(q_i,q_j)) we have 4 leq |supp(q_i(x),q_j(x))| leq 6. In Case 1, x replaces the same taxon in q_i and q_j and supp(q_i,q_j) remains the same. In Case 2, x replaces one taxon in q_i and a different taxon in q_j. Assume that x replaces two different taxa in supp(q_i,q_j)-supp(q_i cap q_j). Then, |supp(q_i(x),q_j(x))|=4 and q_i(x)=q_j(x). This is not possible since q_i and q_j distinguish different edges. Thus, x does not replace two different taxa in supp(q_i,q_j)-supp(q_i cap q_j) and |supp(q_i(x),q_j(x))| neq 4. Now assume that x replaces two different taxa in supp(q_i cap q_j). Then, |supp(q_i(x),q_j(x))|=6. Recall that q_i and q_j distinguish the edges e_i and e_j. Thus, in order for x to replace two different taxa in supp(q_i cap q_j), x would have to be in two different sets of the partition that e_i induces on X. This is not possible because x cannot be in two different sets of a partition. Thus, x does not replace two different taxa in supp(q_i cap q_j) and |supp(q_i(x),q_j(x))| neq 6. Thus, in this case, x replaces one taxon in supp(q_i cap q_j) and one taxon in supp(q_i,q_j)-supp(q_i cap q_j) and |supp(\\q_i(x),q_j(x)\\)|=5. Therefore the vines v(q_i) and v(q_j) are linked.", "Let T be a binary phylogenetic tree on a taxon set X and let e_1 be an interior edge adjacent to a cherry. The tree is connected, which implies we can label the remaining interior edges \\e_2, cdots, e_n-3 \\ such that e_j is adjacent to some e_i with i <j. Let e_j be adjacent to e_i with i<j. We know that e_i separates T into two connected components T_i^a and T_i^b. Moreover, e_j separates T into two connected components T_j^a and T_j^b. Because e_i and e_j are adjacent, supp(T_i^b) cap supp(T_j^a) neq emptyset. Let q_i=ab|cd and q_j=ac|de such that a in supp(T_i^a), c in supp(T_j^b), and d in supp(T_i^b) cap supp(T_j^a). Thus, q_i and q_j are linked for all e_i and e_j in T. Thus, we have a linked system that makes up the first row of our matrix. Using quartet tree substitution, construct vines v(q_i) and v(q_j). By Theorem the vines v(q_j) and v(q_i) are linked. Thus, we have n-3 disjoint columns of quartet trees in our matrix. Additionally, for each pair of linked quartet trees \\q_i,q_j\\ in row one, there exists a pair \\q_i(x),q_j(x)\\ in the remaining rows of the matrix that are linked. Thus, we have n-3 rows of linked systems. Therefore, Q_T contains a meshed system."], "step_info": [], "input": [], "output": [], "equations": [], "foundation_links": ["Independent and Identically Distributed"]}, "D12": {"name": "meshed system", "type": "definition", "section": "", "statement": "A meshed system on a tree T with taxon set X is an (n-3) by (n-3) array of quartet trees, where each row is a linked system and each column is a vine.", "statement_clean": "A meshed system on a tree T with taxon set X is an (n-3) by (n-3) array of quartet trees, where each row is a linked system and each column is a vine.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "T4": {"name": "number", "type": "theorem", "section": "", "statement": "For any binary phylogenetic tree T on a taxon set X, the system Q_T of all quartet trees displayed by T contains a meshed system.", "statement_clean": "For any binary phylogenetic tree T on a taxon set X, the system Q_T of all quartet trees displayed by T contains a meshed system.", "origin": "paper", "origin_citation": "", "assumptions": ["For any binary phylogenetic tree T on a taxon set X"], "conclusions": ["the system Q_T of all quartet trees displayed by T contains a meshed system."], "proof_info": ["Let S be a collection of quartets on a taxon set X=[n], with |S| ge n choose 4 - (n-4). Let T and T' be two phylogenetic trees such that T|Y=T'|Y for all Y in S. We define Q subset Q_T to be the collection of T|Y for all Y in S. By Theorem , Q_T contains a meshed system M. By the pigeon hole principle, if |Q| geq n choose 4 - (n-4) then Q must contain one of the linked systems in M, and by Theorem , Q is definitive. Thus, T is the unique tree which displays Q. However since Q is also T'|Y for all Y in S, we must have T=T'. Therefore, S is decisive. Moreover, Theorem shows that k geq n choose 4 - (n-4). Therefore k(n)=n choose 4 - (n-4) is the minimal number such that every collection of quartets with |S| geq k is decisive."], "step_info": [], "input": [], "output": [], "equations": []}, "T5": {"name": "thm:big", "type": "theorem", "section": "", "statement": "The number k(n)=n choose 4 - (n-4) is the smallest number such that every collection of quartets S on a taxon set X=[n] such that S geq k is decisive.", "statement_clean": "The number k(n)=n choose 4 - (n-4) is the smallest number such that every collection of quartets S on a taxon set X=[n] such that S geq k is decisive.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": ["The number k(n)=n choose 4 - (n-4) is the smallest number such that every collection of quartets S on a taxon set X=[n] such that S geq k is decisive."], "proof_info": ["Let S be a collection of k quartets. Let T and T' be two phylogenetic trees such that T|Y=T'|Y for all Y in S. We define Q subset Q_T to be the collection of T|Y for all Y in S. Following Theorem protect, if Q contains a definitive set of quartet trees, then S is decisive. By Theorem protect, if a collection of compatible quartet trees contains a linked system of quartets, then it is definitive. Thus, the probability that a collection S is decisive is at least the probability that Q contains one of the n-3 disjoint linked systems constructed in Theorem protect. The formula follows from applying the inclusion-exclusion principle to count the number of subsets of size k, which contain one of the disjoint systems of linked quartets."], "step_info": [], "input": [], "output": [], "equations": []}, "T6": {"name": "T6", "type": "theorem", "section": "", "statement": "The probability p(X,k) that an arbitrary collection of k quartets is decisive has the property \\[p(X,k) geq fracsumlimits_i=1^n-3 (-1)^i+1n-3 choose i|Q_T|-i(n-3) choose |Q_T|-k|Q_T| choose k.\\]", "statement_clean": "The probability p(X,k) that an arbitrary collection of k quartets is decisive has the property \\[p(X,k) geq fracsumlimits_i=1^n-3 (-1)^i+1n-3 choose i|Q_T|-i(n-3) choose |Q_T|-k|Q_T| choose k.\\]", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": ["The probability p(X,k) that an arbitrary collection of k quartets is decisive has the property \\[p(X,k) geq fracsumlimits_i=1^n-3 (-1)^i+1n-3 choose i|Q_T|-i(n-3) choose |Q_T|-k|Q_T| choose k.\\]"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "E2", "statement": "p(X,k) geq fracsumlimits_i=1^n-3 (-1)^i+1n-3 choose i|Q_T|-i(n-3) choose |Q_T|-k|Q_T| choose k.", "section": "", "context": "", "parent_step": ""}]}, "DIST_D3": {"name": "displayed by a binary phylogenetic tree $T$", "type": "definition", "section": "", "statement": "and \\c,d\\ are subsets of the vertex sets of different connected components of T-\\e\\. This separation points to a relationship between edges of a tree and quartet trees. A quartet tree ab|cd is displayed by a binary phylogenetic tree T if there exists an edge e in E that separates a and b from c and d.", "statement_clean": "and \\c,d\\ are subsets of the vertex sets of different connected components of T-\\e\\. This separation points to a relationship between edges of a tree and quartet trees. A quartet tree ab|cd is displayed by a binary phylogenetic tree T if there exists an edge e in E that separates a and b from c and d.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DIST_D4": {"name": "compatible", "type": "definition", "section": "", "statement": "on X with the support defined by supp(Q)= bigcup_qin Q supp(q). Additionally, we denote the set of all quartet trees displayed by a tree T by Q_T. A system of quartet trees Q is compatible if there exists a tree T such that Q subseteq Q_T.", "statement_clean": "on X with the support defined by supp(Q)= bigcup_qin Q supp(q). Additionally, we denote the set of all quartet trees displayed by a tree T by Q_T. A system of quartet trees Q is compatible if there exists a tree T such that Q subseteq Q_T.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}};

function showDetail(nodeId) {
  var panel = document.getElementById("detail-panel");
  // Toggle: click same node again to close
  if (_lastDetailNode === nodeId && panel.className === "open") {
    panel.className = "";
    panel.innerHTML = "";
    _lastDetailNode = null;
    return;
  }
  _lastDetailNode = nodeId;
  // Special case: orphan/misc node
  if (nodeId === '__orphan__') {
    var h = '<h3 style="margin:0 0 8px;font-size:16px;">Misc: Unconnected Equations</h3>';
    h += '<div style="font-size:12px;color:#888;margin-bottom:10px;">Equations not linked to any theorem or proof step</div>';
    ORPHANS.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    if (ORPHANS.length === 0) h += '<div style="color:#888;">No orphan equations.</div>';
    panel.innerHTML = h;

  }
  var d = DETAILS[nodeId];
  if (!d) return;
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(nodeId) + ': ' + esc(d.name || d.type) + '</h3>';
  h += '<div style="font-size:12px;color:#888;margin-bottom:4px;">' + d.type + (d.section ? ' (Sec ' + d.section + ')' : '') + '</div>';
  // Origin badge — paper (default, shown only if external) or external (cited prior result)
  if (d.origin === "external") {
    var citeStr = d.origin_citation ? (' &mdash; ' + esc(d.origin_citation)) : '';
    h += '<div style="display:inline-block;padding:2px 8px;background:#FFF3E0;border:1px dashed #E65100;border-radius:3px;font-size:11px;color:#BF360C;margin-bottom:8px;">External (cited prior result)' + citeStr + '</div>';
  }
  // Foundation graph link badge (Case 1: known result)
  if (d.foundation_links && d.foundation_links.length > 0) {
    h += '<div style="display:inline-block;padding:2px 8px;background:#E3F2FD;border:1px solid #2471A3;border-radius:3px;font-size:11px;color:#2471A3;margin-bottom:8px;">&#128218; Known result: ' + d.foundation_links.map(esc).join(', ') + '</div>';
  }
  // Plain-text restatement (statement_clean) — shown above the formal statement
  if (d.statement_clean) {
    h += '<div class="detail-section"><h4>Plain-Text Summary</h4><div style="font-size:13px;color:#444;font-style:italic;">' + esc(d.statement_clean) + '</div></div>';
  }
  // Pre-build equation maps by context
  var eqsByCtx = {statement:[], assumption:[], conclusion:[], orphan:[]};
  var eqsByStep = {};
  if (d.equations) {
    d.equations.forEach(function(e) {
      if (e.parent_step) {
        if (!eqsByStep[e.parent_step]) eqsByStep[e.parent_step] = [];
        eqsByStep[e.parent_step].push(e);
      } else if (e.context && eqsByCtx[e.context]) {
        eqsByCtx[e.context].push(e);
      } else {
        eqsByCtx.orphan.push(e);
      }
    });
  }
  var eqTag = function(e) { return '<span style="color:#2471A3;font-size:11px;"> (' + e.id + ')</span>'; };
  var eqBlock = function(e) { return '<div style="margin:2px 0 2px 12px;padding:3px 8px;background:#EBF5FB;border-left:2px solid #5DADE2;font-size:12px;">' + esc(e.id) + ': ' + esc(e.statement) + '</div>'; };

  // Statement + inline statement equations
  if (d.statement) {
    h += '<div class="detail-section"><h4>Statement</h4><div style="font-size:14px;">' + esc(d.statement) + '</div>';
    eqsByCtx.statement.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Assumptions + inline assumption equations
  if ((d.assumptions && d.assumptions.length > 0) || eqsByCtx.assumption.length > 0) {
    h += '<div class="detail-section"><h4>Assumptions</h4>';
    if (d.assumptions) d.assumptions.forEach(function(a) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(a) + '</div>'; });
    eqsByCtx.assumption.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Conclusions + inline conclusion equations
  if ((d.conclusions && d.conclusions.length > 0) || eqsByCtx.conclusion.length > 0) {
    h += '<div class="detail-section"><h4>Conclusions</h4>';
    if (d.conclusions) d.conclusions.forEach(function(c) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(c) + '</div>'; });
    eqsByCtx.conclusion.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Proof strategy
  if (d.proof_info && d.proof_info.length > 0) {
    h += '<div class="detail-section"><h4>Proof Strategy</h4>';
    d.proof_info.forEach(function(p) {
      if (Array.isArray(p)) {
        p.forEach(function(item) { h += '<div style="font-size:13px;font-style:italic;">&bull; ' + esc(item) + '</div>'; });
      } else {
        h += '<div style="font-size:13px;font-style:italic;">' + esc(p) + '</div>';
      }
    });
    h += '</div>';
  }
  // v2: Step decomposition (proof_step children of a proof, or algorithm_step children of an algorithm)
  if (d.step_info && d.step_info.length > 0) {
    h += '<div class="detail-section"><h4>Decomposition (' + d.step_info.length + ' steps)</h4>';
    d.step_info.forEach(function(s, i) {
      var ord = (s.step_order || (i + 1));
      var label = s.name ? esc(s.name) : esc(s.id || ('Step ' + ord));
      h += '<div class="step-item"><strong>' + ord + '. ' + label + '</strong>';
      if (s.subclass) {
        h += ' <span style="font-size:11px;font-style:italic;color:#666;">[' + esc(s.subclass) + ']</span>';
      }
      var body = s.statement_clean || s.statement || '';
      if (body) {
        h += '<div style="font-size:12px;color:#444;margin-top:2px;">' + esc(body) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  // Algorithm input/output
  if (d.input && d.input.length > 0) {
    h += '<div class="detail-section"><h4>Input</h4>';
    d.input.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // (Legacy "Proof Steps" panel removed: same data now rendered above as
  // "Decomposition" via d.step_info. Both used to read from step_chains and
  // produced duplicate sections on click.)
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  typesetMath(panel);
}
function resetView() {
  document.getElementById("detail-panel").className = "";
  document.getElementById("detail-panel").innerHTML = "";
}
function toggleOrphans() {
  var p = document.getElementById("orphan-panel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  var h = "";
  ORPHANS.forEach(function(e) { h += '<div class="orphan-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>'; });
  document.getElementById("orphan-list").innerHTML = h;
  p.style.display = "block";
  typesetMath(p);
}
// Foundation toggle (ghost nodes — both mathlib/proofwiki ("ghost_") and
// book entries ("ghostbook_") are picked up by the [id^="ghost"] selector).
function toggleGhosts() {
  var btn = document.getElementById("ghost-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  btn.dataset.showing = isShowing ? "0" : "1";
  _applyGhostVisibility();
}

// Apply current foundation visibility, respecting whether ghost edges' target
// nodes are currently hidden (aux/external toggles). A foundation arrow is
// only shown when (a) Foundation toggle is ON and (b) its target node is
// currently visible — otherwise it would float into empty space.
function _applyGhostVisibility() {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  var btn = document.getElementById("ghost-btn");
  var on = btn && btn.dataset.showing === "1";
  var auxBtn = document.getElementById("aux-btn");
  var extBtn = document.getElementById("ext-btn");
  var auxOn = auxBtn && auxBtn.dataset.showing === "1";
  var extOn = extBtn && extBtn.dataset.showing === "1";
  // Show/hide ghost boxes, headers, text, refs uniformly.
  var ghostEls = svgEl.querySelectorAll('[id^="ghost"]');
  ghostEls.forEach(function(el) {
    var gid = el.id;
    if (!on) {
      el.style.display = "none";
      return;
    }
    // Edge gid pattern: "<prefix>_edge_<gi>_<ti>". For these, check target.
    if (GHOST_EDGE_TO_TARGET.hasOwnProperty(gid)) {
      var target = GHOST_EDGE_TO_TARGET[gid];
      var targetHidden = (AUX_NODE_SET[target] && !auxOn) || (EXT_NODE_SET[target] && !extOn);
      el.style.display = targetHidden ? "none" : "";
    } else {
      el.style.display = "";
    }
  });
}

// Generic helper: hide/show a set of nodes (by id) and their incident edges.
function _setNodeVisibility(nodeIds, edgeGids, visible, extraClass) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  nodeIds.forEach(function(nid) {
    // Body rect
    var body = svgEl.querySelector('[id="node_' + nid + '"]');
    if (body) {
      body.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) body.classList.add(extraClass);
        else body.classList.remove(extraClass);
      }
    }
    // All sibling per-node elements (header rect, text labels, divider lines)
    var sibs = svgEl.querySelectorAll('[id^="node_' + nid + '__"]');
    sibs.forEach(function(el) {
      el.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) el.classList.add(extraClass);
        else el.classList.remove(extraClass);
      }
    });
  });
  edgeGids.forEach(function(gid) {
    var e = svgEl.querySelector('[id="' + gid + '"]');
    if (e) e.style.display = visible ? "" : "none";
  });
}

// Examples & Remarks toggle — hides nodes with type in {example, remark}
function toggleAux() {
  var btn = document.getElementById("aux-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  // Apply visual differentiation: lighter shade (opacity) when shown
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, nextShowing, "node-aux-shown");
  // Apply opacity styling on the body rect when shown
  AUX_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) body.style.opacity = nextShowing ? "0.75" : "";
  });
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
}

// Cited Results (External) toggle — hides nodes with origin === "external"
function toggleExternal() {
  var btn = document.getElementById("ext-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, nextShowing, "node-external-shown");
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
  // Apply dashed border on body rect when shown (visual differentiation)
  EXT_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) {
      // FancyBboxPatch is a <path>; modify its stroke-dasharray for a dashed look.
      var pathEl = body.tagName === "path" ? body : body.querySelector("path");
      if (pathEl) {
        if (nextShowing) {
          pathEl.setAttribute("stroke-dasharray", "6,3");
          pathEl.setAttribute("stroke-width", "2");
        } else {
          pathEl.removeAttribute("stroke-dasharray");
          pathEl.removeAttribute("stroke-width");
        }
      }
    }
  });
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements + aux + external elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all foundation ghost elements (mathlib/proofwiki AND book-derived).
    // The [id^="ghost"] selector covers both "ghost_*" and "ghostbook_*".
    var all = svgEl.querySelectorAll('[id^="ghost"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
  // Examples & Remarks: hidden by default (toggle starts in OFF state).
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, false, null);
  // Cited Results (External): hidden by default.
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, false, null);
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() {
  if (svgEl) {
    var container = document.getElementById("svg-container");
    var svgW = svgEl.getBoundingClientRect().width / currentZoom;
    var svgH = svgEl.getBoundingClientRect().height / currentZoom;
    var cW = container.clientWidth - 20;
    var cH = container.clientHeight - 20;
    currentZoom = Math.min(cW / svgW, cH / svgH, 1.0);
    applyZoom();
  }
}
// Auto-fit on load
zoomFit();

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
