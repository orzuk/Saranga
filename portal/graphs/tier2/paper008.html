<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #fafafa; }
#header { background: #2c3e50; color: white; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; }
#header h1 { margin: 0; font-size: 18px; }
#header .hint { font-size: 12px; color: #aaa; font-style: italic; margin-left: 12px; }
#controls button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; background: #34495e; color: white; margin-left: 8px; }
#controls button:hover { background: #4a6785; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 24px; background: #f5f5f5; border-bottom: 1px solid #eee; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #777; }
#main { display: flex; height: calc(100vh - 82px); }
#svg-container { flex: 1; overflow: auto; padding: 10px; cursor: grab; }
#svg-container svg { transform-origin: 0 0; }
#detail-panel { width: 0; overflow-y: auto; background: white; border-left: 1px solid #ddd; transition: width 0.3s; }
#detail-panel.open { width: 380px; padding: 16px; }
.detail-section { margin-bottom: 12px; }
.detail-section h4 { margin: 0 0 6px; color: #444; font-size: 13px; text-transform: uppercase; }
.step-item { background: #f0f0f0; border-left: 3px solid #839192; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.step-arrow { text-align: center; color: #aaa; font-size: 14px; }
.eq-item { background: #d4e6f1; border-left: 3px solid #5dade2; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.orphan-item { background: #fef9e7; border-left: 3px solid #f39c12; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; }
#orphan-panel { position: fixed; bottom: 16px; right: 16px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-width: 350px; max-height: 400px; overflow-y: auto; display: none; padding: 12px; z-index: 100; }
#orphan-toggle { display: none; }
/* Hover effect on clickable node rects */
[id^="node_"]:hover { filter: brightness(0.90); }
.ghost-node { display: inline-block; margin: 4px 8px; padding: 8px 14px; background: #E0E0E0; border: 1.5px solid #757575; border-radius: 5px; font-size: 13px; color: #333; cursor: pointer; vertical-align: top; white-space: normal; max-width: 220px; }
.ghost-node:hover { background: #BDBDBD; }
.ghost-node .ghost-label { font-weight: bold; font-size: 13px; }
.ghost-node .ghost-refs { font-size: 11px; color: #666; margin-top: 3px; }
/* Toggle controls panel (Foundation, Examples & Remarks, Cited Results) */
.toggle-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: 12px; padding: 4px 8px; background: #ECEFF1; border: 1px solid #CFD8DC; border-radius: 6px; }
.toggle-panel .toggle-label { font-size: 11px; color: #555; font-weight: bold; text-transform: uppercase; margin-right: 4px; }
.toggle-btn { padding: 4px 12px; border: 1.5px solid #757575; border-radius: 4px; background: #E0E0E0; cursor: pointer; font-size: 12px; color: #333; }
.toggle-btn:hover { background: #BDBDBD; }
.toggle-btn[data-showing="1"] { background: #2E7D32; color: white; border-color: #1B5E20; }
.toggle-btn[disabled] { opacity: 0.4; cursor: not-allowed; background: #EEE; }
/* Hidden state — applied dynamically via JS */
.svg-hidden { display: none !important; }
/* Visual differentiation when shown */
.node-external-shown [stroke-dasharray] { }  /* no-op, see runtime tweak */
.node-aux-shown { opacity: 0.75; }
/* v2: `resolves` edges (theorem-like resolves an open_problem/conjecture) — dashed */
.edge-resolves path { stroke-dasharray: 5,3 !important; }
.edge-resolves { stroke-dasharray: 5,3 !important; }
</style>

var DETAILS = {"ProbP8.1": {"name": "Convex Stochastic Optimization (Strongly Convex)", "type": "problem", "section": "2 Preliminaries", "statement": "Minimize a $\\lambda$-strongly convex function $F$ over a convex domain $\\Wcal$ using only a stochastic gradient oracle that returns $\\hat{\\bg}$ with $\\E[\\hat{\\bg}]\\in\\partial F(\\bw)$, using $T$ oracle calls; bound $F(\\bw_T)-F(\\bw^*)$.", "statement_clean": "Minimize an unknown strongly convex function from T noisy subgradient queries; bound the suboptimality.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP8.1": {"name": "$\\lambda$-Strongly Convex Function", "type": "definition", "section": "2 Preliminaries", "statement": "$F$ is $\\lambda$-strongly convex if for all $\\bw,\\bw'\\in\\Wcal$ and any subgradient $\\bg$ of $F$ at $\\bw$: $F(\\bw')\\geq F(\\bw)+\\inner{\\bg,\\bw'-\\bw}+\\frac{\\lambda}{2}\\norm{\\bw'-\\bw}^2$.", "statement_clean": "F is lower-bounded by a quadratic in any direction.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP8.2": {"name": "$\\mu$-Smoothness w.r.t. $\\bw^*$", "type": "definition", "section": "2 Preliminaries", "statement": "$F$ is $\\mu$-smooth with respect to $\\bw^*$ if for all $\\bw\\in\\Wcal$: $F(\\bw)-F(\\bw^*)\\leq \\frac{\\mu}{2}\\norm{\\bw-\\bw^*}^2$.", "statement_clean": "F is upper-bounded by a quadratic centered at the optimum.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP8.3": {"name": "Average Iterate $\\bar{\\bw}_T$", "type": "definition", "section": "2 Preliminaries", "statement": "$\\bar{\\bw}_T = \\frac{1}{T}(\\bw_1+\\ldots+\\bw_T)$, the average of the SGD iterates.", "statement_clean": "Standard Polyak-Ruppert averaging.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP8.4": {"name": "$\\alpha$-Suffix Average $\\bar{\\bw}^{\\alpha}_T$", "type": "definition", "section": "5 $\\alpha$-Suffix Averaging", "statement": "$\\bar{\\bw}^{\\alpha}_T = \\frac{\\bw_{(1-\\alpha)T+1}+\\ldots+\\bw_T}{\\alpha T}$ for $\\alpha\\in(0,1)$: average only the last $\\alpha T$ iterates.", "statement_clean": "Average only the final fraction alpha of the SGD trajectory.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "AssumP8.1": {"name": "Bounded Second Moment of Stochastic Gradient", "type": "assumption", "section": "2 Preliminaries", "statement": "$\\E[\\norm{\\hat{\\bg}_t}^2]\\leq G^2$ for all $t$, regardless of how the iterates evolve.", "statement_clean": "Stochastic gradient has uniformly bounded second moment.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "AP8.1": {"name": "Stochastic Gradient Descent (SGD) with $\\eta_t=1/\\lambda t$", "type": "algorithm", "section": "2 Preliminaries", "statement": "Initialize $\\bw_1=\\mathbf{0}$. For $t=1,\\ldots,T$: query the stochastic gradient oracle for $\\hat{\\bg}_t$ at $\\bw_t$; set $\\bw_{t+1}=\\Pi_{\\Wcal}(\\bw_t-\\eta_t \\hat{\\bg}_t)$.", "statement_clean": "Projected stochastic gradient descent with $1/\\lambda t$ step size.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [{"id": "ASP8.1", "name": "Initialize $\\bw_1=\\mathbf{0}$", "subclass": "initialize", "statement_clean": "", "statement": "Set the starting iterate $\\bw_1=\\mathbf{0}\\in\\Wcal$.", "step_order": 1}, {"id": "ASP8.2", "name": "For $t=1,\\ldots,T$ loop body", "subclass": "loop", "statement_clean": "", "statement": "For each $t$: query the stochastic-gradient oracle at $\\bw_t$ to obtain $\\hat{\\bg}_t$ with $\\E[\\hat{\\bg}_t]=\\bg_t\\in\\partial F(\\bw_t)$; then update $\\bw_{t+1}=\\Pi_{\\Wcal}(\\bw_t-\\eta_t \\hat{\\bg}_t)$.", "step_order": 2}, {"id": "ASP8.3", "name": "Return chosen output point", "subclass": "return", "statement_clean": "", "statement": "Return one of: the last iterate $\\bw_{T+1}$, the full average $\\bar{\\bw}_T=\\frac{1}{T}\\sum_{t=1}^{T}\\bw_t$, or the $\\alpha$-suffix average $\\bar{\\bw}^{\\alpha}_T$.", "step_order": 3}], "input": ["Convex domain $\\Wcal$", "Stochastic gradient oracle for $F$", "Step sizes $\\eta_t=1/\\lambda t$", "Number of iterations $T$"], "output": ["Sequence of iterates $\\bw_1,\\ldots,\\bw_{T+1}$", "A returned point: last iterate $\\bw_{T+1}$, average $\\bar{\\bw}_T$, or suffix average $\\bar{\\bw}^{\\alpha}_T$"], "equations": []}, "AP8.2": {"name": "Epoch-GD", "type": "algorithm", "section": "1 Introduction; 6 Experiments (cited)", "statement": "Optimal algorithm of Hazan and Kale for strongly convex stochastic optimization: divides $T$ iterations into exponentially increasing epochs, runs SGD with averaging on each, uses each epoch's output as the next epoch's start; returns the final epoch's point.", "statement_clean": "Exponentially increasing epochs of averaged SGD; cited optimal $O(1/T)$ baseline.", "origin": "external", "origin_citation": "Hazan & Kale 2011 (HazanKa11)", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "TP8.1": {"name": "Last-Iterate $O(1/T)$ Rate for Smooth Strongly Convex SGD", "type": "theorem", "section": "3 Smooth Functions", "statement": "If $F$ is $\\lambda$-strongly convex and $\\mu$-smooth w.r.t. $\\bw^*$ over $\\Wcal$, $\\E[\\norm{\\hat{\\bg}_t}^2]\\leq G^2$, and $\\eta_t=1/\\lambda t$, then $\\E[F(\\bw_T)-F(\\bw^*)]\\leq \\frac{2\\mu G^2}{\\lambda^2 T}$.", "statement_clean": "For smooth strongly convex F, the last SGD iterate achieves the optimal $O(1/T)$ rate.", "origin": "paper", "origin_citation": "", "assumptions": ["$F$ is $\\lambda$-strongly convex", "$F$ is $\\mu$-smooth with respect to $\\bw^*$", "$\\E[\\norm{\\hat{\\bg}_t}^2]\\leq G^2$", "$\\eta_t=1/\\lambda t$"], "conclusions": ["$\\E[F(\\bw_T)-F(\\bw^*)]\\leq \\frac{2\\mu G^2}{\\lambda^2 T}$"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP8.1": {"name": "Distance Decay Lemma", "type": "lemma", "section": "3 Smooth Functions", "statement": "If $F$ is $\\lambda$-strongly convex over $\\Wcal$, $\\E[\\norm{\\hat{\\bg}_t}^2]\\leq G^2$, and $\\eta_t=1/\\lambda t$, then $\\E[\\norm{\\bw_T-\\bw^*}^2]\\leq \\frac{4G^2}{\\lambda^2 T}$.", "statement_clean": "Expected squared distance of SGD iterate to optimum decays as $1/T$ for any strongly convex F.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": ["Strong convexity yields $(1-2\\eta_t\\lambda)\\E[\\norm{\\bw_t-\\bw^*}^2]+\\eta_t^2 G^2$ recurrence; with $\\eta_t=1/\\lambda t$ this becomes $(1-2/t)\\E[\\norm{\\bw_t-\\bw^*}^2]+G^2/(\\lambda^2 t^2)$, and induction starting from Lemma distance gives $4G^2/(\\lambda^2 t)$."], "step_info": [{"id": "PSP8.1", "name": "Strong-convexity inner-product inequality", "subclass": "setup", "statement_clean": "", "statement": "Strong convexity of $F$ and optimality of $\\bw^*$ give $\\inner{\\bg_t,\\bw_t-\\bw^*}\\geq F(\\bw_t)-F(\\bw^*)+\\frac{\\lambda}{2}\\norm{\\bw_t-\\bw^*}^2$ and $F(\\bw_t)-F(\\bw^*)\\geq \\frac{\\lambda}{2}\\norm{\\bw_t-\\bw^*}^2$.", "step_order": 1}, {"id": "PSP8.2", "name": "Expand projection update", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "Use $\\norm{\\Pi_{\\Wcal}(\\bv)-\\bw}\\leq \\norm{\\bv-\\bw}$ to expand $\\E\\norm{\\bw_{t+1}-\\bw^*}^2$ in terms of $\\E\\norm{\\bw_t-\\bw^*}^2$, $\\E\\inner{\\bg_t,\\bw_t-\\bw^*}$, and $\\eta_t^2 \\E\\norm{\\hat{\\bg}_t}^2$.", "step_order": 2}, {"id": "PSP8.3", "name": "Combine to obtain recurrence", "subclass": "substitute", "statement_clean": "", "statement": "Substituting PSP8.1 into PSP8.2 yields the recurrence $\\E[\\norm{\\bw_{t+1}-\\bw^*}^2]\\leq (1-2\\eta_t\\lambda)\\E[\\norm{\\bw_t-\\bw^*}^2]+\\eta_t^2 G^2$.", "step_order": 3}, {"id": "PSP8.4", "name": "Plug $\\eta_t=1/\\lambda t$", "subclass": "substitute", "statement_clean": "", "statement": "Setting $\\eta_t=1/\\lambda t$ gives $\\E[\\norm{\\bw_{t+1}-\\bw^*}^2]\\leq (1-2/t)\\E[\\norm{\\bw_t-\\bw^*}^2]+G^2/(\\lambda^2 t^2)$.", "step_order": 4}, {"id": "PSP8.5", "name": "Induction with base case from Lemma distance", "subclass": "induction_step", "statement_clean": "", "statement": "By Lemma distance (LP8.2), $\\E\\norm{\\bw_1-\\bw^*}^2\\leq 4G^2/\\lambda^2$; the recurrence then gives $\\E\\norm{\\bw_t-\\bw^*}^2\\leq 4G^2/(\\lambda^2 t)$ for $t=2$, and induction (base $t=3$) yields the claim for all $t$.", "step_order": 5}], "input": [], "output": [], "equations": []}, "TP8.2": {"name": "$O(1/T)$ Rate for Average Iterate (Smooth Case)", "type": "theorem", "section": "3 Smooth Functions", "statement": "If $F$ is $\\lambda$-strongly convex and $\\mu$-smooth w.r.t. $\\bw^*$, $\\E[\\norm{\\hat{\\bg}_t}^2]\\leq G^2$, and $\\eta_t=1/\\lambda t$, then $\\E[F(\\bar{\\bw}_T)-F(\\bw^*)]\\leq \\frac{16\\mu G^2}{\\lambda^2 T}$.", "statement_clean": "Average SGD iterate also attains the optimal $O(1/T)$ rate when F is smooth.", "origin": "paper", "origin_citation": "", "assumptions": ["$F$ is $\\lambda$-strongly convex and $\\mu$-smooth w.r.t. $\\bw^*$", "$\\E[\\norm{\\hat{\\bg}_t}^2]\\leq G^2$", "$\\eta_t=1/\\lambda t$"], "conclusions": ["$\\E[F(\\bar{\\bw}_T)-F(\\bw^*)]\\leq \\frac{16\\mu G^2}{\\lambda^2 T}$"], "proof_info": ["Recursion for $\\bar{\\bw}_{t+1}$ combined with Cauchy-Schwartz and Lemma close yields $\\E[\\norm{\\bar{\\bw}_T-\\bw^*}^2]\\leq 32G^2/(\\lambda^2 T)$ by induction; smoothness then gives the suboptimality bound."], "step_info": [{"id": "PSP8.6", "name": "Recursive identity for $\\bar{\\bw}_{t+1}$", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "Decompose $\\bar{\\bw}_{t+1}=\\frac{t}{t+1}\\bar{\\bw}_t+\\frac{1}{t+1}\\bw_{t+1}$ and expand $\\E\\norm{\\bar{\\bw}_{t+1}-\\bw^*}^2$ via the cross-term identity.", "step_order": 1}, {"id": "PSP8.7", "name": "Apply Cauchy-Schwartz and Lemma close", "subclass": "apply_lemma", "statement_clean": "", "statement": "Bound the cross term by $\\E[|XY|]\\leq\\sqrt{\\E[X^2]}\\sqrt{\\E[Y^2]}$ and use Lemma close (LP8.1) to bound $\\E\\norm{\\bw_{t+1}-\\bw^*}^2\\leq 4G^2/(\\lambda^2(t+1))$.", "step_order": 2}, {"id": "PSP8.8", "name": "Induction yields $\\E\\norm{\\bar{\\bw}_T-\\bw^*}^2\\leq 32G^2/(\\lambda^2 T)$", "subclass": "induction_step", "statement_clean": "", "statement": "By induction (base from Lemma distance LP8.2) the resulting inequality $\\big(\\tfrac{t}{t+1}\\big)^2 a_t+\\tfrac{4G}{\\lambda(t+1)^{3/2}}\\sqrt{a_t}+\\tfrac{4G^2}{\\lambda^2(t+1)^3}$ gives $\\E\\norm{\\bar{\\bw}_T-\\bw^*}^2\\leq 32G^2/(\\lambda^2 T)$.", "step_order": 3}, {"id": "PSP8.9", "name": "Apply $\\mu$-smoothness to conclude", "subclass": "conclude", "statement_clean": "", "statement": "Smoothness of $F$ w.r.t. $\\bw^*$ gives $F(\\bar{\\bw}_T)-F(\\bw^*)\\leq \\frac{\\mu}{2}\\norm{\\bar{\\bw}_T-\\bw^*}^2$; combine with PSP8.8 to obtain the $16\\mu G^2/(\\lambda^2 T)$ bound.", "step_order": 4}], "input": [], "output": [], "equations": []}, "TP8.3": {"name": "$\\Omega(\\log T/T)$ Lower Bound for SGD-Average (Border Optimum)", "type": "theorem", "section": "4 Non-Smooth Functions", "statement": "For $F(\\bw)=\\frac{1}{2}\\norm{\\bw}^2+w_1$ on $\\Wcal=[0,1]^d$ with the prescribed stochastic gradient, if $\\eta_t=c/t$, then for any $T\\geq T_0+1$ with $T_0=\\max\\{2,c/2\\}$: $\\E[F(\\bar{\\bw}_T)-F(\\bw^*)]\\geq \\frac{c}{16T}\\sum_{t=T_0}^{T-1}\\frac{1}{t}=\\Omega(\\log T/T)$.", "statement_clean": "When the optimum lies on a corner of W, SGD with averaging is provably $\\Omega(\\log T/T)$.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": ["Conditional on $Z_t\\leq -1/2$, $w_{t+1,1}\\geq \\eta_t/2$; Pr$(Z_t\\leq -1/2)=1/8$ gives $\\E[w_{t+1,1}]\\geq \\eta_t/16$, summing yields the lower bound."], "step_info": [{"id": "PSP8.10", "name": "Write coordinate-1 SGD recursion", "subclass": "setup", "statement_clean": "", "statement": "From the projected SGD update, $w_{t+1,1}=\\Pi_{[0,1]}((1-\\eta_t)w_{t,1}-\\eta_t Z_t)$.", "step_order": 1}, {"id": "PSP8.11", "name": "Case split on $Z_t$", "subclass": "case_split", "statement_clean": "", "statement": "Conditional on $Z_t\\leq -1/2$ and using $\\eta_t\\leq 2$, $w_{t+1,1}\\geq \\eta_t/2$; conditional on $Z_t>-1/2$, the domain forces $w_{t+1,1}\\geq 0$.", "step_order": 2}, {"id": "PSP8.12", "name": "Take expectation: $\\E[w_{t+1,1}]\\geq \\eta_t/16$", "subclass": "bound_estimate", "statement_clean": "", "statement": "Combining the two cases with $\\Pr(Z_t\\leq -1/2)=1/8$ on $Z_t\\sim U[-1,3]$ gives $\\E[w_{t+1,1}]\\geq \\frac{1}{16}\\eta_t$.", "step_order": 3}, {"id": "PSP8.13", "name": "Sum over $t$ and convert to $F$", "subclass": "conclude", "statement_clean": "", "statement": "Summing $\\E[w_{t,1}]\\geq \\eta_{t-1}/16$ over $t=T_0+1,\\ldots,T$ gives $\\E[\\bar{w}_{T,1}]\\geq \\frac{1}{16T}\\sum_{t=T_0}^{T-1}\\eta_t$, and $F(\\bar{\\bw}_T)\\geq \\bar{w}_{T,1}$ on this instance with $\\bw^*=\\mathbf{0}$.", "step_order": 4}], "input": [], "output": [], "equations": []}, "TP8.4": {"name": "$\\Omega(\\log T/T)$ Lower Bound for SGD-Average (Interior Optimum)", "type": "theorem", "section": "4 Non-Smooth Functions", "statement": "For the $1$-strongly convex $F(\\bw)=\\frac{1}{2}\\norm{\\bw}^2+\\begin{cases}w_1 & w_1\\geq 0\\\\ -7w_1 & w_1<0\\end{cases}$ on $\\Wcal=[-1,1]^d$ with the prescribed gradient oracle, if $w_{1,1}\\geq 0$, $\\eta_t=c/t$, $T_0=\\max\\{2,6c+1\\}$, $T\\geq T_0+2$: $\\E[F(\\bar{\\bw}_T)-F(\\bw^*)]\\geq \\frac{3c}{16T}\\sum_{t=T_0+2}^{T}\\frac{1}{t}-\\frac{T_0}{T}=\\Omega(\\log T/T)$.", "statement_clean": "Even with optimum in the interior, non-smoothness forces SGD-average to a $\\Omega(\\log T/T)$ rate.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": ["Lemma above0 ensures $w_{t,1}<0$ implies $w_{t+1,1}\\geq 5c/t$; bounding Pr$(w_{t,1}\\notin[0,c/t]\\mid w_{t-1,1}\\geq 0)\\geq 3/4$ yields $\\E[\\bar{w}_{T,1}]\\geq (3c/16T)\\sum 1/t-T_0/T$."], "step_info": [{"id": "PSP8.14", "name": "Invoke Lemma above 0", "subclass": "apply_lemma", "statement_clean": "", "statement": "By Lemma above0 (LP8.4), for $t\\geq T_0$, $w_{t,1}<0$ implies $w_{t+1,1}\\geq 5c/t$, and $w_{t,1}+w_{t+1,1}\\geq 3c/t$.", "step_order": 1}, {"id": "PSP8.15", "name": "Lower-bound $\\E\\sum w_{t,1}$ by indicator argument", "subclass": "bound_estimate", "statement_clean": "", "statement": "Pair iterates so that $\\E[w_{T_0,1}+\\ldots+w_{T,1}]\\geq \\sum_t \\Pr(w_{t,1}\\notin[0,\\eta_t])\\frac{c}{2t}$ via splitting the cases $w_{t,1}<0$ and $w_{t,1}>c/t$.", "step_order": 2}, {"id": "PSP8.16", "name": "Bound $\\Pr(w_{t,1}\\in[0,c/t]\\mid w_{t-1,1}\\geq 0)\\leq 1/4$", "subclass": "bound_estimate", "statement_clean": "", "statement": "For $Z_t\\sim U[-1,3]$ (length-4 interval), the event traps $Z_t$ in a length-1 interval, so the conditional probability is $\\leq 1/4$, giving $\\Pr(w_{t,1}\\notin[0,c/t]\\mid w_{t-1,1}\\geq 0)\\geq 3/4$.", "step_order": 3}, {"id": "PSP8.17", "name": "Combine using non-consecutive-zero indicator", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "By LP8.4 the indicators $\\mathbf{1}_{w_{t,1}\\geq 0}$ cannot equal 0 in two consecutive rounds, so $\\mathbf{1}_{w_{t-1,1}\\geq 0}+\\mathbf{1}_{w_{t,1}\\geq 0}\\geq 1$, yielding $\\E[\\sum_{T_0}^{T} w_{t,1}]\\geq (3c/16)\\sum_{T_0+2}^{T}1/t$.", "step_order": 4}, {"id": "PSP8.18", "name": "Add early-rounds correction and conclude", "subclass": "conclude", "statement_clean": "", "statement": "Bound $\\E[\\sum_{1}^{T_0-1} w_{t,1}]\\geq -T_0$ via $w_{t,1}\\geq -1$; combine to get $\\E[\\bar{w}_{T,1}]\\geq \\frac{3c}{16T}\\sum_{T_0+2}^{T}\\frac{1}{t}-\\frac{T_0}{T}$, and note $F(\\bar{\\bw}_T)\\geq \\bar{w}_{T,1}$.", "step_order": 5}], "input": [], "output": [], "equations": []}, "TP8.5": {"name": "$O(1/T)$ Upper Bound for $\\alpha$-Suffix Averaging", "type": "theorem", "section": "5 $\\alpha$-Suffix Averaging", "statement": "For SGD with $\\alpha$-suffix averaging, $\\eta_t=1/\\lambda t$, $F$ $\\lambda$-strongly convex, $\\E[\\norm{\\hat{\\bg}_t}^2]\\leq G$: $\\E[F(\\bar{\\bw}^{\\alpha}_T)-F(\\bw^*)]\\leq \\frac{2+2.5\\log(1/(1-\\alpha))}{\\alpha}\\frac{G^2}{\\lambda T}$.", "statement_clean": "Suffix averaging achieves the optimal $O(1/T)$ rate even without smoothness.", "origin": "paper", "origin_citation": "", "assumptions": ["$F$ is $\\lambda$-strongly convex", "$\\E[\\norm{\\hat{\\bg}_t}^2]\\leq G$", "$\\eta_t=1/\\lambda t$"], "conclusions": ["$\\E[F(\\bar{\\bw}^{\\alpha}_T)-F(\\bw^*)]\\leq \\frac{2+2.5\\log(1/(1-\\alpha))}{\\alpha}\\frac{G^2}{\\lambda T}$"], "proof_info": ["Sum the per-step recurrence over the suffix, lower-bound the inner-product sum via convexity, plug Lemma close to bound $\\E[\\norm{\\bw_t-\\bw^*}^2]$, and use $\\sum_{(1-\\alpha)T+1}^{T}1/t\\leq \\log(1/(1-\\alpha))$."], "step_info": [{"id": "PSP8.19", "name": "Per-step recurrence and suffix sum", "subclass": "setup", "statement_clean": "", "statement": "Reuse PP8.1's per-step inequality $\\E[\\norm{\\bw_{t+1}-\\bw^*}^2]\\leq \\E[\\norm{\\bw_t-\\bw^*}^2]-2\\eta_t\\E[\\inner{\\bg_t,\\bw_t-\\bw^*}]+\\eta_t^2 G^2$ and sum over $t=(1-\\alpha)T+1,\\ldots,T$.", "step_order": 1}, {"id": "PSP8.20", "name": "Lower-bound LHS via convexity", "subclass": "apply_lemma", "statement_clean": "", "statement": "By convexity, $\\sum_{t=(1-\\alpha)T+1}^{T}\\E[\\inner{\\bg_t,\\bw_t-\\bw^*}]\\geq \\sum_t \\E[F(\\bw_t)-F(\\bw^*)]\\geq \\alpha T \\E[F(\\bar{\\bw}^{\\alpha}_T)-F(\\bw^*)]$.", "step_order": 2}, {"id": "PSP8.21", "name": "Plug Lemma close to bound $\\E\\norm{\\bw_t-\\bw^*}^2$", "subclass": "apply_lemma", "statement_clean": "", "statement": "Apply Lemma close (LP8.1) to bound each $\\E\\norm{\\bw_t-\\bw^*}^2\\leq 4G^2/(\\lambda^2 t)$, and substitute into the rearranged sum.", "step_order": 3}, {"id": "PSP8.22", "name": "Use $\\sum_{(1-\\alpha)T+1}^{T}1/t\\leq \\log(1/(1-\\alpha))$", "subclass": "conclude", "statement_clean": "", "statement": "Bound the harmonic suffix sum by $\\log(1/(1-\\alpha))$ and simplify to obtain $\\E[F(\\bar{\\bw}^{\\alpha}_T)-F(\\bw^*)]\\leq \\frac{2+2.5\\log(1/(1-\\alpha))}{\\alpha}\\frac{G^2}{\\lambda T}$.", "step_order": 4}], "input": [], "output": [], "equations": []}, "PrP8.1": {"name": "High-Probability Distance Bound", "type": "proposition", "section": "5.5 High-Probability Bounds", "statement": "Let $\\delta\\in(0,1/e)$, $T\\geq 4$, $F$ $\\lambda$-strongly convex, $\\norm{\\hat{\\bg}_t}^2\\leq G^2$ a.s., $\\eta_t=1/\\lambda t$. Then with probability $\\geq 1-\\delta$, for any $t\\leq T$: $\\norm{\\bw_t-\\bw^*}^2\\leq \\frac{(624\\log(\\log(T)/\\delta)+1)G^2}{\\lambda^2 t}$.", "statement_clean": "High-probability strengthening of Lemma close giving $1/t$ distance with $\\log\\log T$ overhead.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": ["Bound conditional variance and uniform step size of $(i-1)Z_i$ via Lemma uniformupperbound, apply Lemma fromFreedman to the martingale $\\sum (i-1)Z_i$, plug into the recursive decomposition (Lemma recursive-def), then use induction with $a=(624\\log(\\log T/\\delta)+1)G^2/\\lambda^2$."], "step_info": [{"id": "PSP8.23", "name": "Identify martingale $Z_i=\\inner{\\hat{\\bz}_i,\\bw_i-\\bw^*}$", "subclass": "introduce_variable", "statement_clean": "", "statement": "Define $Z_i=\\inner{\\hat{\\bz}_i,\\bw_i-\\bw^*}$ with $\\hat{\\bz}_i=\\bg_i-\\hat{\\bg}_i$; note $\\E_{i-1}[Z_i]=0$ and $\\var_{i-1}(Z_i var _lastDetailNode = null;
function showDetail(nodeId) {
  var panel = document.getElementById("detail-panel");
  // Toggle: click same node again to close
  if (_lastDetailNode === nodeId && panel.className === "open") {
    panel.className = "";
    panel.innerHTML = "";
    _lastDetailNode = null;
    return;
  }
  _lastDetailNode = nodeId;
  // Special case: orphan/misc node
  if (nodeId === '__orphan__') {
    var h = '<h3 style="margin:0 0 8px;font-size:16px;">Misc: Unconnected Equations</h3>';
    h += '<div style="font-size:12px;color:#888;margin-bottom:10px;">Equations not linked to any theorem or proof step</div>';
    ORPHANS.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    if (ORPHANS.length === 0) h += '<div style="color:#888;">No orphan equations.</div>';
    panel.innerHTML = h;
    panel.className = "open";
    typesetMath(panel);
    return;
  }
  var d = DETAILS[nodeId];
  if (!d) return;
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(nodeId) + ': ' + esc(d.name || d.type) + '</h3>';
  h += '<div style="font-size:12px;color:#888;margin-bottom:4px;">' + d.type + (d.section ? ' (Sec ' + d.section + ')' : '') + '</div>';
  // Origin badge — paper (default, shown only if external) or external (cited prior result)
  if (d.origin === "external") {
    var citeStr = d.origin_citation ? (' &mdash; ' + esc(d.origin_citation)) : '';
    h += '<div style="display:inline-block;padding:2px 8px;background:#FFF3E0;border:1px dashed #E65100;border-radius:3px;font-size:11px;color:#BF360C;margin-bottom:8px;">External (cited prior result)' + citeStr + '</div>';
  }
  // Foundation graph link badge (Case 1: known result)
  if (d.foundation_links && d.foundation_links.length > 0) {
    h += '<div style="display:inline-block;padding:2px 8px;background:#E3F2FD;border:1px solid #2471A3;border-radius:3px;font-size:11px;color:#2471A3;margin-bottom:8px;">&#128218; Known result: ' + d.foundation_links.map(esc).join(', ') + '</div>';
  }
  // Plain-text restatement (statement_clean) — shown above the formal statement
  if (d.statement_clean) {
    h += '<div class="detail-section"><h4>Plain-Text Summary</h4><div style="font-size:13px;color:#444;font-style:italic;">' + esc(d.statement_clean) + '</div></div>';
  }
  // Pre-build equation maps by context
  var eqsByCtx = {statement:[], assumption:[], conclusion:[], orphan:[]};
  var eqsByStep = {};
  if (d.equations) {
    d.equations.forEach(function(e) {
      if (e.parent_step) {
        if (!eqsByStep[e.parent_step]) eqsByStep[e.parent_step] = [];
        eqsByStep[e.parent_step].push(e);
      } else if (e.context && eqsByCtx[e.context]) {
        eqsByCtx[e.context].push(e);
      } else {
        eqsByCtx.orphan.push(e);
      }
    });
  }
  var eqTag = function(e) { return '<span style="color:#2471A3;font-size:11px;"> (' + e.id + ')</span>'; };
  var eqBlock = function(e) { return '<div style="margin:2px 0 2px 12px;padding:3px 8px;background:#EBF5FB;border-left:2px solid #5DADE2;font-size:12px;">' + esc(e.id) + ': ' + esc(e.statement) + '</div>'; };

  // Statement + inline statement equations
  if (d.statement) {
    h += '<div class="detail-section"><h4>Statement</h4><div style="font-size:14px;">' + esc(d.statement) + '</div>';
    eqsByCtx.statement.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Assumptions + inline assumption equations
  if ((d.assumptions && d.assumptions.length > 0) || eqsByCtx.assumption.length > 0) {
    h += '<div class="detail-section"><h4>Assumptions</h4>';
    if (d.assumptions) d.assumptions.forEach(function(a) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(a) + '</div>'; });
    eqsByCtx.assumption.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Conclusions + inline conclusion equations
  if ((d.conclusions && d.conclusions.length > 0) || eqsByCtx.conclusion.length > 0) {
    h += '<div class="detail-section"><h4>Conclusions</h4>';
    if (d.conclusions) d.conclusions.forEach(function(c) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(c) + '</div>'; });
    eqsByCtx.conclusion.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Proof strategy
  if (d.proof_info && d.proof_info.length > 0) {
    h += '<div class="detail-section"><h4>Proof Strategy</h4>';
    d.proof_info.forEach(function(p) {
      if (Array.isArray(p)) {
        p.forEach(function(item) { h += '<div style="font-size:13px;font-style:italic;">&bull; ' + esc(item) + '</div>'; });
      } else {
        h += '<div style="font-size:13px;font-style:italic;">' + esc(p) + '</div>';
      }
    });
    h += '</div>';
  }
  // v2: Step decomposition (proof_step children of a proof, or algorithm_step children of an algorithm)
  if (d.step_info && d.step_info.length > 0) {
    h += '<div class="detail-section"><h4>Decomposition (' + d.step_info.length + ' steps)</h4>';
    d.step_info.forEach(function(s, i) {
      var ord = (s.step_order || (i + 1));
      var label = s.name ? esc(s.name) : esc(s.id || ('Step ' + ord));
      h += '<div class="step-item"><strong>' + ord + '. ' + label + '</strong>';
      if (s.subclass) {
        h += ' <span style="font-size:11px;font-style:italic;color:#666;">[' + esc(s.subclass) + ']</span>';
      }
      var body = s.statement_clean || s.statement || '';
      if (body) {
        h += '<div style="font-size:12px;color:#444;margin-top:2px;">' + esc(body) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  // Algorithm input/output
  if (d.input && d.input.length > 0) {
    h += '<div class="detail-section"><h4>Input</h4>';
    d.input.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // (Legacy "Proof Steps" panel removed: same data now rendered above as
  // "Decomposition" via d.step_info. Both used to read from step_chains and
  // produced duplicate sections on click.)
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  typesetMath(panel);
}

  var btn = document.getElementById("ghost-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  btn.dataset.showing = isShowing ? "0" : "1";
  _applyGhostVisibility();
}

// Apply current foundation visibility, respecting whether ghost edges' target
// nodes are currently hidden (aux/external toggles). A foundation arrow is
// only shown when (a) Foundation toggle is ON and (b) its target node is
// currently visible — otherwise it would float into empty space.
function _applyGhostVisibility() {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  var btn = document.getElementById("ghost-btn");
  var on = btn && btn.dataset.showing === "1";
  var auxBtn = document.getElementById("aux-btn");
  var extBtn = document.getElementById("ext-btn");
  var auxOn = auxBtn && auxBtn.dataset.showing === "1";
  var extOn = extBtn && extBtn.dataset.showing === "1";
  // Show/hide ghost boxes, headers, text, refs uniformly.
  var ghostEls = svgEl.querySelectorAll('[id^="ghost"]');
  ghostEls.forEach(function(el) {
    var gid = el.id;
    if (!on) {
      el.style.display = "none";
      return;
    }
    // Edge gid pattern: "<prefix>_edge_<gi>_<ti>". For these, check target.
    if (GHOST_EDGE_TO_TARGET.hasOwnProperty(gid)) {
      var target = GHOST_EDGE_TO_TARGET[gid];
      var targetHidden = (AUX_NODE_SET[target] && !auxOn) || (EXT_NODE_SET[target] && !extOn);
      el.style.display = targetHidden ? "none" : "";
    } else {
      el.style.display = "";
    }
  });
}

// Generic helper: hide/show a set of nodes (by id) and their incident edges.
function _setNodeVisibility(nodeIds, edgeGids, visible, extraClass) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  nodeIds.forEach(function(nid) {
    // Body rect
    var body = svgEl.querySelector('[id="node_' + nid + '"]');
    if (body) {
      body.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) body.classList.add(extraClass);
        else body.classList.remove(extraClass);
      }
    }
    // All sibling per-node elements (header rect, text labels, divider lines)
    var sibs = svgEl.querySelectorAll('[id^="node_' + nid + '__"]');
    sibs.forEach(function(el) {
      el.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) el.classList.add(extraClass);
        else el.classList.remove(extraClass);
      }
    });
  });
  edgeGids.forEach(function(gid) {
    var e = svgEl.querySelector('[id="' + gid + '"]');
    if (e) e.style.display = visible ? "" : "none";
  });
}

// Examples & Remarks toggle — hides nodes with type in {example, remark}
function toggleAux() {
  var btn = document.getElementById("aux-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  // Apply visual differentiation: lighter shade (opacity) when shown
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, nextShowing, "node-aux-shown");
  // Apply opacity styling on the body rect when shown
  AUX_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) body.style.opacity = nextShowing ? "0.75" : "";
  });
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
}

// Cited Results (External) toggle — hides nodes with origin === "external"
function toggleExternal() {
  var btn = document.getElementById("ext-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, nextShowing, "node-external-shown");
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
  // Apply dashed border on body rect when shown (visual differentiation)
  EXT_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) {
      // FancyBboxPatch is a <path>; modify its stroke-dasharray for a dashed look.
      var pathEl = body.tagName === "path" ? body : body.querySelector("path");
      if (pathEl) {
        if (nextShowing) {
          pathEl.setAttribute("stroke-dasharray", "6,3");
          pathEl.setAttribute("stroke-width", "2");
        } else {
          pathEl.removeAttribute("stroke-dasharray");
          pathEl.removeAttribute("stroke-width");
        }
      }
    }
  });
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements + aux + external elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all foundation ghost elements (mathlib/proofwiki AND book-derived).
    // The [id^="ghost"] selector covers both "ghost_*" and "ghostbook_*".
    var all = svgEl.querySelectorAll('[id^="ghost"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
  // Examples & Remarks: hidden by default (toggle starts in OFF state).
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, false, null);
  // Cited Results (External): hidden by default.
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, false, null);
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() {
  if (svgEl) {
    var container = document.getElementById("svg-container");
    var svgW = svgEl.getBoundingClientRect().width / currentZoom;
    var svgH = svgEl.getBoundingClientRect().height / currentZoom;
    var cW = container.clientWidth - 20;
    var cH = container.clientHeight - 20;
    currentZoom = Math.min(cW / svgW, cH / svgH, 1.0);
    applyZoom();
  }
}
// Auto-fit on load
zoomFit();

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
