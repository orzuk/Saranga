<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #fafafa; }
#header { background: #2c3e50; color: white; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; }
#header h1 { margin: 0; font-size: 18px; }
#header .hint { font-size: 12px; color: #aaa; font-style: italic; margin-left: 12px; }
#controls button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; background: #34495e; color: white; margin-left: 8px; }
#controls button:hover { background: #4a6785; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 24px; background: #f5f5f5; border-bottom: 1px solid #eee; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #777; }
#main { display: flex; height: calc(100vh - 82px); }
#svg-container { flex: 1; overflow: auto; padding: 10px; cursor: grab; }
#svg-container svg { transform-origin: 0 0; }
#detail-panel { width: 0; overflow-y: auto; background: white; border-left: 1px solid #ddd; transition: width 0.3s; }
#detail-panel.open { width: 380px; padding: 16px; }
.detail-section { margin-bottom: 12px; }
.detail-section h4 { margin: 0 0 6px; color: #444; font-size: 13px; text-transform: uppercase; }
.step-item { background: #f0f0f0; border-left: 3px solid #839192; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.step-arrow { text-align: center; color: #aaa; font-size: 14px; }
.eq-item { background: #d4e6f1; border-left: 3px solid #5dade2; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.orphan-item { background: #fef9e7; border-left: 3px solid #f39c12; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; }
#orphan-panel { position: fixed; bottom: 16px; right: 16px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-width: 350px; max-height: 400px; overflow-y: auto; display: none; padding: 12px; z-index: 100; }
#orphan-toggle { display: none; }
/* Hover effect on clickable node rects */
[id^="node_"]:hover { filter: brightness(0.90); }
.ghost-node { display: inline-block; margin: 4px 8px; padding: 8px 14px; background: #E0E0E0; border: 1.5px solid #757575; border-radius: 5px; font-size: 13px; color: #333; cursor: pointer; vertical-align: top; white-space: normal; max-width: 220px; }
.ghost-node:hover { background: #BDBDBD; }
.ghost-node .ghost-label { font-weight: bold; font-size: 13px; }
.ghost-node .ghost-refs { font-size: 11px; color: #666; margin-top: 3px; }
/* Toggle controls panel (Foundation, Examples & Remarks, Cited Results) */
.toggle-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: 12px; padding: 4px 8px; background: #ECEFF1; border: 1px solid #CFD8DC; border-radius: 6px; }
.toggle-panel .toggle-label { font-size: 11px; color: #555; font-weight: bold; text-transform: uppercase; margin-right: 4px; }
.toggle-btn { padding: 4px 12px; border: 1.5px solid #757575; border-radius: 4px; background: #E0E0E0; cursor: pointer; font-size: 12px; color: #333; }
.toggle-btn:hover { background: #BDBDBD; }
.toggle-btn[data-showing="1"] { background: #2E7D32; color: white; border-color: #1B5E20; }
.toggle-btn[disabled] { opacity: 0.4; cursor: not-allowed; background: #EEE; }
/* Hidden state — applied dynamically via JS */
.svg-hidden { display: none !important; }
/* Visual differentiation when shown */
.node-external-shown [stroke-dasharray] { }  /* no-op, see runtime tweak */
.node-aux-shown { opacity: 0.75; }
/* v2: `resolves` edges (theorem-like resolves an open_problem/conjecture) — dashed */
.edge-resolves path { stroke-dasharray: 5,3 !important; }
.edge-resolves { stroke-dasharray: 5,3 !important; }
</style>

var DETAILS = {"DP4.1": {"name": "Nonparametric regression model", "type": "definition", "section": "2", "statement": "Sample $(Z_1,Y_1),\\dots,(Z_n,Y_n)$ with $Y_i = f(Z_i) + W_i$, where $f:\\mathcal{Z}\\to\\mathbb{R}$ is unknown, $Z_i$ are fixed in $\\mathcal{Z}\\subset\\mathbb{R}^d$, and $W_i$ are Gaussian errors.", "statement_clean": "Fixed-design Gaussian regression with unknown regression function f.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP4.2": {"name": "Dictionary and design matrix", "type": "definition", "section": "2", "statement": "A dictionary $\\mathcal{F}_M = \\{f_1,\\dots,f_M\\}$ with $M\\ge 2$, design matrix $X = (f_j(Z_i))_{i,j}$, and ${\\sf f}_\\beta = \\sum_{j=1}^M \\beta_j f_j$ for $\\beta\\in\\mathbb{R}^M$.", "statement_clean": "Finite dictionary of regressors and induced design matrix.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP4.3": {"name": "Empirical norm", "type": "definition", "section": "2", "statement": "$\\|g\\|_n = \\sqrt{\\frac{1}{n}\\sum_{i=1}^n g^2(Z_i)}$ for $g:\\mathcal{Z}\\to\\mathbb{R}$, with $f_{\\max} = \\max_j \\|f_j\\|_n$, $f_{\\min} = \\min_j \\|f_j\\|_n$.", "statement_clean": "Empirical L2 norm and extremal dictionary norms.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP4.4": {"name": "Sparsity index", "type": "definition", "section": "2", "statement": "$\\mathcal{M}(\\beta) = \\sum_{j=1}^M I_{\\{\\beta_j\\ne 0\\}} = |J(\\beta)|$ where $J(\\beta) = \\{j: \\beta_j\\ne 0\\}$. Smaller $\\mathcal{M}(\\beta)$ means sparser $\\beta$.", "statement_clean": "Number of nonzero coordinates of beta.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions":  some integer $s$ and $C_0<\\infty$.", "statement_clean": "f admits a sparse beta whose bias term is bounded by the variance term.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "AssumP4.1": {"name": "Assumption RE(s, c_0)", "type": "assumption", "section": "3", "statement": "$\\kappa(s,c_0) \\triangleq \\min_{|J_0|\\le s} \\min_{\\bD\\ne 0, |\\bD_{J_0^c}|_1\\le c_0|\\bD_{J_0}|_1} \\frac{|X\\bD|_2}{\\sqrt{n}|\\bD_{J_0}|_2} > 0$.", "statement_clean": "Restricted eigenvalue condition: positive definiteness on a restricted cone.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "AssumP4.2": {"name": "Assumption RE(s, m, c_0)", "type": "assumption", "section": "3", "statement": "$\\kappa(s,m,c_0) \\triangleq \\min_{|J_0|\\le s} \\min_{\\bD\\ne 0, |\\bD_{J_0^c}|_1\\le c_0|\\bD_{J_0}|_1} \\frac{|X\\bD|_2}{\\sqrt{n}|\\bD_{J_{01}}|_2} > 0$, where $J_{01}=J_0\\cup J_1$ with $J_1$ indexing the $m$ largest-magnitude coordinates of $\\bD$ outside $J_0$.", "statement_clean": "Stronger restricted eigenvalue with denominator over expanded index set J_{01}.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "AssumP4.3": {"name": "Assumption 1", "type": "assumption", "section": "4", "statement": "$\\phi_{\\min}(2s) > c_0\\,\\theta_{s,2s}$ for some integer $1\\le s\\le M/2$ and constant $c_0>0$.", "statement_clean": "Sufficient condition for RE assumptions via min eigenvalue and restricted correlation.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "AssumP4.4": {"name": "Assumption 2", "type": "assumption", "section": "4", "statement": "$m\\,\\phi_{\\min}(s+m) > c_0^2 s\\,\\phi_{\\max}(m)$ for integers $1\\le s\\le M/2$, $m\\ge s$, $s+m\\le M$, and a constant $c_0>0$.", "statement_clean": "Sufficient condition for RE assumptions using only min/max eigenvalues of small submatrices.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "AssumP4.5": {"name": "Assumption 3", "type": "assumption", "section": "4", "statement": "$\\phi_{\\min}(s) > 2 c_0\\,\\theta_{s,1}\\sqrt{s}$ for $1\\le s\\le M$ and $c_0>0$.", "statement_clean": "Sufficient condition implying RE(s,c_0) (Bickel 2007).", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "AssumP4.6": {"name": "Assumption 4", "type": "assumption", "section": "4", "statement": "$\\phi_{\\min}(s) > 2 c_0\\,\\theta_{1,1}\\, s$ for $1\\le s\\le M$ and $c_0>0$.", "statement_clean": "Mutual-coherence-type sufficient condition for RE(s,c_0).", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "AssumP4.7": {"name": "Assumption 5", "type": "assumption", "section": "4", "statement": "All diagonal elements of $\\Psi_n$ equal 1, and $\\theta_{1,1} < \\frac{1}{(1+2c_0)\\,s}$ for some $1\\le s\\le M$ and $c_0>0$.", "statement_clean": "Mutual-coherence sufficient condition for RE(s,c_0), assuming unit diagonals.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "ProbP4.1": {"name": "Lasso optimization", "type": "problem", "section": "2", "statement": "$\\widehat\\beta_L = \\arg\\min_{\\beta\\in\\mathbb{R}^M}\\left\\{\\widehat S(\\beta) + 2r\\sum_{j=1}^M \\|f_j\\|_n |\\beta_j|\\right\\}$ where $\\widehat S(\\beta) = \\frac{1}{n}\\sum_i (Y_i - {\\sf f}_\\beta(Z_i))^2$ and $r>0$.", "statement_clean": "L1-penalized least squares formulation of the Lasso.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "ProbP4.2": {"name": "Dantzig selector optimization", "type": "problem", "section": "2", "statement": "$\\widehat\\beta_D = \\arg\\min\\left\\{|\\beta|_1: \\Big|\\frac{1}{n}D^{-1/2}X^T(y-X\\beta)\\Big|_\\infty \\le r\\right\\}$.", "statement_clean": "Min-L1-norm linear program subject to the Dantzig constraint.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "AP4.1": {"name": "Lasso estimator", "type": "algorithm", "section": "2", "statement": "Convex optimization that returns the Lasso solution $\\widehat\\beta_L$ and the estimator $\\widehat f_L(z) = \\sum_{j=1}^M \\widehat\\beta_{j,L} f_j(z)$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": ["Design matrix $X$ with columns $f_j(Z_i)$", "Response vector $\\bmy$", "Tuning constant $r>0$", "Diagonal weights $\\|f_j\\|_n$"], "output": ["Lasso coefficient vector $\\widehat\\beta_L$", "Lasso estimator $\\widehat f_L$"], "equations": [{"id": "EP4.1", "statement": "$\\Big|\\frac{1}{n}D^{-1/2}X^T(y - X\\widehat\\beta_L)\\Big|_\\infty \\le r$.", "section": "2", "context": "", "parent_step": ""}]}, "AP4.2": {"name": "Dantzig selector", "type": "algorithm", "section": "2", "statement": "Linear program returning the minimum-$\\ell_1$ vector $\\widehat\\beta_D$ subject to the Dantzig constraint, yielding $\\widehat f_D(z) = \\sum_j \\widehat\\beta_{j,D} f_j(z)$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": ["Design matrix $X$", "Response vector $\\bmy$", "Tuning constant $r>0$", "Diagonal $D = \\mathrm{diag}\\{\\|f_j\\|_n^2\\}$"], "output": ["Dantzig coefficient vector $\\widehat\\beta_D$", "Dantzig estimator $\\widehat f_D$"], "equations": [{"id": "EP4.1", "statement": "$\\Big|\\frac{1}{n}D^{-1/2}X^T(y - X\\widehat\\beta_L)\\Big|_\\infty \\le r$.", "section": "2", "context": "", "parent_step": ""}]}, "LP4.1": {"name": "Lemma 4.1 (Restricted positive definiteness)", "type": "lemma", "section": "Appendix A", "statement": "If Assumption 1 holds then RE(s,c_0) and RE(s,s,c_0) hold with $\\kappa = \\kappa_1(s,c_0) = \\sqrt{\\phi_{\\min}(2s)}\\left(1 - \\frac{c_0\\theta_{s,2s}}{\\phi_{\\min}(2s)}\\right)$. If Assumption 2 holds then RE(s,c_0) and RE(s,m,c_0) hold with $\\kappa = \\kappa_2(s,m,c_0) = \\sqrt{\\phi_{\\min}(s+m)}\\left(1 - c_0\\sqrt{\\frac{s\\phi_{\\max}(m)}{m\\phi_{\\min}(s+m)}}\\right)$. Moreover $\\frac{1}{\\sqrt{n}}|P_{01}X\\bD|_2 \\ge \\kappa |\\bD_{J_{01}}|_2$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Assumption 1 or Assumption 2", "$|\\bD_{J_0^c}|_1 \\le c_0 |\\bD_{J_0}|_1$"], "conclusions": ["RE(s,c_0) holds with explicit $\\kappa$", "Projector inequality $\\frac{1}{\\sqrt{n}}|P_{01}X\\bD|_2 \\ge \\kappa |\\bD_{J_{01}}|_2$"], "proof_info": ["Partition $J_0^c$ into blocks of size $m$ ordered by descending magnitude; bound $|P_{01} X \\bD_{J_k}|_2$ via $\\sqrt{\\phi_{\\max}(m)}|\\bD_{J_k}|_2$; sum the geometric tail using $|\\bD_{J_{k+1}}|_2 \\le |\\bD_{J_k}|_1/\\sqrt{m}$."], "step_info": [{"id": "PSP4.1", "name": "Block partition of $J_0^c$", "subclass": "setup", "statement_clean": "", "statement": "Partition $J_0^c = \\cup_{k=1}^K J_k$ with $|J_k| = m$ for $k<K$, where $J_k$ collects the $m$ largest-magnitude coordinates of $\\bD$ outside $\\cup_{j<k} J_j$.", "step_order": 1}, {"id": "PSP4.2", "name": "Triangle inequality on projector", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "$|P_{01} X \\bD|_2 \\ge |X\\bD_{J_{01}}|_2 - \\sum_{k\\ge 2} |P_{01}X\\bD_{J_k}|_2$, since $P_{01}X\\bD_{J_{01}} = X\\bD_{J_{01}}$.", "step_order": 2}, {"id": "PSP4.3", "name": "Block bound via $\\phi_{\\max}(m)$", "subclass": "bound_estimate", "statement_clean": "", "statement": "For $k\\ge 1$, $\\frac{1}{\\sqrt{n}}|P_{01}X\\bD_{J_k}|_2 \\le \\frac{1}{\\sqrt{n}}|X\\bD_{J_k}|_2 \\le \\sqrt{\\phi_{\\max}(m)}\\,|\\bD_{J_k}|_2$ (used in part (ii); under Assumption 1 use $\\theta_{s,2s}/\\sqrt{\\phi_{\\min}(2s)}$ instead).", "step_order": 3}, {"id": "PSP4.4", "name": "Geometric tail bound", "subclass": "bound_estimate", "statement_clean": "", "statement": "Using $|\\bD_{J_{k+1}}|_2 \\le |\\bD_{J_k}|_1/\\sqrt{m}$: $\\sum_{k\\ge 2} |\\bD_{J_k}|_2 \\le c_0\\sqrt{s/m}\\,|\\bD_{J_{01}}|_2$, invoking the cone hypothesis $|\\bD_{J_0^c}|_1 \\le c_0 |\\bD_{J_0}|_1$.", "step_order": 4}, {"id": "PSP4.5", "name": "Combine and conclude", "subclass": "conclude", "statement_clean": "", "statement": "Combining the estimates yields $\\frac{1}{\\sqrt{n}}|X\\bD|_2 \\ge \\left(\\sqrt{\\phi_{\\min}(s+m)} - c_0\\sqrt{\\phi_{\\max}(m)}\\sqrt{s/m}\\right)|\\bD_{J_{01}}|_2$ (part (ii)); part (i) follows analogously with $m\\to s$.", "step_order": 5}], "input": [], "output": [], "equations": []}, "LP4.2": {"name": "Lemma B.1 (Lasso oracle inequality on event A)", "type": "lemma", "section": "Appendix B", "statement": "With probability at least $1 - M^{1-A^2/8}$, for all $\\beta\\in\\mathbb{R}^M$: $\\|\\widehat f_L - f\\|_n^2 + r\\sum_j \\|f_j\\|_n |\\widehat\\beta_{j,L} - \\beta_j| \\le \\|{\\sf f}_\\beta - f\\|_n^2 + 4r\\sum_{j\\in J(\\beta)}\\|f_j\\|_n |\\widehat\\beta_{j,L} - \\beta_j|$, plus $|\\frac{1}{n}X^T({\\bmf} - X\\widehat\\beta_L)|_\\infty \\le 3rf_{\\max}/2$ and $\\mathcal{M}(\\widehat\\beta_L) \\le 4\\phi_{\\max} f_{\\min}^{-2}\\|\\widehat f_L - f\\|_n^2/r^2$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["$W_i \\sim \\mathcal{N}(0,\\sigma^2)$ i.i.d.", "$r = A\\sigma\\sqrt{\\log M / n}$ with $A>2\\sqrt{2}$"], "conclusions": ["Basic Lasso oracle inequality", "Bounded empirical correlation of residual", "Sparsity-of-Lasso bound"], "proof_info": ["Define the high-probability event $\\A = \\bigcap_j \\{2|V_j|\\le r_{n,j}\\}$ via Gaussian tails ($\\PP(\\A^c)\\le M^{1-A^2/8}$). Manipulate the Lasso optimality inequality to get the oracle bound; combine with (\\ref{dc}) for the residual sup-bound; use the KKT conditions plus eigenvalue argument for the sparsity bound."], "step_info": [{"id": "PSP4.6", "name": "Define the favorable event $\\A$", "subclass": "setup", "statement_clean": "", "statement": "Set $V_j = n^{-1}\\sum_i f_j(Z_i) W_i$ and $\\A = \\bigcap_j \\{2|V_j|\\le r_{n,j}\\}$ with $r_{n,j} = r\\|f_j\\|_n$.", "step_order": 1}, {"id": "PSP4.7", "name": "Gaussian tail bound on $\\PP(\\A^c)$", "subclass": "bound_estimate", "statement_clean": "", "statement": "$\\PP(\\A^c) \\le M\\,\\PP(|\\eta|\\ge r\\sqrt{n}/(2\\sigma)) \\le M\\exp(-A^2\\log M/8) = M^{1-A^2/8}$.", "step_order": 2}, {"id": "PSP4.8", "name": "Manipulate Lasso optimality", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "From $\\widehat S(\\widehat\\beta_L) + 2\\sum_j r_{n,j}|\\widehat\\beta_{j,L}| \\le \\widehat S(\\beta) + 2\\sum_j r_{n,j}|\\beta_j|$, on $\\A$ derive $\\|\\widehat f_L - f\\|_n^2 + \\sum_j r_{n,j}|\\widehat\\beta_{j,L} - \\beta_j| \\le \\|{\\sf f}_\\beta - f\\|_n^2 + 2\\sum_j r_{n,j}(|\\widehat\\beta_{j,L}-\\beta_j| + |\\beta_j| - |\\widehat\\beta_{j,L}|)$, then use $|a-b|+|b|-|a|=0$ for $j\\notin J(\\beta)$.", "step_order": 3}, {"id": "PSP4.9", "name": "Derive sup-bound on residual", "subclass": "apply_lemma", "statement_clean": "", "statement": "On $\\A$, $|\\frac{1}{n}D^{-1/2}X^T W|_\\infty \\le r/2$; combined with the Lasso Dantzig constraint EP4.1, $|\\frac{1}{n}X^T(\\bmf - X\\widehat\\beta_L)|_\\infty \\le 3rf_{\\max}/2$.", "step_order": 4}, {"id": "PSP4.10", "name": "Sparsity bound via KKT", "subclass": "conclude", "statement_clean": "", "statement": "Use Lasso KKT condition $|\\frac{1}{n}\\mathbf{x}_{(j)}^T(\\bmf - X\\widehat\\beta_L)| \\ge r\\|f_j\\|_n/2$ for $\\widehat\\beta_{j,L}\\ne 0$ together with $\\phi_{\\max}$ to obtain $\\mathcal{M}(\\widehat\\beta_L) \\le 4\\phi_{\\max} f_{\\min}^{-2}\\|\\widehat f_L - f\\|_n^2/r^2$.", "step_order": 5}], "input": [], "output": [], "equations": [], "foundation_links": ["Independent and Identically Distributed"]}, "LP4.3": {"name": "Lemma B.2 (Dantzig cone and residual control)", "type": "lemma", "section": "Appendix B", "statement": "If $\\beta$ satisfies the Dantzig constraint then $|\\bD_{J_0^c}|_1 \\le |\\bD_{J_0}|_1$ for $\\bD = \\widehat\\beta_D - \\beta$. Furthermore, with probability at least $1 - M^{1-A^2/2}$ (under $A>\\sqrt{2}$), $|\\frac{1}{n}X^T({\\bmf} - X\\widehat\\beta_D)|_\\infty \\le 2 r f_{\\max}$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["$\\beta$ satisfies Dantzig constraint", "Gaussian noise $W_i\\sim\\mathcal{N}(0,\\sigma^2)$"], "conclusions": ["Dantzig cone inequality with $c_0=1$", "Sup-norm bound on residual correlation"], "proof_info": ["Cone inequality is immediate from the definition of $\\widehat\\beta_D$ as the minimum-$\\ell_1$ point in the Dantzig set. Sup-bound follows from event $\\B = \\{|\\frac{1}{n}D^{-1/2}X^T W|_\\infty \\le r\\}$ with $\\PP(\\B^c)\\le M^{1-A^2/2}$."], "step_info": [], "input": [], "output": [], "equations": []}, "TP4.1": {"name": "Theorem 1 (Approximate equivalence of Lasso and Dantzig)", "type": "theorem", "section": "4", "statement": "Under Gaussian noise, RE(s,1), $r = A\\sigma\\sqrt{\\log M/n}$ with $A>2\\sqrt{2}$, and $\\mathcal{M}(\\widehat\\beta_L)\\le s$: with probability $\\ge 1 - M^{1-A^2/8}$, $\\big|\\|\\widehat f_D - f\\|_n^2 - \\|\\widehat f_L - f\\|_n^2\\big| \\le 16 A^2 \\frac{\\mathcal{M}(\\widehat\\beta_L)\\sigma^2}{n}\\frac{f_{\\max}^2}{\\kappa^2(s,1)}\\log M$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Gaussian noise", "Assumption RE(s,1)", "$\\mathcal{M}(\\widehat\\beta_L)\\le s$"], "conclusions": ["Prediction losses of Lasso and Dantzig differ by at most an explicit oracle-rate quantity"], "proof_info": ["Set $\\bD = \\widehat\\beta_L - \\widehat\\beta_D$. Both sides of $\\big|\\|\\widehat f_D - f\\|_n^2 - \\|\\widehat f_L - f\\|_n^2\\big|$ are bounded by combining a quadratic identity, Lemma B.2 sup-bound, the Dantzig cone (with $J_0 = J(\\widehat\\beta_L)$), and Assumption RE(s,1)."], "step_info": [{"id": "PSP4.11", "name": "Quadratic identity for $\\widehat\\beta_L - \\widehat\\beta_D$", "subclass": "setup", "statement_clean": "", "statement": "Set $\\bD = \\widehat\\beta_L - \\widehat\\beta_D$. Then $\\frac{1}{n}|\\bmf - X\\widehat\\beta_L|_2^2 = \\frac{1}{n}|\\bmf - X\\widehat\\beta_D|_2^2 - \\frac{2}{n}\\bD^T X^T(\\bmf - X\\widehat\\beta_D) + \\frac{1}{n}|X\\bD|_2^2$.", "step_order": 1}, {"id": "PSP4.12", "name": "Bound on cross term via Lemma B.2", "subclass": "apply_lemma", "statement_clean": "", "statement": "Apply Lemma B.2 inequality $|\\frac{1}{n}X^T(\\bmf - X\\widehat\\beta_D)|_\\infty \\le 2rf_{\\max}$ to obtain $\\|\\widehat f_D - f\\|_n^2 \\le \\|\\widehat f_L - f\\|_n^2 + 4f_{\\max}r|\\bD|_1 - \\frac{1}{n}|X\\bD|_2^2$ with probability $\\ge 1 - M^{1-A^2/2}$.", "step_order": 2}, {"id": "PSP4.13", "name": "Cone inequality on $\\bD$", "subclass": "apply_lemma", "statement_clean": "", "statement": "Since $\\widehat\\beta_L$ satisfies the Dantzig constraint, Lemma B.2 with $\\beta = \\widehat\\beta_L$ gives $|\\bD_{J_0^c}|_1 \\le |\\bD_{J_0}|_1$ where $J_0 = J(\\widehat\\beta_L)$.", "step_order": 3}, {"id": "PSP4.14", "name": "Apply RE(s,1) to bound $|\\bD|_1$ via $|X\\bD|_2$", "subclass": "apply_lemma", "statement_clean": "", "statement": "By RE(s,1), $\\frac{1}{\\sqrt{n}}|X\\bD|_2 \\ge \\kappa |\\bD_{J_0}|_2$, hence $|\\bD|_1 \\le 2\\sqrt{\\mathcal{M}(\\widehat\\beta_L)}|\\bD_{J_0}|_2 \\le \\frac{2\\sqrt{\\mathcal{M}(\\widehat\\beta_L)}}{\\kappa\\sqrt{n}}|X\\bD|_2$.", "step_order": 4}, {"id": "PSP4.15", "name": "Optimize quadratic in $|X\\bD|_2$ -- one direction", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "Substitute into PSP4.12 to get $\\|\\widehat f_D - f\\|_n^2 \\le \\|\\widehat f_L - f\\|_n^2 + 16 f_{\\max}^2 r^2 \\mathcal{M}(\\widehat\\beta_L)/\\kappa^2$ by maximizing the linear-quadratic expression in $|X\\bD|_2$.", "step_order": 5}, {"id": "PSP4.16", "name": "Reverse direction via Lemma B.1", "subclass": "case_split", "statement_clean": "", "statement": "Symmetric argument with roles of $\\widehat\\beta_L,\\widehat\\beta_D$ swapped, using Lemma B.1 sup-bound (\\ref{dcf}) instead of (\\ref{ll23}), yields $\\|\\widehat f_L - f\\|_n^2 \\le \\|\\widehat f_D - f\\|_n^2 + 9 f_{\\max}^2 r^2 \\mathcal{M}(\\widehat\\beta_L)/\\kappa^2$, with probability $\\ge 1 - M^{1-A^2/8}$.", "step_order": 6}, {"id": "PSP4.17", "name": "Combine both directions", "subclass": "conclude", "statement_clean": "", "statement": "Combining the two-sided bounds yields the announced symmetric inequality with constant $16 A^2$ (since $r^2 = A^2 \\sigma^2 \\log M/n$).", "step_order": 7}], "input": [], "output": [], "equations": []}, "TP4.2": {"name": "Theorem 2 (Lasso prediction bounded by Dantzig prediction)", "type": "theorem", "section": "4", "statement": "Under the assumptions of Theorem 1 with RE(s,5) replacing RE(s,1), $\\|f_j\\|_n=1$, and $\\mathcal{M}(\\widehat\\beta_D)\\le s$: with probability $\\ge 1 - M^{1-A^2/8}$, $\\|\\widehat f_L - f\\|_n^2 \\le 10\\|\\widehat f_D - f\\|_n^2 + 81 A^2 \\frac{\\mathcal{M}(\\widehat\\beta_D)\\sigma^2}{n}\\frac{\\log M}{\\kappa^2(s,5)}$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Gaussian noise", "RE(s,5)", "$\\|f_j\\|_n=1$", "$\\mathcal{M}(\\widehat\\beta_D)\\le s$"], "conclusions": ["Lasso prediction loss bounded by 10 Dantzig prediction loss plus oracle term"], "proof_info": ["Set $\\bD = \\widehat\\beta_L - \\widehat\\beta_D$, apply Lemma B.1 with $\\beta = \\widehat\\beta_D$, then split into two cases depending on whether $\\|\\widehat f_D - f\\|_n^2 > 2r|\\bD_{J_0}|_1$ or not."], "step_info": [{"id": "PSP4.18", "name": "Apply Lemma B.1 with $\\beta=\\widehat\\beta_D$", "subclass": "apply_lemma", "statement_clean": "", "statement": "$|\\bD|_1 \\le 4|\\bD_{J_0}|_1 + \\|\\widehat f_D - f\\|_n^2/r$ with probability $\\ge 1 - M^{1-A^2/8}$, where $J_0 = J(\\widehat\\beta_D)$.", "step_order": 1}, {"id": "PSP4.19", "name": "Case split on bias term", "subclass": "case_split", "statement_clean": "", "statement": "Case (i): $\\|\\widehat f_D - f\\|_n^2 > 2r|\\bD_{J_0}|_1$. Case (ii): $\\|\\widehat f_D - f\\|_n^2 \\le 2r|\\bD_{J_0}|_1$.", "step_order": 2}, {"id": "PSP4.20", "name": "Case (i) closure", "subclass": "case", "statement_clean": "", "statement": "Direct from inequality (\\ref{e5}) with $f_{\\max}=1$: $\\|\\widehat f_L - f\\|_n^2 \\le 10\\|\\widehat f_D - f\\|_n^2$, theorem holds.", "step_order": 3}, {"id": "PSP4.21", "name": "Case (ii) cone setup", "subclass": "case", "statement_clean": "", "statement": "From PSP4.18 we get $|\\bD|_1 \\le 6|\\bD_{J_0}|_1$, hence $|\\bD_{J_0^c}|_1 \\le 5|\\bD_{J_0}|_1$, allowing the use of RE(s,5).", "step_order": 4}, {"id": "PSP4.22", "name": "Apply RE(s,5) and finish case (ii)", "subclass": "conclude", "statement_clean": "", "statement": "RE(s,5) yields $|\\bD|_1 \\le \\frac{6\\sqrt{\\mathcal{M}(\\widehat\\beta_D)}}{\\kappa\\sqrt{n}}|X\\bD|_2$; substituting into (\\ref{e5}) gives $\\|\\widehat f_L - f\\|_n^2 \\le \\|\\widehat f_D - f\\|_n^2 + 81 r^2 \\mathcal{M}(\\widehat\\beta_D)/\\kappa^2$.", "step_order": 5}], "input": [], "output": [], "equations": []}, "TP4.3": {"name": "Theorem 3 (Lasso sparsity oracle inequality, nonparametric)", "type": "theorem", "section": "5", "statement": "Under RE($s,(3+4/\\eps)f_{\\max}/f_{\\min}$) and $r=A\\sigma\\sqrt{\\log M/n}$ with $A>2\\sqrt{2}$: with probability $\\ge 1 - M^{1-A^2/8}$, $\\|\\widehat f_L - f\\|_n^2 \\le (1+\\eps)\\inf_{\\mathcal{M}(\\beta)\\le s}\\left\\{\\|{\\sf f}_\\beta - f\\|_n^2 + \\frac{C(\\eps)f_{\\max}^2 A^2 \\sigma^2}{\\kappa^2}\\,\\frac{\\mathcal{M}(\\beta)\\log M}{n}\\right\\}$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Gaussian noise", "RE($s,(3+4/\\eps)f_{\\max}/f_{\\min}$)", "$\\eps>0$"], "conclusions": ["Sparsity oracle inequality for Lasso prediction in nonparametric regression"], "proof_info": ["Fix $\\beta$ with $\\mathcal{M}(\\beta)\\le s$, set $\\bD = D^{1/2}(\\widehat\\beta_L - \\beta)$, $J_0 = J(\\beta)$. From Lemma B.1, on event $\\A$ derive a cone inequality, apply Assumption RE($s,(3+4/\\eps)f_{\\max}/f_{\\min}$), and finish via decoupling argument $2xy\\le x^2/b + by^2$."], "step_info": [{"id": "PSP4.23", "name": "Setup variables and apply Lemma B.1", "subclass": "setup", "statement_clean": "", "statement": "Set $\\bD = D^{1/2}(\\widehat\\beta_L - \\beta)$, $J_0 = J(\\beta)$. From the first inequality of (\\ref{onA}): $\\|\\widehat f_L - f\\|_n^2 + r|\\bD|_1 \\le \\|{\\sf f}_\\beta - f\\|_n^2 + 4r|\\bD_{J_0}|_1$.", "step_order": 1}, {"id": "PSP4.24", "name": "Case split on bias vs cone", "subclass": "case_split", "statement_clean": "", "statement": "Case (a): $4r|\\bD_{J_0}|_1 \\le \\eps\\|{\\sf f}_\\beta - f\\|_n^2$. Case (b): $\\eps\\|{\\sf f}_\\beta - f\\|_n^2 < 4r|\\bD_{J_0}|_1$.", "step_order": 2}, {"id": "PSP4.25", "name": "Case (a) trivial closure", "subclass": "case", "statement_clean": "", "statement": "In case (a), the result follows trivially from PSP4.23 since the cone term is dominated by the bias term.", "step_order": 3}, {"id": "PSP4.26", "name": "Cone derivation in case (b)", "subclass": "case", "statement_clean": "", "statement": "In case (b): $|\\bD|_1 \\le 4(1+1/\\eps)|\\bD_{J_0}|_1$, hence $|\\bD_{J_0^c}|_1 \\le (3+4/\\eps)|\\bD_{J_0}|_1$. Translating back to $\\bD' = D^{-1/2}\\bD$: $|\\bD'_{J_0^c}|_1 \\le (3+4/\\eps)(f_{\\max}/f_{\\min})|\\bD'_{J_0}|_1$.", "step_order": 4}, {"id": "PSP4.27", "name": "Apply RE assumption", "subclass": "apply_lemma", "statement_clean": "", "statement": "Apply RE($s,(3+4/\\eps)f_{\\max}/f_{\\min}$): $\\kappa^2|\\bD'_{J_0}|_2^2 \\le \\frac{1}{n}|X\\bD'|_2^2 = \\|\\widehat f_L - {\\sf f}_\\beta\\|_n^2$, where $\\kappa = \\kappa(s,(3+4/\\eps)f_{\\max}/f_{\\min})$.", "step_order": 5}, {"id": "PSP4.28", "name": "Decoupling inequality", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "Apply $2xy \\le x^2/b + by^2$ with $b>1$, $x = r\\kappa^{-1}\\sqrt{\\mathcal{M}(\\beta)}$, and $y\\in\\{\\|\\widehat f_L - f\\|_n, \\|{\\sf f}_\\beta - f\\|_n\\}$ to obtain $\\|\\widehat f_L - f\\|_n^2 \\le \\frac{b+1}{b-1}\\|{\\sf f}_\\beta - f\\|_n^2 + \\frac{8b^2 f_{\\max}^2}{(b-1)\\kappa^2}r^2\\mathcal{M}(\\beta)$.", "step_order": 6}, {"id": "PSP4.29", "name": "Choose $b = 1 + 2/\\eps$", "subclass": "conclude", "statement_clean": "", "statement": "Setting $b = 1 + 2/\\eps$ yields the claimed sparsity oracle inequality with $C(\\eps)$ derived from $b^2/(b-1)$.", "step_order": 7}], "input": [], "output": [], "equations": []}, "PrP4.1": {"name": "Proposition 1 (Dantzig sparsity oracle inequality, nonparametric)", "type": "proposition", "section": "5", "statement": "Under weak sparsity with $C_0<\\infty$ and Assumption RE for $s\\max\\{C_1(\\eps),1\\}$: with probability $\\ge 1 - M^{1-A^2/8}$, $\\|\\widehat f_D - f\\|_n^2 \\le (1+\\eps)\\inf_{\\mathcal{M}(\\beta)=s}\\|{\\sf f}_\\beta - f\\|_n^2 + C_2(\\eps)\\frac{f_{\\max}^2 A^2 \\sigma^2}{\\kappa_0^2}\\,\\frac{s\\log M}{n}$, with $C_1, C_2$ explicit constants.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Weak sparsity (DP4.8)", "RE($s\\max\\{C_1(\\eps),1\\},(3+4/\\eps)f_{\\max}/f_{\\min}$)"], "conclusions": ["Sparsity oracle inequality for Dantzig prediction loss"], "proof_info": ["Use weak sparsity to find $\\bar\\beta$, apply Theorem 3 and (\\ref{Lassom}) to bound $\\mathcal{M}(\\widehat\\beta_L)$, then invoke Theorem 1 and Theorem 3 again."], "step_info": [{"id": "PSP4.30", "name": "Invoke weak sparsity", "subclass": "setup", "statement_clean": "", "statement": "Weak sparsity gives $\\bar\\beta\\in\\mathbb{R}^M$ with $\\mathcal{M}(\\bar\\beta)\\le s$ and $\\|{\\sf f}_{\\bar\\beta} - f\\|_n^2 \\le C_0 f_{\\max}^2 r^2 \\kappa^{-2}\\mathcal{M}(\\bar\\beta)$.", "step_order": 1}, {"id": "PSP4.31", "name": "Bound Lasso sparsity via Theorem 3 and Lemma B.1", "subclass": "apply_lemma", "statement_clean": "", "statement": "Combining Theorem 3 (TP4.3) with the sparsity bound (\\ref{Lassom}) of Lemma B.1: $\\mathcal{M}(\\widehat\\beta_L) \\le C_1(\\eps)\\mathcal{M}(\\bar\\beta) \\le C_1(\\eps) s$, with probability $\\ge 1 - M^{1-A^2/8}$.", "step_order": 2}, {"id": "PSP4.32", "name": "Apply Theorem 1 to compare losses", "subclass": "apply_lemma", "statement_clean": "", "statement": "Theorem 1 (TP4.1) yields $\\|\\widehat f_D - f\\|_n^2 \\le \\|\\widehat f_L - f\\|_n^2 + \\frac{16 C_1(\\eps)f_{\\max}^2 A^2 \\sigma^2}{\\kappa_0^2}\\frac{s\\log M}{n}$ where $\\kappa_0 = \\kappa(\\max(C_1(\\eps),1)s, 3+4/\\eps)$.", "step_order": 3}, {"id": "PSP4.33", "name": "Re-apply Theorem 3 to finish", "subclass": "conclude", "statement_clean": "", "statement": "Applying TP4.3 once again to $\\|\\widehat f_L - f\\|_n^2$ produces the stated oracle inequality with constant $C_2(\\eps) = 16 C_1(\\eps) + C(\\eps)$.", "step_order": 4}], "input": [], "output": [], "equations": []}, "TP4.4": {"name": "Theorem 4 (Dantzig coefficient bounds, linear model)", "type": "theorem", "section": "6", "statement": "In the linear model with unit-diagonal Gram matrix and $\\mathcal{M}(\\bb^*)\\le s$, under RE(s,1) and $A>\\sqrt{2}$: with probability $\\ge 1 - M^{1-A^2/2}$, $|\\widehat\\bb_D - \\bb^*|_1 \\le \\frac{8A}{\\kappa^2(s,1)}\\sigma s\\sqrt{\\log M/n}$ and $|X(\\widehat\\bb_D - \\bb^*)|_2^2 \\le \\frac{16 A^2}{\\kappa^2(s,1)}\\sigma^2 s\\log M$. Under RE(s,m,1), for $1<p\\le 2$, $|\\widehat\\bb_D - \\bb^*|_p^p \\le 2^{p-1}8\\{1+\\sqrt{s/m}\\}^{2(p-1)} s\\left(\\frac{A\\sigma}{\\kappa^2(s,m,1)}\\sqrt{\\log M/n}\\right)^p$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Linear model with unit Gram diagonal", "$\\mathcal{M}(\\bb^*)\\le s$", "RE(s,1) (and RE(s,m,1) for $\\ell_p$ bound)"], "conclusions": ["$\\ell_1$ bound on coefficients", "Prediction $\\ell_2$ bound", "$\\ell_p$ bound for $1<p\\le 2$"], "proof_info": ["On event $\\B$, use Lemma B.2 to deduce $\\frac{1}{n}|X^T X \\bD|_\\infty \\le 2r$ and the cone inequality with $c_0=1$. Bound $\\frac{1}{n}|X\\bD|_2^2$ by $4r\\sqrt{s}|\\bD_{J_0}|_2$ and apply RE(s,1). Derive $\\ell_p$ bound using a tail-sum trick and RE(s,m,1)."], "step_info": [{"id": "PSP4.34", "name": "Setup and event $\\B$", "subclass": "setup", "statement_clean": "", "statement": "Set $\\bD = \\widehat\\bb_D - \\bb^*$, $J_0 = J(\\bb^*)$. Lemma B.2 with $\\beta = \\bb^*$ gives, on $\\B$ (probability $\\ge 1 - M^{1-A^2/2}$): (i) $\\frac{1}{n}|X^T X \\bD|_\\infty \\le 2r$ and (ii) cone inequality with $c_0=1$.", "step_order": 1}, {"id": "PSP4.35", "name": "Quadratic-form bound", "subclass": "bound_estimate", "statement_clean": "", "statement": "$\\frac{1}{n}|X\\bD|_2^2 = \\frac{1}{n}\\bD^T X^T X \\bD \\le \\frac{1}{n}|X^T X \\bD|_\\infty |\\bD|_1 \\le 4r\\sqrt{s}|\\bD_{J_0}|_2$ via cone inequality and $|\\bD_{J_0}|_1 \\le \\sqrt{s}|\\bD_{J_0}|_2$.", "step_order": 2}, {"id": "PSP4.36", "name": "Apply RE(s,1)", "subclass": "apply_lemma", "statement_clean": "", "statement": "RE(s,1) gives $\\frac{1}{n}|X\\bD|_2^2 \\ge \\kappa^2 |\\bD_{J_0}|_2^2$, hence $\\frac{1}{n}|X\\bD|_2^2 \\le 16 r^2 s/\\kappa^2$ and $|\\bD_{J_0}|_2 \\le 4r\\sqrt{s}/\\kappa^2$, proving (\\ref{th43}) and (\\ref{th44}).", "step_order": 3}, {"id": "PSP4.37", "name": "Tail estimate $|\\bD_{J_{01}^c}|_2$", "subclass": "bound_estimate", "statement_clean": "", "statement": "Using $|\\bD_{J_0^c}|_{(k)} \\le |\\bD_{J_0^c}|_1/k$ and summation: $|\\bD_{J_{01}^c}|_2^2 \\le \\frac{1}{m}|\\bD_{J_0^c}|_1^2$, hence $|\\bD|_2 \\le (1 + c_0\\sqrt{s/m})|\\bD_{J_{01}}|_2$.", "step_order": 4}, {"id": "PSP4.38", "name": "Apply RE(s,m,1) and conclude $\\ell_p$ bound", "subclass": "conclude", "statement_clean": "", "statement": "From RE(s,m,1) and PSP4.35: $|\\bD_{J_{01}}|_2 \\le 4r\\sqrt{s}/\\kappa^2$. Combine with the tail estimate to get $|\\bD|_2^2 \\le 16(1+c_0\\sqrt{s/m})^2 (r\\sqrt{s}/\\kappa^2)^2$. Use $\\sum a_j^p \\le b_1^{2-p}b_2^{p-1}$ for $1<p\\le 2$ to obtain (\\ref{th42}).", "step_order": 5}], "input": [], "output": [], "equations": []}, "TP4.5": {"name": "Theorem 5 (Lasso coefficient bounds, linear model)", "type": "theorem", "section": "6", "statement": "In the linear model with unit Gram diagonal and $\\mathcal{M}(\\bb^*)\\le s$, under RE(s,3) and $A>2\\sqrt{2}$: with probability $\\ge 1 - M^{1-A^2/8}$, $|\\widehat\\bb_L - \\bb^*|_1 \\le \\frac{16A}{\\kappa^2(s,3)}\\sigma s\\sqrt{\\log M/n}$, $|X(\\widehat\\bb_L - \\bb^*)|_2^2 \\le \\frac{16A^2}{\\kappa^2(s,3)}\\sigma^2 s\\log M$, and $\\mathcal{M}(\\widehat\\bb_L) \\le \\frac{64\\phi_{\\max}}{\\kappa^2(s,3)} s$. Under RE(s,m,3), for $1<p\\le 2$, $|\\widehat\\bb_L - \\bb^*|_p^p \\le 16\\{1+3\\sqrt{s/m}\\}^{2(p-1)} s\\left(\\frac{A\\sigma}{\\kappa^2(s,m,3)}\\sqrt{\\log M/n}\\right)^p$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Linear model with unit Gram diagonal", "$\\mathcal{M}(\\bb^*)\\le s$", "RE(s,3) (and RE(s,m,3) for $\\ell_p$ bound)"], "conclusions": ["$\\ell_1$ coefficient bound", "Prediction $\\ell_2$ bound", "Lasso sparsity bound", "$\\ell_p$ bound for $1<p\\le 2$"], "proof_info": ["On event $\\A$, apply Lemma B.1 with $\\beta = \\bb^*$, $\\|{\\sf f}_\\beta - f\\|_n = 0$ to get $\\frac{1}{n}|X\\bD|_2^2 \\le 4r\\sqrt{s}|\\bD_{J_0}|_2$ and cone with $c_0=3$. Apply RE(s,3) and follow Theorem 4's argument with $c_0=3$."], "step_info": [{"id": "PSP4.39", "name": "Setup and apply Lemma B.1 with $\\beta=\\bb^*$", "subclass": "setup", "statement_clean": "", "statement": "Set $\\bD = \\widehat\\bb_L - \\bb^*$, $J_0 = J(\\bb^*)$. Lemma B.1 with $\\beta = \\bb^*$ and $\\|{\\sf f}_\\beta - f\\|_n = 0$ yields $\\frac{1}{n}|X\\bD|_2^2 \\le 4r\\sqrt{s}|\\bD_{J_0}|_2$ on event $\\A$, and (\\ref{l21}) with $c_0=3$.", "step_order": 1}, {"id": "PSP4.40", "name": "Apply RE(s,3)", "subclass": "apply_lemma", "statement_clean": "", "statement": "By RE(s,3): $\\frac{1}{n}|X\\bD|_2^2 \\le 16 r^2 s/\\kappa^2$ and $|\\bD_{J_0}|_2 \\le 4r\\sqrt{s}/\\kappa^2$, with $\\kappa = \\kappa(s,3)$. The first matches (\\ref{th54}).", "step_order": 2}, {"id": "PSP4.41", "name": "Sparsity bound (\\ref{th55})", "subclass": "apply_lemma", "statement_clean": "", "statement": "Combine (\\ref{Lassom}) from Lemma B.1 with (\\ref{th54}) to obtain $\\mathcal{M}(\\widehat\\bb_L) \\le \\frac{64\\phi_{\\max}}{\\kappa^2(s,3)} s$.", "step_order": 3}, {"id": "PSP4.42", "name": "Derive $\\ell_1$ and $\\ell_p$ bounds", "subclass": "conclude", "statement_clean": "", "statement": "Using (\\ref{dl6a}) with $c_0=3$ gives (\\ref{th53}). The $\\ell_p$ bound (\\ref{th52}) follows verbatim the Theorem 4 argument (PSP4.37, PSP4.38) with $c_0=3$ in (\\ref{chain0}), (\\ref{chain2}).", "step_order": 4}], "input": [], "output": [], "equations": []}, "TP4.6": {"name": "Theorem 6 (Sup-bound version of Theorem 4)", "type": "theorem", "section": "6", "statement": "Theorem 4 remains valid if $|\\widehat\\bb_D - \\bb^*|_p^p$ is replaced by $\\sup\\{|\\widehat\\bb_D - \\bb|_p^p: \\bb\\in\\Lambda, \\mathcal{M}(\\bb)\\le s\\}$ and $|X(\\widehat\\bb_D - \\bb^*)|_2^2$ by the analogous supremum, where $\\Lambda$ is the set of vectors satisfying the Dantzig constraint.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Same as Theorem 4"], "conclusions": ["Bounds hold uniformly over all $s$-sparse vectors satisfying the Dantzig constraint"], "proof_info": [], "step_info": [], "input": [], "output": [], "equa var ORPHANS = [{"id": "EP4.2", "statement": "$|\\bD_{J_0^c}|_1 \\le c_0 |\\bD_{J_0}|_1$ holds with high probability for $\\bD = \\widehat\\beta_L - \\beta$ ($c_0=3$) or $\\bD = \\widehat\\beta_D - \\beta$ ($c_0=1$).", "section": "3"}];
var GHOSTS = {"Independent and Identically Distributed": ["LP4.2"]};
var CASE1 = {"LP4.2": ["Independent and Identically Distributed"]};
var AUX_NODE_IDS = [];
var EXT_NODE_IDS = [];
var AUX_EDGE_GIDS = [];
var EXT_EDGE_GIDS = [];
// Foundation ghost-edge gid → target node id (so we can hide ghost edges
// pointing to currently-invisible aux/external nodes).
var GHOST_EDGE_TO_TARGET = {"ghost_edge_0_0": "LP4.2"};
var AUX_NODE_SET = (function(){ var s={}; AUX_NODE_IDS.forEach(function(n){s[n]=1;}); return s; })();
var EXT_NODE_SET = (function(){ var s={}; EXT_NODE_IDS.forEach(function(n){s[n]=1;}); return s; })();

var _lastDetailNode = null;
function showDetail(nodeId) {
  var panel = document.getElementById("detail-panel");
  // Toggle: click same node again to close
  if (_lastDetailNode === nodeId && panel.className === "open") {
    panel.className = "";
    panel.innerHTML = "";
    _lastDetailNode = null;
    return;
  }
  _lastDetailNode = nodeId;
  // Special case: orphan/misc node
  if (nodeId === '__orphan__') {
    var h = '<h3 style="margin:0 0 8px;font-size:16px;">Misc: Unconnected Equations</h3>';
    h += '<div style="font-size:12px;color:#888;margin-bottom:10px;">Equations not linked to any theorem or proof step</div>';
    ORPHANS.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    if (ORPHANS.length === 0) h += '<div style="color:#888;">No orphan equations.</div>';
    panel.innerHTML = h;
    panel.className = "open";
    typesetMath(panel);
    return;
  }
  var d = DETAILS[nodeId];
  if (!d) return;
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(nodeId) + ': ' + esc(d.name || d.type) + '</h3>';
  h += '<div style="font-size:12px;color:#888;margin-bottom:4px;">' + d.type + (d.section ? ' (Sec ' + d.section + ')' : '') + '</div>';
  // Origin badge — paper (default, shown only if external) or external (cited prior result)
  if (d.origin === "external") {
    var citeStr = d.origin_citation ? (' &mdash; ' + esc(d.origin_citation)) : '';
    h += '<div style="display:inline-block;padding:2px 8px;background:#FFF3E0;border:1px dashed #E65100;border-radius:3px;font-size:11px;color:#BF360C;margin-bottom:8px;">External (cited prior result)' + citeStr + '</div>';
  }
  // Foundation graph link badge (Case 1: known result)
  if (d.foundation_links && d.foundation_links.length > 0) {
    h += '<div style="display:inline-block;padding:2px 8px;background:#E3F2FD;border:1px solid #2471A3;border-radius:3px;font-size:11px;color:#2471A3;margin-bottom:8px;">&#128218; Known result: ' + d.foundation_links.map(esc).join(', ') + '</div>';
  }
  // Plain-text restatement (statement_clean) — shown above the formal statement
  if (d.statement_clean) {
    h += '<div class="detail-section"><h4>Plain-Text Summary</h4><div style="font-size:13px;color:#444;font-style:italic;">' + esc(d.statement_clean) + '</div></div>';
  }
  // Pre-build equation maps by context
  var eqsByCtx = {statement:[], assumption:[], conclusion:[], orphan:[]};
  var eqsByStep = {};
  if (d.equations) {
    d.equations.forEach(function(e) {
      if (e.parent_step) {
        if (!eqsByStep[e.parent_step]) eqsByStep[e.parent_step] = [];
        eqsByStep[e.parent_step].push(e);
      } else if (e.context && eqsByCtx[e.context]) {
        eqsByCtx[e.context].push(e);
      } else {
        eqsByCtx.orphan.push(e);
      }
    });
  }
  var eqTag = function(e) { return '<span style="color:#2471A3;font-size:11px;"> (' + e.id + ')</span>'; };
  var eqBlock = function(e) { return '<div style="margin:2px 0 2px 12px;padding:3px 8px;background:#EBF5FB;border-left:2px solid #5DADE2;font-size:12px;">' + esc(e.id) + ': ' + esc(e.statement) + '</div>'; };

  // Statement + inline statement equations
  if (d.statement) {
    h += '<div class="detail-section"><h4>Statement</h4><div style="font-size:14px;">' + esc(d.statement) + '</div>';
    eqsByCtx.statement.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Assumptions + inline assumption equations
  if ((d.assumptions && d.assumptions.length > 0) || eqsByCtx.assumption.length > 0) {
    h += '<div class="detail-section"><h4>Assumptions</h4>';
    if (d.assumptions) d.assumptions.forEach(function(a) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(a) + '</div>'; });
    eqsByCtx.assumption.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Conclusions + inline conclusion equations
  if ((d.conclusions && d.conclusions.length > 0) || eqsByCtx.conclusion.length > 0) {
    h += '<div class="detail-section"><h4>Conclusions</h4>';
    if (d.conclusions) d.conclusions.forEach(function(c) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(c) + '</div>'; });
    eqsByCtx.conclusion.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Proof strategy
  if (d.proof_info && d.proof_info.length > 0) {
    h += '<div class="detail-section"><h4>Proof Strategy</h4>';
    d.proof_info.forEach(function(p) {
      if (Array.isArray(p)) {
        p.forEach(function(item) { h += '<div style="font-size:13px;font-style:italic;">&bull; ' + esc(item) + '</div>'; });
      } else {
        h += '<div style="font-size:13px;font-style:italic;">' + esc(p) + '</div>';
      }
    });
    h += '</div>';
  }
  // v2: Step decomposition (proof_step children of a proof, or algorithm_step children of an algorithm)
  if (d.step_info && d.step_info.length > 0) {
    h += '<div class="detail-section"><h4>Decomposition (' + d.step_info.length + ' steps)</h4>';
    d.step_info.forEach(function(s, i) {
      var ord = (s.step_order || (i + 1));
      var label = s.name ? esc(s.name) : esc(s.id || ('Step ' + ord));
      h += '<div class="step-item"><strong>' + ord + '. ' + label + '</strong>';
      if (s.subclass) {
        h += ' <span style="font-size:11px;font-style:italic;color:#666;">[' + esc(s.subclass) + ']</span>';
      }
      var body = s.statement_clean || s.statement || '';
      if (body) {
        h += '<div style="font-size:12px;color:#444;margin-top:2px;">' + esc(body) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  // Algorithm input/output
  if (d.input && d.input.length > 0) {
    h += '<div class="detail-section"><h4>Input</h4>';
    d.input.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // (Legacy "Proof Steps" panel removed: same data now rendered above as
  // "Decomposition" via d.step_info. Both used to read from step_chains and
  // produced duplicate sections on click.)
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  typesetMath(panel);
}
function resetView() {
  document.getElementById("detail-panel").className = "";
  document.getElementById("detail-panel").innerHTML = "";
}
function toggleOrphans() {
  var p = document.getElementById("orphan-panel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  var h = "";
  ORPHANS.forEach(function(e) { h += '<div class="orphan-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>'; });
  document.getElementById("orphan-list").innerHTML = h;
  p.style.display = "block";
  typesetMath(p);
}
// Foundation toggle (ghost nodes — both mathlib/proofwiki ("ghost_") and
// book entries ("ghostbook_") are picked up by the [id^="ghost"] selector).
function toggleGhosts() {
  var btn = document.getElementById("ghost-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  btn.dataset.showing = isShowing ? "0" : "1";
  _applyGhostVisibility();
}

// Apply current foundation visibility, respecting whether ghost edges' target
// nodes are currently hidden (aux/external toggles). A foundation arrow is
// only shown when (a) Foundation toggle is ON and (b) its target node is
// currently visible — otherwise it would float into empty space.
function _applyGhostVisibility() {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  var btn = document.getElementById("ghost-btn");
  var on = btn && btn.dataset.showing === "1";
  var auxBtn = document.getElementById("aux-btn");
  var extBtn = document.getElementById("ext-btn");
  var auxOn = auxBtn && auxBtn.dataset.showing === "1";
  var extOn = extBtn && extBtn.dataset.showing === "1";
  // Show/hide ghost boxes, headers, text, refs uniformly.
  var ghostEls = svgEl.querySelectorAll('[id^="ghost"]');
  ghostEls.forEach(function(el) {
    var gid = el.id;
    if (!on) {
      el.style.display = "none";
      return;
    }
    // Edge gid pattern: "<prefix>_edge_<gi>_<ti>". For these, check target.
    if (GHOST_EDGE_TO_TARGET.hasOwnProperty(gid)) {
      var target = GHOST_EDGE_TO_TARGET[gid];
      var targetHidden = (AUX_NODE_SET[target] && !auxOn) || (EXT_NODE_SET[target] && !extOn);
      el.style.display = targetHidden ? "none" : "";
    } else {
      el.style.display = "";
    }
  });
}

// Generic helper: hide/show a set of nodes (by id) and their incident edges.
function _setNodeVisibility(nodeIds, edgeGids, visible, extraClass) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  nodeIds.forEach(function(nid) {
    // Body rect
    var body = svgEl.querySelector('[id="node_' + nid + '"]');
    if (body) {
      body.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) body.classList.add(extraClass);
        else body.classList.remove(extraClass);
      }
    }
    // All sibling per-node elements (header rect, text labels, divider lines)
    var sibs = svgEl.querySelectorAll('[id^="node_' + nid + '__"]');
    sibs.forEach(function(el) {
      el.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) el.classList.add(extraClass);
        else el.classList.remove(extraClass);
      }
    });
  });
  edgeGids.forEach(function(gid) {
    var e = svgEl.querySelector('[id="' + gid + '"]');
    if (e) e.style.display = visible ? "" : "none";
  });
}

// Examples & Remarks toggle — hides nodes with type in {example, remark}
function toggleAux() {
  var btn = document.getElementById("aux-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  // Apply visual differentiation: lighter shade (opacity) when shown
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, nextShowing, "node-aux-shown");
  // Apply opacity styling on the body rect when shown
  AUX_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) body.style.opacity = nextShowing ? "0.75" : "";
  });
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
}

// Cited Results (External) toggle — hides nodes with origin === "external"
function toggleExternal() {
  var btn = document.getElementById("ext-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, nextShowing, "node-external-shown");
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
  // Apply dashed border on body rect when shown (visual differentiation)
  EXT_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) {
      // FancyBboxPatch is a <path>; modify its stroke-dasharray for a dashed look.
      var pathEl = body.tagName === "path" ? body : body.querySelector("path");
      if (pathEl) {
        if (nextShowing) {
          pathEl.setAttribute("stroke-dasharray", "6,3");
          pathEl.setAttribute("stroke-width", "2");
        } else {
          pathEl.removeAttribute("stroke-dasharray");
          pathEl.removeAttribute("stroke-width");
        }
      }
    }
  });
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements + aux + external elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all foundation ghost elements (mathlib/proofwiki AND book-derived).
    // The [id^="ghost"] selector covers both "ghost_*" and "ghostbook_*".
    var all = svgEl.querySelectorAll('[id^="ghost"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
  // Examples & Remarks: hidden by default (toggle starts in OFF state).
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, false, null);
  // Cited Results (External): hidden by default.
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, false, null);
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() { currentZoom = 1.0; applyZoom(); }

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
