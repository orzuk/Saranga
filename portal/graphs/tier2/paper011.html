<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #fafafa; }
#header { background: #2c3e50; color: white; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; }
#header h1 { margin: 0; font-size: 18px; }
#header .hint { font-size: 12px; color: #aaa; font-style: italic; margin-left: 12px; }
#controls button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; background: #34495e; color: white; margin-left: 8px; }
#controls button:hover { background: #4a6785; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 24px; background: #f5f5f5; border-bottom: 1px solid #eee; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #777; }
#main { display: flex; height: calc(100vh - 82px); }
#svg-container { flex: 1; overflow: auto; padding: 10px; cursor: grab; }
#svg-container svg { transform-origin: 0 0; }
#detail-panel { width: 0; overflow-y: auto; background: white; border-left: 1px solid #ddd; transition: width 0.3s; }
#detail-panel.open { width: 380px; padding: 16px; }
.detail-section { margin-bottom: 12px; }
.detail-section h4 { margin: 0 0 6px; color: #444; font-size: 13px; text-transform: uppercase; }
.step-item { background: #f0f0f0; border-left: 3px solid #839192; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.step-arrow { text-align: center; color: #aaa; font-size: 14px; }
.eq-item { background: #d4e6f1; border-left: 3px solid #5dade2; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.orphan-item { background: #fef9e7; border-left: 3px solid #f39c12; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; }
#orphan-panel { position: fixed; bottom: 16px; right: 16px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-width: 350px; max-height: 400px; overflow-y: auto; display: none; padding: 12px; z-index: 100; }
#orphan-toggle { display: none; }
/* Hover effect on clickable node rects */
[id^="node_"]:hover { filter: brightness(0.90); }
.ghost-node { display: inline-block; margin: 4px 8px; padding: 8px 14px; background: #E0E0E0; border: 1.5px solid #757575; border-radius: 5px; font-size: 13px; color: #333; cursor: pointer; vertical-align: top; white-space: normal; max-width: 220px; }
.ghost-node:hover { background: #BDBDBD; }
.ghost-node .ghost-label { font-weight: bold; font-size: 13px; }
.ghost-node .ghost-refs { font-size: 11px; color: #666; margin-top: 3px; }
/* Toggle controls panel (Foundation, Examples & Remarks, Cited Results) */
.toggle-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: 12px; padding: 4px 8px; background: #ECEFF1; border: 1px solid #CFD8DC; border-radius: 6px; }
.toggle-panel .toggle-label { font-size: 11px; color: #555; font-weight: bold; text-transform: uppercase; margin-right: 4px; }
.toggle-btn { padding: 4px 12px; border: 1.5px solid #757575; border-radius: 4px; background: #E0E0E0; cursor: pointer; font-size: 12px; color: #333; }
.toggle-btn:hover { background: #BDBDBD; }
.toggle-btn[data-showing="1"] { background: #2E7D32; color: white; border-color: #1B5E20; }
.toggle-btn[disabled] { opacity: 0.4; cursor: not-allowed; background: #EEE; }
/* Hidden state — applied dynamically via JS */
.svg-hidden { display: none !important; }
/* Visual differentiation when shown */
.node-external-shown [stroke-dasharray] { }  /* no-op, see runtime tweak */
.node-aux-shown { opacity: 0.75; }
/* v2: `resolves` edges (theorem-like resolves an open_problem/conjecture) — dashed */
.edge-resolves path { stroke-dasharray: 5,3 !important; }
.edge-resolves { stroke-dasharray: 5,3 !important; }
</style>

var DETAILS = {"DP11.1": {"name": "$(c,r)$-approximate near neighbor problem (ANN)", "type": "definition", "section": "2 Preliminaries", "statement": "Given a set $P$ of points in metric space $(X,D)$ and failure probability $f$, build a data structure that, on query $q$, if some $p \\in P$ has $D(p,q) \\le r$, returns $p' \\in P$ with $D(p',q) \\le cr$ with probability $\\ge 1-f$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP11.2": {"name": "$(r_1,r_2,p_1,p_2)$-sensitive hash family", "type": "definition", "section": "2 Preliminaries", "statement": "A family $\\mathcal{H}$ on $(X,D)$ is $(r_1,r_2,p_1,p_2)$-sensitive if for all $x,y \\in X$: $D(x,y) \\le r_1 \\Rightarrow \\Pr_{h\\sim\\mathcal{H}}[h(x)=h(y)] \\ge p_1$ and $D(x,y) \\ge r_2 \\Rightarrow \\Pr[h(x)=h(y)] \\le p_2$.", "statement_clean": "", "origin": "external", "origin_citation": "Har-Peled, Indyk, Motwani 2012 (him-anntr-12)", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP11.3": {"name": "Tensor power $\\mathcal{H}^{\\otimes k}$", "type": "definition", "section": "2 Preliminaries", "statement": "For a hash family $\\mathcal{H}$ and $k \\in \\mathbb{N}$, sample $\\mathcal{H}^{\\otimes k}$ by drawing $h_1,\\dots,h_k \\sim \\mathcal{H}$ independently and mapping $x \\mapsto (h_1(x),\\dots,h_k(x))$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP11.1": {"name": "Sensitivity of tensor power", "type": "lemma", "section": "2 Preliminaries", "statement": "If $\\mathcal{H}$ is $(r_1,r_2,p_1,p_2)$-sensitive, then $\\mathcal{H}^{\\otimes k}$ is $(r_1,r_2,p_1^k,p_2^k)$-sensitive.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["$\\mathcal{H}$ is $(r_1,r_2,p_1,p_2)$-sensitive on $(X,D)$", "$k \\in \\mathbb{N}$"], "conclusions": ["$\\mathcal{H}^{\\otimes k}$ is $(r_1,r_2,p_1^k,p_2^k)$-sensitive"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "TP11.1": {"name": "LSH-to-ANN reduction", "type": "theorem", "section": "2 Preliminaries", "statement": "If a $(r,cr,p_1,p_2)$-sensitive family exists with $\\rho = \\ln(1/p_1)/\\ln(1/p_2)$, there is a $(c,r)$-ANN data structure using $O(n^\\rho/p_1)$ distance computations per query, $O(n^\\rho/p_1 \\cdot \\lceil \\log_{1/p_2} n \\rceil)$ hash evaluations, and $O(n^{1+\\rho}/p_1)$ words of space.", "statement_clean": "", "origin": "external", "origin_citation": "Har-Peled, Indyk, Motwani 2012 (him-anntr-12)", "assumptions": ["$(r,cr,p_1,p_2)$-sensitive family $\\mathcal{H}$ on $(X,D)$", "$p_1,p_2 \\in (0,1)$", "$P \\subseteq X$, $|P| \\le n$"], "conclusions": ["Query distance computations: $O(n^\\rho/p_1)$", "Hash evaluations: $O(n^\\rho/p_1 \\cdot \\lceil \\log_{1/p_2} n \\rceil)$", "Space: $O(n^{1+\\rho}/p_1)$ words", "Failure probability arbitrarily small constant"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "TP11.2": {"name": "Ball-carving LSH (Andoni-Indyk)", "type": "theorem", "section": "2 Preliminaries", "statement": "For sufficiently large $d,n$ there is a hash family $\\mathcal{H}$ on $\\ell_2^d$ whose collision probability depends only on $\\|u-v\\|$, with $p(1) \\ge L = \\frac{A}{2\\sqrt{t}}(1+\\eps+8\\eps^2)^{-t/2}$ and $p(c) \\le U(c) = 2(1+c^2\\eps)^{-t/2}$, where $t=\\log^{2/3} n$ and $\\eps = \\Theta(t^{-1/2})$.", "statement_clean": "", "origin": "external", "origin_citation": "Andoni & Indyk, FOCS 2006 (ai-nohaa-06)", "assumptions": ["Sufficiently large $d$ and $n$", "$t = \\log^{2/3} n$", "$\\eps = \\Theta(t^{-1/2}) = \\Theta(\\log^{-1/3} n)$"], "conclusions": ["Sample/store/eval time $t^{O(t)}\\log n + O(dt)$", "Collision probability depends only on $\\|u-v\\|$", "$p(1) \\ge L$", "$\\forall c>1: p(c) \\le U(c)$"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [], "foundation_links": ["Independent and Identically Distributed"]}, "CP11.1": {"name": "Baseline $\\ell_2$ ANN with $\\rho = 1/c^2$", "type": "corollary", "section": "2 Preliminaries", "statement": "There is a data structure for $(c,r)$-ANN in $\\ell_2^d$ with preprocessing time/space $O_c(n^{1+1/c^2 + o_c(1)} + nd)$ and query time $O_c(d\\, n^{1/c^2 + o_c(1)})$.", "statement_clean": "", "origin": "external", "origin_citation": "Andoni & Indyk, FOCS 2006", "assumptions": ["$(c,r)$-ANN problem in $\\ell_2^d$", "$c > 1$"], "conclusions": ["Preprocessing time/space $O_c(n^{1+1/c^2+o_c(1)} + nd)$", "Query time $O_c(d\\, n^{1/c^2+o_c(1)})$"], "proof_info": ["By rescaling assume $r=1$; combine Theorem~\\ref{lsh_to_nn} with Theorem~\\ref{ball_carving} and check $L = n^{-o_c(1)}$ and $\\ln(1/L)/\\ln(1/U(c)) \\le 1/c^2 + o_c(1)$."], "step_info": [], "input": [], "output": [], "equations": []}, "LP11.2": {"name": "Gaussian tail bound", "type": "lemma", "section": "2 Preliminaries", "statement": "For every $t > 0$: $\\frac{1}{\\sqrt{2\\pi}}(\\frac{1}{t}-\\frac{1}{t^3})e^{-t^2/2} \\le \\Pr_{X\\sim N(0,1)}[X \\ge t] \\le \\frac{1}{\\sqrt{2\\pi}} \\cdot \\frac{1}{t} e^{-t^2/2}$.", "statement_clean": "", "origin": "external", "origin_citation": "Karloff, Mahajan, Sudan (kms-agcsp-98)", "assumptions": ["$t > 0$", "$X \\sim N(0,1)$"], "conclusions": ["$\\frac{1}{\\sqrt{2\\pi}}(\\frac{1}{t}-\\frac{1}{t^3})e^{-t^2/2} \\le \\Pr[X \\ge t] \\le \\frac{1}{\\sqrt{2\\pi}}\\frac{1}{t}e^{-t^2/2}$"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "TP11.3": {"name": "Johnson-Lindenstrauss dimension reduction", "type": "theorem", "section": "2 Preliminaries", "statement": "For every $d \\in \\mathbb{N}$ and $\\eps,\\delta > 0$ there is a distribution over linear maps $A:\\mathbb{R}^d \\to \\mathbb{R}^{O(\\log(1/\\delta)/\\eps^2)}$ with $\\Pr_A[\\|Ax\\| \\in (1\\pm\\eps)\\|x\\|] \\ge 1-\\delta$ for every $x$, samplable in $O(d\\log(1/\\delta)/\\eps^2)$ time.", "statement_clean": "", "origin": "external", "origin_citation": "Johnson-Lindenstrauss 1984; Dasgupta-Gupta 2003", "assumptions": ["$d \\in \\mathbb{N}$", "$\\eps, \\delta > 0$"], "conclusions": ["Distribution on linear maps $A:\\mathbb{R}^d \\to \\mathbb{R}^{O(\\log(1/\\delta)/\\eps^2)}$", "$\\forall x: \\Pr_A[\\|Ax\\| \\in (1\\pm\\eps)\\|x\\|] \\ge 1-\\delta$", "Sampling time $O(d\\log(1/\\delta)/\\eps^2)$"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [], "foundation_links": ["Johnson-Lindenstrauss Lemma"]}, "TP11.4": {"name": "Jung's theorem", "type": "theorem", "section": "2 Preliminaries", "statement": "Every subset of $\\mathbb{R}^d$ with diameter $\\Delta$ can be enclosed in a ball of radius $\\Delta/\\sqrt{2}$.", "statement_clean": "", "origin": "external", "origin_citation": "Matousek, Lectures on Discrete Geometry, Exercise 1.3.5", "assumptions": ["$S \\subseteq \\mathbb{R}^d$ with diameter $\\Delta$"], "conclusions": ["$S$ is enclosed in a ball of radius $\\Delta/\\sqrt{2}$"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "TP11.5": {"name": "Idealized Gaussian LSH on a sphere", "type": "theorem", "section": "3 Gaussian LSH", "statement": "For sufficiently large $c$, every $\\nu \\ge 1/2$ and $1/2 \\le \\eta \\le \\nu$, there is a $(1,c,p_1,p_2)$-sensitive LSH family for $\\eta c \\cdot S^{d-1}$ with $p_1 = \\exp(-o_{c,\\nu}(d))$ and $\\rho = (1-\\frac{1}{4\\eta^2})\\cdot\\frac{1}{c^2} + O_\\nu(1/c^3) + o_{c,\\nu}(1)$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["$c$ sufficiently large", "$\\nu \\ge 1/2$", "$1/2 \\le \\eta \\le \\nu$", "Points lie on sphere $\\eta c \\cdot S^{d-1}$"], "conclusions": ["LSH family on $\\eta c \\cdot S^{d-1}$ is $(1,c,p_1,p_2)$-sensitive", "$p_1 = \\exp(-o_{c,\\nu}(d))$", "$\\rho = (1-\\frac{1}{4\\eta^2})\\cdot\\frac{1}{c^2} + O_\\nu(1/c^3) + o_{c,\\nu}(1)$"], "proof_info": ["Compute the collision probability via Gaussian-tail estimates (Lemmas \\ref{numerator_up}, \\ref{numerator_lo}); set $\\eps = d^{-1/4}$; bound $\\ln(1/p_1)$ and $\\ln(1/p_2)$ in terms of $\\tan^2(\\alpha/2)$ for the angles corresponding to distances $1$ and $c$; obtain the stated $\\rho$."], "step_info": [{"id": "PSP11.2.1", "name": "Express collision probability via Gaussian inner products", "subclass": "setup", "statement_clean": "", "statement": "For $u,v \\in \\eta c \\cdot S^{d-1}$ at angle $\\alpha$, write $\\Pr[h(u)=h(v)]$ as a ratio of Gaussian-cap probabilities and reduce to two-dimensional Gaussian probabilities $\\Pr[X \\ge \\eps\\sqrt{d} \\wedge \\cos\\alpha \\cdot X - \\sin\\alpha \\cdot Y \\ge \\eps\\sqrt{d}]$ via Equation~(\\ref{coll}).", "step_order": 1}, {"id": "PSP11.2.2", "name": "Apply numerator bounds (Lemmas \\ref{numerator_up}, \\ref{numerator_lo})", "subclass": "apply_lemma", "statement_clean": "", "statement": "Combine the upper and lower bounds on $\\Pr[X \\ge \\eps\\sqrt{d} \\wedge \\cos\\alpha\\cdot X - \\sin\\alpha\\cdot Y \\ge \\eps\\sqrt{d}]$ to obtain $\\ln(1/\\Pr[h(u)=h(v)]) \\approx \\frac{\\eps^2 d}{2}\\tan^2(\\alpha/2)$ (Lemma~\\ref{closed_coll}).", "step_order": 2}, {"id": "PSP11.2.3", "name": "Translate angle to Euclidean distance", "subclass": "substitute", "statement_clean": "", "statement": "Use $\\tan^2(\\alpha/2) = \\frac{\\|u-v\\|^2/(\\eta c)^2}{4 - \\|u-v\\|^2/(\\eta c)^2}$ to convert the closed-form collision-probability bound from angles to distances.", "step_order": 3}, {"id": "PSP11.2.4", "name": "Set $\\eps = d^{-1/4}$ and conclude", "subclass": "conclude", "statement_clean": "", "statement": "Plug $\\eps = d^{-1/4}$ into the bounds for distances $1$ and $c$, obtaining $\\ln(1/p_1) \\le \\frac{\\sqrt{d}}{2}\\cdot\\frac{1/(\\eta c)^2}{4-1/(\\eta c)^2}+O_{c,\\nu}(\\ln d)$ and a matching lower bound for $\\ln(1/p_2)$, hence $\\rho = \\frac{4-1/\\eta^2}{4-1/(\\eta c)^2}\\cdot\\frac{1}{c^2}+o_{c,\\nu}(1) = (1-\\frac{1}{4\\eta^2})\\frac{1}{c^2}+O_\\nu(1/c^3)+o_{c,\\nu}(1)$.", "step_order": 4}], "input": [], "output": [], "equations": []}, "AP11.1": {"name": "Gaussian partitioning", "type": "algorithm", "section": "3 Gaussian LSH", "statement": "Random Gaussian partition of $\\eta c \\cdot S^{d-1}$ into halfspace caps $\\{u : \\langle u,w\\rangle \\ge \\eta c \\eps \\sqrt{d}\\}$ with i.i.d. Gaussian $w$, used to define the idealized LSH family $\\mathcal{H}$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [{"id": "ASP11.1.1", "name": "Initialize empty partition", "subclass": "initialize", "statement_clean": "", "statement": "$\\mathcal{P} \\gets \\emptyset$.", "step_order": 1}, {"id": "ASP11.1.2", "name": "Cap-sampling loop", "subclass": "loop", "statement_clean": "", "statement": "While $\\bigcup\\mathcal{P} \\ne \\eta c \\cdot S^{d-1}$, sample $w \\sim N(0,1)^d$ and form the unclaimed cap $S \\gets \\{u \\in \\eta c \\cdot S^{d-1} : \\langle u,w\\rangle \\ge \\eta c \\eps \\sqrt{d}\\}\\setminus\\bigcup\\mathcal{P}$.", "step_order": 2}, {"id": "ASP11.1.3", "name": "Add nonempty cap to partition", "subclass": "branch", "statement_clean": "", "statement": "If $S \\ne \\emptyset$, add $S$ to $\\mathcal{P}$.", "step_order": 3}, {"id": "ASP11.1.4", "name": "Define hash function $h$", "subclass": "return", "statement_clean": "", "statement": "Define $h$ to map a point $u \\in \\eta c \\cdot S^{d-1}$ to the part of $\\mathcal{P}$ containing it.", "step_order": 4}], "input": ["Sphere $\\eta c \\cdot S^{d-1} \\subset \\mathbb{R}^d$", "Threshold parameter $\\eps$ (with $\\eps = o(1)$, $\\eps = \\omega(d^{-1/2})$)"], "output": ["Partition $\\mathcal{P}$ of $\\eta c \\cdot S^{d-1}$", "Hash function $h:\\eta c \\cdot S^{d-1} \\to \\mathcal{P}$ mapping each point to its containing part"], "equations": [], "foundation_links": ["Independent and Identically Distributed"]}, "LP11.3": {"name": "Numerator upper bound", "type": "lemma", "section": "3 Gaussian LSH", "statement": "$\\Pr_{X,Y \\sim N(0,1)}[X \\ge \\eps\\sqrt{d} \\wedge \\cos\\alpha\\cdot X - \\sin\\alpha\\cdot Y \\ge \\eps\\sqrt{d}] = O\\left(\\frac{e^{-\\eps^2 d (1+\\tan^2(\\alpha/2))/2}}{\\eps\\sqrt{d}}\\right)$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["$X,Y \\sim N(0,1)$ independent", "$\\eps = \\omega(d^{-1/2})$", "$\\alpha \\in [0,\\pi)$"], "conclusions": ["$\\Pr[X \\ge \\eps\\sqrt{d} \\wedge \\cos\\alpha\\cdot X - \\sin\\alpha\\cdot Y \\ge \\eps\\sqrt{d}] = O(e^{-\\eps^2 d(1+\\tan^2(\\alpha/2))/2}/(\\eps\\sqrt{d}))$"], "proof_info": ["Bound the joint event by $(1+\\cos\\alpha)X - \\sin\\alpha\\cdot Y \\ge 2\\eps\\sqrt{d}$, recognize the linear combination as $\\sqrt{2(1+\\cos\\alpha)}\\cdot Z$ for $Z \\sim N(0,1)$, then apply Lemma~\\ref{gaussians} together with the identity $\\frac{2}{1+\\cos\\alpha}=1+\\tan^2(\\alpha/2)$."], "step_info": [], "input": [], "output": [], "equations": []}, "LP11.4": {"name": "Numerator lower bound", "type": "lemma", "section": "3 Gaussian LSH", "statement": "If $0 \\le \\alpha < \\alpha_0 < \\pi/2$ for a constant $\\alpha_0$, then $\\Pr_{X,Y\\sim N(0,1)}[X \\ge \\eps\\sqrt{d} \\wedge \\cos\\alpha\\cdot X - \\sin\\alpha\\cdot Y \\ge \\eps\\sqrt{d}] = \\Omega\\left(\\frac{e^{-\\eps^2 d(1+\\tan^2(\\alpha_0/2))/2}}{\\eps^2 d \\tan(\\alpha_0/2)}\\right)$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["$X,Y \\sim N(0,1)$ independent", "$0 \\le \\alpha < \\alpha_0$ for constant $0 < \\alpha_0 < \\pi/2$", "$\\eps = \\omega(d^{-1/2})$"], "conclusions": ["$\\Pr[X \\ge \\eps\\sqrt{d} \\wedge \\cos\\alpha\\cdot X - \\sin\\alpha\\cdot Y \\ge \\eps\\sqrt{d}] = \\Omega(e^{-\\eps^2 d(1+\\tan^2(\\alpha_0/2))/2}/(\\eps^2 d \\tan(\\alpha_0/2)))$"], "proof_info": ["Lower-bound the joint event by the independent event $\\{X \\ge \\eps\\sqrt{d}\\}\\wedge\\{Y \\le -\\tan(\\alpha/2)\\eps\\sqrt{d}\\}$ (which implies the original since $\\cos\\alpha,\\sin\\alpha > 0$ and $\\alpha < \\alpha_0 < \\pi/2$); replace $\\alpha$ by the constant $\\alpha_0$; and apply Lemma~\\ref{gaussians}."], "step_info": [], "input": [], "output": [], "equations": []}, "LP11.5": {"name": "Closed-form collision-probability bound", "type": "lemma", "section": "3 Gaussian LSH", "statement": "For $u,v$ at angle $\\alpha$ on $\\eta c\\cdot S^{d-1}$: $\\ln(1/\\Pr[h(u)=h(v)]) \\ge \\frac{\\eps^2 d}{2}\\tan^2(\\alpha/2) - O(1)$, and if $\\alpha < \\alpha_0 < \\pi/2$ constant, then $\\ln(1/\\Pr[h(u)=h(v)]) \\le \\frac{\\eps^2 d}{2}\\tan^2(\\alpha_0/2) + \\ln(\\eps\\sqrt{d}\\tan(\\alpha_0/2)) + O(1)$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Hash family $\\mathcal{H}$ from Algorithm~\\ref{gaussian_partitioning}", "$u,v \\in \\eta c \\cdot S^{d-1}$ at angle $\\alpha$", "$\\eps = \\omega(d^{-1/2})$"], "conclusions": ["$\\ln(1/\\Pr[h(u)=h(v)]) \\ge \\frac{\\eps^2 d}{2}\\tan^2(\\alpha/2)-O(1)$", "If $\\alpha < \\alpha_0 < \\pi/2$ constant: $\\ln(1/\\Pr[h(u)=h(v)]) \\le \\frac{\\eps^2 d}{2}\\tan^2(\\alpha_0/2)+\\ln(\\eps\\sqrt{d}\\tan(\\alpha_0/2))+O(1)$"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "TP11.6": {"name": "Non-idealized Gaussian LSH (spherical shell)", "type": "theorem", "section": "3 Gaussian LSH", "statement": "For sufficiently large $c$, every $\\nu \\ge 1/2$ and $1/2 \\le \\eta \\le \\nu$ there is an LSH family $\\mathcal{H}$ for the shell $\\{x \\in \\mathbb{R}^d : \\|x\\| \\in [\\eta c-1, \\eta c+1]\\}$ with the conclusion of Theorem~\\ref{gaussian_lsh} and with sample/store/query time $\\exp(o(d))$ for every $k \\in \\mathbb{N}$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["$c$ sufficiently large", "$\\nu \\ge 1/2$", "$1/2 \\le \\eta \\le \\nu$", "Points lie in the shell $\\|x\\| \\in [\\eta c-1, \\eta c+1]$"], "conclusions": ["Family $\\mathcal{H}$ satisfies the conclusion of Theorem~\\ref{gaussian_lsh}", "Sample, store and query in time $\\exp(o(d))$ for every $k \\in \\mathbb{N}$"], "proof_info": ["Modify Algorithm~\\ref{gaussian_partitioning} by (i) running the partitioning for $\\exp(o(d))$ steps until the uncovered measure is $\\le e^{-d}$ and (ii) normalizing $x$ to length $\\eta c$ before evaluating $h$; bound the distance perturbation via Lemma~\\ref{LP11.6} to recover the conclusion of Theorem~\\ref{gaussian_lsh}."], "step_info": [{"id": "PSP11.6.1", "name": "Truncate the partitioning loop", "subclass": "setup", "statement_clean": "", "statement": "Replace the unbounded \\textbf{while} loop with a fixed $\\exp(o(d))$-step run, which by an $\\eps$-net argument covers $\\eta c \\cdot S^{d-1}$ with probability $\\ge 1-\\exp(-d)$, giving the $\\exp(o(d))$ sample/store/query bounds.", "step_order": 1}, {"id": "PSP11.6.2", "name": "Normalize input to $\\eta c$ before hashing", "subclass": "introduce_variable", "statement_clean": "", "statement": "Define $h$ on the shell by first normalizing $x$ to $\\eta c \\cdot x/\\|x\\|$, then applying the spherical hash from Theorem~\\ref{gaussian_lsh}.", "step_order": 2}, {"id": "PSP11.6.3", "name": "Bound distance distortion via LP11.6", "subclass": "bound_estimate", "statement_clean": "", "statement": "Using Lemma~\\ref{LP11.6}, show that for $u,v$ in the shell with $\\|u-v\\|\\le 1$: $(\\eta c\\cdot \\|u/\\|u\\|-v/\\|v\\|\\|)^2 \\le 1+O_\\nu(1/c)$, and with $\\|u-v\\|\\ge c$: $(\\eta c\\cdot \\|\\cdot\\|)^2 \\ge c^2(1-O_\\nu(1/c))$.", "step_order": 3}, {"id": "PSP11.6.4", "name": "Conclude conclusion of TP11.5 transfers", "subclass": "conclude", "statement_clean": "", "statement": "These distortion bounds preserve the parameters $p_1,\\rho$ from Theorem~\\ref{gaussian_lsh} up to $o_c(1)$, completing the proof.", "step_order": 4}], "input": [], "output": [], "equations": []}, "LP11.6": {"name": "Distance after normalization", "type": "lemma", "section": "3 Gaussian LSH", "statement": "For any $u,v$: $\\|u/\\|u\\| - v/\\|v\\|\\|^2 = \\frac{1}{\\|u\\|\\cdot\\|v\\|}\\left(\\|u-v\\|^2 - (\\|u\\|-\\|v\\|)^2\\right)$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["$u,v \\in \\mathbb{R}^d$ nonzero"], "conclusions": ["$\\|u/\\|u\\| - v/\\|v\\|\\|^2 = \\frac{1}{\\|u\\|\\|v\\|}(\\|u-v\\|^2 - (\\|u\\|-\\|v\\|)^2)$"], "proof_info": ["Expand $\\|u/\\|u\\| - v/\\|v\\|\\|^2 = 2 - 2\\langle u,v\\rangle/(\\|u\\|\\|v\\|)$ and rewrite using $2\\langle u,v\\rangle = \\|u\\|^2+\\|v\\|^2-\\|u-v\\|^2$."], "step_info": [], "input": [], "output": [], "equations": []}, "AP11.2": {"name": "Two-level hashing", "type": "algorithm", "section": "4 Two-level hashing", "statement": "Two-level data structure for $(c,1)$-ANN in $\\ell_2^d$: an outer ball-carving LSH partitions points into bounded-diameter buckets, and within each bucket a Gaussian LSH centered at the smallest enclosing ball is applied to spherical-shell layers indexed by $l$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [{"id": "ASP11.2.1", "name": "Outer hashing into buckets", "subclass": "initialize", "statement_clean": "", "statement": "Sample $h \\sim \\mathcal{H}_1^{\\otimes k}$ from the ball-carving family (Theorem~\\ref{ball_carving}); set $B_i \\gets \\{p \\in P : h(p)=i\\}$ for each bucket $i$.", "step_order": 1}, {"id": "ASP11.2.2", "name": "Diameter-pruning inside each bucket", "subclass": "loop", "statement_clean": "", "statement": "For each bucket $B_i$, while there exist $p_1,p_2 \\in B_i$ with $\\|p_1-p_2\\| > \\tau c$, remove both. After pruning, $\\mathrm{diam}(B_i) \\le \\tau c$.", "step_order": 2}, {"id": "ASP11.2.3", "name": "Compute bucket center and nearest representative", "subclass": "update", "statement_clean": "", "statement": "If $B_i \\ne \\emptyset$, let $u_i$ be the center of the smallest enclosing ball of $B_i$ and let $s_i \\in B_i$ be the nearest neighbor of $u_i$.", "step_order": 3}, {"id": "ASP11.2.4", "name": "Inner Gaussian hashing per shell", "subclass": "loop", "statement_clean": "", "statement": "For $l = 0,\\ldots,T$: form the shell $\\widetilde{P}_{il} \\gets \\{p-u_i : p \\in B_i,\\, c/2+l-1 \\le \\|p-u_i\\| \\le c/2+l+1\\}$; sample $\\widetilde{h}_{il} \\sim \\mathcal{H}_2^{\\otimes \\widetilde{k}_l}$ for $\\eta = 1/2 + l/c$; set $\\widetilde{B}_{ilj} \\gets \\{p \\in \\widetilde{P}_{il} : \\widetilde{h}_{il}(p) = j\\}$.", "step_order": 4}, {"id": "ASP11.2.5", "name": "Query: locate outer bucket", "subclass": "branch", "statement_clean": "", "statement": "On query $q$, set $i \\gets h(q)$; if $B_i = \\emptyset$ return $\\perp$.", "step_order": 5}, {"id": "ASP11.2.6", "name": "Quick check via $s_i$", "subclass": "branch", "statement_clean": "", "statement": "If $\\|q - s_i\\| \\le c$, return $s_i$.", "step_order": 6}, {"id": "ASP11.2.7", "name": "Inner-shell scan", "subclass": "loop", "statement_clean": "", "statement": "For $l = 0,\\ldots,T$ with $c/2+l-1 \\le \\|q-u_i\\| \\le c/2+l+1$: compute $j \\gets \\widetilde{h}_{il}(q-u_i)$ and check each $p \\in \\widetilde{B}_{ilj}$; if $\\|q-(p+u_i)\\| \\le c$, return $p+u_i$.", "step_order": 7}, {"id": "ASP11.2.8", "name": "Failure return", "subclass": "return", "statement_clean": "", "statement": "If no candidate satisfies $\\|q-\\cdot\\| \\le c$, return $\\perp$.", "step_order": 8}], "input": ["Point set $P \\subset \\mathbb{R}^d$", "Parameters $\\tau$ (diameter scale), $T$ (number of shells), $k$ (outer hash length), $\\widetilde{k}_l$ (inner hash lengths)"], "output": ["Build: outer hash $h$, buckets $B_i$ with center $u_i$ and nearest neighbor $s_i$, shell datasets $\\widetilde{P}_{il}$, inner hashes $\\widetilde{h}_{il}$, inner buckets $\\widetilde{B}_{ilj}$", "Query: an approximate near neighbor $p \\in P$ with $\\|q-p\\| \\le c$, or $\\perp$"], "equations": [{"id": "EP11.1", "statement": "$T = \\left\\lceil \\frac{\\tau c}{\\sqrt{2}} - \\frac{c}{2} \\right\\rceil + 1$.", "section": "4 Two-level hashing", "context": "", "parent_step": ""}, {"id": "EP11.2", "statement": "Smallest positive integer $k$ with $(U(\\tau c-1)/L)^k \\le 1/(2n)$.", "section": "4 Two-level hashing", "context": "", "parent_step": ""}, {"id": "EP11.3", "statement": "$\\widetilde{k}_l$ is the smallest positive integer with $U(c)^k \\cdot \\Pr_{\\widetilde{h}\\sim\\mathcal{H}_2^{\\otimes \\widetilde{k}_l}}[\\widetilde{h}(u)=\\widetilde{h}(v)] \\le 1/(3n)$ for all $u,v$ in the shell with $\\|u-v\\| \\ge c$.", "section": "4 Two-level hashing", "context": "", "parent_step": ""}]}, "LP11.7": {"name": "Bucket decomposes into shells", "type": "lemma", "section": "4 Two-level hashing", "statement": "After preprocessing, $B_i = \\bigcup_{0 \\le l \\le T} \\widetilde{P}_{il}$ for every $1 \\le i \\le m$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Algorithm~\\ref{two_level_hashing_alg} preprocessing has run", "Choice of $T$ as in (\\ref{choice_t})"], "conclusions": ["$B_i = \\bigcup_{0\\le l\\le T}\\widetilde{P}_{il}$"], "proof_info": ["After lines 5--7 the diameter of $B_i$ is $\\le \\tau c$. By Jung's theorem (Theorem~\\ref{jung}) the smallest enclosing ball has radius $\\le \\tau c/\\sqrt{2}$, so for every $l > T$ the shell $\\widetilde{P}_{il}$ is empty."], "step_info": [], "input": [], "output": [], "equations": []}, "LP11.8": {"name": "Disjunction probability bound", "type": "lemma", "section": "4 Two-level hashing", "statement": "If $\\mathcal{U}$ and $\\mathcal{V}$ are events with $\\Pr[\\mathcal{V}] < 1$, then $\\Pr[\\mathcal{U} \\vee \\mathcal{V}] \\ge \\Pr[\\mathcal{U} \\mid \\neg\\mathcal{V}]$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["$\\mathcal{U},\\mathcal{V}$ events", "$\\Pr[\\mathcal{V}] < 1$"], "conclusions": ["$\\Pr[\\mathcal{U} \\vee \\mathcal{V}] \\ge \\Pr[\\mathcal{U} \\mid \\neg\\mathcal{V}]$"], "proof_info": ["Decompose $\\Pr[\\mathcal{U}\\vee\\mathcal{V}] = \\Pr[\\mathcal{V}] + \\Pr[\\mathcal{U}\\mid\\neg\\mathcal{V}]\\Pr[\\neg\\mathcal{V}]$ and bound $\\Pr[\\mathcal{V}] \\ge \\Pr[\\mathcal{U}\\mid\\neg\\mathcal{V}]\\Pr[\\mathcal{V}]$."], "step_info": [], "input": [], "output": [], "equations": []}, "LP11.9": {"name": "Upper bound on collision (far point)", "type": "lemma", "section": "4 Two-level hashing", "statement": "If $\\|p-q\\| \\ge c$, then $\\Pr[\\mathcal{C}] \\le 1/n$, where $\\mathcal{C}$ is the event ``$p$ is iterated through in line 30 of Algorithm~\\ref{two_level_hashing_alg}''.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["Algorithm~\\ref{two_level_hashing_alg} with parameters $\\tau,T,k,\\widetilde{k}_l$ chosen by (\\ref{choice_t})--(\\ref{choice_kl})", "$p \\in P$, $q \\in \\mathbb{R}^d$", "$\\|p-q\\| \\ge c$"], "conclusions": ["$\\Pr[\\mathcal{C}] \\le 1/n$"], "proof_info": ["Since $\\mathcal{C}$ implies $\\mathcal{A}$, $\\Pr[\\mathcal{C}] = \\Pr[\\mathcal{A}]\\Pr[\\mathcal{C}\\mid\\mathcal{A}]$. Bound $\\Pr[\\mathcal{A}] \\le U(c)^k$ via Theorem~\\ref{ball_carving}; expand $\\Pr[\\mathcal{C}\\mid\\mathcal{A}]$ as a sum over at most $|W_q| \\le 3$ shell indices; apply (\\ref{choice_kl}) to conclude $\\Pr[\\mathcal{C}] \\le 1/n$."], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP11.3", "statement": "$\\widetilde{k}_l$ is the smallest positive integer with $U(c)^k \\cdot \\Pr_{\\widetilde{h}\\sim\\mathcal{H}_2^{\\otimes \\widetilde{k}_l}}[\\widetilde{h}(u)=\\widetilde{h}(v)] \\le 1/(3n)$ for all $u,v$ in the shell with $\\|u-v\\| \\ge c$.", "section": "4 Two-level hashing", "context": "", "parent_step": ""}]}, "LP11.10": {"name": "Lower bound on collision (near point)", "type": "lemma", "section": "4 Two-level hashing", "statement": "If $\\|p-q\\| \\le 1$, then $\\Pr[\\mathcal{C}\\vee\\mathcal{D}] \\ge n^{-(1-\\frac{1}{2\\tau^2}+\\frac{1}{2\\tau^4})\\frac{1}{c^2} + O_\\tau( var _lastDetailNode = null;
function showDetail(nodeId) {
  var panel = document.getElementById("detail-panel");
  // Toggle: click same node again to close
  if (_lastDetailNode === nodeId && panel.className === "open") {
    panel.className = "";
    panel.innerHTML = "";
    _lastDetailNode = null;
    return;
  }
  _lastDetailNode = nodeId;
  // Special case: orphan/misc node
  if (nodeId === '__orphan__') {
    var h = '<h3 style="margin:0 0 8px;font-size:16px;">Misc: Unconnected Equations</h3>';
    h += '<div style="font-size:12px;color:#888;margin-bottom:10px;">Equations not linked to any theorem or proof step</div>';
    ORPHANS.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    if (ORPHANS.length === 0) h += '<div style="color:#888;">No orphan equations.</div>';
    panel.innerHTML = h;
    panel.className = "open";
    typesetMath(panel);
    return;
  }
  var d = DETAILS[nodeId];
  if (!d) return;
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(nodeId) + ': ' + esc(d.name || d.type) + '</h3>';
  h += '<div style="font-size:12px;color:#888;margin-bottom:4px;">' + d.type + (d.section ? ' (Sec ' + d.section + ')' : '') + '</div>';
  // Origin badge — paper (default, shown only if external) or external (cited prior result)
  if (d.origin === "external") {
    var citeStr = d.origin_citation ? (' &mdash; ' + esc(d.origin_citation)) : '';
    h += '<div style="display:inline-block;padding:2px 8px;background:#FFF3E0;border:1px dashed #E65100;border-radius:3px;font-size:11px;color:#BF360C;margin-bottom:8px;">External (cited prior result)' + citeStr + '</div>';
  }
  // Foundation graph link badge (Case 1: known result)
  if (d.foundation_links && d.foundation_links.length > 0) {
    h += '<div style="display:inline-block;padding:2px 8px;background:#E3F2FD;border:1px solid #2471A3;border-radius:3px;font-size:11px;color:#2471A3;margin-bottom:8px;">&#128218; Known result: ' + d.foundation_links.map(esc).join(', ') + '</div>';
  }
  // Plain-text restatement (statement_clean) — shown above the formal statement
  if (d.statement_clean) {
    h += '<div class="detail-section"><h4>Plain-Text Summary</h4><div style="font-size:13px;color:#444;font-style:italic;">' + esc(d.statement_clean) + '</div></div>';
  }
  // Pre-build equation maps by context
  var eqsByCtx = {statement:[], assumption:[], conclusion:[], orphan:[]};
  var eqsByStep = {};
  if (d.equations) {
    d.equations.forEach(function(e) {
      if (e.parent_step) {
        if (!eqsByStep[e.parent_step]) eqsByStep[e.parent_step] = [];
        eqsByStep[e.parent_step].push(e);
      } else if (e.context && eqsByCtx[e.context]) {
        eqsByCtx[e.context].push(e);
      } else {
        eqsByCtx.orphan.push(e);
      }
    });
  }
  var eqTag = function(e) { return '<span style="color:#2471A3;font-size:11px;"> (' + e.id + ')</span>'; };
  var eqBlock = function(e) { return '<div style="margin:2px 0 2px 12px;padding:3px 8px;background:#EBF5FB;border-left:2px solid #5DADE2;font-size:12px;">' + esc(e.id) + ': ' + esc(e.statement) + '</div>'; };

  // Statement + inline statement equations
  if (d.statement) {
    h += '<div class="detail-section"><h4>Statement</h4><div style="font-size:14px;">' + esc(d.statement) + '</div>';
    eqsByCtx.statement.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Assumptions + inline assumption equations
  if ((d.assumptions && d.assumptions.length > 0) || eqsByCtx.assumption.length > 0) {
    h += '<div class="detail-section"><h4>Assumptions</h4>';
    if (d.assumptions) d.assumptions.forEach(function(a) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(a) + '</div>'; });
    eqsByCtx.assumption.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Conclusions + inline conclusion equations
  if ((d.conclusions && d.conclusions.length > 0) || eqsByCtx.conclusion.length > 0) {
    h += '<div class="detail-section"><h4>Conclusions</h4>';
    if (d.conclusions) d.conclusions.forEach(function(c) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(c) + '</div>'; });
    eqsByCtx.conclusion.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Proof strategy
  if (d.proof_info && d.proof_info.length > 0) {
    h += '<div class="detail-section"><h4>Proof Strategy</h4>';
    d.proof_info.forEach(function(p) {
      if (Array.isArray(p)) {
        p.forEach(function(item) { h += '<div style="font-size:13px;font-style:italic;">&bull; ' + esc(item) + '</div>'; });
      } else {
        h += '<div style="font-size:13px;font-style:italic;">' + esc(p) + '</div>';
      }
    });
    h += '</div>';
  }
  // v2: Step decomposition (proof_step children of a proof, or algorithm_step children of an algorithm)
  if (d.step_info && d.step_info.length > 0) {
    h += '<div class="detail-section"><h4>Decomposition (' + d.step_info.length + ' steps)</h4>';
    d.step_info.forEach(function(s, i) {
      var ord = (s.step_order || (i + 1));
      var label = s.name ? esc(s.name) : esc(s.id || ('Step ' + ord));
      h += '<div class="step-item"><strong>' + ord + '. ' + label + '</strong>';
      if (s.subclass) {
        h += ' <span style="font-size:11px;font-style:italic;color:#666;">[' + esc(s.subclass) + ']</span>';
      }
      var body = s.statement_clean || s.statement || '';
      if (body) {
        h += '<div style="font-size:12px;color:#444;margin-top:2px;">' + esc(body) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  // Algorithm input/output
  if (d.input && d.input.length > 0) {
    h += '<div class="detail-section"><h4>Input</h4>';
    d.input.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // (Legacy "Proof Steps" panel removed: same data now rendered above as
  // "Decomposition" via d.step_info. Both used to read from step_chains and
  // produced duplicate sections on click.)
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  typesetMath(panel);
}
function resetView() {
  document.getElementById("detail-panel").className = "";

// Foundation toggle (ghost nodes — both mathlib/proofwiki ("ghost_") and
// book entries ("ghostbook_") are picked up by the [id^="ghost"] selector).
function toggleGhosts() {
  var btn = document.getElementById("ghost-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  btn.dataset.showing = isShowing ? "0" : "1";
  _applyGhostVisibility();
}

// Apply current foundation visibility, respecting whether ghost edges' target
// nodes are currently hidden (aux/external toggles). A foundation arrow is
// only shown when (a) Foundation toggle is ON and (b) its target node is
// currently visible — otherwise it would float into empty space.
function _applyGhostVisibility() {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  var btn = document.getElementById("ghost-btn");
  var on = btn && btn.dataset.showing === "1";
  var auxBtn = document.getElementById("aux-btn");
  var extBtn = document.getElementById("ext-btn");
  var auxOn = auxBtn && auxBtn.dataset.showing === "1";
  var extOn = extBtn && extBtn.dataset.showing === "1";
  // Show/hide ghost boxes, headers, text, refs uniformly.
  var ghostEls = svgEl.querySelectorAll('[id^="ghost"]');
  ghostEls.forEach(function(el) {
    var gid = el.id;
    if (!on) {
      el.style.display = "none";
      return;
    }
    // Edge gid pattern: "<prefix>_edge_<gi>_<ti>". For these, check target.
    if (GHOST_EDGE_TO_TARGET.hasOwnProperty(gid)) {
      var target = GHOST_EDGE_TO_TARGET[gid];
      var targetHidden = (AUX_NODE_SET[target] && !auxOn) || (EXT_NODE_SET[target] && !extOn);
      el.style.display = targetHidden ? "none" : "";
    } else {
      el.style.display = "";
    }
  });
}

// Generic helper: hide/show a set of nodes (by id) and their incident edges.
function _setNodeVisibility(nodeIds, edgeGids, visible, extraClass) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  nodeIds.forEach(function(nid) {
    // Body rect
    var body = svgEl.querySelector('[id="node_' + nid + '"]');
    if (body) {
      body.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) body.classList.add(extraClass);
        else body.classList.remove(extraClass);
      }
    }
    // All sibling per-node elements (header rect, text labels, divider lines)
    var sibs = svgEl.querySelectorAll('[id^="node_' + nid + '__"]');
    sibs.forEach(function(el) {
      el.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) el.classList.add(extraClass);
        else el.classList.remove(extraClass);
      }
    });
  });
  edgeGids.forEach(function(gid) {
    var e = svgEl.querySelector('[id="' + gid + '"]');
    if (e) e.style.display = visible ? "" : "none";
  });
}

// Examples & Remarks toggle — hides nodes with type in {example, remark}
function toggleAux() {
  var btn = document.getElementById("aux-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  // Apply visual differentiation: lighter shade (opacity) when shown
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, nextShowing, "node-aux-shown");
  // Apply opacity styling on the body rect when shown
  AUX_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) body.style.opacity = nextShowing ? "0.75" : "";
  });
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
}

// Cited Results (External) toggle — hides nodes with origin === "external"
function toggleExternal() {
  var btn = document.getElementById("ext-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, nextShowing, "node-external-shown");
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
  // Apply dashed border on body rect when shown (visual differentiation)
  EXT_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) {
      // FancyBboxPatch is a <path>; modify its stroke-dasharray for a dashed look.
      var pathEl = body.tagName === "path" ? body : body.querySelector("path");
      if (pathEl) {
        if (nextShowing) {
          pathEl.setAttribute("stroke-dasharray", "6,3");
          pathEl.setAttribute("stroke-width", "2");
        } else {
          pathEl.removeAttribute("stroke-dasharray");
          pathEl.removeAttribute("stroke-width");
        }
      }
    }
  });
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements + aux + external elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all foundation ghost elements (mathlib/proofwiki AND book-derived).
    // The [id^="ghost"] selector covers both "ghost_*" and "ghostbook_*".
    var all = svgEl.querySelectorAll('[id^="ghost"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
  // Examples & Remarks: hidden by default (toggle starts in OFF state).
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, false, null);
  // Cited Results (External): hidden by default.
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, false, null);
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() {
  if (svgEl) {
    var container = document.getElementById("svg-container");
    var svgW = svgEl.getBoundingClientRect().width / currentZoom;
    var svgH = svgEl.getBoundingClientRect().height / currentZoom;
    var cW = container.clientWidth - 20;
    var cH = container.clientHeight - 20;
    currentZoom = Math.min(cW / svgW, cH / svgH, 1.0);
    applyZoom();
  }
}
// Auto-fit on load
zoomFit();

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
