<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #fafafa; }
#header { background: #2c3e50; color: white; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; }
#header h1 { margin: 0; font-size: 18px; }
#header .hint { font-size: 12px; color: #aaa; font-style: italic; margin-left: 12px; }
#controls button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; background: #34495e; color: white; margin-left: 8px; }
#controls button:hover { background: #4a6785; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 24px; background: #f5f5f5; border-bottom: 1px solid #eee; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #777; }
#main { display: flex; height: calc(100vh - 82px); }
#svg-container { flex: 1; overflow: auto; padding: 10px; cursor: grab; }
#svg-container svg { transform-origin: 0 0; }
#detail-panel { width: 0; overflow-y: auto; background: white; border-left: 1px solid #ddd; transition: width 0.3s; }
#detail-panel.open { width: 380px; padding: 16px; }
.detail-section { margin-bottom: 12px; }
.detail-section h4 { margin: 0 0 6px; color: #444; font-size: 13px; text-transform: uppercase; }
.step-item { background: #f0f0f0; border-left: 3px solid #839192; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.step-arrow { text-align: center; color: #aaa; font-size: 14px; }
.eq-item { background: #d4e6f1; border-left: 3px solid #5dade2; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.orphan-item { background: #fef9e7; border-left: 3px solid #f39c12; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; }
#orphan-panel { position: fixed; bottom: 16px; right: 16px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-width: 350px; max-height: 400px; overflow-y: auto; display: none; padding: 12px; z-index: 100; }
#orphan-toggle { display: none; }
/* Hover effect on clickable node rects */
[id^="node_"]:hover { filter: brightness(0.90); }
.ghost-node { display: inline-block; margin: 4px 8px; padding: 8px 14px; background: #E0E0E0; border: 1.5px solid #757575; border-radius: 5px; font-size: 13px; color: #333; cursor: pointer; vertical-align: top; white-space: normal; max-width: 220px; }
.ghost-node:hover { background: #BDBDBD; }
.ghost-node .ghost-label { font-weight: bold; font-size: 13px; }
.ghost-node .ghost-refs { font-size: 11px; color: #666; margin-top: 3px; }
/* Toggle controls panel (Foundation, Examples & Remarks, Cited Results) */
.toggle-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: 12px; padding: 4px 8px; background: #ECEFF1; border: 1px solid #CFD8DC; border-radius: 6px; }
.toggle-panel .toggle-label { font-size: 11px; color: #555; font-weight: bold; text-transform: uppercase; margin-right: 4px; }
.toggle-btn { padding: 4px 12px; border: 1.5px solid #757575; border-radius: 4px; background: #E0E0E0; cursor: pointer; font-size: 12px; color: #333; }
.toggle-btn:hover { background: #BDBDBD; }
.toggle-btn[data-showing="1"] { background: #2E7D32; color: white; border-color: #1B5E20; }
.toggle-btn[disabled] { opacity: 0.4; cursor: not-allowed; background: #EEE; }
/* Hidden state — applied dynamically via JS */
.svg-hidden { display: none !important; }
/* Visual differentiation when shown */
.node-external-shown [stroke-dasharray] { }  /* no-op, see runtime tweak */
.node-aux-shown { opacity: 0.75; }
/* v2: `resolves` edges (theorem-like resolves an open_problem/conjecture) — dashed */
.edge-resolves path { stroke-dasharray: 5,3 !important; }
.edge-resolves { stroke-dasharray: 5,3 !important; }
</style>

<script>
var DETAILS = {"ProbP2.1": {"name": "Linear code decoding problem", "type": "problem", "section": "1.1 Decoding of linear codes", "statement": "Recover input vector $f \\in \\R^n$ from corrupted measurements $y = Af + e$, where $A$ is an $m \\times n$ coding matrix and $e$ is an arbitrary unknown vector of errors with $\\|e\\|_{\\ell_0} \\leq \\rho \\cdot m$.", "statement_clean": "Recover f from corrupted linear measurements y = Af + e where e is sparse.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP2.1", "statement": "$\\|e\\|_{\\ell_0} := |\\{i : e_i \\neq 0\\}| \\le \\rho \\cdot m$.", "section": "1.1", "context": "", "parent_step": ""}, {"id": "EP2.2", "statement": "If $FA = 0$, then $\\tilde y = F(Af + e) = Fe$, reducing decoding to recovering sparse $e$ from $Fe$.", "section": "1.1", "context": "", "parent_step": ""}]}, "ProbP2.2": {"name": "$\\ell_0$-minimization $(P_0)$", "type": "problem", "section": "1.2 Sparse solutions to underdetermined systems", "statement": "$(P_0): \\min_{d \\in \\R^m} \\|d\\|_{\\ell_0}$ subject to $Fd = \\tilde y$. Finding the sparsest solution to $Fd = \\tilde y$.", "statement_clean": "Combinatorial sparsest-solution problem; NP-hard.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP2.2", "statement": "If $FA = 0$, then $\\tilde y = F(Af + e) = Fe$, reducing decoding to recovering sparse $e$ from $Fe$.", "section": "1.1", "context": "", "parent_step": ""}]}, "ProbP2.3": {"name": "Basis Pursuit $(P_1)$", "type": "problem", "section": "1.2", "statement": "$(P_1): \\min_{d \\in \\R^m} \\|d\\|_{\\ell_1}$ subject to $Fd = \\tilde y$. Convex $\\ell_1$ relaxation of $(P_0)$, recastable as a linear program.", "statement_clean": "Convex l1-minimization problem; the LP relaxation of P0.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP2.2", "statement": "If $FA = 0$, then $\\tilde y = F(Af + e) = Fe$, reducing decoding to recovering sparse $e$ from $Fe$.", "section": "1.1", "context": "", "parent_step": ""}]}, "ProbP2.4": {"name": "Direct decoding LP $(P'_1)$", "type": "problem", "section": "1.3 Innovations", "statement": "$(P'_1): \\min_{g \\in \\R^n} \\|y - Ag\\|_{\\ell_1}$. Equivalent to $(P_1)$; recovers $f$ directly without forming the annihilator $F$.", "statement_clean": "Direct l1-minimization on the residual y-Ag, equivalent to basis pursuit.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP2.3", "statement": "$\\min 1^T t$ subject to $-t \\le y - Ag \\le t$, with variables $t \\in \\R^m$ and $g \\in \\R^n$.", "section": "1.3", "context": "", "parent_step": ""}]}, "DP2.1": {"name": "Restricted isometry constants", "type": "definition", "section": "1.4 Restricted isometries", "statement": "For integer $1 \\le S \\le |J|$, $\\delta_S$ is the smallest quantity such that $(1-\\delta_S)\\|c\\|^2 \\le \\|F_T c\\|^2 \\le (1+\\delta_S)\\|c\\|^2$ for all $T \\subset J$ with $|T| \\le S$ and all real coefficients $(c_j)_{j \\in T}$.", "statement_clean": "Smallest delta_S making F_T act like a near-isometry on all S-sparse subsets.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP2.4", "statement": "$1 - \\delta_1 \\le \\|v_j\\|_H^2 \\le 1 + \\delta_1$ for all $j \\in J$; in particular $\\delta_1 = 0$ iff all $v_j$ have unit length.", "section": "1.4", "context": "", "parent_step": ""}]}, "DP2.2": {"name": "Restricted orthogonality constants", "type": "definition", "section": "1.4", "statement": "For $S+S' \\le |J|$, $\\theta_{S,S'}$ is the smallest quantity such that $|\\langle F_T c, F_{T'} c' \\rangle| \\le \\theta_{S,S'} \\cdot \\|c\\|\\,\\|c'\\|$ for all disjoint $T, T' \\subseteq J$ with $|T| \\le S$, $|T'| \\le S'$.", "statement_clean": "Smallest theta_{S,S'} bounding inner products between disjoint S- and S'-sparse images of F.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP2.1": {"name": "Theta-delta comparison", "type": "lemma", "section": "1.4", "statement": "$\\theta_{S,S'} \\le \\delta_{S+S'} \\le \\theta_{S,S'} + \\max(\\delta_S, \\delta_{S'})$ for all $S, S'$.", "statement_clean": "Restricted-orthogonality and restricted-isometry constants are quantitatively comparable.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": ["First $\\theta_{S,S'} \\le \\delta_{S+S'}$ via the parallelogram identity applied to disjoint unit-norm sums. Second $\\delta_{S+S'} \\le \\max(\\delta_S, \\delta_{S'}) + \\theta_S$ via a partition of $\\tilde T$ into $T \\cup T'$ and \\eqref{frame}+\\eqref{ortho}."], "step_info": [{"id": "PSP2.16", "name": "First inequality $\\theta_{S,S'} \\le \\delta_{S+S'}$ via parallelogram identity", "subclass": "apply_lemma", "statement_clean": "", "statement": "By homogeneity, suffices to bound $|\\langle \\sum_T c_j v_j, \\sum_{T'} c'_{j'} v_{j'}\\rangle| \\le \\delta_{S+S'}$ for disjoint $T, T'$ with unit-norm coefficients. Apply \\eqref{frame} to the sum and difference $\\sum_T c_j v_j \\pm \\sum_{T'} c'_{j'} v_{j'}$ (each supported on $\\le S+S'$ indices) and the parallelogram identity $\\langle f, g\\rangle = (\\|f+g\\|^2 - \\|f-g\\|^2)/4$.", "step_order": 1}, {"id": "PSP2.17", "name": "Second inequality $\\delta_{S+S'} \\le \\max(\\delta_S, \\delta_{S'}) + \\theta_S$ via partition", "subclass": "case_split", "statement_clean": "", "statement": "By homogeneity, bound $|\\langle \\sum_{\\tilde T} c_j v_j, \\sum_{\\tilde T} c_{j'} v_{j'}\\rangle - 1|$ for $|\\tilde T| \\le S + S'$ with $\\sum |c_j|^2 = 1$. Partition $\\tilde T = T \\cup T'$ ($|T| \\le S$, $|T'| \\le S'$) with $\\sum_T |c_j|^2 = \\alpha$. Apply \\eqref{frame} on $T$ and $T'$ separately and \\eqref{ortho} on the cross term to obtain $|\\cdots - 1| \\le \\delta_S \\alpha + \\delta_{S'}(1-\\alpha) + 2\\theta_S \\sqrt{\\alpha(1-\\alpha)} \\le \\max(\\delta_S, \\delta_{S'}) + \\theta_S$.", "step_order": 2}], "input": [], "output": [], "equations": []}, "LP2.2": {"name": "Unique sparse recovery from $\\delta_{2S}<1$", "type": "lemma", "section": "1.4", "statement": "Suppose $S \\ge 1$ with $\\delta_{2S} < 1$ and $T \\subset J$ with $|T| \\le S$. Let $f := F_T c$. Then $T$ and the coefficients $(c_j)_{j \\in T}$ can be uniquely reconstructed from $f$ and the $v_j$'s.", "statement_clean": "delta_{2S}<1 guarantees uniqueness of sparse representations (existence-only; brute force).", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": ["By contradiction: two distinct sparse representations would give $F_{T \\cup T'} d = 0$ with $|T \\cup T'| \\le 2S$; $\\delta_{2S} < 1$ via \\eqref{frame} forces $\\|d\\|^2 = 0$, contradicting distinctness."], "step_info": [{"id": "PSP2.1", "name": "Set up contradiction with two distinct sparse representations", "subclass": "contradiction_setup", "statement_clean": "", "statement": "Suppose for contradiction that $f$ has two distinct sparse representations $f = F_T c = F_{T'} c'$ with $|T|, |T'| \\le S$. Then $F_{T \\cup T'} d = 0$ for $d_j := c_j 1_{j \\in T} - c'_{j} 1_{j \\in T'}$.", "step_order": 1}, {"id": "PSP2.2", "name": "Apply restricted isometry to derive contradiction", "subclass": "conclude", "statement_clean": "", "statement": "Take norms of $F_{T \\cup T'} d = 0$ and apply \\eqref{frame} with $|T \\cup T'| \\le 2S$ and the hypothesis $\\delta_{2S} < 1$ to conclude $\\|d\\|^2 = 0$, contradicting distinctness of the two representations.", "step_order": 2}], "input": [], "output": [], "equations": []}, "TP2.1": {"name": "Main recovery theorem (Theorem 1.3)", "type": "theorem", "section": "1.5 Main results", "statement": "Suppose $S \\ge 1$ with $\\delta_S + \\theta_S + \\theta_{S,2S} < 1$, and $c$ is a real vector supported on $T \\subset J$ with $|T| \\le S$. Set $f := Fc$. Then $c$ is the unique minimizer of $(P_1): \\min \\|d\\|_{\\ell_1}$ subject to $Fd = f$.", "statement_clean": "Under the RIP+ROP condition, l1-minimization exactly recovers any S-sparse vector.", "origin": "paper", "origin_citation": "", "assumptions": ["$S \\ge 1$", "$\\delta_S + \\theta_S + \\theta_{S,2S} < 1$", "$c$ supported on $T$ with $|T| \\le S$"], "conclusions": ["$c$ is the unique minimizer of $(P_1)$ with $Fd = f$"], "proof_info": ["By duality: take $w$ from Lemma 2.2 satisfying (i) $\\langle w, v_j\\rangle = \\sgn(c_j)$ on $T$ and (ii) $|\\langle w, v_j\\rangle| < 1$ off $T$. Comparing $\\|d\\|_{\\ell_1}$ with $\\|c\\|_{\\ell_1}$ via $w$ forces $d_j = 0$ off $T$, then $\\delta_S < 1$ gives $d = c$."], "step_info": [{"id": "PSP2.12", "name": "Existence of minimizer and lower bound on $\\|d\\|_{\\ell_1}$", "subclass": "setup", "statement_clean": "", "statement": "Standard convex arguments give existence of a minimizer $d$ to $(P_1)$. Since $c$ is feasible, $\\|d\\|_{\\ell_1} \\le \\|c\\|_{\\ell_1} = \\sum_{j \\in T} |c_j|$.", "step_order": 1}, {"id": "PSP2.13", "name": "Take dual certificate $w$ from Lemma 2.2", "subclass": "apply_lemma", "statement_clean": "", "statement": "Apply Lemma 2.2 to obtain $w$ with (i) $\\langle w, v_j\\rangle = \\sgn(c_j)$ for $j \\in T$ and (ii) $|\\langle w, v_j\\rangle| < 1$ for $j \\notin T$ (the latter holds under $\\delta_S + \\theta_{S,S} + \\theta_{S,2S} < 1$).", "step_order": 2}, {"id": "PSP2.14", "name": "Compute lower bound on $\\|d\\|_{\\ell_1}$ via $w$", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "Decompose $\\|d\\|_{\\ell_1} = \\sum_{j \\in T} |c_j + (d_j - c_j)| + \\sum_{j \\notin T} |d_j|$, then use $\\sgn(c_j)$ on $T$ and $\\langle w, v_j\\rangle$ off $T$ to show $\\|d\\|_{\\ell_1} \\ge \\sum_{j \\in T} |c_j| + \\langle w, \\sum_j d_j v_j - \\sum_{j \\in T} c_j v_j\\rangle = \\sum_{j \\in T} |c_j|$ (using $\\sum_j d_j v_j = f = \\sum_{j \\in T} c_j v_j$).", "step_order": 3}, {"id": "PSP2.15", "name": "Force $d_j = 0$ off $T$ and conclude $d = c$", "subclass": "conclude", "statement_clean": "", "statement": "All inequalities are equalities; since $|\\langle w, v_j\\rangle| < 1$ off $T$, this forces $d_j = 0$ for $j \\notin T$. Then $\\sum_{j \\in T} (d_j - c_j) v_j = 0$, and \\eqref{frame} with $\\delta_S < 1$ gives $d_j = c_j$ on $T$. Hence $d = c$.", "step_order": 4}], "input": [], "output": [], "equations": []}, "TP2.2": {"name": "Decoding theorem (Theorem 1.4)", "type": "theorem", "section": "1.5", "statement": "Suppose $F$ satisfies $FA = 0$ and $S \\ge 1$ obeys the hypothesis of Theorem 1.3. Set $y = Af + e$ with $e$ supported on a set of size $\\le S$. Then $f$ is the unique minimizer of $(P'_1): \\min_{g \\in \\R^n} \\|y - Ag\\|_{\\ell_1}$.", "statement_clean": "Under the RIP+ROP condition, the LP decoder (P'_1) exactly recovers f despite arbitrary S-sparse corruption.", "origin": "paper", "origin_citation": "", "assumptions": ["$FA = 0$", "$\\delta_S + \\theta_S + \\theta_{S,2S} < 1$", "$|\\mathrm{supp}(e)| \\le S$"], "conclusions": ["$f$ is the unique minimizer of $(P'_1)$"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "TP2.3": {"name": "Gaussian matrices satisfy main hypothesis (Theorem 1.5)", "type": "theorem", "section": "1.6 Gaussian random matrices", "statement": "Assume $p \\le m$ and let $F$ be a $p \\times m$ matrix with i.i.d. Gaussian entries of mean zero and variance $1/p$. Then the condition of Theorem 1.3 holds with overwhelming probability provided $r = S/m < r^*(p,m)$, with explicit numerical thresholds e.g. $r \\le 3.6 \\cdot 10^{-4}$ at $p/m = 3/4$.", "statement_clean": "Gaussian random F obeys the RIP+ROP main condition w.h.p. for r below explicit numerical thresholds.", "origin": "paper", "origin_citation": "", "assumptions": ["$F$ is $p \\times m$, i.i.d. $\\mathcal{N}(0, 1/p)$", "$r = S/m < r^*(p,m)$"], "conclusions": ["$\\delta_S + \\theta_S + \\theta_{S,2S} < 1$ with overwhelming probability"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP2.6", "statement": "$\\delta_S + \\delta_{2S} + \\delta_{3S} < \\rho_{p/m}(r)$ where $\\rho_{p/m}(r) = \\sum_{j=1}^{3} -1 + [1 + f(jr)]^2$, with very high probability.", "section": "3", "context": "", "parent_step": ""}], "foundation_links": ["Independent and Identically Distributed"]}, "CP2.1": {"name": "Gaussian decoding corollary", "type": "corollary", "section": "1.6", "statement": "Suppose $A$ is an $n \\times m$ Gaussian matrix and set $p = m - n$. Under the hypotheses of Theorem 1.5, the solution to $(P'_1)$ is unique and equal to $f$.", "statement_clean": "For Gaussian coding matrices A, LP decoding (P'_1) recovers f exactly.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP2.3": {"name": "Dual sparse reconstruction property, $\\ell_2$ version (Lemma 2.1)", "type": "lemma", "section": "2.1 Exact reconstruction property", "statement": "Let $S, S' \\ge 1$ with $\\delta_S < 1$ and $c$ supported on $T \\subset J$ with $|T| \\le S$. Then $\\exists w \\in H$ with $\\langle w, v_j \\rangle_H = c_j$ for $j \\in T$, an exceptional set $E$ disjoint from $T$ with $|E| \\le S'$, and $|\\langle w, v_j \\rangle| \\le \\frac{\\theta_{S,S'}}{(1-\\delta_S)\\sqrt{S'}}\\|c\\|$ for $j \\notin T \\cup E$.", "statement_clean": "Constructs a dual certificate w with l2 control of inner products outside T (with a small exceptional set).", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": ["Construct $w := F_T (F_T^* F_T)^{-1} c_T$ via invertibility of $F_T^* F_T$ from $\\delta_S < 1$; bound $\\|F_{T'}^* w\\|_{\\ell_2}$ via duality; define exceptional set $E$ where the bound is exceeded."], "step_info": [{"id": "PSP2.3", "name": "Set up adjoint and bound spectrum of $F_T^* F_T$", "subclass": "setup", "statement_clean": "", "statement": "Define $F_T : \\ell_2(T) \\to H$, $F_T c_T := \\sum_{j \\in T} c_j v_j$ and adjoint $F_T^* w := (\\langle w, v_j\\rangle)_{j \\in T}$. By \\eqref{frame}, $1 - \\delta_S \\le \\lambda_{\\min}(F_T^* F_T) \\le \\lambda_{\\max}(F_T^* F_T) \\le 1 + \\delta_S$, so $F_T^* F_T$ is invertible with $\\|(F_T^* F_T)^{-1}\\| \\le 1/(1-\\delta_S)$.", "step_order": 1}, {"id": "PSP2.4", "name": "Define dual certificate $w$", "subclass": "introduce_variable", "statement_clean": "", "statement": "Set $w := F_T (F_T^* F_T)^{-1} c_T$. Then $F_T^* w = c_T$, i.e. $\\langle w, v_j \\rangle_H = c_j$ for all $j \\in T$, and $\\|w\\| \\le K \\|c_T\\|$ with $K = \\sqrt{1+\\delta_S}/(1-\\delta_S)$.", "step_order": 2}, {"id": "PSP2.5", "name": "Bound $\\|F_{T'}^* w\\|_{\\ell_2}$ on disjoint sets via duality", "subclass": "bound_estimate", "statement_clean": "", "statement": "For any $T' \\subseteq J \\setminus T$ with $|T'| \\le S'$ and any $d_{T'}$, expand $\\langle F_{T'}^* w, d_{T'} \\rangle$ and apply \\eqref{ortho} with restricted-orthogonality constant $\\theta_{S,S'}$ together with $\\|(F_T^* F_T)^{-1}\\| \\le 1/(1-\\delta_S)$ to obtain $\\|F_{T'}^* w\\|_{\\ell_2(T')} \\le \\frac{\\theta_{S,S'}}{1-\\delta_S}\\|c_T\\|$.", "step_order": 3}, {"id": "PSP2.6", "name": "Define exceptional set $E$ and conclude", "subclass": "conclude", "statement_clean": "", "statement": "Let $E := \\{j \\in J \\setminus T : |\\langle w, v_j\\rangle| > \\frac{\\theta_{S,S'}}{(1-\\delta_S)\\sqrt{S'}}\\|c_T\\|\\}$. The $\\ell_2$ bound forces $|E| \\le S'$ (else a subset $T' \\subseteq E$ of size $S'$ contradicts the bound). The lemma's claims follow.", "step_order": 4}], "input": [], "output": [], "equations": []}, "LP2.4": {"name": "Dual sparse reconstruction property, $\\ell_\\infty$ version (Lemma 2.2)", "type": "lemma", "section": "2.1", "statement": "Let $S \\ge 1$ with $\\delta_S + \\theta_{S,2S} < 1$ and $c$ supported on $T \\subset J$ with $|T| \\le S$. Then $\\exists w \\in H$ with $\\langle w, v_j\\rangle_H = c_j$ for $j \\in T$, and $|\\langle w, v_j \\rangle| \\le \\frac{\\theta_S}{(1 - \\delta_S - \\theta_{S,2S})\\sqrt{S}}\\|c\\|$ for $j \\notin T$.", "statement_clean": "Constructs a dual certificate w with l-infinity control of inner products outside T (no exceptional set).", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": ["Iterate Lemma 2.1: build $w_n$ correcting the previous step's exceptional set $T_{n-1}$, then set $w := \\sum_{n=1}^{\\infty} (-1)^{n-1} w_n$; absolute convergence and term-cancellation on $T_n$ give the $\\ell_\\infty$ bound via geometric series."], "step_info": [{"id": "PSP2.7", "name": "Base step: apply Lemma 2.1 to obtain $w_1, T_1$", "subclass": "apply_lemma", "statement_clean": "", "statement": "Normalize $\\sum_{j \\in T} |c_j|^2 = \\sqrt{S}$ and set $T_0 := T$. Apply Lemma 2.1 to obtain $w_1 \\in H$ and exceptional set $T_1$ disjoint from $T_0$ with $|T_1| \\le S$, $\\langle w_1, v_j\\rangle = c_j$ for $j \\in T_0$, $\\ell_2$-control of $w_1$ on $T_1$, and $\\ell_\\infty$ bound off $T_0 \\cup T_1$.", "step_order": 1}, {"id": "PSP2.8", "name": "Iterative step: build $w_{n+1}$ to cancel $w_n$ on $T_n$", "subclass": "induction_step", "statement_clean": "", "statement": "For each $n \\ge 1$ apply Lemma 2.1 again to construct $w_{n+1} \\in H$ and $T_{n+1}$ with $T_n \\cap (T_0 \\cup T_{n+1}) = \\emptyset$, $\\langle w_{n+1}, v_j\\rangle = \\langle w_n, v_j\\rangle$ for $j \\in T_n$, $\\langle w_{n+1}, v_j\\rangle = 0$ for $j \\in T_0$, and decaying $\\ell_\\infty$ and $\\ell_2$ bounds with factor $(\\theta_{S,2S}   }
  // Proof strategy
  if (d.proof_info && d.proof_info.length > 0) {
    h += '<div class="detail-section"><h4>Proof Strategy</h4>';
    d.proof_info.forEach(function(p) {
      if (Array.isArray(p)) {
        p.forEach(function(item) { h += '<div style="font-size:13px;font-style:italic;">&bull; ' + esc(item) + '</div>'; });
      } else {
        h += '<div style="font-size:13px;font-style:italic;">' + esc(p) + '</div>';
      }
    });
    h += '</div>';
  }
  // v2: Step decomposition (proof_step children of a proof, or algorithm_step children of an algorithm)
  if (d.step_info && d.step_info.length > 0) {
    h += '<div class="detail-section"><h4>Decomposition (' + d.step_info.length + ' steps)</h4>';
    d.step_info.forEach(function(s, i) {
      var ord = (s.step_order || (i + 1));
      var label = s.name ? esc(s.name) : esc(s.id || ('Step ' + ord));
      h += '<div class="step-item"><strong>' + ord + '. ' + label + '</strong>';
      if (s.subclass) {
        h += ' <span style="font-size:11px;font-style:italic;color:#666;">[' + esc(s.subclass) + ']</span>';
      }
      var body = s.statement_clean || s.statement || '';
      if (body) {
        h += '<div style="font-size:12px;color:#444;margin-top:2px;">' + esc(body) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  // Algorithm input/output
  if (d.input && d.input.length > 0) {
    h += '<div class="detail-section"><h4>Input</h4>';
    d.input.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // (Legacy "Proof Steps" panel removed: same data now rendered above as
  // "Decomposition" via d.step_info. Both used to read from step_chains and
  // produced duplicate sections on click.)
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  typesetMath(panel);
}
function resetView() {
  document.getElementById("detail-panel").className = "";
  document.getElementById("detail-panel").innerHTML = "";
}
function toggleOrphans() {
  var p = document.getElementById("orphan-panel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  var h = "";
  ORPHANS.forEach(function(e) { h += '<div class="orphan-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>'; });
  document.getElementById("orphan-list").innerHTML = h;
  p.style.display = "block";
  typesetMath(p);
}
// Foundation toggle (ghost nodes — both mathlib/proofwiki ("ghost_") and
// book entries ("ghostbook_") are picked up by the [id^="ghost"] selector).
function toggleGhosts() {
  var btn = document.getElementById("ghost-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  btn.dataset.showing = isShowing ? "0" : "1";
  _applyGhostVisibility();
}

// Apply current foundation visibility, respecting whether ghost edges' target
// nodes are currently hidden (aux/external toggles). A foundation arrow is
// only shown when (a) Foundation toggle is ON and (b) its target node is
// currently visible — otherwise it would float into empty space.
function _applyGhostVisibility() {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  var btn = document.getElementById("ghost-btn");
  var on = btn && btn.dataset.showing === "1";
  var auxBtn = document.getElementById("aux-btn");
  var extBtn = document.getElementById("ext-btn");
  var auxOn = auxBtn && auxBtn.dataset.showing === "1";
  var extOn = extBtn && extBtn.dataset.showing === "1";
  // Show/hide ghost boxes, headers, text, refs uniformly.
  var ghostEls = svgEl.querySelectorAll('[id^="ghost"]');
  ghostEls.forEach(function(el) {
    var gid = el.id;
    if (!on) {
      el.style.display = "none";
      return;
    }
    // Edge gid pattern: "<prefix>_edge_<gi>_<ti>". For these, check target.
    if (GHOST_EDGE_TO_TARGET.hasOwnProperty(gid)) {
      var target = GHOST_EDGE_TO_TARGET[gid];
      var targetHidden = (AUX_NODE_SET[target] && !auxOn) || (EXT_NODE_SET[target] && !extOn);
      el.style.display = targetHidden ? "none" : "";
    } else {
      el.style.display = "";
    }
  });
}

// Generic helper: hide/show a set of nodes (by id) and their incident edges.
function _setNodeVisibility(nodeIds, edgeGids, visible, extraClass) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  nodeIds.forEach(function(nid) {
    // Body rect
    var body = svgEl.querySelector('[id="node_' + nid + '"]');
    if (body) {
      body.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) body.classList.add(extraClass);
        else body.classList.remove(extraClass);
      }
    }
    // All sibling per-node elements (header rect, text labels, divider lines)
    var sibs = svgEl.querySelectorAll('[id^="node_' + nid + '__"]');
    sibs.forEach(function(el) {
      el.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) el.classList.add(extraClass);
        else el.classList.remove(extraClass);
      }
    });
  });
  edgeGids.forEach(function(gid) {
    var e = svgEl.querySelector('[id="' + gid + '"]');
    if (e) e.style.display = visible ? "" : "none";
  });
}

// Examples & Remarks toggle — hides nodes with type in {example, remark}
function toggleAux() {
  var btn = document.getElementById("aux-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  // Apply visual differentiation: lighter shade (opacity) when shown
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, nextShowing, "node-aux-shown");
  // Apply opacity styling on the body rect when shown
  AUX_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) body.style.opacity = nextShowing ? "0.75" : "";
  });
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
}

// Cited Results (External) toggle — hides nodes with origin === "external"
function toggleExternal() {
  var btn = document.getElementById("ext-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, nextShowing, "node-external-shown");
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
  // Apply dashed border on body rect when shown (visual differentiation)
  EXT_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) {
      // FancyBboxPatch is a <path>; modify its stroke-dasharray for a dashed look.
      var pathEl = body.tagName === "path" ? body : body.querySelector("path");
      if (pathEl) {
        if (nextShowing) {
          pathEl.setAttribute("stroke-dasharray", "6,3");
          pathEl.setAttribute("stroke-width", "2");
        } else {
          pathEl.removeAttribute("stroke-dasharray");
          pathEl.removeAttribute("stroke-width");
        }
      }
    }
  });
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements + aux + external elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all foundation ghost elements (mathlib/proofwiki AND book-derived).
    // The [id^="ghost"] selector covers both "ghost_*" and "ghostbook_*".
    var all = svgEl.querySelectorAll('[id^="ghost"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
  // Examples & Remarks: hidden by default (toggle starts in OFF state).
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, false, null);
  // Cited Results (External): hidden by default.
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, false, null);
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() {
  if (svgEl) {
    var container = document.getElementById("svg-container");
    var svgW = svgEl.getBoundingClientRect().width / currentZoom;
    var svgH = svgEl.getBoundingClientRect().height / currentZoom;
    var cW = container.clientWidth - 20;
    var cH = container.clientHeight - 20;
    currentZoom = Math.min(cW / svgW, cH / svgH, 1.0);
    applyZoom();
  }
}
// Auto-fit on load
zoomFit();

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
