<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #fafafa; }
#header { background: #2c3e50; color: white; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; }
#header h1 { margin: 0; font-size: 18px; }
#header .hint { font-size: 12px; color: #aaa; font-style: italic; margin-left: 12px; }
#controls button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; background: #34495e; color: white; margin-left: 8px; }
#controls button:hover { background: #4a6785; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 24px; background: #f5f5f5; border-bottom: 1px solid #eee; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #777; }
#main { display: flex; height: calc(100vh - 82px); }
#svg-container { flex: 1; overflow: auto; padding: 10px; cursor: grab; }
#svg-container svg { transform-origin: 0 0; }
#detail-panel { width: 0; overflow-y: auto; background: white; border-left: 1px solid #ddd; transition: width 0.3s; }
#detail-panel.open { width: 380px; padding: 16px; }
.detail-section { margin-bottom: 12px; }
.detail-section h4 { margin: 0 0 6px; color: #444; font-size: 13px; text-transform: uppercase; }
.step-item { background: #f0f0f0; border-left: 3px solid #839192; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.step-arrow { text-align: center; color: #aaa; font-size: 14px; }
.eq-item { background: #d4e6f1; border-left: 3px solid #5dade2; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.orphan-item { background: #fef9e7; border-left: 3px solid #f39c12; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; }
#orphan-panel { position: fixed; bottom: 16px; right: 16px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-width: 350px; max-height: 400px; overflow-y: auto; display: none; padding: 12px; z-index: 100; }
#orphan-toggle { display: none; }
/* Hover effect on clickable node rects */
[id^="node_"]:hover { filter: brightness(0.90); }
.ghost-node { display: inline-block; margin: 4px 8px; padding: 8px 14px; background: #E0E0E0; border: 1.5px solid #757575; border-radius: 5px; font-size: 13px; color: #333; cursor: pointer; vertical-align: top; white-space: normal; max-width: 220px; }
.ghost-node:hover { background: #BDBDBD; }
.ghost-node .ghost-label { font-weight: bold; font-size: 13px; }
.ghost-node .ghost-refs { font-size: 11px; color: #666; margin-top: 3px; }
/* Toggle controls panel (Foundation, Examples & Remarks, Cited Results) */
.toggle-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: 12px; padding: 4px 8px; background: #ECEFF1; border: 1px solid #CFD8DC; border-radius: 6px; }
.toggle-panel .toggle-label { font-size: 11px; color: #555; font-weight: bold; text-transform: uppercase; margin-right: 4px; }
.toggle-btn { padding: 4px 12px; border: 1.5px solid #757575; border-radius: 4px; background: #E0E0E0; cursor: pointer; font-size: 12px; color: #333; }
.toggle-btn:hover { background: #BDBDBD; }
.toggle-btn[data-showing="1"] { background: #2E7D32; color: white; border-color: #1B5E20; }
.toggle-btn[disabled] { opacity: 0.4; cursor: not-allowed; background: #EEE; }
/* Hidden state — applied dynamically via JS */
.svg-hidden { display: none !important; }
/* Visual differentiation when shown */
.node-external-shown [stroke-dasharray] { }  /* no-op, see runtime tweak */
.node-aux-shown { opacity: 0.75; }
/* v2: `resolves` edges (theorem-like resolves an open_problem/conjecture) — dashed */
.edge-resolves path { stroke-dasharray: 5,3 !important; }
.edge-resolves { stroke-dasharray: 5,3 !important; }
</style>

origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP14.4": {"name": "Variational lower bound (ELBO)", "type": "definition", "section": "2.2 The variational bound", "statement": "$\\log p_{\\bT}(\\bx^{(i)}) = D_{KL}(q_{\\bphi}(\\bz|\\bx^{(i)}) \\| p_{\\bT}(\\bz|\\bx^{(i)})) + \\mathcal{L}(\\bT,\\bphi;\\bx^{(i)})$ with $\\mathcal{L}(\\bT,\\bphi;\\bx^{(i)}) = \\mathbb{E}_{q_{\\bphi}(\\bz|\\bx)}[-\\log q_{\\bphi}(\\bz|\\bx) + \\log p_{\\bT}(\\bx,\\bz)]$.", "statement_clean": "The marginal log-likelihood decomposes as a non-negative KL between the approximate and true posterior plus the variational lower bound L(theta,phi;x).", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP14.1", "statement": "$\\mathcal{L}(\\bT,\\bphi;\\bx^{(i)}) = -D_{KL}(q_{\\bphi}(\\bz|\\bx^{(i)}) \\| p_{\\bT}(\\bz)) + \\mathbb{E}_{q_{\\bphi}(\\bz|\\bx^{(i)})}[\\log p_{\\bT}(\\bx^{(i)}|\\bz)]$.", "section": "2.2 The variational bound", "context": "", "parent_step": ""}, {"id": "EP14.3", "statement": "$\\widetilde{\\mathcal{L}}^{A}(\\bT,\\bphi;\\bx^{(i)}) = \\frac{1}{L}\\sum_{l=1}^L \\log p_{\\bT}(\\bx^{(i)},\\bz^{(i,l)}) - \\log q_{\\bphi}(\\bz^{(i,l)}|\\bx^{(i)})$ with $\\bz^{(i,l)} = g_{\\bphi}(\\beps^{(i,l)},\\bx^{(i)})$, $\\beps^{(l)}\\sim p(\\beps)$.", "section": "2.3 The SGVB estimator and AEVB algorithm", "context": "", "parent_step": ""}]}, "DP14.5": {"name": "Reparameterization of $q_{\\bphi}(\\bz|\\bx)$", "type": "definition", "section": "2.4 The reparameterization trick", "statement": "Express $\\widetilde{\\bz} \\sim q_{\\bphi}(\\bz|\\bx)$ as $\\widetilde{\\bz} = g_{\\bphi}(\\beps,\\bx)$ with auxiliary noise $\\beps \\sim p(\\beps)$ independent of $\\bphi$, where $g_{\\bphi}$ is a differentiable transformation.", "statement_clean": "A sample from q_phi(z|x) is rewritten as a deterministic differentiable function of x, phi, and an auxiliary noise epsilon whose distribution does not depend on phi.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP14.2", "statement": "$\\nabla_{\\bphi}\\mathbb{E}_{q_{\\bphi}(\\bz)}[f(\\bz)] = \\mathbb{E}_{q_{\\bphi}(\\bz)}[f(\\bz)\\nabla_{q_{\\bphi}(\\bz)}\\log q_{\\bphi}(\\bz)]$, which exhibits very high variance.", "section": "2.2 The variational bound", "context": "", "parent_step": ""}]}, "TP14.1": {"name": "Reparameterized Monte Carlo expectation", "type": "theorem", "section": "2.4 The reparameterization trick", "statement": "If $\\widetilde{\\bz} = g_{\\bphi}(\\beps,\\bx)$ with $\\beps \\sim p(\\beps)$ realizes $q_{\\bphi}(\\bz|\\bx)$, then $\\mathbb{E}_{q_{\\bphi}(\\bz|\\bx^{(i)})}[f(\\bz)] = \\mathbb{E}_{p(\\beps)}[f(g_{\\bphi}(\\beps,\\bx^{(i)}))] \\simeq \\frac{1}{L}\\sum_{l=1}^L f(g_{\\bphi}(\\beps^{(l)},\\bx^{(i)}))$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["$\\widetilde{\\bz} \\sim q_{\\bphi}(\\bz|\\bx)$ admits the reparameterization $\\widetilde{\\bz} = g_{\\bphi}(\\beps,\\bx)$ with $\\beps \\sim p(\\beps)$", "$g_{\\bphi}$ is differentiable in $\\bphi$"], "conclusions": ["$\\mathbb{E}_{q_{\\bphi}(\\bz|\\bx^{(i)})}[f(\\bz)] = \\mathbb{E}_{p(\\beps)}[f(g_{\\bphi}(\\beps,\\bx^{(i)}))]$", "The Monte Carlo estimate $\\tfrac{1}{L}\\sum_l f(g_{\\bphi}(\\beps^{(l)},\\bx^{(i)}))$ is differentiable w.r.t. $\\bphi$"], "proof_info": ["By change of variables: $q_{\\bphi}(\\bz|\\bx)\\,d\\bz = p(\\beps)\\,d\\beps$, so $\\int q_{\\bphi}(\\bz|\\bx) f(\\bz)\\,d\\bz = \\int p(\\beps) f(g_{\\bphi}(\\beps,\\bx))\\,d\\beps$."], "step_info": [{"id": "PSP14.1", "name": "Apply infinitesimal change of variables", "subclass": "invoke_identity", "statement_clean": "", "statement": "From $\\bz = g_{\\bphi}(\\beps,\\bx)$ deduce $q_{\\bphi}(\\bz|\\bx)\\prod_i dz_i = p(\\beps)\\prod_i d\\epsilon_i$, i.e. $q_{\\bphi}(\\bz|\\bx)\\,d\\bz = p(\\beps)\\,d\\beps$.", "step_order": 1}, {"id": "PSP14.2", "name": "Substitute into expectation integral", "subclass": "substitute", "statement_clean": "", "statement": "Therefore $\\int q_{\\bphi}(\\bz|\\bx) f(\\bz)\\,d\\bz = \\int p(\\beps) f(\\bz)\\,d\\beps = \\int p(\\beps) f(g_{\\bphi}(\\beps,\\bx))\\,d\\beps$.", "step_order": 2}, {"id": "PSP14.3", "name": "Conclude differentiable Monte Carlo estimator", "subclass": "conclude", "statement_clean": "", "statement": "Approximate by Monte Carlo: $\\int q_{\\bphi}(\\bz|\\bx) f(\\bz)\\,d\\bz \\simeq \\tfrac{1}{L}\\sum_{l=1}^L f(g_{\\bphi}(\\bx,\\beps^{(l)}))$, $\\beps^{(l)}\\sim p(\\beps)$. Since $\\beps$ does not depend on $\\bphi$, the estimator is differentiable in $\\bphi$.", "step_order": 3}], "input": [], "output": [], "equations": [{"id": "EP14.3", "statement": "$\\widetilde{\\mathcal{L}}^{A}(\\bT,\\bphi;\\bx^{(i)}) = \\frac{1}{L}\\sum_{l=1}^L \\log p_{\\bT}(\\bx^{(i)},\\bz^{(i,l)}) - \\log q_{\\bphi}(\\bz^{(i,l)}|\\bx^{(i)})$ with $\\bz^{(i,l)} = g_{\\bphi}(\\beps^{(i,l)},\\bx^{(i)})$, $\\beps^{(l)}\\sim p(\\beps)$.", "section": "2.3 The SGVB estimator and AEVB algorithm", "context": "", "parent_step": ""}, {"id": "EP14.4", "statement": "$\\widetilde{\\mathcal{L}}^{B}(\\bT,\\bphi;\\bx^{(i)}) = -D_{KL}(q_{\\bphi}(\\bz|\\bx^{(i)}) \\| p_{\\bT}(\\bz)) + \\frac{1}{L}\\sum_{l=1}^L \\log p_{\\bT}(\\bx^{(i)}|\\bz^{(i,l)})$, typically lower variance than $\\widetilde{\\mathcal{L}}^A$.", "section": "2.3 The SGVB estimator and AEVB algorithm", "context": "", "parent_step": ""}]}, "ExP14.1": {"name": "Univariate Gaussian reparameterization $z = \\mu + \\sigma\\epsilon$", "type": "example", "section": "2.4 The reparameterization trick", "statement": "If $z\\sim\\mathcal{N}(\\mu,\\sigma^2)$, set $z = \\mu+\\sigma\\epsilon$ with $\\epsilon\\sim\\mathcal{N}(0,1)$; then $\\mathbb{E}_{\\mathcal{N}(z;\\mu,\\sigma^2)}[f(z)] = \\mathbb{E}_{\\mathcal{N}(\\epsilon;0,1)}[f(\\mu+\\sigma\\epsilon)]$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "RP14.1": {"name": "Three families of reparameterizable distributions", "type": "remark", "section": "2.4 The reparameterization trick", "statement": "Choices of $g_{\\bphi}$: (1) tractable inverse CDF (Exponential, Cauchy, Logistic, Rayleigh, Pareto, Weibull, Reciprocal, Gompertz, Gumbel, Erlang); (2) location-scale families (Laplace, Elliptical, Student-t, Logistic, Uniform, Triangular, Gaussian); (3) compositions (Log-Normal, Gamma, Dirichlet, Beta, Chi-Squared, F).", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [], "foundation_links": ["Dirichlet Distribution"]}, "AP14.1": {"name": "Auto-Encoding Variational Bayes (AEVB), minibatch version", "type": "algorithm", "section": "2.3 The SGVB estimator and AEVB algorithm", "statement": "Stochastic-gradient algorithm that jointly learns generative parameters $\\bT$ and recognition parameters $\\bphi$ by ascending the SGVB minibatch estimator of the variational lower bound.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [{"id": "ASP14.1", "name": "Initialize parameters", "subclass": "initialize", "statement_clean": "", "statement": "$\\bT, \\bphi \\gets$ Initialize parameters (e.g. random $\\mathcal{N}(0,0.01)$).", "step_order": 1}, {"id": "ASP14.2", "name": "Main optimization loop", "subclass": "loop", "statement_clean": "", "statement": "Repeat until convergence of $(\\bT,\\bphi)$: sample minibatch, compute gradient of $\\widetilde{\\mathcal{L}}^M$, update parameters.", "step_order": 2}, {"id": "ASP14.3", "name": "Sample minibatch and noise", "subclass": "update", "statement_clean": "", "statement": "$\\bX^M \\gets$ random minibatch of $M$ datapoints from $\\bX$; $\\beps \\gets$ random samples from noise distribution $p(\\beps)$.", "step_order": 3}, {"id": "ASP14.4", "name": "Compute gradient of minibatch ELBO estimator", "subclass": "update", "statement_clean": "", "statement": "$\\bg \\gets \\nabla_{\\bT,\\bphi}\\widetilde{\\mathcal{L}}^M(\\bT,\\bphi;\\bX^M,\\beps)$ via backpropagation through the reparameterized SGVB objective.", "step_order": 4}, {"id": "ASP14.5", "name": "Update parameters with stochastic optimizer", "subclass": "update", "statement_clean": "", "statement": "$\\bT, \\bphi \\gets$ update with gradients $\\bg$, e.g. SGD or Adagrad~\\cite{duchi2010adaptive}.", "step_order": 5}, {"id": "ASP14.6", "name": "Return learned parameters", "subclass": "return", "statement_clean": "", "statement": "Return $\\bT, \\bphi$ once $(\\bT,\\bphi)$ have converged.", "step_order": 6}], "input": ["Dataset $\\bX = \\{\\bx^{(i)}\\}_{i=1}^N$", "Generative model $p_{\\bT}(\\bz), p_{\\bT}(\\bx|\\bz)$", "Recognition model $q_{\\bphi}(\\bz|\\bx)$ with reparameterization $\\bz = g_{\\bphi}(\\beps,\\bx)$, $\\beps \\sim p(\\beps)$", "Minibatch size $M$, MC samples $L$"], "output": ["Learned parameters $\\bT, \\bphi$"], "equations": [{"id": "EP14.5", "statement": "$\\mathcal{L}(\\bT,\\bphi;\\bX) \\simeq \\widetilde{\\mathcal{L}}^M(\\bT,\\bphi;\\bX^M) = \\frac{N}{M}\\sum_{i=1}^M \\widetilde{\\mathcal{L}}(\\bT,\\bphi;\\bx^{(i)})$ with random minibatch $\\bX^M$ of size $M$.", "section": "2.3 The SGVB estimator and AEVB algorithm", "context": "", "parent_step": ""}], "foundation_links": ["Bayes' Rule"]}, "ExP14.2": {"name": "Variational Auto-Encoder with Gaussian prior and diagonal-Gaussian encoder", "type": "example", "section": "3 Example: Variational Auto-Encoder", "statement": "Set $p_{\\bT}(\\bz) = \\mathcal{N}(\\bz;\\bzero,\\bI)$, let $p_{\\bT}(\\bx|\\bz)$ be a Bernoulli or Gaussian MLP, and let $q_{\\bphi}(\\bz|\\bx) = \\mathcal{N}(\\bz;\\bmu^{(i)},\\bsigma^{2(i)}\\bI)$ with $(\\bmu^{(i)},\\bsigma^{(i)})$ output by an MLP. Reparameterize as $\\bz^{(i,l)} = \\bmu^{(i)} + \\bsigma^{(i)}\\odot\\beps^{(l)}$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP14.6", "statement": "$\\mathcal{L}(\\bT,\\bphi;\\bx^{(i)}) \\simeq \\frac{1}{2}\\sum_{j=1}^J(1+\\log((\\sigma_j^{(i)})^2) - (\\mu_j^{(i)})^2 - (\\sigma_j^{(i)})^2) + \\frac{1}{L}\\sum_{l=1}^L \\log p_{\\bT}(\\bx^{(i)}|\\bz^{(i,l)})$ with $\\bz^{(i,l)} = \\bmu^{(i)}+\\bsigma^{(i)}\\odot\\beps^{(l)}$, $\\beps^{(l)}\\sim\\mathcal{N}(0,\\bI)$.", "section": "3 Example: Variational Auto-Encoder", "context": "", "parent_step": ""}]}, "TP14.2": {"name": "Closed-form KL between two Gaussians (prior $\\mathcal{N}(0,I)$)", "type": "theorem", "section": "Appendix B (Solution of $-D_{KL}$, Gaussian case)", "statement": "If $q_{\\bphi}(\\bz|\\bx^{(i)}) = \\mathcal{N}(\\bz;\\bmu,\\bsigma^2\\bI)$ and $p_{\\bT}(\\bz) = \\mathcal{N}(\\bz;\\bzero,\\bI)$, then $-D_{KL}(q_{\\bphi}(\\bz)\\|p_{\\bT}(\\bz)) = \\tfrac{1}{2}\\sum_{j=1}^J(1+\\log(\\sigma_j^2)-\\mu_j^2-\\sigma_j^2)$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": ["$q_{\\bphi}(\\bz|\\bx^{(i)}) = \\mathcal{N}(\\bz;\\bmu,\\bsigma^2\\bI)$", "$p_{\\bT}(\\bz) = \\mathcal{N}(\\bz;\\bzero,\\bI)$", "$J$ is the dimensionality of $\\bz$"], "conclusions": ["$-D_{KL}(q_{\\bphi}(\\bz)\\|p_{\\bT}(\\bz)) = \\tfrac{1}{2}\\sum_{j=1}^J(1+\\log(\\sigma_j^2)-\\mu_j^2-\\sigma_j^2)$"], "proof_info": ["Compute the two cross-entropy integrals $\\int \\mathcal{N}(\\bz;\\bmu,\\bsigma^2)\\log\\mathcal{N}(\\bz;\\bzero,\\bI)\\,d\\bz$ and $\\int \\mathcal{N}(\\bz;\\bmu,\\bsigma^2)\\log\\mathcal{N}(\\bz;\\bmu,\\bsigma^2)\\,d\\bz$ analytically and subtract."], "step_info": [{"id": "PSP14.4", "name": "Compute cross-entropy of $q$ with prior", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "$\\int \\mathcal{N}(\\bz;\\bmu,\\bsigma^2)\\log\\mathcal{N}(\\bz;\\bzero,\\bI)\\,d\\bz = -\\tfrac{J}{2}\\log(2\\pi) - \\tfrac{1}{2}\\sum_{j=1}^J(\\mu_j^2+\\sigma_j^2)$.", "step_order": 1}, {"id": "PSP14.5", "name": "Compute negative entropy of $q$", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "$\\int \\mathcal{N}(\\bz;\\bmu,\\bsigma^2)\\log\\mathcal{N}(\\bz;\\bmu,\\bsigma^2)\\,d\\bz = -\\tfrac{J}{2}\\log(2\\pi) - \\tfrac{1}{2}\\sum_{j=1}^J(1+\\log\\sigma_j^2)$.", "step_order": 2}, {"id": "PSP14.6", "name": "Subtract to obtain $-D_{KL}$", "subclass": "conclude", "statement_clean": "", "statement": "$-D_{KL}(q_{\\bphi}(\\bz)\\|p_{\\bT}(\\bz)) = \\int q(\\bz)(\\log p(\\bz)-\\log q(\\bz))\\,d\\bz = \\tfrac{1}{2}\\sum_{j=1}^J(1+\\log(\\sigma_j^2)-\\mu_j^2-\\sigma_j^2)$.", "step_order": 3}], "input": [], "output": [], "equations": [{"id": "EP14.6", "statement": "$\\mathcal{L}(\\bT,\\bphi;\\bx^{(i)}) \\simeq \\frac{1}{2}\\sum_{j=1}^J(1+\\log((\\sigma_j^{(i)})^2) - (\\mu_j^{(i)})^2 - (\\sigma_j^{(i)})^2) + \\frac{1}{L}\\sum_{l=1}^L \\log p_{\\bT}(\\bx^{(i)}|\\bz^{(i,l)})$ with $\\bz^{(i,l)} = \\bmu^{(i)}+\\bsigma^{(i)}\\odot\\beps^{(l)}$, $\\beps^{(l)}\\sim\\mathcal{N}(0,\\bI)$.", "section": "3 Example: Variational Auto-Encoder", "context": "", "parent_step": ""}]}, "DP14.6": {"name": "Bernoulli MLP decoder", "type": "definition", "section": "Appendix C.1 (Bernoulli MLP as decoder)", "statement": "$\\log p(\\bx|\\bz) = \\sum_{i=1}^D x_i\\log y_i + (1-x_i)\\log(1-y_i)$ where $\\by = f_\\sigma(\\bW_2\\tanh(\\bW_1\\bz+\\bbb_1)+\\bbb_2)$ and $\\bT=\\{\\bW_1,\\bW_2,\\bbb_1,\\bbb_2\\}$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP14.7": {"name": "Gaussian MLP encoder/decoder", "type": "definition", "section": "Appendix C.2 (Gaussian MLP as encoder or decoder)", "statement": "$\\log p(\\bx|\\bz) = \\log\\mathcal{N}(\\bx;\\bmu,\\bsigma^2\\bI)$ with $\\bh=\\tanh(\\bW_3\\bz+\\bbb_3)$, $\\bmu=\\bW_4\\bh+\\bbb_4$, $\\log\\bsigma^2=\\bW_5\\bh+\\bbb_5$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "AP14.2": {"name": "Marginal-likelihood importance estimator", "type": "algorithm", "section": "Appendix D (Marginal likelihood estimator)", "statement": "Three-stage harmonic-style estimator that approximates $p_{\\bT}(\\bx^{(i)})$ by sampling latent codes via gradient-based MCMC, fitting a density $q(\\bz)$, then resampling.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": ["Multiply $1/p_{\\bT}(\\bx^{(i)})$ by $\\int q(\\bz)\\,d\\bz = 1$ and rearrange via Bayes' rule to obtain $1/p_{\\bT}(\\bx^{(i)}) = \\mathbb{E}_{p_{\\bT}(\\bz|\\bx^{(i)})}[q(\\bz)/p_{\\bT}(\\bx^{(i)},\\bz)]$."], "step_info": [{"id": "ASP14.7", "name": "Sample posterior via gradient-based MCMC", "subclass": "initialize", "statement_clean": "", "statement": "Sample $L$ values $\\{\\bz^{(l)}\\}$ from the posterior using gradient-based MCMC (e.g. Hybrid Monte Carlo) with $\\nabla_{\\bz}\\log p_{\\bT}(\\bz|\\bx) = \\nabla_{\\bz}\\log p_{\\bT}(\\bz)+\\nabla_{\\bz}\\log p_{\\bT}(\\bx|\\bz)$.", "step_order": 1}, {"id": "PSP14.7", "name": "Insert $\\int q(\\bz)\\,d\\bz = 1$", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "$\\frac{1}{p_{\\bT}(\\bx^{(i)})} = \\frac{\\int q(\\bz)\\,d\\bz}{p_{\\bT}(\\bx^{(i)})} = \\frac{\\int q(\\bz)\\,p_{\\bT}(\\bx^{(i)},\\bz)/p_{\\bT}(\\bx^{(i)},\\bz)\\,d\\bz}{p_{\\bT}(\\bx^{(i)})}$.", "step_order": 1}, {"id": "ASP14.8", "name": "Fit density estimator $q(\\bz)$", "subclass": "update", "statement_clean": "", "statement": "Fit a density estimator $q(\\bz)$ to the samples $\\{\\bz^{(l)}\\}$ produced in step 1.", "step_order": 2}, {"id": "PSP14.8", "name": "Apply Bayes' rule $p_{\\bT}(\\bz|\\bx^{(i)}) = p_{\\bT}(\\bx^{(i)},\\bz)/p_{\\bT}(\\bx^{(i)})$", "subclass": "invoke_identity", "statement_clean": "", "statement": "Rewriting yields $\\int p_{\\bT}(\\bz|\\bx^{(i)}) \\frac{q(\\bz)}{p_{\\bT}(\\bx^{(i)},\\bz)}\\,d\\bz$.", "step_order": 2}, {"id": "ASP14.9", "name": "Estimate marginal likelihood", "subclass": "return", "statement_clean": "", "statement": "Resample $L$ posterior samples and return $p_{\\bT}(\\bx^{(i)}) \\simeq \\big(\\frac{1}{L}\\sum_{l=1}^L \\frac{q(\\bz^{(l)})}{p_{\\bT}(\\bz)p_{\\bT}(\\bx^{(i)}|\\bz^{(l)})}\\big)^{-1}$.", "step_order": 3}, {"id": "PSP14.9", "name": "Monte Carlo estimate over posterior samples", "subclass": "conclude", "statement_clean": "", "statement": "Approximate by $\\tfrac{1}{L}\\sum_{l=1}^L \\frac{q(\\bz^{(l)})}{p_{\\bT}(\\bz)p_{\\bT}(\\bx^{(i)}|\\bz^{(l)})}$ with $\\bz^{(l)} \\sim p_{\\bT}(\\bz|\\bx^{(i)})$, then invert.", "step_order": 3}], "input": ["Generative model $p_{\\bT}(\\bx,\\bz) = p_{\\bT}(\\bz)p_{\\bT}(\\bx|\\bz)$", "Datapoint $\\bx^{(i)}$", "Number of MCMC samples $L$"], "output": ["Estimate $p_{\\bT}(\\bx^{(i)}) \\simeq \\big(\\frac{1}{L}\\sum_{l=1}^L \\frac{q(\\bz^{(l)})}{p_{\\bT}(\\bz)p_{\\bT}(\\bx^{(i)}|\\bz^{(l)})}\\big)^{-1}$"], "equations": [], "foundation_links": ["Bayes' Rule"]}, "AP14.3": {"name": "Full Variational Bayes AEVB (latent variables and parameters)", "type": "algorithm", "section": "Appendix F (Full VB)", "statement": "Stochastic-gradient algorithm extending AEVB to perform variational inference jointly over latent variables $\\bz$ and parameters $\\bT$ via reparameterizations $\\widetilde{\\bz} = g_{\\bphi}(\\beps,\\bx)$ and $\\widetilde{\\bT} = h_{\\bphi}(\\bzeta)$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [{"id": "ASP14.10", "name": "Initialize stochastic gradient", "subclass": "initialize", "statement_clean": "", "statement": "$\\bg \\gets 0$.", "step_order": 1}, {"id": "ASP14.11", "name": "Loop over $L$ Monte Carlo samples", "subclass": "loop", "statement_clean": "", "statement": "For $l=1$ to $L$, draw $\\bx$ from dataset, $\\beps\\sim p(\\beps)$, $\\bzeta\\sim p(\\bzeta)$, and accumulate $\\bg \\gets \\bg + \\tfrac{1}{L}\\nabla_{\\bphi}f_{\\bphi}(\\bx,g_{\\bphi}(\\beps,\\bx),h_{\\bphi}(\\bzeta))$.", "step_order": 2}, {"id": "ASP14.12", "name": "Return accumulated gradient", "subclass": "return", "statement_clean": "", "statement": "Return $\\bg$.", "step_order": 3}], "input": ["Hyperprior $p_{\\balpha}(\\bT)$", "Generative likelihood $p_{\\bT}(\\bx|\\bz)$ and prior $p_{\\bT}(\\bz)$", "Reparameterized variational posteriors $q_{\\bphi}(\\bT)$ and $q_{\\bphi}(\\bz|\\bx)$"], "output": ["Stochastic gradient $\\bg = \\frac{1}{L}\\sum_l \\nabla_{\\bphi} f_{\\bphi}(\\bx,g_{\\bphi}(\\beps,\\bx),h_{\\bphi}(\\bzeta))$"], "equations": [{"id": "EP14.7", "statement": "$f_{\\bphi}(\\bx,\\bz,\\bT) = N\\cdot(\\log p_{\\bT}(\\bx|\\bz)+\\log p_{\\bT}(\\bz)-\\log q_{\\bphi}(\\bz|\\bx)) + \\log p_{\\balpha}(\\bT)-\\log q_{\\bphi}(\\bT)$.", "section": "Appendix F (Full VB)", "context": "", "parent_step": ""}], "foundation_links": ["Bayes' Rule"]}, "ExP14.3": {"name": "MNIST and Frey Face VAE experiments", "type": "example", "section": "5 Experiments", "statement": "Generative models trained on MNIST (500 hidden units; 100 hidden units, 3 latent dims for marginal-likelihood estimate) and Frey Face (200 hidden units, Gaussian decoder with sigmoidal mean) compared to wake-sleep~\\cite{hinton1995wake} and Monte Carlo EM with HMC; AEVB converges faster and reaches a better solution.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "AP14.4": {"name": "Wake-sleep algorithm (cited baseline)", "type": "algorithm", "section": "4 Related work (cited)", "statement": "On-line var AUX_NODE_IDS = ["ExP14.1", "ExP14.2", "ExP14.3", "RP14.1"];

var AUX_EDGE_GIDS = ["edge_TP14.1__ExP14.1", "edge_DP14.5__RP14.1", "edge_AP14.1__ExP14.2", "edge_TP14.2__ExP14.2", "edge_DP14.7__ExP14.2", "edge_DP14.6__ExP14.2", "edge_AP14.1__ExP14.3", "edge_ExP14.2__ExP14.3", "edge_AP14.4__ExP14.3", "edge_AP14.5__ExP14.3", "edge_AP14.2__ExP14.3"];
var EXT_EDGE_GIDS = ["edge_DP14.8__AP14.1", "edge_AP14.4__ExP14.3", "edge_AP14.5__ExP14.3"];
// Foundation ghost-edge gid → target node id (so we can hide ghost edges
// pointing to currently-invisible aux/external nodes).
var GHOST_EDGE_TO_TARGET = {"ghost_edge_0_0": "AP14.1", "ghost_edge_0_1": "AP14.2", "ghost_edge_0_2": "AP14.3", "ghost_edge_1_0": "RP14.1", "ghost_edge_2_0": "DP14.1"};
var AUX_NODE_SET = (function(){ var s={}; AUX_NODE_IDS.forEach(function(n){s[n]=1;}); return s; })();
var EXT_NODE_SET = (function(){ var s={}; EXT_NODE_IDS.forEach(function(n){s[n]=1;}); return s; })();

var _lastDetailNode = null;
function showDetail(nodeId) {
  var panel = document.getElementById("detail-panel");
  // Toggle: click same node again to close
  if (_lastDetailNode === nodeId && panel.className === "open") {
    panel.className = "";
    panel.innerHTML = "";
    _lastDetailNode = null;
    return;
  }
  _lastDetailNode = nodeId;
  // Special case: orphan/misc node
  if (nodeId === '__orphan__') {
    var h = '<h3 style="margin:0 0 8px;font-size:16px;">Misc: Unconnected Equations</h3>';
    h += '<div style="font-size:12px;color:#888;margin-bottom:10px;">Equations not linked to any theorem or proof step</div>';
    ORPHANS.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    if (ORPHANS.length === 0) h += '<div style="color:#888;">No orphan equations.</div>';
    panel.innerHTML = h;
    panel.className = "open";
    typesetMath(panel);
    return;
  }
  var d = DETAILS[nodeId];
  if (!d) return;
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(nodeId) + ': ' + esc(d.name || d.type) + '</h3>';
  h += '<div style="font-size:12px;color:#888;margin-bottom:4px;">' + d.type + (d.section ? ' (Sec ' + d.section + ')' : '') + '</div>';
  // Origin badge — paper (default, shown only if external) or external (cited prior result)
  if (d.origin === "external") {
    var citeStr = d.origin_citation ? (' &mdash; ' + esc(d.origin_citation)) : '';
    h += '<div style="display:inline-block;padding:2px 8px;background:#FFF3E0;border:1px dashed #E65100;border-radius:3px;font-size:11px;color:#BF360C;margin-bottom:8px;">External (cited prior result)' + citeStr + '</div>';
  }
  // Foundation graph link badge (Case 1: known result)
  if (d.foundation_links && d.foundation_links.length > 0) {
    h += '<div style="display:inline-block;padding:2px 8px;background:#E3F2FD;border:1px solid #2471A3;border-radius:3px;font-size:11px;color:#2471A3;margin-bottom:8px;">&#128218; Known result: ' + d.foundation_links.map(esc).join(', ') + '</div>';
  }
  // Plain-text restatement (statement_clean) — shown above the formal statement
  if (d.statement_clean) {
    h += '<div class="detail-section"><h4>Plain-Text Summary</h4><div style="font-size:13px;color:#444;font-style:italic;">' + esc(d.statement_clean) + '</div></div>';
  }
  // Pre-build equation maps by context
  var eqsByCtx = {statement:[], assumption:[], conclusion:[], orphan:[]};
  var eqsByStep = {};
  if (d.equations) {
    d.equations.forEach(function(e) {
      if (e.parent_step) {
        if (!eqsByStep[e.parent_step]) eqsByStep[e.parent_step] = [];
        eqsByStep[e.parent_step].push(e);
      } else if (e.context && eqsByCtx[e.context]) {
        eqsByCtx[e.context].push(e);
      } else {
        eqsByCtx.orphan.push(e);
      }
    });
  }
  var eqTag = function(e) { return '<span style="color:#2471A3;font-size:11px;"> (' + e.id + ')</span>'; };
  var eqBlock = function(e) { return '<div style="margin:2px 0 2px 12px;padding:3px 8px;background:#EBF5FB;border-left:2px solid #5DADE2;font-size:12px;">' + esc(e.id) + ': ' + esc(e.statement) + '</div>'; };

  // Statement + inline statement equations
  if (d.statement) {
    h += '<div class="detail-section"><h4>Statement</h4><div style="font-size:14px;">' + esc(d.statement) + '</div>';
    eqsByCtx.statement.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Assumptions + inline assumption equations
  if ((d.assumptions && d.assumptions.length > 0) || eqsByCtx.assumption.length > 0) {
    h += '<div class="detail-section"><h4>Assumptions</h4>';
    if (d.assumptions) d.assumptions.forEach(function(a) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(a) + '</div>'; });
    eqsByCtx.assumption.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Conclusions + inline conclusion equations
  if ((d.conclusions && d.conclusions.length > 0) || eqsByCtx.conclusion.length > 0) {
    h += '<div class="detail-section"><h4>Conclusions</h4>';
    if (d.conclusions) d.conclusions.forEach(function(c) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(c) + '</div>'; });
    eqsByCtx.conclusion.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Proof strategy
  if (d.proof_info && d.proof_info.length > 0) {
    h += '<div class="detail-section"><h4>Proof Strategy</h4>';
    d.proof_info.forEach(function(p) {
      if (Array.isArray(p)) {
        p.forEach(function(item) { h += '<div style="font-size:13px;font-style:italic;">&bull; ' + esc(item) + '</div>'; });
      } else {
        h += '<div style="font-size:13px;font-style:italic;">' + esc(p) + '</div>';
      }
    });
    h += '</div>';
  }
  // v2: Step decomposition (proof_step children of a proof, or algorithm_step children of an algorithm)
  if (d.step_info && d.step_info.length > 0) {
    h += '<div class="detail-section"><h4>Decomposition (' + d.step_info.length + ' steps)</h4>';
    d.step_info.forEach(function(s, i) {
      var ord = (s.step_order || (i + 1));
      var label = s.name ? esc(s.name) : esc(s.id || ('Step ' + ord));
      h += '<div class="step-item"><strong>' + ord + '. ' + label + '</strong>';
      if (s.subclass) {
        h += ' <span style="font-size:11px;font-style:italic;color:#666;">[' + esc(s.subclass) + ']</span>';
      }
      var body = s.statement_clean || s.statement || '';
      if (body) {
        h += '<div style="font-size:12px;color:#444;margin-top:2px;">' + esc(body) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  // Algorithm input/output
  if (d.input && d.input.length > 0) {
    h += '<div class="detail-section"><h4>Input</h4>';
    d.input.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // (Legacy "Proof Steps" panel removed: same data now rendered above as
  // "Decomposition" via d.step_info. Both used to read from step_chains and
  // produced duplicate sections on click.)
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  typesetMath(panel);
}
function resetView() {
  document.getElementById("detail-panel").className = "";
  document.getElementById("detail-panel").innerHTML = "";
}
function toggleOrphans() {
  var p = document.getElementById("orphan-panel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  var h = "";
  ORPHANS.forEach(function(e) { h += '<div class="orphan-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>'; });
  document.getElementById("orphan-list").innerHTML = h;
  p.style.display = "block";
  typesetMath(p);
}
// Foundation toggle (ghost nodes — both mathlib/proofwiki ("ghost_") and
// book entries ("ghostbook_") are picked up by the [id^="ghost"] selector).
function toggleGhosts() {
  var btn = document.getElementById("ghost-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  btn.dataset.showing = isShowing ? "0" : "1";
  _applyGhostVisibility();
}

// Apply current foundation visibility, respecting whether ghost edges' target
// nodes are currently hidden (aux/external toggles). A foundation arrow is
// only shown when (a) Foundation toggle is ON and (b) its target node is
// currently visible — otherwise it would float into empty space.
function _applyGhostVisibility() {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  var btn = document.getElementById("ghost-btn");
  var on = btn && btn.dataset.showing === "1";
  var auxBtn = document.getElementById("aux-btn");
  var extBtn = document.getElementById("ext-btn");
  var auxOn = auxBtn && auxBtn.dataset.showing === "1";
  var extOn = extBtn && extBtn.dataset.showing === "1";
  // Show/hide ghost boxes, headers, text, refs uniformly.
  var ghostEls = svgEl.querySelectorAll('[id^="ghost"]');
  ghostEls.forEach(function(el) {
    var gid = el.id;
    if (!on) {
      el.style.display = "none";
      return;
    }
    // Edge gid pattern: "<prefix>_edge_<gi>_<ti>". For these, check target.
    if (GHOST_EDGE_TO_TARGET.hasOwnProperty(gid)) {
      var target = GHOST_EDGE_TO_TARGET[gid];
      var targetHidden = (AUX_NODE_SET[target] && !auxOn) || (EXT_NODE_SET[target] && !extOn);
      el.style.display = targetHidden ? "none" : "";
    } else {
      el.style.display = "";
    }
  });
}

// Generic helper: hide/show a set of nodes (by id) and their incident edges.
function _setNodeVisibility(nodeIds, edgeGids, visible, extraClass) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  nodeIds.forEach(function(nid) {
    // Body rect
    var body = svgEl.querySelector('[id="node_' + nid + '"]');
    if (body) {
      body.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) body.classList.add(extraClass);
        else body.classList.remove(extraClass);
      }
    }
    // All sibling per-node elements (header rect, text labels, divider lines)
    var sibs = svgEl.querySelectorAll('[id^="node_' + nid + '__"]');
    sibs.forEach(function(el) {
      el.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) el.classList.add(extraClass);
        else el.classList.remove(extraClass);
      }
    });
  });
  edgeGids.forEach(function(gid) {
    var e = svgEl.querySelector('[id="' + gid + '"]');
    if (e) e.style.display = visible ? "" : "none";
  });
}

// Examples & Remarks toggle — hides nodes with type in {example, remark}
function toggleAux() {
  var btn = document.getElementById("aux-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  // Apply visual differentiation: lighter shade (opacity) when shown
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, nextShowing, "node-aux-shown");
  // Apply opacity styling on the body rect when shown
  AUX_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) body.style.opacity = nextShowing ? "0.75" : "";
  });
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
}

// Cited Results (External) toggle — hides nodes with origin === "external"
function toggleExternal() {
  var btn = document.getElementById("ext-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, nextShowing, "node-external-shown");
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
  // Apply dashed border on body rect when shown (visual differentiation)
  EXT_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) {
      // FancyBboxPatch is a <path>; modify its stroke-dasharray for a dashed look.
      var pathEl = body.tagName === "path" ? body : body.querySelector("path");
      if (pathEl) {
        if (nextShowing) {
          pathEl.setAttribute("stroke-dasharray", "6,3");
          pathEl.setAttribute("stroke-width", "2");
        } else {
          pathEl.removeAttribute("stroke-dasharray");
          pathEl.removeAttribute("stroke-width");
        }
      }
    }
  });
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements + aux + external elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all foundation ghost elements (mathlib/proofwiki AND book-derived).
    // The [id^="ghost"] selector covers both "ghost_*" and "ghostbook_*".
    var all = svgEl.querySelectorAll('[id^="ghost"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
  // Examples & Remarks: hidden by default (toggle starts in OFF state).
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, false, null);
  // Cited Results (External): hidden by default.
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, false, null);
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() {
  if (svgEl) {
    var container = document.getElementById("svg-container");
    var svgW = svgEl.getBoundingClientRect().width / currentZoom;
    var svgH = svgEl.getBoundingClientRect().height / currentZoom;
    var cW = container.clientWidth - 20;
    var cH = container.clientHeight - 20;
    currentZoom = Math.min(cW / svgW, cH / svgH, 1.0);
    applyZoom();
  }
}
// Auto-fit on load
zoomFit();

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
