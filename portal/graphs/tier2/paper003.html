<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #fafafa; }
#header { background: #2c3e50; color: white; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; }
#header h1 { margin: 0; font-size: 18px; }
#header .hint { font-size: 12px; color: #aaa; font-style: italic; margin-left: 12px; }
#controls button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; background: #34495e; color: white; margin-left: 8px; }
#controls button:hover { background: #4a6785; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 24px; background: #f5f5f5; border-bottom: 1px solid #eee; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #777; }
#main { display: flex; height: calc(100vh - 82px); }
#svg-container { flex: 1; overflow: auto; padding: 10px; cursor: grab; }
#svg-container svg { transform-origin: 0 0; }
#detail-panel { width: 0; overflow-y: auto; background: white; border-left: 1px solid #ddd; transition: width 0.3s; }
#detail-panel.open { width: 380px; padding: 16px; }
.detail-section { margin-bottom: 12px; }
.detail-section h4 { margin: 0 0 6px; color: #444; font-size: 13px; text-transform: uppercase; }
.step-item { background: #f0f0f0; border-left: 3px solid #839192; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.step-arrow { text-align: center; color: #aaa; font-size: 14px; }
.eq-item { background: #d4e6f1; border-left: 3px solid #5dade2; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.orphan-item { background: #fef9e7; border-left: 3px solid #f39c12; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; }
#orphan-panel { position: fixed; bottom: 16px; right: 16px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-width: 350px; max-height: 400px; overflow-y: auto; display: none; padding: 12px; z-index: 100; }
#orphan-toggle { display: none; }
/* Hover effect on clickable node rects */
[id^="node_"]:hover { filter: brightness(0.90); }
.ghost-node { display: inline-block; margin: 4px 8px; padding: 8px 14px; background: #E0E0E0; border: 1.5px solid #757575; border-radius: 5px; font-size: 13px; color: #333; cursor: pointer; vertical-align: top; white-space: normal; max-width: 220px; }
.ghost-node:hover { background: #BDBDBD; }
.ghost-node .ghost-label { font-weight: bold; font-size: 13px; }
.ghost-node .ghost-refs { font-size: 11px; color: #666; margin-top: 3px; }
/* Toggle controls panel (Foundation, Examples & Remarks, Cited Results) */
.toggle-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: 12px; padding: 4px 8px; background: #ECEFF1; border: 1px solid #CFD8DC; border-radius: 6px; }
.toggle-panel .toggle-label { font-size: 11px; color: #555; font-weight: bold; text-transform: uppercase; margin-right: 4px; }
.toggle-btn { padding: 4px 12px; border: 1.5px solid #757575; border-radius: 4px; background: #E0E0E0; cursor: pointer; font-size: 12px; color: #333; }
.toggle-btn:hover { background: #BDBDBD; }
.toggle-btn[data-showing="1"] { background: #2E7D32; color: white; border-color: #1B5E20; }
.toggle-btn[disabled] { opacity: 0.4; cursor: not-allowed; background: #EEE; }
/* Hidden state — applied dynamically via JS */
.svg-hidden { display: none !important; }
/* Visual differentiation when shown */
.node-external-shown [stroke-dasharray] { }  /* no-op, see runtime tweak */
.node-aux-shown { opacity: 0.75; }
/* v2: `resolves` edges (theorem-like resolves an open_problem/conjecture) — dashed */
.edge-resolves path { stroke-dasharray: 5,3 !important; }
.edge-resolves { stroke-dasharray: 5,3 !important; }
</style>

me": "Maximum likelihood / min-bisection problem", "type": "problem", "section": "3 Information theoretic perspective and main results", "statement": "Find a balanced partition of $V$ into $(A_{ML},B_{ML})$ with $|A_{ML}|=|B_{ML}|=n/2$ minimising the number of edges across the cut: $\\arg\\min_{|A|=|B|=n/2} E(A,B)$ (when $\\alpha>\\beta$). NP-hard in the worst case.", "statement_clean": "Find a balanced bipartition minimizing the cut size; equivalent to ML when communities are uniform.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "ProbP3.2": {"name": "Combinatorial $\\pm 1$ formulation", "type": "problem", "section": "6.1 SDP relaxation", "statement": "$\\max_{x \\in \\{\\pm 1\\}^n} x^T B x$, where $B_{ij}=1$ if $(i,j)\\in E(\\mathcal{G})$, $B_{ij}=-1$ if $(i,j) \\notin E(\\mathcal{G})$, $B_{ii}=0$.", "statement_clean": "Quadratic combinatorial maximization over sign vectors used as ML reformulation.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "ProbP3.3": {"name": "SDP relaxation of ML", "type": "problem", "section": "6.1 SDP relaxation", "statement": "$\\max_{X \\succeq 0, X_{ii}=1} \\mathrm{Tr}(BX)$ -- the Goemans-Williamson-style semidefinite relaxation of $\\max_{x\\in\\{\\pm 1\\}^n} x^T B x$.", "statement_clean": "SDP relaxation of the combinatorial cut maximization.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [], "foundation_links": ["Goemans-Williamson Algorithm"]}, "TP3.1": {"name": "Information-theoretic lower bound (Theorem 1)", "type": "theorem", "section": "4 Information theoretic lower bound", "statement": "Let $\\alpha>\\beta\\geq 0$. If $(\\alpha+\\beta)/2 - \\sqrt{\\alpha\\beta} < 1$ (equivalently $\\alpha+\\beta<2$, or $\\alpha+\\beta\\geq 2$ and $(\\alpha-\\beta)^2 < 4(\\alpha+\\beta)-4$), then ML fails to recover the communities with probability bounded away from zero.", "statement_clean": "Below the threshold, ML cannot exactly recover the communities w.h.p.", "origin": "paper", "origin_citation": "", "assumptions": ["$\\alpha>\\beta\\geq 0$", "$p=\\alpha\\log(n)/n$, $q=\\beta\\log(n)/n$"], "conclusions": ["$\\mathbb{P}(\\text{ML fails}) \\geq 1/3$ for large $n$"], "proof_info": ["Show $\\rho(n) > n^{-1}\\gamma(n)\\log(10)$ via the asymptotic of $-\\log T$ (Lemma~LP3.4); then by Lemma LP3.3 we get $\\mathbb{P}(F)\\geq 1/3$."], "step_info": [{"id": "PSP3.1", "name": "Setup events and $\\rho(n)$", "subclass": "setup", "statement_clean": "", "statement": "Recall the failure events $F, F_A, \\Delta, F_H^{(j)}, F_H$ from (\\ref{def:events}) and define $\\rho(n) = \\mathbb{P}(F_H^{(i)})$ as the per-node failure probability over $H \\subset A$ of size $n/\\gamma(n)$.", "step_order": 1}, {"id": "PSP3.2", "name": "Apply Lemma LP3.4 to bound $-\\log\\rho(n)$", "subclass": "apply_lemma", "statement_clean": "", "statement": "Since $\\rho(n) \\geq T(n/2,p,q,\\log n/\\log\\log n)$ (after dropping the $H$-correction in the sum), Lemma LP3.4 gives $-\\log \\rho(n) \\leq ((\\alpha+\\beta)/2 - \\sqrt{\\alpha\\beta})\\log n + o(\\log n)$.", "step_order": 2}, {"id": "PSP3.3", "name": "Conclude $\\rho(n) > n^{-1}\\gamma(n)\\log(10)$", "subclass": "bound_estimate", "statement_clean": "", "statement": "Under the assumption $(\\alpha+\\beta)/2 - \\sqrt{\\alpha\\beta} < 1$, the previous bound implies $\\rho(n) \\geq n^{-((\\alpha+\\beta)/2 - \\sqrt{\\alpha\\beta} + o(1))} > n^{-1}\\gamma(n)\\log(10)$ for large $n$.", "step_order": 3}, {"id": "PSP3.4", "name": "Conclude via Lemma LP3.3 that $\\mathbb{P}(F)\\geq 1/3$", "subclass": "conclude", "statement_clean": "", "statement": "Plugging the lower bound on $\\rho(n)$ into Lemma LP3.3 yields $\\mathbb{P}(F) \\geq 1/3$, i.e. ML fails with probability bounded away from zero.", "step_order": 4}], "input": [], "output": [], "equations": [{"id": "EP3.1", "statement": "$(\\alpha+\\beta)/2 - \\sqrt{\\alpha\\beta} > 1$, equivalently $\\alpha+\\beta>2$ and $(\\alpha-\\beta)^2 > 4(\\alpha+\\beta)-4$, equivalently $\\sqrt{\\alpha}-\\sqrt{\\beta}>1$ for $\\alpha>\\beta$.", "section": "3 / Theorems 1 and 2", "context": "", "parent_step": ""}]}, "TP3.2": {"name": "Information-theoretic upper bound (Theorem 2)", "type": "theorem", "section": "5 Information theoretic upper bound", "statement": "If $(\\alpha+\\beta)/2 - \\sqrt{\\alpha\\beta} > 1$ (i.e. $\\alpha+\\beta>2$ and $(\\alpha-\\beta)^2 > 4(\\alpha+\\beta)-4$), then ML exactly recovers the communities (up to a global flip) with high probability.", "statement_clean": "Above the threshold, ML achieves exact recovery w.h.p.", "origin": "paper", "origin_citation": "", "assumptions": ["$p=\\alpha\\log(n)/n$, $q=\\beta\\log(n)/n$, $\\alpha>\\beta>0$"], "conclusions": ["$\\mathbb{P}(\\text{ML succeeds}) \\to 1$"], "proof_info": ["Union-bound over swapped subsets of size $k\\in[1,n/4]$, apply the binomial-difference Bernstein bound (Lemma~LP3.6), and use ${n\\choose k}\\leq (ne/k)^k$ to obtain $\\mathbb{P}(F)\\leq cn^{-\\epsilon/4}$ when $(\\alpha+\\beta)/2-\\sqrt{\\alpha\\beta}>1+\\epsilon$."], "step_info": [{"id": "PSP3.5", "name": "Witness lemma for ML failure", "subclass": "apply_lemma", "statement_clean": "", "statement": "By Lemma LP3.5, ML failure implies the existence of equally sized swap sets $A_w \\subset A$, $B_w \\subset B$ with $|A_w|=|B_w|=k\\leq n/4$ such that the cross-edge counts dominate the within-cluster edge counts.", "step_order": 1}, {"id": "PSP3.6", "name": "Identify witness probability with $T$", "subclass": "introduce_variable", "statement_clean": "", "statement": "For fixed $A_w, B_w$ of size $k$, $P_n^{(k)} := \\mathbb{P}(\\text{witness condition}) = T(2k(n/2-k), \\alpha\\log n/n, \\beta\\log n/n, 0)$.", "step_order": 2}, {"id": "PSP3.7", "name": "Union bound over witness sets", "subclass": "bound_estimate", "statement_clean": "", "statement": "By a union bound over choices of $A_w$ and $B_w$, $\\mathbb{P}(F) \\leq \\sum_{k=1}^{n/4} {n/2 \\choose k}^2 P_n^{(k)}$.", "step_order": 3}, {"id": "PSP3.8", "name": "Apply binomial-difference Bernstein bound (Lemma LP3.6)", "subclass": "apply_lemma", "statement_clean": "", "statement": "Lemma LP3.6 gives $P_n^{(k)} \\leq \\exp(-(\\log n/n) \\cdot 4k(n/2-k)((\\alpha+\\beta)/2 - \\sqrt{\\alpha\\beta}))$.", "step_order": 4}, {"id": "PSP3.9", "name": "Substitute ${n\\choose k} \\leq (ne/k)^k$", "subclass": "substitute", "statement_clean": "", "statement": "Using ${n/2 \\choose k} \\leq (ne/(2k))^k$ and the previous bound, simplify the summand to $\\exp[k(2\\log n - 2\\log 2k + 2 - (1/2-k/n)\\cdot 4((\\alpha+\\beta)/2-\\sqrt{\\alpha\\beta})\\log n)]$.", "step_order": 5}, {"id": "PSP3.10", "name": "Conclude $\\mathbb{P}(F) \\leq c n^{-\\epsilon/4}$", "subclass": "conclude", "statement_clean": "", "statement": "Assuming $(\\alpha+\\beta)/2 -\\sqrt{\\alpha\\beta} \\geq 1+\\epsilon$, factor $n^{-\\epsilon/4}$ out of each summand and bound $\\sum_k \\exp[-\\frac23 k(\\log 2k - 3)] = O(1)$ to obtain $\\mathbb{P}(F) \\leq c n^{-\\epsilon/4} \\to 0$.", "step_order": 6}], "input": [], "output": [], "equations": [{"id": "EP3.1", "statement": "$(\\alpha+\\beta)/2 - \\sqrt{\\alpha\\beta} > 1$, equivalently $\\alpha+\\beta>2$ and $(\\alpha-\\beta)^2 > 4(\\alpha+\\beta)-4$, equivalently $\\sqrt{\\alpha}-\\sqrt{\\beta}>1$ for $\\alpha>\\beta$.", "section": "3 / Theorems 1 and 2", "context": "", "parent_step": ""}]}, "TP3.3": {"name": "SDP recovery guarantee (Theorem 3)", "type": "theorem", "section": "6.1 SDP relaxation", "statement": "If $(\\alpha-\\beta)^2 > 8(\\alpha+\\beta) + \\frac{8}{3}(\\alpha-\\beta)$, then with high probability the SDP $\\max_{X \\succeq 0, X_{ii}=1} \\mathrm{Tr}(BX)$ has unique optimum $gg^T$, where $g_i=\\pm 1$ encodes the communities; hence exact recovery is possible in polynomial time.", "statement_clean": "Under a slightly looser threshold, the SDP relaxation exactly recovers the communities in polynomial time.", "origin": "paper", "origin_citation": "", "assumptions": ["$(\\alpha-\\beta)^2 > 8(\\alpha+\\beta) + 8(\\alpha-\\beta)/3$"], "conclusions": ["unique SDP optimum equals $gg^T$ w.h.p.", "polynomial-time exact recovery"], "proof_info": ["By Lemma LP3.10, the dual-feasibility/PSD condition implies SDP optimality of $gg^T$. Decompose $2L_{SBM}+I_n-\\mathbf{1}\\mathbf{1}^T = C-\\Gamma$, reduce (Lemma LP3.11) to two tail bounds on $\\Gamma^{\\mathbf{1}}$ and $\\Gamma^{\\perp\\mathbf{1}}$ (Lemmas LP3.12-13), proven via Matrix Bernstein under $(\\alpha-\\beta)^2 > 8(\\alpha+\\beta) + 8(\\alpha-\\beta)/3$."], "step_info": [{"id": "PSP3.11", "name": "KKT setup: dual certificate $Y = 2(D^+-D^-)+I_n$", "subclass": "setup", "statement_clean": "", "statement": "Apply KKT to the SDP (\\ref{SDP:mainSDP}); $gg^T$ is primal-feasible. To obtain strong duality, build the diagonal dual matrix $Y = 2(D_{\\mathcal{G}}^+ - D_{\\mathcal{G}}^-) + I_n$ satisfying $\\mathrm{Tr}(Bgg^T) = \\mathrm{Tr}(Y)$.", "step_order": 1}, {"id": "PSP3.12", "name": "Optimality and uniqueness via Lemma LP3.10", "subclass": "apply_lemma", "statement_clean": "", "statement": "Dual feasibility $Y \\succeq B$ becomes $2L_{SBM}+I_n - \\mathbf{1}\\mathbf{1}^T \\succeq 0$; the second-eigenvalue condition $\\lambda_2 > 0$ then forces $X^* = gg^T$ uniquely (Lemma LP3.10).", "step_order": 2}, {"id": "PSP3.13", "name": "Decompose $2L_{SBM}+I_n - \\mathbf{1}\\mathbf{1}^T = C - \\Gamma$", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "Rewrite the SDP matrix as a deterministic mean $C$ minus a zero-mean random matrix $\\Gamma$ using elementary matrices $\\Delta_{ij}^\\pm$ and Bernoulli signs $\\alpha_{ij}^\\pm$.", "step_order": 3}, {"id": "PSP3.14", "name": "Reduce to spectral tail bounds (Lemma LP3.11)", "subclass": "apply_lemma", "statement_clean": "", "statement": "Lemma LP3.11 shows it suffices to prove $\\mathbb{P}(\\lambda_{\\max}(\\Gamma^{\\mathbf{1}}) \\geq n - 2\\beta\\log n) < n^{-\\epsilon}$ and $\\mathbb{P}(\\lambda_{\\max}(\\Gamma^{\\perp\\mathbf{1}}) \\geq (\\alpha-\\beta)\\log n) < n^{-\\epsilon}$.", "step_order": 4}, {"id": "PSP3.15", "name": "Bound $\\Gamma^{\\mathbf{1}}$ tail via Matrix Bernstein (Lemma LP3.12)", "subclass": "apply_lemma", "statement_clean": "", "statement": "Apply Matrix Bernstein with $R = O(1/n)$ and $\\sigma^2 = O(\\beta\\log n/n)$ to bound the projection $\\Gamma^{\\mathbf{1}}$, giving Lemma LP3.12 unconditionally for large $n$.", "step_order": 5}, {"id": "PSP3.16", "name": "Bound $\\Gamma^{\\perp\\mathbf{1}}$ tail via Matrix Bernstein (Lemma LP3.13)", "subclass": "apply_lemma", "statement_clean": "", "statement": "Apply Matrix Bernstein with $R=4$ and $\\sigma^2 = 4(\\alpha+\\beta)\\log n + O(\\log^2 n /n)$; the resulting tail is $< n^{-\\epsilon}$ exactly when $(\\alpha-\\beta)^2 > 8(\\alpha+\\beta) + 8(\\alpha-\\beta)/3$.", "step_order": 6}, {"id": "PSP3.17", "name": "Conclude SDP recovery", "subclass": "conclude", "statement_clean": "", "statement": "Combining steps PSP3.12, PSP3.14-PSP3.16, the dual-feasibility condition holds w.h.p., so $gg^T$ is the unique SDP optimum and exact recovery is achieved in polynomial time.", "step_order": 7}], "input": [], "output": [], "equations": []}, "TP3.4": {"name": "Efficient algorithm achieving the threshold (Theorem 4)", "type": "theorem", "section": "6.2 Efficient full recovery from efficient partial recovery", "statement": "If $(\\alpha+\\beta)/2 - \\sqrt{\\alpha\\beta} > 1$, then there exists $C=C(\\alpha,\\beta)$ large enough such that the partition-then-local-flip algorithm succeeds with high probability in recovering the communities from $\\mathcal{G}(n,p,q)$.", "statement_clean": "An efficient algorithm matching the IT threshold exists, via partial recovery + local improvements.", "origin": "paper", "origin_citation": "", "assumptions": ["$(\\alpha+\\beta)/2-\\sqrt{\\alpha\\beta}>1$"], "conclusions": ["polynomial-time algorithm exactly recovers the communities w.h.p."], "proof_info": ["Use the random edge split (Lemma LP3.14) to make partial recovery on $G_1$ near-independent of local-flip step on $G_2$; bound mislabel probability per node via Lemma LP3.8; union-bound over $n$ nodes; choose $C$ large so $\\delta(C)\\to 0$ and $1-((\\alpha+\\beta)/2-\\sqrt{\\alpha\\beta}) < 0$."], "step_info": [{"id": "PSP3.18", "name": "Setup: assume partial recovery succeeds on $G_1$", "subclass": "setup", "statement_clean": "", "statement": "Assume Massoulie's algorithm on the sparse split $G_1$ outputs $(A',B')$ correct on $\\geq (1-\\delta(C))n$ nodes w.h.p.; aim to bound the probability that any node remains mislabeled after the local-flip step on $G_2$.", "step_order": 1}, {"id": "PSP3.19", "name": "Reduce $H_2$ to almost-complete via Lemma LP3.14", "subclass": "apply_lemma", "statement_clean": "", "statement": "Using Lemma LP3.14, the degree of every node in $H_2$ is at least $n(1 - 2C/\\log n)$ w.h.p., so we may upper-bound the mislabel probability by removing $2Cn/\\log n$ from the right-hand-side sums.", "step_order": 2}, {"id": "PSP3.20", "name": "Express mislabel probability $P_e$ as Bernoulli-difference tail", "subclass": "introduce_variable", "statement_clean": "", "statement": "For a node $e$, $P_e = \\mathbb{P}\\!\\left( \\sum_{i=1}^{(1-\\delta(C))n/2} Z_i + \\sum_{i=1}^{\\delta(C)n/2} W_i \\geq \\sum_{i=1}^{(1-\\delta(C))n/2} W'_i + \\sum_{i=1}^{\\delta(C)n/2} Z'_i \\right)$.", "step_order": 3}, {"id": "PSP3.21", "name": "Apply Lemma LP3.8 to bound $P_e$", "subclass": "apply_lemma", "statement_clean": "", "statement": "Lemma LP3.8 gives $P_e \\leq n^{-(g(\\alpha,\\beta,-\\gamma\\delta(C))+o(1))} + n^{-(1+\\Omega(1))}$, where $\\gamma = 1/(\\delta(C)\\sqrt{\\log(1/\\delta(C))})$ and $g(\\alpha,\\beta,\\delta') \\to (\\alpha+\\beta)/2 - \\sqrt{\\alpha\\beta}$ as $\\delta'\\to 0$.", "step_order": 4}, {"id": "PSP3.22", "name": "Union bound over nodes and conclude", "subclass": "conclude", "statement_clean": "", "statement": "Union-bound: $\\mathbb{P}(\\exists\\text{ mislabeled node}) \\leq n \\cdot P_e \\leq n^{1 - g(\\alpha,\\beta,-\\gamma\\delta(C)) - o(1)} + n^{-\\Omega(1)} \\to 0$ for $C$ large enough so that $\\delta(C)$ is small and $1 - g(\\alpha,\\beta,0) = 1 - ((\\alpha+\\beta)/2-\\sqrt{\\alpha\\beta}) < 0$.", "step_order": 5}], "input": [], "output": [], "equations": []}, "TP3.5": {"name": "Matrix Bernstein inequality", "type": "theorem", "section": "Appendix A.3 (cited)", "statement": "For independent self-adjoint $d\\times d$ matrices $\\{X_k\\}$ with $\\mathbb{E}X_k=0$ and $\\lambda_{\\max}(X_k)\\leq R$ a.s., $\\mathbb{P}\\!\\left(\\lambda_{\\max}(\\sum_k X_k) \\geq t\\right) \\leq d\\exp\\!\\left(-\\frac{t^2/2}{\\sigma^2 + Rt/3}\\right)$, where $\\sigma^2 = \\| \\sum_k \\mathbb{E} X_k^2 \\|$.", "statement_clean": "Concentration tail bound for sums of independent self-adjoint matrices.", "origin": "external", "origin_citation": "Tropp, User-Friendly Tail Bounds for Sums of Random Matrices (2012)", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "TP3.6": {"name": "Detection threshold for SBM (cited)", "type": "theorem", "section": "1 / 3 (cited)", "statement": "For $\\mathcal{G}(n,a/n,b/n)$, detection (recovering more than $(1/2+\\eps)n$ vertices correctly) is possible if and only if $(a-b)^2 > 2(a+b)$.", "statement_clean": "Sharp detection threshold for sparse SBM, used as reference for the recovery problem.", "origin": "external", "origin_citation": "Decelle et al. 2011 (conjecture); Massoulie 2014; Mossel-Neeman-Sly 2013", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "TP3.7": {"name": "ER connectivity threshold (cited)", "type": "theorem", "section": "1 / 3 (cited)", "statement": "For Erdos-Renyi $G(n,p)$ with $p = c\\log n / n$, the graph is connected w.h.p. if $c>1$ and disconnected w.h.p. if $c<1$.", "statement_clean": "Classical sharp connectivity threshold for ER; necessary condition for SBM recovery.", "origin": "external", "origin_citation": "Erdos & Renyi 1960", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [], "foundation_links": ["Erdos-Renyi Model"]}, "LP3.1": {"name": "Lemma (failure on $A$ implies ML failure)", "type": "lemma", "section": "4 Information theoretic lower bound", "statement": "If $\\mathbb{P}(F_A) \\geq 2/3$ then $\\mathbb{P}(F) \\geq 1/3$.", "statement_clean": "If a failure event in side A holds w.p. at least 2/3, ML fails with prob at least 1/3.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP3.2": {"name": "Lemma (reverse union bound on $F_H$)", "type": "lemma", "section": "4 Information theoretic lower bound", "statement": "If $\\mathbb{P}(F_H) \\geq 9/10$ then $\\mathbb{P}(F) \\geq 1/3$.", "statement_clean": "Lower bound on ML failure via the H-event probability.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP3.3": {"name": "Lemma (controlling $\\rho(n)$ suffices)", "type": "lemma", "section": "4 Information theoretic lower bound", "statement": "Let $\\rho(n)=\\mathbb{P}(F_H^{(i)})$. If $\\rho(n) > n^{-1}\\gamma(n)\\log(10)$ then for sufficiently large $n$, $\\mathbb{P}(F) \\geq 1/3$.", "statement_clean": "A lower bound on the per-node failure probability rho(n) suffices for ML failure.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP3.4": {"name": "Lemma (asymptotic of $-\\log T$)", "type": "lemma", "section": "4 Information theoretic lower bound", "statement": "For $\\alpha>\\beta>0$, $-\\log T\\!\\left(n/2, \\alpha\\log n/n, \\beta\\log n/n, \\log n/\\log\\log n\\right) \\leq \\left( (\\alpha+\\beta)/2 - \\sqrt{\\alpha\\beta} \\right)\\log n + o(\\log n)$.", "statement_clean": "Sharp bound on the log-tail of difference of binomials in the SBM regime.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP3.5": {"name": "Lemma (ML failure $\\Rightarrow$ disagreement set witness)", "type": "lemma", "section": "5 Information theoretic upper bound", "statement": "If ML does not coincide with the ground truth, then there exist $1\\leq k\\leq n/4$, $A_w \\subset A$, $B_w \\subset B$ with $|A_w|=|B_w|=k$ such that $E(A_w,B\\setminus B_w) + E(B_w,A\\setminus A_w) \\geq E(A_w,A\\setminus A_w) + E(B_w,B\\setminus B_w)$.", "statement_clean": "ML failure is witnessed by a balanced swap of equal-size subsets.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP3.6": {"name": "Lemma $P_n^{(k)}$ Bernstein bound", "type": "lemma", "section": "Appendix A.1 (Lemma~7 / pnk)", "statement": "$T\\!\\left(m, \\alpha\\log n/n, \\beta\\log n/n, 0\\right) \\leq \\exp\\!\\left( -\\frac{2m}{n} \\left( \\frac{\\alpha+\\beta}{2} - \\sqrt{\\alpha\\beta} + o(1) \\right) \\log n \\right)$ for $n$ large, where $m=2k(n/2-k)$.", "statement_clean": "Exponential bound on the binomial-difference tail used in the union bound for ML success.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP3.7": {"name": "Lemma 1 (binomial dominant-term bounds)", "type": "lemma", "section": "Appendix A.1", "statement": "Define $g(\\alpha,\\beta,\\epsilon)=(\\alpha+\\beta) - \\epsilon\\log(\\beta) - 2\\sqrt{(\\epsilon/2)^2 + \\alpha\\beta} + (\\epsilon/2)\\log\\!\\left( \\alpha\\beta \\frac{\\sqrt{(\\epsilon/2)^2+\\alpha\\beta}+\\epsilon/2}{\\sqrt{(\\epsilon/2)^2+\\alpha\\beta}-\\epsilon/2} \\right)$. Then $-\\log T^*(m,p,q,\\epsilon) \\geq (m/n)\\log(n)\\,g(\\alpha,\\beta,\\epsilon) - o((m/n)\\log n)$, and for $cn \\leq m < c'n^{3/2}$, $-\\log T^*(m,p,q,\\epsilon) \\leq (m/n)\\log(n)\\,g(\\alpha,\\beta,\\epsilon) + o((m/n)\\log n)$.", "statement_clean": "Two-sided bounds on the dominant binomial term via the function g(alpha,beta,epsilon).", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP3.8": {"name": "Lemma (mislabel-probability upper bound)", "type": "lemma", "section": "Appendix A.1 (failupperbound)", "statement": "$\\mathbb{P}\\!\\left( \\sum_{i=1}^{(1-\\delta)n/2} Z_i + \\sum_{i=1}^{\\delta n/2} W_i \\geq \\sum_{i=1}^{(1-\\delta)n/2 - 2Cn/\\log n} W'_i + \\sum_{i=1}^{\\delta n/2 - 2Cn/\\log n} Z'_i \\right) \\leq n^{-(g(\\alpha,\\beta,-\\gamma\\delta(C))+o(1))} + n^{-(1+\\Omega(1))}$.", "statement_clean": "Bound on the probability that a node is mislabeled in the partial-recovery + local-flip algorithm.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP3.9": {"name": "Lemma ($\\mathbb{P}(\\Delta) \\geq 9/10$)", "type": "lemma", "section": "Appendix A.2", "statement": "$\\mathbb{P}(\\Delta) \\geq 9/10$, where $\\Delta$ is the event that in a graph on $n/\\log^3 n$ vertices with edge probability $\\alpha\\log n/n$, every node has degree $< \\log n / \\log\\log n$.", "statement_clean": "With probability at least 9/10, no node in the small subgraph H has many H-neighbours.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP3.10": {"name": "Lemma (KKT/dual sufficient condition for SDP)", "type": "lemma", "section": "6.1 SDP relaxation", "statement": "If $2L_{SBM}+I_n-\\mathbf{1}\\mathbf{1}^T \\succeq 0$ and $\\lambda_2(2L_{SBM}+I_n-\\mathbf{1}\\mathbf{1}^T) > 0$, then $gg^T$ is the unique optimum of the SDP $\\max_{X\\succeq 0, X_{ii}=1}\\mathrm{Tr}(BX)$.", "statement_clean": "Sufficient PSD/eigenvalue conditions for the SDP to recover the planted partition uniquely.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP3.2", "statement": "$2L_{SBM}+I_n - \\mathbf{1}\\mathbf{1}^T \\succeq 0$ and $\\lambda_2(2L_{SBM}+I_n-\\mathbf{1}\\mathbf{1}^T) > 0$.", "section": "6.1 SDP relaxation", "context": "", "parent_step": ""}]}, "LP3.11": {"name": "Lemma (reduction to spectral norm of $\\Gamma$ projections)", "type": "lemma", "section": "Appendix A.3", "statement": "If $\\mathbb{P}(\\lambda_{\\max}(\\Gamma^{\\mathbf{1}}) \\geq n - 2\\beta\\log n) < n^{-\\epsilon}$ and $\\mathbb{P}(\\lambda_{\\max}(\\Gamma^{\\perp\\mathbf{1}}) \\geq (\\alpha-\\beta)\\log n) < n^{-\\epsilon}$ for some $\\epsilon>0$, then condition $C-\\Gamma \\succeq 0$ and $\\lambda_{\\min}(C^{\\perp g}-\\Gamma^{\\perp g})>0$ holds w.h.p.", "statement_clean": "Reduces SDP success conditions to two spectral-norm tail bounds on Gamma.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP3.12": {"name": "Lemma ($\\Gamma^{\\mathbf{1}}$ tail bound)", "type": "lemma", "section": "Appendix A.3", "statement": "For $n$ large, $\\mathbb{P}\\!\\left(\\lambda_{\\max}(\\Gamma^{\\mathbf{1}}) \\geq n - 2\\beta\\log n\\right) < n^{-\\epsilon}$ for some $\\epsilon>0$.", "statement_clean": "Tail bound for the projection of Gamma onto span(1) via Matrix Bernstein.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP3.13": {"name": "Lemma ($\\Gamma^{\\perp\\mathbf{1}}$ tail bound)", "type": "lemma", "section": "Appendix A.3", "statement": "If $(\\alpha-\\beta)^2 > 8(\\alpha+\\beta) + \\frac{8}{3}(\\alpha-\\beta)$, then $\\mathbb{P}\\!\\left(\\lambda_{\\max}(\\Gamma^{\\perp\\mathbf{1}}) \\geq (\\alpha-\\beta)\\log n\\right) < n^{-\\epsilon}$ for some $\\epsilon>0$.", "statement_clean": "Tail bound for the orthogonal-to-1 projection of Gamma; key step for SDP recovery.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP3.14": {"name": "Lemma (degree of $H_1$ nodes)", "type": "lemma", "section": "Appendix A.4", "statement": "With high probability, every node in $H_1$ has degree at most $2Cn/\\log n$, where $H_1$ is an Erdos-Renyi graph on $n$ nodes with edge probability $C/\\log n$.", "statement_clean": "Uniform bound on degrees in the auxiliary graph H_1 used to split edges.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [], "foundation_links": ["Erdos-Renyi Model"]}, "AP3.1": {"name": "SDP-based community recovery", "type": "algorithm", "section": "6.1 SDP relaxation", "statement": "Solve the SDP $\\max_{X\\succeq 0, X_{ii}=1} \\mathrm{Tr}(BX)$ on the $\\pm 1$-signed adjacency-like matrix $B$, recover communities from the rank-1 optimum $gg^T$.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [{"id": "ASP3.7", "name": "Construct signed matrix $B$", "subclass": "initialize", "statement_clean": "", "statement": "Form $B \\in \\mathbb{R}^{n\\times n}$ with $B_{ii}=0$, $B_{ij}=1$ if $(i,j)\\in E(\\mathcal{G})$, $B_{ij}=-1$ otherwise.", "step_order": 1}, {"id": "ASP3.8", "name": "Solve SDP $\\max \\mathrm{Tr}(BX)$", "subclass": "update", "statement_clean": "", "statement": "Solve $\\max_{X \\succeq 0,\\, X_{ii}=1} \\mathrm{Tr}(BX)$ to obtain optimum $X^*$ via interior-point or other polynomial-time SDP solver.", "step_order": 2}, {"id": "ASP3.9", "name": "Extract communities from rank-1 optimum", "subclass": "return", "statement_clean": "", "statement": "When the SDP optimum is rank-1 (the case under Theorem 3), $X^* = gg^T$ for some $g \\in \\{\\pm 1\\}^n$ encoding the two communities; output $g$.", "step_order": 3}], "input": ["Observed graph $\\mathcal{G}$ on $n$ vertices", "Signed matrix $B$ with $B_{ij}=1$ if $(i,j)\\in E(\\mathcal{G})$, $B_{ij}=-1$ else, $B_{ii}=0$"], "output": ["Community assignment vector $g \\in \\{\\pm 1\\}^n$ (up to global flip)"], "equations": []}, "AP3.2": {"name": "Partial recovery + local improvement (two-step)", "type": "algorithm", "section": "6.2 Efficient full recovery from efficient partial recovery", "statement": "Split edges into $G_1=H_1\\cap\\mathcal{G}$ (sparse) and $G_2=H_2\\cap\\mathcal{G}$; run partial-recovery (Massoulie) on $G_1$ to obtain $(A',B')$; flip each node whose $G_2$-neighbour majority points to the opposite cluster; revert if flip counts are unbalanced.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [{"id": "ASP3.1", "name": "Random edge split", "subclass": "initialize", "statement_clean": "", "statement": "Independently of $\\mathcal{G}$, partition the edges of the complete graph $K_n$ into $H_1$ (Erdos-Renyi with edge probability $C/\\log n$) and $H_2 = K_n \\setminus H_1$.", "step_order": 1}, {"id": "ASP3.2", "name": "Form subgraphs $G_1, G_2$", "subclass": "initialize", "statement_clean": "", "statement": "Set $G_1 = H_1 \\cap \\mathcal{G}$ (a sparse SBM with parameters $(C\\alpha, C\\beta)$) and $G_2 = H_2 \\cap \\mathcal{G}$ (the remaining edges).", "step_orde B')$ correlated with the truth on $\\geq (1-\\delta(C))n$ nodes"], "equations": []}, "AP3.4": {"name": "Maximum likelihood (min-bisection) decoder", "type": "algorithm", "section": "3 / 5", "statement": "Among balanced bipartitions, return one with the fewest cross-edges (equivalently, maximum likelihood when communities are uniform). Information-theoretically optimal but NP-hard in the worst case.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": ["Observed graph $\\mathcal{G}$"], "output": ["Balanced partition $(A_{ML},B_{ML})$ minimising $E(A_{ML},B_{ML})$"], "equations": []}, "OpenP3.1": {"name": "Direct SDP/spectral algorithm achieving the IT threshold", "type": "open_problem", "section": "7 Conclusion and open problems", "statement": "Show that the SDP relaxation (or a spectral algorithm) achieves exact recovery all the way down to the optimal threshold $(\\alpha+\\beta)/2 - \\sqrt{\\alpha\\beta}>1$, removing the factor-2 looseness from the Matrix Bernstein analysis.", "statement_clean": "Open: prove the SDP (or spectral) algorithm matches the IT recovery threshold directly.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "OpenP3.2": {"name": "Relation between detection and recovery thresholds", "type": "open_problem", "section": "7 Conclusion and open problems", "statement": "Determine whether efficient algorithms achieving the detection threshold $(a-b)^2 > 2(a+b)$ can also achieve the recovery threshold (and vice versa), or whether the two thresholds require fundamentally different algorithmic approaches.", "statement_clean": "Open: are detection-optimal and recovery-optimal algorithms related?", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "OpenP3.3": {"name": "Generalisation to more complex SBM models", "type": "open_problem", "section": "7 Conclusion and open problems", "statement": "Extend the sharp threshold result to more general network models with multiple communities, overlapping (mixed-membership) communities, or labelled edges.", "statement_clean": "Open: extend the sharp threshold to multi-community, overlapping, or labelled SBMs.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "RP3.1": {"name": "Numerical evidence: SDP matches IT threshold", "type": "remark", "section": "6.1 / 7", "statement": "Numerical simulations ($n=300$, 20 trials) suggest the SDP-based algorithm achieves exact recovery essentially down to the optimal threshold $(\\alpha-\\beta)^2 = 4(\\alpha+\\beta)-4$, despite the analysis only proving recovery for the looser threshold $(\\alpha-\\beta)^2 > 8(\\alpha+\\beta)+8(\\alpha-\\beta)/3$.", "statement_clean": "Empirically, the SDP appears to attain the IT threshold; the factor-2 gap is likely a Matrix-Bernstein analysis artifact.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "RP3.2": {"name": "Standard CLT/Chernoff/Sanov insufficient", "type": "remark", "section": "3 / Appendix A.1", "statement": "Standard estimates (CLT, Chernoff, Sanov) do not yield the sharp $(\\alpha+\\beta)/2 -\\sqrt{\\alpha\\beta}$ exponent, because their error on the exponent is $O(\\log n)$ -- of the same order as the leading term -- owing to the slow concentration in the regime $p,q = \\Theta(\\log n / n)$.", "statement_clean": "Sharp threshold cannot be obtained by classical concentration; tighter binomial estimates are required.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output":   }
  // Pre-build equation maps by context
  var eqsByCtx = {statement:[], assumption:[], conclusion:[], orphan:[]};
  var eqsByStep = {};
  if (d.equations) {
    d.equations.forEach(function(e) {
      if (e.parent_step) {
        if (!eqsByStep[e.parent_step]) eqsByStep[e.parent_step] = [];
        eqsByStep[e.parent_step].push(e);
      } else if (e.context && eqsByCtx[e.context]) {
        eqsByCtx[e.context].push(e);
      } else {
        eqsByCtx.orphan.push(e);
      }
    });
  }
  var eqTag = function(e) { return '<span style="color:#2471A3;font-size:11px;"> (' + e.id + ')</span>'; };
  var eqBlock = function(e) { return '<div style="margin:2px 0 2px 12px;padding:3px 8px;background:#EBF5FB;border-left:2px solid #5DADE2;font-size:12px;">' + esc(e.id) + ': ' + esc(e.statement) + '</div>'; };

  // Statement + inline statement equations
  if (d.statement) {
    h += '<div class="detail-section"><h4>Statement</h4><div style="font-size:14px;">' + esc(d.statement) + '</div>';
    eqsByCtx.statement.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Assumptions + inline assumption equations
  if ((d.assumptions && d.assumptions.length > 0) || eqsByCtx.assumption.length > 0) {
    h += '<div class="detail-section"><h4>Assumptions</h4>';
    if (d.assumptions) d.assumptions.forEach(function(a) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(a) + '</div>'; });
    eqsByCtx.assumption.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Conclusions + inline conclusion equations
  if ((d.conclusions && d.conclusions.length > 0) || eqsByCtx.conclusion.length > 0) {
    h += '<div class="detail-section"><h4>Conclusions</h4>';
    if (d.conclusions) d.conclusions.forEach(function(c) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(c) + '</div>'; });
    eqsByCtx.conclusion.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Proof strategy
  if (d.proof_info && d.proof_info.length > 0) {
    h += '<div class="detail-section"><h4>Proof Strategy</h4>';
    d.proof_info.forEach(function(p) {
      if (Array.isArray(p)) {
        p.forEach(function(item) { h += '<div style="font-size:13px;font-style:italic;">&bull; ' + esc(item) + '</div>'; });
      } else {
        h += '<div style="font-size:13px;font-style:italic;">' + esc(p) + '</div>';
      }
    });
    h += '</div>';
  }
  // v2: Step decomposition (proof_step children of a proof, or algorithm_step children of an algorithm)
  if (d.step_info && d.step_info.length > 0) {
    h += '<div class="detail-section"><h4>Decomposition (' + d.step_info.length + ' steps)</h4>';
    d.step_info.forEach(function(s, i) {
      var ord = (s.step_order || (i + 1));
      var label = s.name ? esc(s.name) : esc(s.id || ('Step ' + ord));
      h += '<div class="step-item"><strong>' + ord + '. ' + label + '</strong>';
      if (s.subclass) {
        h += ' <span style="font-size:11px;font-style:italic;color:#666;">[' + esc(s.subclass) + ']</span>';
      }
      var body = s.statement_clean || s.statement || '';
      if (body) {
        h += '<div style="font-size:12px;color:#444;margin-top:2px;">' + esc(body) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  // Algorithm input/output
  if (d.input && d.input.length > 0) {
    h += '<div class="detail-section"><h4>Input</h4>';
    d.input.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // (Legacy "Proof Steps" panel removed: same data now rendered above as
  // "Decomposition" via d.step_info. Both used to read from step_chains and
  // produced duplicate sections on click.)
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  typesetMath(panel);
}
function resetView() {
  document.getElementById("detail-panel").className = "";
  document.getElementById("detail-panel").innerHTML = "";
}
function toggleOrphans() {
  var p = document.getElementById("orphan-panel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  var h = "";
  ORPHANS.forEach(function(e) { h += '<div class="orphan-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>'; });
  document.getElementById("orphan-list").innerHTML = h;
  p.style.display = "block";
  typesetMath(p);
}
// Foundation toggle (ghost nodes — both mathlib/proofwiki ("ghost_") and
// book entries ("ghostbook_") are picked up by the [id^="ghost"] selector).
function toggleGhosts() {
  var btn = document.getElementById("ghost-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  btn.dataset.showing = isShowing ? "0" : "1";
  _applyGhostVisibility();
}

// Apply current foundation visibility, respecting whether ghost edges' target
// nodes are currently hidden (aux/external toggles). A foundation arrow is
// only shown when (a) Foundation toggle is ON and (b) its target node is
// currently visible — otherwise it would float into empty space.
function _applyGhostVisibility() {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  var btn = document.getElementById("ghost-btn");
  var on = btn && btn.dataset.showing === "1";
  var auxBtn = document.getElementById("aux-btn");
  var extBtn = document.getElementById("ext-btn");
  var auxOn = auxBtn && auxBtn.dataset.showing === "1";
  var extOn = extBtn && extBtn.dataset.showing === "1";
  // Show/hide ghost boxes, headers, text, refs uniformly.
  var ghostEls = svgEl.querySelectorAll('[id^="ghost"]');
  ghostEls.forEach(function(el) {
    var gid = el.id;
    if (!on) {
      el.style.display = "none";
      return;
    }
    // Edge gid pattern: "<prefix>_edge_<gi>_<ti>". For these, check target.
    if (GHOST_EDGE_TO_TARGET.hasOwnProperty(gid)) {
      var target = GHOST_EDGE_TO_TARGET[gid];
      var targetHidden = (AUX_NODE_SET[target] && !auxOn) || (EXT_NODE_SET[target] && !extOn);
      el.style.display = targetHidden ? "none" : "";
    } else {
      el.style.display = "";
    }
  });
}

// Generic helper: hide/show a set of nodes (by id) and their incident edges.
function _setNodeVisibility(nodeIds, edgeGids, visible, extraClass) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  nodeIds.forEach(function(nid) {
    // Body rect
    var body = svgEl.querySelector('[id="node_' + nid + '"]');
    if (body) {
      body.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) body.classList.add(extraClass);
        else body.classList.remove(extraClass);
      }
    }
    // All sibling per-node elements (header rect, text labels, divider lines)
    var sibs = svgEl.querySelectorAll('[id^="node_' + nid + '__"]');
    sibs.forEach(function(el) {
      el.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) el.classList.add(extraClass);
        else el.classList.remove(extraClass);
      }
    });
  });
  edgeGids.forEach(function(gid) {
    var e = svgEl.querySelector('[id="' + gid + '"]');
    if (e) e.style.display = visible ? "" : "none";
  });
}

// Examples & Remarks toggle — hides nodes with type in {example, remark}
function toggleAux() {
  var btn = document.getElementById("aux-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  // Apply visual differentiation: lighter shade (opacity) when shown
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, nextShowing, "node-aux-shown");
  // Apply opacity styling on the body rect when shown
  AUX_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) body.style.opacity = nextShowing ? "0.75" : "";
  });
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
}

// Cited Results (External) toggle — hides nodes with origin === "external"
function toggleExternal() {
  var btn = document.getElementById("ext-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, nextShowing, "node-external-shown");
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
  // Apply dashed border on body rect when shown (visual differentiation)
  EXT_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) {
      // FancyBboxPatch is a <path>; modify its stroke-dasharray for a dashed look.
      var pathEl = body.tagName === "path" ? body : body.querySelector("path");
      if (pathEl) {
        if (nextShowing) {
          pathEl.setAttribute("stroke-dasharray", "6,3");
          pathEl.setAttribute("stroke-width", "2");
        } else {
          pathEl.removeAttribute("stroke-dasharray");
          pathEl.removeAttribute("stroke-width");
        }
      }
    }
  });
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements + aux + external elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all foundation ghost elements (mathlib/proofwiki AND book-derived).
    // The [id^="ghost"] selector covers both "ghost_*" and "ghostbook_*".
    var all = svgEl.querySelectorAll('[id^="ghost"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
  // Examples & Remarks: hidden by default (toggle starts in OFF state).
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, false, null);
  // Cited Results (External): hidden by default.
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, false, null);
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() { currentZoom = 1.0; applyZoom(); }

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
