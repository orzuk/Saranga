<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #fafafa; }
#header { background: #2c3e50; color: white; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; }
#header h1 { margin: 0; font-size: 18px; }
#header .hint { font-size: 12px; color: #aaa; font-style: italic; margin-left: 12px; }
#controls button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; background: #34495e; color: white; margin-left: 8px; }
#controls button:hover { background: #4a6785; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 24px; background: #f5f5f5; border-bottom: 1px solid #eee; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #777; }
#main { display: flex; height: calc(100vh - 82px); }
#svg-container { flex: 1; overflow: auto; padding: 10px; cursor: grab; }
#svg-container svg { transform-origin: 0 0; }
#detail-panel { width: 0; overflow-y: auto; background: white; border-left: 1px solid #ddd; transition: width 0.3s; }
#detail-panel.open { width: 380px; padding: 16px; }
.detail-section { margin-bottom: 12px; }
.detail-section h4 { margin: 0 0 6px; color: #444; font-size: 13px; text-transform: uppercase; }
.step-item { background: #f0f0f0; border-left: 3px solid #839192; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.step-arrow { text-align: center; color: #aaa; font-size: 14px; }
.eq-item { background: #d4e6f1; border-left: 3px solid #5dade2; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.orphan-item { background: #fef9e7; border-left: 3px solid #f39c12; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; }
#orphan-panel { position: fixed; bottom: 16px; right: 16px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-width: 350px; max-height: 400px; overflow-y: auto; display: none; padding: 12px; z-index: 100; }
#orphan-toggle { display: none; }
/* Hover effect on clickable node rects */
[id^="node_"]:hover { filter: brightness(0.90); }
.ghost-node { display: inline-block; margin: 4px 8px; padding: 8px 14px; background: #E0E0E0; border: 1.5px solid #757575; border-radius: 5px; font-size: 13px; color: #333; cursor: pointer; vertical-align: top; white-space: normal; max-width: 220px; }
.ghost-node:hover { background: #BDBDBD; }
.ghost-node .ghost-label { font-weight: bold; font-size: 13px; }
.ghost-node .ghost-refs { font-size: 11px; color: #666; margin-top: 3px; }
/* Toggle controls panel (Foundation, Examples & Remarks, Cited Results) */
.toggle-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: 12px; padding: 4px 8px; background: #ECEFF1; border: 1px solid #CFD8DC; border-radius: 6px; }
.toggle-panel .toggle-label { font-size: 11px; color: #555; font-weight: bold; text-transform: uppercase; margin-right: 4px; }
.toggle-btn { padding: 4px 12px; border: 1.5px solid #757575; border-radius: 4px; background: #E0E0E0; cursor: pointer; font-size: 12px; color: #333; }
.toggle-btn:hover { background: #BDBDBD; }
.toggle-btn[data-showing="1"] { background: #2E7D32; color: white; border-color: #1B5E20; }
.toggle-btn[disabled] { opacity: 0.4; cursor: not-allowed; background: #EEE; }
/* Hidden state — applied dynamically via JS */
.svg-hidden { display: none !important; }
/* Visual differentiation when shown */
.node-external-shown [stroke-dasharray] { }  /* no-op, see runtime tweak */
.node-aux-shown { opacity: 0.75; }
/* v2: `resolves` edges (theorem-like resolves an open_problem/conjecture) — dashed */
.edge-resolves path { stroke-dasharray: 5,3 !important; }
.edge-resolves { stroke-dasharray: 5,3 !important; }
</style>

<script>
var DETAILS = {"DP7.1": {"name": "ANN Realization Function", "type": "definition", "section": "2 Neural networks", "statement": "The realization function $F^{(L)} : \\mathbb{R}^{P} \\to \\mathcal{F}$ maps parameters $\\theta$ to network functions $f_\\theta$, where $P = \\sum_{\\ell=0}^{L-1} (n_\\ell + 1) n_{\\ell+1}$, with parameters initialized as iid $\\mathcal{N}(0,1)$.", "statement_clean": "Map sending neural-network parameters to the function the network computes.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP7.2": {"name": "Network Function (Preactivations and Activations)", "type": "definition", "section": "2 Neural networks", "statement": "$f_\\theta(x) := \\tilde{\\alpha}^{(L)}(x;\\theta)$ with $\\alpha^{(0)}(x;\\theta)=x$, $\\tilde{\\alpha}^{(\\ell+1)}(x;\\theta)=\\frac{1}{\\sqrt{n_\\ell}}W^{(\\ell)}\\alpha^{(\\ell)}(x;\\theta)+\\beta b^{(\\ell)}$, $\\alpha^{(\\ell)}=\\sigma(\\tilde{\\alpha}^{(\\ell)})$.", "statement_clean": "Recursive definition of pre-activations and activations of the network with NTK-style normalization $1/\\sqrt{n_\\ell}$.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP7.3": {"name": "Multi-dimensional Kernel", "type": "definition", "section": "3 Kernel gradient", "statement": "A multi-dimensional kernel $K:\\mathbb{R}^{n_0}\\times\\mathbb{R}^{n_0}\\to\\mathbb{R}^{n_L\\times n_L}$ satisfying $K(x,x')=K(x',x)^T$, defining the bilinear form $\\langle f,g\\rangle_K=\\mathbb{E}_{x,x'\\sim p^{in}}[f(x)^T K(x,x') g(x')]$.", "statement_clean": "Symmetric matrix-valued kernel inducing a bilinear form on the function space $\\mathcal{F}$.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP7.4": {"name": "Positive-definite kernel w.r.t. $\\|\\cdot\\|_{p^{in}}$", "type": "definition", "section": "3 Kernel gradient", "statement": "A kernel $K$ is positive-definite with respect to $\\|\\cdot\\|_{p^{in}}$ if $\\|f\\|_{p^{in}}>0 \\implies \\|f\\|_K>0$.", "statement_clean": "Strict positivity of the kernel-norm whenever the data-norm is positive.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP7.5": {"name": "Kernel Gradient", "type": "definition", "section": "3 Kernel gradient", "statement": "The kernel gradient $\\nabla_K C|_{f_0}\\in\\mathcal{F}$ is $\\Phi_K(\\partial^{in}_f C|_{f_0})$, satisfying $\\nabla_K C|_{f_0}(x)=\\frac{1}{N}\\sum_{j=1}^N K(x,x_j) d|_{f_0}(x_j)$.", "statement_clean": "Functional gradient of the cost computed through a kernel; generalises beyond the dataset via $K$.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP7.6": {"name": "Kernel Gradient Descent", "type": "definition", "section": "3 Kernel gradient", "statement": "A time-dependent function $f(t)$ follows kernel gradient descent w.r.t. $K$ if $\\partial_t f(t) = -\\nabla_K C|_{f(t)}$; then $\\partial_t C|_{f(t)} = -\\|d|_{f(t)}\\|_K^2$.", "statement_clean": "Functional dynamics governed by the negative kernel gradient of the cost.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP7.7": {"name": "Tangent Kernel of Random Functions Approximation", "type": "definition", "section": "3.1 Random functions approximation", "statement": "For a random linear parametrization $f_\\theta^{lin}=\\frac{1}{\\sqrt{P}}\\sum_p \\theta_p f^{(p)}$, the tangent kernel is $\\tilde{K}=\\sum_{p=1}^P \\partial_{\\theta_p} F^{lin}\\otimes \\partial_{\\theta_p} F^{lin} = \\frac{1}{P}\\sum_p f^{(p)}\\otimes f^{(p)}$.", "statement_clean": "Random kernel built from a finite set of random functions; converges to $K$ as $P\\to\\infty$.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP7.8": {"name": "Neural Tangent Kernel (NTK)", "type": "definition", "section": "4 Neural tangent kernel", "statement": "The neural tangent kernel is $\\Theta^{(L)}(\\theta)=\\sum_{p=1}^P \\partial_{\\theta_p} F^{(L)}(\\theta)\\otimes \\partial_{\\theta_p} F^{(L)}(\\theta)$. The network function evolves as $\\partial_t f_{\\theta(t)}=-\\nabla_{\\Theta^{(L)}} C|_{f_{\\theta(t)}}$.", "statement_clean": "Kernel built from the gradients of the network function w.r.t. its parameters; governs ANN gradient dynamics in function space.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP7.9": {"name": "Limiting NTK $\\Theta^{(L)}_\\infty$", "type": "definition", "section": "4 Neural tangent kernel", "statement": "Defined recursively: $\\Theta^{(1)}_\\infty(x,x')=\\Sigma^{(1)}(x,x')$ and $\\Theta^{(L+1)}_\\infty(x,x')=\\Theta^{(L)}_\\infty(x,x')\\dot\\Sigma^{(L+1)}(x,x')+\\Sigma^{(L+1)}(x,x')$, with $\\dot\\Sigma^{(L+1)}(x,x')=\\mathbb{E}_{f\\sim\\mathcal{N}(0,\\Sigma^{(L)})}[\\dot\\sigma(f(x))\\dot\\sigma(f(x'))]$.", "statement_clean": "Deterministic limit of the NTK in the infinite-width regime, defined recursively in depth.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP7.10": {"name": "Activation Covariance Kernel $\\Sigma^{(L)}$", "type": "definition", "section": "4.1 Initialization", "statement": "Defined recursively: $\\Sigma^{(1)}(x,x')=\\frac{1}{n_0}x^T x'+\\beta^2$, $\\Sigma^{(L+1)}(x,x')=\\mathbb{E}_{f\\sim\\mathcal{N}(0,\\Sigma^{(L)})}[\\sigma(f(x))\\sigma(f(x'))]+\\beta^2$.", "statement_clean": "Recursive covariance kernel for the Gaussian-process limit of network outputs at initialization.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP7.11": {"name": "Dual of a Lipschitz Function", "type": "definition", "section": "Appendix A.4 (cited)", "statement": "The dual $\\hat\\mu:[-1,1]\\to\\mathbb{R}$ of a Lipschitz $\\mu:\\mathbb{R}\\to\\mathbb{R}$ is $\\hat\\mu(\\rho)=\\mathbb{E}_{(X,Y)}[\\mu(X)\\mu(Y)]$ where $(X,Y)$ is centered Gaussian with covariance $\\begin{pmatrix}1&\\rho\\\\\\rho&1\\end{pmatrix}$.", "statement_clean": "Definition of the dual activation as a Gaussian expectation parameterised by correlation $\\rho$.", "origin": "external", "origin_citation": "Daniely et al. 2016", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "ProbP7.1": {"name": "Least-squares Regression Cost Minimization", "type": "problem", "section": "5 Least-squares regression", "statement": "Given a goal $f^*$ and input distribution $p^{in}$, minimize $C(f)=\\frac{1}{2}\\|f-f^*\\|^2_{p^{in}}=\\frac{1}{2}\\mathbb{E}_{x\\sim p^{in}}[\\|f(x)-f^*(x)\\|^2]$ over $f\\in\\mathcal{F}$.", "statement_clean": "Optimization problem: minimise the squared-error functional cost.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP7.1", "statement": "$f_t = f^* + e^{-t\\Pi}(f_0-f^*) = f^* + \\Delta^0_f + \\sum_{i=1}^{Nn_L} e^{-t\\lambda_i}\\Delta^i_f$, where $f^{(i)}$ are kernel principal components and $\\lambda_i$ the corresponding eigenvalues of $\\Pi$.", "section": "5 Least-squares regression", "context": "", "parent_step": ""}]}, "PrP7.1": {"name": "Gaussian-Process Limit of Output (Initialization)", "type": "proposition", "section": "4.1 Initialization (also Appendix A.1)", "statement": "For depth $L$ with Lipschitz $\\sigma$, as $n_1,\\dots,n_{L-1}\\to\\infty$, the outputs $f_{\\theta,k}$ tend in law to iid centered Gaussian processes of covariance $\\Sigma^{(L)}$.", "statement_clean": "In the infinite-width limit at initialization, output functions converge to iid Gaussian processes with covariance $\\Sigma^{(L)}$.", "origin": "paper", "origin_citation": "", "assumptions": ["Lipschitz nonlinearity $\\sigma$", "Sequential infinite-width limit $n_1,\\dots,n_{L-1}\\to\\infty$"], "conclusions": ["Outputs $f_{\\theta,k}$ are iid centered Gaussian processes", "Covariance equals $\\Sigma^{(L)}$ defined recursively"], "proof_info": ["Induction on depth using conditional Gaussianity and the law of large numbers."], "step_info": [{"id": "PSP7.1", "name": "Base case $L=1$: random affine map", "subclass": "induction_step", "statement_clean": "", "statement": "When $L=1$, $f_\\theta(x)=\\frac{1}{\\sqrt{n_0}}W^{(0)}x+\\beta b^{(0)}$, so all output components $f_{\\theta,k}$ are independent Gaussian with covariance $\\Sigma^{(1)}$.", "step_order": 1}, {"id": "PSP7.2", "name": "Decompose $(L+1)$-network as $L$-network composed with $\\sigma$ and random affine map", "subclass": "setup", "statement_clean": "", "statement": "View an $(L+1)$-network as an $L$-network mapping inputs to pre-activations $\\tilde\\alpha^{(L)}$, followed by elementwise $\\sigma$ and a random affine map $\\mathbb{R}^{n_L}\\to\\mathbb{R}^{n_{L+1}}$. By the inductive hypothesis, $\\tilde\\alpha^{(L)}_i$ are iid Gaussian with covariance $\\Sigma^{(L)}$.", "step_order": 2}, {"id": "PSP7.3", "name": "Law of large numbers on conditional covariance gives $\\Sigma^{(L+1)}$", "subclass": "conclude", "statement_clean": "", "statement": "Conditioned on $\\alpha^{(L)}$, outputs $f_{\\theta,i}$ are iid Gaussian with covariance $\\tilde\\Sigma^{(L+1)}=\\frac{1}{n_L}\\alpha^{(L)}(x;\\theta)^T\\alpha^{(L)}(x';\\theta)+\\beta^2$; by LLN as $n_L\\to\\infty$ this converges in probability to $\\Sigma^{(L+1)}(x,x')=\\mathbb{E}_{f\\sim\\mathcal{N}(0,\\Sigma^{(L)})}[\\sigma(f(x))\\sigma(f(x'))]+\\beta^2$, completing the induction.", "step_order": 3}], "input": [], "output": [], "equations": [], "foundation_links": ["Law of Large Numbers"]}, "TP7.1": {"name": "Convergence of NTK at Initialization", "type": "theorem", "section": "4.1 Initialization (also Appendix A.1)", "statement": "For depth $L$ with Lipschitz $\\sigma$, as $n_1,\\dots,n_{L-1}\\to\\infty$, the NTK $\\Theta^{(L)}$ converges in probability to a deterministic limiting kernel: $\\Theta^{(L)}\\to \\Theta^{(L)}_\\infty\\otimes Id_{n_L}$.", "statement_clean": "At initialization, the random NTK converges in probability to a deterministic kernel in the infinite-width limit.", "origin": "paper", "origin_citation": "", "assumptions": ["Lipschitz nonlinearity $\\sigma$", "Sequential infinite-width limit"], "conclusions": ["$\\Theta^{(L)}\\to \\Theta^{(L)}_\\infty\\otimes Id_{n_L}$ in probability", "Limit is deterministic and depends only on depth, $\\sigma$, init variance"], "proof_info": ["Induction on depth with parameter splitting; uses Proposition \\ref{prop:output_limit} and law of large numbers."], "step_info": [{"id": "PSP7.4", "name": "Base case $L=1$: NTK equals $\\Sigma^{(1)}\\delta_{kk'}$", "subclass": "induction_step", "statement_clean": "", "statement": "For $L=1$, summing over entries of $W^{(0)}$ and $b^{(0)}$: $\\Theta_{kk'}(x,x')=\\frac{1}{n_0}x^T x'\\delta_{kk'}+\\beta^2\\delta_{kk'}=\\Sigma^{(1)}(x,x')\\delta_{kk'}$.", "step_order": 1}, {"id": "PSP7.5", "name": "Split parameters $\\tilde\\theta$ vs. $(W^{(L)},b^{(L)})$", "subclass": "setup", "statement_clean": "", "statement": "Split the $L+1$-network into the first $L$-network with parameters $\\tilde\\theta$ and the top layer $(W^{(L)},b^{(L)})$. By Proposition \\ref{prop:output_limit} and induction, $\\tilde\\alpha^{(L)}_i$ are iid Gaussian with covariance $\\Sigma^{(L)}$ and $\\Theta^{(L)}_{ii'}\\to\\Theta^{(L)}_\\infty(x,x')\\delta_{ii'}$.", "step_order": 2}, {"id": "PSP7.6", "name": "LLN on lower-layer + top-layer contributions yields $\\Theta^{(L+1)}_\\infty$", "subclass": "conclude", "statement_clean": "", "statement": "By the chain rule and induction the lower-layer contribution converges to $\\Theta^{(L)}_\\infty(x,x')\\dot\\Sigma^{(L+1)}(x,x')\\delta_{kk'}$ via LLN. The top-layer contribution (sum over $W^{(L)},b^{(L)}$) converges to $\\Sigma^{(L+1)}\\delta_{kk'}$. Adding gives $\\Theta^{(L+1)}_\\infty\\delta_{kk'}$.", "step_order": 3}], "input": [], "output": [], "equations": [], "foundation_links": ["Law of Large Numbers"]}, "TP7.2": {"name": "NTK Stays Constant During Training", "type": "theorem", "section": "4.2 Training (also Appendix A.2)", "statement": "Under Lipschitz $\\sigma$ with bounded second derivative, for $T$ such that $\\int_0^T\\|d_t\\|_{p^{in}}dt$ is stochastically bounded, as $n_1,\\dots,n_{L-1}\\to\\infty$, $\\Theta^{(L)}(t)\\to\\Theta^{(L)}_\\infty\\otimes Id_{n_L}$ uniformly on $[0,T]$, and $\\partial_t f_{\\theta(t)}=\\Phi_{\\Theta^{(L)}_\\infty\\otimes Id_{n_L}}(\\langle d_t,\\cdot\\rangle_{p^{in}})$.", "statement_clean": "The NTK remains asymptotically constant throughout training, yielding a linear functional ODE for the network function.", "origin": "paper", "origin_citation": "", "assumptions": ["$\\sigma$ Lipschitz, twice differentiable, bounded second derivative", "$\\int_0^T\\|d_t\\|_{p^{in}}dt$ stochastically bounded", "Sequential infinite-width limit"], "conclusions": ["$\\Theta^{(L)}(t)\\to\\Theta^{(L)}_\\infty\\otimes Id_{n_L}$ uniformly on $[0,T]$", "Function-space dynamics is governed by a constant kernel"], "proof_info": ["Induction with Gr\u00f6nwall control on a combined activation/weight quantity $A(t)$."], "step_info": [{"id": "PSP7.7", "name": "Base case $L=1$ and induction setup", "subclass": "induction_step", "statement_clean": "", "statement": "Base case $L=1$: NTK does not depend on parameters, so it is constant during training. Inductive step: split the $L+1$-network into a lower $L$-network with parameters $\\tilde\\theta$ and top layer $(W^{(L)},b^{(L)})$; smaller network follows training direction $d'_t=\\dot\\sigma(\\tilde\\alpha^{(L)})(\\frac{1}{\\sqrt{n_L}}W^{(L)})^T d_t$.", "step_order": 1}, {"id": "PSP7.8", "name": "Bound $\\|d'_t\\|$ via Lemma \\ref{lem:control-w}", "subclass": "apply_lemma", "statement_clean": "", "statement": "Since $\\sigma$ is $c$-Lipschitz, $\\|d'_t\\|_{p^{in}}\\leq c\\|\\frac{1}{\\sqrt{n_L}}W^{(L)}(t)\\|_{op}\\|d_t\\|_{p^{in}}$. Applying Lemma \\ref{lem:control-w} reduces bounding $\\|\\frac{1}{\\sqrt{n_L}}W^{(L)}(t)\\|_{op}$ to bounding it at $t=0$, which is bounded by LLN. Apply induction hypothesis to smaller network.", "step_order": 2}, {"id": "PSP7.9", "name": "Gr\u00f6nwall control on combined quantity $A(t)$", "subclass": "bound_estimate", "statement_clean": "", "statement": "Define $A(t)=\\|\\alpha^{(L)}_i(0)\\|_{p^{in}}+c\\|\\tilde\\alpha^{(L)}_i(t)-\\tilde\\alpha^{(L)}_i(0)\\|_{p^{in}}+\\|W^{(L)}_i(0)\\|_2+\\|W^{(L)}_i(t)-W^{(L)}_i(0)\\|_2$. Cauchy-Schwarz and ODE bounds give $\\partial_t A(t)\\leq\\frac{\\max\\{c^2\\|\\Theta^{(L)}_\\infty\\|_{op},1\\}}{\\sqrt{n_L}}\\|d_t\\|_{p^{in}}A(t)$. Gr\u00f6nwall: $A(t)\\leq A(0)\\exp(\\cdot)\\to A(0)$ in probability as $n_L\\to\\infty$.", "step_order": 3}, {"id": "PSP7.10", "name": "NTK summands vary at rate $1/\\sqrt{n_L}$ from top layer", "subclass": "bound_estimate", "statement_clean": "", "statement": "Top-layer derivatives $\\partial_{W^{(L)}_{ij}}f_{\\theta,j'}(x)=\\frac{1}{\\sqrt{n_L}}\\alpha^{(L)}_i(x;\\theta)\\delta_{jj'}$ together with $1/\\sqrt{n_L}$ activation drift give NTK summands varying at rate $n_L^{-3/2}$, hence NTK varies at $1/\\sqrt{n_L}$.", "step_order": 4}, {"id": "PSP7.11", "name": "Lower-layer NTK contribution: $W^{(L)}_{ij}$ and $\\dot\\sigma$ vary at rate $1/\\sqrt{n_L}$", "subclass": "conclude", "statement_clean": "", "statement": "For lower-layer parameters: by induction $\\Theta^{(L)}\\to\\Theta^{(L)}_\\infty\\delta_{ii'}$. The connection weights $W^{(L)}_{ij}$ vary at rate $1/\\sqrt{n_L}$. Bounded second derivative of $\\sigma$ implies $\\partial_t \\dot\\sigma(\\tilde\\alpha^{(L)}_i)=O(\\partial_t \\tilde\\alpha^{(L)}_i)$, also $1/\\sqrt{n_L}$. Combining yields constant-NTK conclusion.", "step_order": 5}], "input": [], "output": [], "equations": []}, "PrP7.2": {"name": "Positive-definiteness of Limiting NTK on the Sphere", "type": "proposition", "section": "4.2 Training (Appendix A.4)", "statement": "For non-polynomial Lipschitz nonlinearity $\\sigma$, any input dimension $n_0$, the restriction of $\\Theta^{(L)}_\\infty$ to $\\mathbb{S}^{n_0-1}=\\{x\\in\\mathbb{R}^{n_0}:x^T x=1\\}$ is positive-definite if $L\\geq 2$.", "statement_clean": "When $\\sigma$ is non-polynomial, the limiting NTK is positive-definite on the unit sphere for depth at least two.", "origin": "paper", "origin_citation": "", "assumptions": ["$\\sigma$ non-polynomial Lipschitz", "$L\\geq 2$", "Inputs on $\\mathbb{S}^{n_0-1}$"], "conclusions": ["$\\Theta^{(L)}_\\infty$ is positive-definite on $\\mathbb{S}^{n_0-1}$"], "proof_info": ["Reduce to base level $\\Sigma^{(2)}$, use Daniely's Hermite identity and the Schoenberg/Gneiting characterisation."], "step_info": [{"id": "PSP7.16", "name": "Recursive decomposition $\\Theta^{(L+1)}=\\dot\\Sigma^{(L)}\\Theta^{(L)}+\\Sigma^{(L+1)}$", "subclass": "setup", "statement_clean": "", "statement": "For $L\\geq 1$, $\\Theta^{(L+1)}=\\dot\\Sigma^{(L)}\\Theta^{(L)}+\\Sigma^{(L+1)}$. The first summand is positive semi-definite (product of two PSD kernels), so positive-definiteness of $\\Theta^{(L+1)}$ reduces to that of $\\Sigma^{(L+1)}$.", "step_order": 1}, {"id": "PSP7.17", "name": "Inductive lift: positive-definiteness of $\\Sigma^{(2)}$ implies $\\Sigma^{(L)}$ for $L\\geq 2$", "subclass": "induction_step", "statement_clean": "", "statement": "Using $\\Sigma^{(L+1)}(x,x')=\\mathbb{E}_f[\\sigma(f(x))\\sigma(f(x'))]+\\beta^2$, $\\sum_{i,j}c_i c_j\\Sigma^{(L+1)}(x_i,x_j)=\\mathbb{E}[(\\sum_i c_i\\sigma(f(x_i)))^2]+(\\beta\\sum c_i)^2$ vanishes only when all $c_i=0$ if $\\Sigma^{(L)}$ is positive-definite (so $f(x_i)$ are non-degenerate Gaussian) and $\\sigma$ non-constant. Hence by induction $\\Sigma^{(L)}$ is PD for $L\\geq 2$.", "step_order": 2}, {"id": "PSP7.18", "name": "Reduce $\\Sigma^{(2)}$ to $\\hat\\mu$ via change of variables", "subclass": "substitute", "statement_clean": "", "statement": "$\\Sigma^{(2)}(x,x')=\\mathbb{E}_{(X,Y)\\sim\\mathcal{N}(0,\\tilde\\Sigma)}[\\sigma(X)\\sigma(Y)]+\\beta^2$ with $\\tilde\\Sigma$ depending on $\\frac{1}{n_0}x^T x'$. A change of variables yields $\\mathbb{E}[\\sigma(X)\\sigma(Y)]+\\beta^2=\\hat\\mu(\\frac{n_0\\beta^2+x^T x'}{n_0\\beta^2+1})+\\beta^2$ where $\\mu(x)=\\sigma(x\\sqrt{1/n_0+\\beta^2})$ and $\\hat\\mu$ is its dual.", "step_order": 3}, {"id": "PSP7.19", "name": "Hermite expansion: infinitely many nonzero $a_i$ since $\\sigma$ non-polynomial", "subclass": "apply_lemma", "statement_clean": "", "statement": "By Lemma \\ref{lem:daniely}, $\\hat\\mu(\\rho)=\\sum_i a_i^2 \\rho^i$ where $\\mu=\\sum_i a_i h_i$. Since $\\sigma$ is non-polynomial, $\\mu$ is non-polynomial, hence infinitely many $a_i$ are nonzero.", "step_order": 4}, {"id": "PSP7.20", "name": "Apply Schoenberg/Gneiting: $\\Sigma^{(2)}=\\nu(x^T x')$ with both even and odd nonzero coefficients", "subclass": "conclude", "statement_clean": "", "statement": "Write $\\Sigma^{(2)}(x,x')=\\nu(x^T x')$ with $\\nu(\\rho)=\\beta^2+\\sum_i a_i((n_0\\beta^2+\\rho)/(n_0\\beta^2+1))^i$. Power series of $\\nu$ has infinitely many nonzero even and odd terms; Theorem \\ref{thm:schoenberg} yields positive-definiteness of $\\Sigma^{(2)}$ on $\\mathbb{S}^{n_0-1}$, completing the proof.", "step_order": 5}], "input": [], "output": [], "equations": []}, "LP7.1": {"name": "A Priori Control on Weight Variation", "type": "lemma", "section": "Appendix A.3", "statement": "Under the setting of Theorem \\ref{thm:conv-ntk-training}, for a network of depth $L+1$ and any $\\ell=1,\\dots,L$: $\\lim_{n_L\\to\\infty}\\cdots\\lim_{n_1\\to\\infty}\\sup_{t\\in[0,T]}\\|\\frac{1}{\\sqrt{n_\\ell}}(W^{(\\ell)}(t)-W^{(\\ell)}(0))\\|_{op}=0$ in probability.", "statement_clean": "Normalised weights vary negligibly during training in the sequential infinite-width limit.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": ["Polynomial recursive bounds plus nonlinear Gr\u00f6nwall yield the vanishing of $\\tilde w^{(\\ell)}(t)$ in the sequential limit."], "step_info": [{"id": "PSP7.12", "name": "Express dynamics via back-propagated directions and sub-network NTKs", "subclass": "introduce_variable", "statement_clean": "", "statement": "Write $\\partial_t \\tilde\\alpha^{(\\ell)}=\\Phi_{\\Theta^{(\\ell)}}(\\langle d^{(\\ell)}_t,\\cdot\\rangle_{p^{in}})$ and $\\partial_t W^{(\\ell)}=\\frac{1}{\\sqrt{n_\\ell}}\\langle\\alpha^{(\\ell)},d^{(\\ell+1)}_t\\rangle_{p^{in}}$, with layer-wise back-propagated directions $d^{(\\ell)}_t=\\dot\\sigma(\\tilde\\alpha^{(\\ell)})(\\frac{1}{\\sqrt{n_\\ell}}W^{(\\ell)})^T d^{(\\ell+1)}_t$ (and $d^{(L+1)}_t=d_t$).", "step_order": 1}, {"id": "PSP7.13", "name": "Recursive polynomial bounds on $\\|d^{(\\ell)}_t\\|$ and $\\|\\Theta^{(\\ell)}\\|_{op}$", "subclass": "bound_estimate", "statement_clean": "", "statement": "Set $w^{(k)}(t)=\\|\\frac{1}{\\sqrt{n_k}}W^{(k)}(t)\\|_{op}$, $a^{(k)}(t)=\\|\\frac{1}{\\sqrt{n_k}}\\alpha^{(k)}(t)\\|_{p^{in}}$. Recursive bounds give $\\|d^{(\\ell)}_t\\|\\leq c^{L+1-\\ell}\\prod_{k=\\ell}^L w^{(k)}(t)\\|d_t\\|$ and $\\|\\Theta^{(\\ell+1)}\\|_{op}\\leq\\mathcal{P}(a^{(1)},\\dots,a^{(\\ell)},w^{(1)},\\dots,w^{(\\ell)})$ for a polynomial $\\mathcal{P}$.", "step_order": 2}, {"id": "PSP7.14", "name": "Construct $A(t)$ and bound its derivative", "subclass": "introduce_variable", "statement_clean": "", "statement": "Define $\\tilde a^{(k)},\\ ical Gaussian limit at convergence.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP7.2", "statement": "$f_{\\infty,k}(x) = \\kappa_{x,k}^T \\tilde{K}^{-1} y^* + (f_0(x) - \\kappa_{x,k}^T \\tilde{K}^{-1} y_0)$, with mean equal to the MAP estimate under a $\\mathcal{N}(0,\\Theta^{(L)}_\\infty)$ prior or to kernel ridge regression as $\\lambda\\to 0$.", "section": "5 Least-squares regression", "context": "", "parent_step": ""}]}, "ExP7.3": {"name": "Convergence along principal components on MNIST", "type": "example", "section": "6.3 Convergence along a principal component", "statement": "Compute first three NTK kernel principal components on a batch of $N=512$ MNIST digits using $n=10000$, with eigenvalues $\\lambda_1=0.0457, \\lambda_2=0.00108, \\lambda_3=0.00078$. Set $f^* = f_{\\theta(0)}+0.5 f^{(2)}$ and verify exponential decay $\\|g_t\\|_{p^{in}}=0.5 e^{-\\lambda_2 t}$ along the principal direction for widths $n=100,1000,10000$.", "statement_clean": "MNIST experiment confirming exponential decay along NTK kernel principal components, matching the theory.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP7.1", "statement": "$f_t = f^* + e^{-t\\Pi}(f_0-f^*) = f^* + \\Delta^0_f + \\sum_{i=1}^{Nn_L} e^{-t\\lambda_i}\\Delta^i_f$, where $f^{(i)}$ are kernel principal components and $\\lambda_i$ the corresponding eigenvalues of $\\Pi$.", "section": "5 Least-squares regression", "context": "", "parent_step": ""}]}};

var _lastDetailNode = null;
function showDetail(nodeId) {
  var panel = document.getElementById("detail-panel");
  // Toggle: click same node again to close
  if (_lastDetailNode === nodeId && panel.className === "open") {
    panel.className = "";
    panel.innerHTML = "";
    _lastDetailNode = null;
    return;
  }
  _lastDetailNode = nodeId;
  // Special case: orphan/misc node
  if (nodeId === '__orphan__') {
    var h = '<h3 style="margin:0 0 8px;font-size:16px;">Misc: Unconnected Equations</h3>';
    h += '<div style="font-size:12px;color:#888;margin-bottom:10px;">Equations not linked to any theorem or proof step</div>';
    ORPHANS.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    if (ORPHANS.length === 0) h += '<div style="color:#888;">No orphan equations.</div>';
    panel.innerHTML = h;
    panel.className = "open";
    typesetMath(panel);
    return;
  }
  var d = DETAILS[nodeId];
  if (!d) return;
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(nodeId) + ': ' + esc(d.name || d.type) + '</h3>';
  h += '<div style="font-size:12px;color:#888;margin-bottom:4px;">' + d.type + (d.section ? ' (Sec ' + d.section + ')' : '') + '</div>';
  // Origin badge — paper (default, shown only if external) or external (cited prior result)
  if (d.origin === "external") {
    var citeStr = d.origin_citation ? (' &mdash; ' + esc(d.origin_citation)) : '';
    h += '<div style="display:inline-block;padding:2px 8px;background:#FFF3E0;border:1px dashed #E65100;border-radius:3px;font-size:11px;color:#BF360C;margin-bottom:8px;">External (cited prior result)' + citeStr + '</div>';
  }
  // Foundation graph link badge (Case 1: known result)
  if (d.foundation_links && d.foundation_links.length > 0) {
    h += '<div style="display:inline-block;padding:2px 8px;background:#E3F2FD;border:1px solid #2471A3;border-radius:3px;font-size:11px;color:#2471A3;margin-bottom:8px;">&#128218; Known result: ' + d.foundation_links.map(esc).join(', ') + '</div>';
  }
  // Plain-text restatement (statement_clean) — shown above the formal statement
  if (d.statement_clean) {
    h += '<div class="detail-section"><h4>Plain-Text Summary</h4><div style="font-size:13px;color:#444;font-style:italic;">' + esc(d.statement_clean) + '</div></div>';
  }
  // Pre-build equation maps by context
  var eqsByCtx = {statement:[], assumption:[], conclusion:[], orphan:[]};
  var eqsByStep = {};
  if (d.equations) {
    d.equations.forEach(function(e) {
      if (e.parent_step) {
        if (!eqsByStep[e.parent_step]) eqsByStep[e.parent_step] = [];
        eqsByStep[e.parent_step].push(e);
      } else if (e.context && eqsByCtx[e.context]) {
        eqsByCtx[e.context].push(e);
      } else {
        eqsByCtx.orphan.push(e);
      }
    });
  }
  var eqTag = function(e) { return '<span style="color:#2471A3;font-size:11px;"> (' + e.id + ')</span>'; };
  var eqBlock = function(e) { return '<div style="margin:2px 0 2px 12px;padding:3px 8px;background:#EBF5FB;border-left:2px solid #5DADE2;font-size:12px;">' + esc(e.id) + ': ' + esc(e.statement) + '</div>'; };

  // Statement + inline statement equations
  if (d.statement) {
    h += '<div class="detail-section"><h4>Statement</h4><div style="font-size:14px;">' + esc(d.statement) + '</div>';
    eqsByCtx.statement.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Assumptions + inline assumption equations
  if ((d.assumptions && d.assumptions.length > 0) || eqsByCtx.assumption.length > 0) {
    h += '<div class="detail-section"><h4>Assumptions</h4>';
    if (d.assumptions) d.assumptions.forEach(function(a) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(a) + '</div>'; });
    eqsByCtx.assumption.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Conclusions + inline conclusion equations
  if ((d.conclusions && d.conclusions.length > 0) || eqsByCtx.conclusion.length > 0) {
    h += '<div class="detail-section"><h4>Conclusions</h4>';
    if (d.conclusions) d.conclusions.forEach(function(c) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(c) + '</div>'; });
    eqsByCtx.conclusion.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Proof strategy
  if (d.proof_info && d.proof_info.length > 0) {
    h += '<div class="detail-section"><h4>Proof Strategy</h4>';
    d.proof_info.forEach(function(p) {
      if (Array.isArray(p)) {
        p.forEach(function(item) { h += '<div style="font-size:13px;font-style:italic;">&bull; ' + esc(item) + '</div>'; });
      } else {
        h += '<div style="font-size:13px;font-style:italic;">' + esc(p) + '</div>';
      }
    });
    h += '</div>';
  }
  // v2: Step decomposition (proof_step children of a proof, or algorithm_step children of an algorithm)
  if (d.step_info && d.step_info.length > 0) {
    h += '<div class="detail-section"><h4>Decomposition (' + d.step_info.length + ' steps)</h4>';
    d.step_info.forEach(function(s, i) {
      var ord = (s.step_order || (i + 1));
      var label = s.name ? esc(s.name) : esc(s.id || ('Step ' + ord));
      h += '<div class="step-item"><strong>' + ord + '. ' + label + '</strong>';
      if (s.subclass) {
        h += ' <span style="font-size:11px;font-style:italic;color:#666;">[' + esc(s.subclass) + ']</span>';
      }
      var body = s.statement_clean || s.statement || '';
      if (body) {
        h += '<div style="font-size:12px;color:#444;margin-top:2px;">' + esc(body) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  // Algorithm input/output
  if (d.input && d.input.length > 0) {
    h += '<div class="detail-section"><h4>Input</h4>';
    d.input.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // (Legacy "Proof Steps" panel removed: same data now rendered above as
  // "Decomposition" via d.step_info. Both used to read from step_chains and
  // produced duplicate sections on click.)
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  typesetMath(panel);
}

  ghostEls.forEach(function(el) {

    if (!on) {
      el.style.display = "none";
      return;
    }
    // Edge gid pattern: "<prefix>_edge_<gi>_<ti>". For these, check target.
    if (GHOST_EDGE_TO_TARGET.hasOwnProperty(gid)) {
      var target = GHOST_EDGE_TO_TARGET[gid];
      var targetHidden = (AUX_NODE_SET[target] && !auxOn) || (EXT_NODE_SET[target] && !extOn);
      el.style.display = targetHidden ? "none" : "";
    } else {
      el.style.display = "";
    }
  });
}

// Generic helper: hide/show a set of nodes (by id) and their incident edges.
function _setNodeVisibility(nodeIds, edgeGids, visible, extraClass) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  nodeIds.forEach(function(nid) {
    // Body rect
    var body = svgEl.querySelector('[id="node_' + nid + '"]');
    if (body) {
      body.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) body.classList.add(extraClass);
        else body.classList.remove(extraClass);
      }
    }
    // All sibling per-node elements (header rect, text labels, divider lines)
    var sibs = svgEl.querySelectorAll('[id^="node_' + nid + '__"]');
    sibs.forEach(function(el) {
      el.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) el.classList.add(extraClass);
        else el.classList.remove(extraClass);
      }
    });
  });
  edgeGids.forEach(function(gid) {
    var e = svgEl.querySelector('[id="' + gid + '"]');
    if (e) e.style.display = visible ? "" : "none";
  });
}

// Examples & Remarks toggle — hides nodes with type in {example, remark}
function toggleAux() {
  var btn = document.getElementById("aux-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  // Apply visual differentiation: lighter shade (opacity) when shown
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, nextShowing, "node-aux-shown");
  // Apply opacity styling on the body rect when shown
  AUX_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) body.style.opacity = nextShowing ? "0.75" : "";
  });
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
}

// Cited Results (External) toggle — hides nodes with origin === "external"
function toggleExternal() {
  var btn = document.getElementById("ext-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, nextShowing, "node-external-shown");
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
  // Apply dashed border on body rect when shown (visual differentiation)
  EXT_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) {
      // FancyBboxPatch is a <path>; modify its stroke-dasharray for a dashed look.
      var pathEl = body.tagName === "path" ? body : body.querySelector("path");
      if (pathEl) {
        if (nextShowing) {
          pathEl.setAttribute("stroke-dasharray", "6,3");
          pathEl.setAttribute("stroke-width", "2");
        } else {
          pathEl.removeAttribute("stroke-dasharray");
          pathEl.removeAttribute("stroke-width");
        }
      }
    }
  });
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements + aux + external elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all foundation ghost elements (mathlib/proofwiki AND book-derived).
    // The [id^="ghost"] selector covers both "ghost_*" and "ghostbook_*".
    var all = svgEl.querySelectorAll('[id^="ghost"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
  // Examples & Remarks: hidden by default (toggle starts in OFF state).
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, false, null);
  // Cited Results (External): hidden by default.
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, false, null);
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() {
  if (svgEl) {
    var container = document.getElementById("svg-container");
    var svgW = svgEl.getBoundingClientRect().width / currentZoom;
    var svgH = svgEl.getBoundingClientRect().height / currentZoom;
    var cW = container.clientWidth - 20;
    var cH = container.clientHeight - 20;
    currentZoom = Math.min(cW / svgW, cH / svgH, 1.0);
    applyZoom();
  }
}
// Auto-fit on load
zoomFit();

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
