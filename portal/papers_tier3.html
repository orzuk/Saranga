<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tier 3 papers — SARANGA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site">
    <h1><a href="index.html" style="color:inherit;text-decoration:none">SARANGA Database</a></h1>
    <span class="crumbs">Tier 3 — 100K corpus graphs</span>
  </header>
  <main>
    <h2 id="tier3-heading">Tier 3 — Knowledge Graphs</h2>
    <p id="tier3-desc" style="color:#6a6a6a;font-size:14px;margin-bottom:18px">
      Interactive graph visualizations from the 100K math/CS corpus.
      Browse by category below.
    </p>
    <script>
    (function() {
      var cat = new URL(window.location.href).searchParams.get("cat");
      if (cat) {
        document.getElementById("tier3-heading").textContent = "Tier 3 — " + cat;
        document.getElementById("tier3-desc").innerHTML =
          '<a href="papers_tier3.html" style="color:#34495e;text-decoration:none">&larr; Back to categories</a>';
      }
    })();
    </script>
    <div id="listing"></div>
  </main>
  <script src="js/common.js"></script>
  <script>window.AuthomathicsListConfig = { mode: "papers", tier: 3 };</script>
  <script src="js/list.js"></script>
</body>
</html>
