<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #fafafa; }
#header { background: #2c3e50; color: white; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; }
#header h1 { margin: 0; font-size: 18px; }
#header .hint { font-size: 12px; color: #aaa; font-style: italic; margin-left: 12px; }
#controls button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; background: #34495e; color: white; margin-left: 8px; }
#controls button:hover { background: #4a6785; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 24px; background: #f5f5f5; border-bottom: 1px solid #eee; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-color { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #777; }
#main { display: flex; height: calc(100vh - 82px); }
#svg-container { flex: 1; overflow: auto; padding: 10px; cursor: grab; }
#svg-container svg { transform-origin: 0 0; }
#detail-panel { width: 0; overflow-y: auto; background: white; border-left: 1px solid #ddd; transition: width 0.3s; }
#detail-panel.open { width: 380px; padding: 16px; }
.detail-section { margin-bottom: 12px; }
.detail-section h4 { margin: 0 0 6px; color: #444; font-size: 13px; text-transform: uppercase; }
.step-item { background: #f0f0f0; border-left: 3px solid #839192; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.step-arrow { text-align: center; color: #aaa; font-size: 14px; }
.eq-item { background: #d4e6f1; border-left: 3px solid #5dade2; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.orphan-item { background: #fef9e7; border-left: 3px solid #f39c12; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; }
#orphan-panel { position: fixed; bottom: 16px; right: 16px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-width: 350px; max-height: 400px; overflow-y: auto; display: none; padding: 12px; z-index: 100; }
#orphan-toggle { display: none; }
/* Hover effect on clickable node rects */
[id^="node_"]:hover { filter: brightness(0.90); }
.ghost-node { display: inline-block; margin: 4px 8px; padding: 8px 14px; background: #E0E0E0; border: 1.5px solid #757575; border-radius: 5px; font-size: 13px; color: #333; cursor: pointer; vertical-align: top; white-space: normal; max-width: 220px; }
.ghost-node:hover { background: #BDBDBD; }
.ghost-node .ghost-label { font-weight: bold; font-size: 13px; }
.ghost-node .ghost-refs { font-size: 11px; color: #666; margin-top: 3px; }
/* Toggle controls panel (Foundation, Examples & Remarks, Cited Results) */
.toggle-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: 12px; padding: 4px 8px; background: #ECEFF1; border: 1px solid #CFD8DC; border-radius: 6px; }
.toggle-panel .toggle-label { font-size: 11px; color: #555; font-weight: bold; text-transform: uppercase; margin-right: 4px; }
.toggle-btn { padding: 4px 12px; border: 1.5px solid #757575; border-radius: 4px; background: #E0E0E0; cursor: pointer; font-size: 12px; color: #333; }
.toggle-btn:hover { background: #BDBDBD; }
.toggle-btn[data-showing="1"] { background: #2E7D32; color: white; border-color: #1B5E20; }
.toggle-btn[disabled] { opacity: 0.4; cursor: not-allowed; background: #EEE; }
/* Hidden state — applied dynamically via JS */
.svg-hidden { display: none !important; }
/* Visual differentiation when shown */
.node-external-shown [stroke-dasharray] { }  /* no-op, see runtime tweak */
.node-aux-shown { opacity: 0.75; }
/* v2: `resolves` edges (theorem-like resolves an open_problem/conjecture) — dashed */
.edge-resolves path { stroke-dasharray: 5,3 !important; }
.edge-resolves { stroke-dasharray: 5,3 !important; }
</style>

</div>

h(r) + h(c)$, with equality at the independence table $P = rc^T$.", "section": "3.1", "context": "", "parent_step": ""}]}, "DP5.4": {"name": "Cone of Distance Matrices", "type": "definition", "section": "2.2", "statement": "$\\mathcal{M} = \\{M \\in \\mathbb{R}_+^{d\\times d} : \\forall i, m_{ii}=0;\\ \\forall i,j,k,\\ m_{ij} \\leq m_{ik} + m_{kj}\\}$ is the cone of (pseudo-)metric matrices on $\\{1,\\ldots,d\\}$.", "statement_clean": "Nonnegative symmetric matrices with zero diagonal satisfying the triangle inequality.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "ProbP5.1": {"name": "Optimal Transportation Problem", "type": "problem", "section": "2.2", "statement": "Given a $d\\times d$ cost matrix $M$ and marginals $r,c \\in \\Sigma_d$, compute $d_M(r,c) \\defeq \\min_{P \\in U(r,c)} \\langle P, M \\rangle$.", "statement_clean": "Minimize the Frobenius inner product between a transportation plan P and a cost matrix M over the transportation polytope.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "DP5.5": {"name": "Entropy-Constrained Transportation Polytope", "type": "definition", "section": "3.1", "statement": "For $\\alpha \\geq 0$, $U_\\alpha(r,c) \\defeq \\{P \\in U(r,c) \\mid \\mathbf{KL}(P \\| rc^T) \\leq \\alpha\\} = \\{P \\in U(r,c) \\mid h(P) \\geq h(r)+h(c)-\\alpha\\}$.", "statement_clean": "Subset of $U(r,c)$ consisting of joint tables with KL distance at most $\\alpha$ from the independence table.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [{"id": "EP5.1", "statement": "$\\forall r, c \\in \\Sigma_d,\\ \\forall P \\in U(r,c),\\ h(P) \\leq h(r) + h(c)$, with equality at the independence table $P = rc^T$.", "section": "3.1", "context": "", "parent_step": ""}]}, "DP5.6": {"name": "Sinkhorn Distance", "type": "definition", "section": "3.1", "statement": "$d_{M,\\alpha}(r,c) \\defeq \\min_{P \\in U_\\alpha(r,c)} \\langle P, M \\rangle$ \u2014 the optimal transportation cost over the entropy-constrained polytope.", "statement_clean": "Optimal transport cost over the entropy-restricted transportation polytope.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "PrP5.1": {"name": "Sinkhorn Reduces to Optimal Transport for Large $\\alpha$", "type": "proposition", "section": "3.2", "statement": "For $\\alpha$ large enough, the Sinkhorn distance $d_{M,\\alpha}$ coincides with the classical transportation distance $d_M$.", "statement_clean": "When the entropic budget $\\alpha$ is large enough, the Sinkhorn distance equals the classical optimal transport distance.", "origin": "paper", "origin_citation": "", "assumptions": ["$\\alpha$ large enough", "$M \\in \\mathcal{M}$ (distance matrix)"], "conclusions": ["$d_{M,\\alpha}(r,c) = d_M(r,c)$ (Sinkhorn distance equals classical OT distance)"], "proof_info": ["Since $h(P) \\geq \\tfrac12(h(r)+h(c))$ for any $P \\in U(r,c)$, for $t$ large enough $U_t(r,c) = U(r,c)$, so $d_{M,t} = d_M$."], "step_info": [], "input": [], "output": [], "equations": []}, "PrP5.2": {"name": "Independence Kernel", "type": "proposition", "section": "3.2", "statement": "When $\\alpha = 0$ and $M$ is a Euclidean distance matrix, $d_{M,0}(r,c) = r^T M c$ is a negative-definite kernel; equivalently $e^{-t\\, r^T M c}$ is positive-definite for all $t>0$.", "statement_clean": "At $\\alpha=0$ with Euclidean $M$, the Sinkhorn distance reduces to $r^T M c$, which is negative-definite.", "origin": "paper", "origin_citation": "", "assumptions": ["$\\alpha = 0$", "$M$ is a Euclidean distance matrix"], "conclusions": ["$d_{M,0}(r,c) = r^T M c$ is a negative-definite kernel", "$e^{-t\\,r^T M c}$ is positive-definite for all $t > 0$"], "proof_info": ["When $\\alpha=0$, $U_0(r,c) = \\{rc^T\\}$ by Theorem 2.6.6 of Cover & Thomas, so $d_{M,0}(r,c) = r^T M c$. Expanding $m_{ij} = \\|\\varphi_i - \\varphi_j\\|^2$ shows $r^T M c$ is a sum of negative-definite kernels."], "step_info": [{"id": "PSP5.8", "name": "Reduce $U_0(r,c)$ to the singleton $\\{rc^T\\}$", "subclass": "apply_lemma", "statement_clean": "", "statement": "$U_0(r,c)$ contains all $P$ with $h(P) = h(r)+h(c)$; by Cover & Thomas Theorem 2.6.6 this forces $P = rc^T$, so $d_{M,0}(r,c) = \\langle rc^T, M\\rangle = r^T M c$.", "step_order": 1}, {"id": "PSP5.9", "name": "Expand $r^T M c$ via Euclidean embedding", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "Since $M$ is a Euclidean distance matrix, $m_{ij} = \\|\\varphi_i - \\varphi_j\\|^2$. Expanding gives $r^T M c = r^T u + c^T u - 2\\, r^T K c$ with $u_i = \\|\\varphi_i\\|^2$ and $K_{ij} = \\langle \\varphi_i, \\varphi_j\\rangle$, using $\\sum r_i = \\sum c_i = 1$.", "step_order": 2}, {"id": "PSP5.10", "name": "Show $r^T M c$ is a negative-definite kernel", "subclass": "conclude", "statement_clean": "", "statement": "$r^T u + c^T u$ is a sum of n.d. kernels (separable), and $-2 r^T K c$ is n.d. as the negative of a positive-definite kernel; their sum $r^T M c$ is therefore negative-definite.", "step_order": 3}], "input": [], "output": [], "equations": [], "foundation_links": ["Definition:Positive Definite"]}, "TP5.1": {"name": "Sinkhorn Distances Are Symmetric and Satisfy Triangle Inequality", "type": "theorem", "section": "3.2", "statement": "For all $\\alpha \\geq 0$ and $M \\in \\mathcal{M}$, $d_{M,\\alpha}$ is symmetric and satisfies all triangle inequalities. The function $(r,c) \\mapsto \\mathbf{1}_{r \\neq c}\\, d_{M,\\alpha}(r,c)$ satisfies all three distance axioms.", "statement_clean": "Sinkhorn distances are symmetric and obey the triangle inequality; multiplying by an indicator recovers the coincidence axiom.", "origin": "paper", "origin_citation": "", "assumptions": ["$\\alpha \\ge 0$", "$M \\in \\mathcal{M}$"], "conclusions": ["$d_{M,\\alpha}$ is symmetric and satisfies all triangle inequalities", "$(r,c) \\mapsto \\mathbf{1}_{r \\ne c}\\, d_{M,\\alpha}(r,c)$ satisfies all three distance axioms"], "proof_info": ["Symmetry follows from $M$'s symmetry. For the triangle inequality, glue optimal $P \\in U_\\alpha(x,y)$ and $Q \\in U_\\alpha(y,z)$ via Lemma 1 to obtain $S \\in U_\\alpha(x,z)$ and bound $\\langle S, M\\rangle$ using $m_{ik} \\leq m_{ij}+m_{jk}$."], "step_info": [{"id": "PSP5.1", "name": "Symmetry of $d_{M,\\alpha}$", "subclass": "setup", "statement_clean": "", "statement": "Symmetry of $d_{M,\\alpha}$ follows directly from the symmetry of the cost matrix $M$ and the symmetric role of $r, c$ in $U_\\alpha(r,c)$.", "step_order": 1}, {"id": "PSP5.2", "name": "Glue optimal plans via Lemma 1", "subclass": "apply_lemma", "statement_clean": "", "statement": "Let $P \\in U_\\alpha(x,y)$ and $Q \\in U_\\alpha(y,z)$ be the optimal plans for $d_{M,\\alpha}(x,y)$ and $d_{M,\\alpha}(y,z)$. Apply Lemma 1 to obtain $S \\in U_\\alpha(x,z)$.", "step_order": 2}, {"id": "PSP5.3", "name": "Bound $\\langle S, M\\rangle$ via triangle inequality on $M$", "subclass": "bound_estimate", "statement_clean": "", "statement": "$d_{M,\\alpha}(x,z) \\leq \\langle S, M\\rangle = \\sum_{ik} m_{ik} \\sum_j p_{ij}q_{jk}/y_j \\leq \\sum_{ijk} (m_{ij}+m_{jk}) p_{ij} q_{jk}/y_j$ using $m_{ik} \\leq m_{ij}+m_{jk}$.", "step_order": 3}, {"id": "PSP5.4", "name": "Marginalize and conclude", "subclass": "conclude", "statement_clean": "", "statement": "Splitting the sum and using $\\sum_k q_{jk}/y_j = 1$ and $\\sum_i p_{ij}/y_j = 1$ collapses the bound to $\\sum_{ij} m_{ij} p_{ij} + \\sum_{jk} m_{jk} q_{jk} = d_{M,\\alpha}(x,y) + d_{M,\\alpha}(y,z)$.", "step_order": 4}], "input": [], "output": [], "equations": [], "foundation_links": ["Inequalities", "Triangle Inequality"]}, "LP5.1": {"name": "Gluing Lemma With Entropic Constraint", "type": "lemma", "section": "3.2", "statement": "Let $\\alpha \\geq 0$ and $x,y,z \\in \\Sigma_d$. Given $P \\in U_\\alpha(x,y)$ and $Q \\in U_\\alpha(y,z)$, the matrix $S$ with $s_{ik} \\defeq \\sum_j p_{ij} q_{jk}/y_j$ satisfies $S \\in U_\\alpha(x,z)$.", "statement_clean": "Two entropy-constrained joint tables (P on x,y and Q on y,z) can be glued via the y-conditional product to produce an entropy-constrained joint table on (x,z).", "origin": "paper", "origin_citation": "", "assumptions": ["$\\alpha \\ge 0$", "$x, y, z \\in \\Sigma_d$", "$P \\in U_\\alpha(x,y)$ and $Q \\in U_\\alpha(y,z)$"], "conclusions": ["The matrix $S$ with $s_{ik} := \\sum_j p_{ij} q_{jk} / y_j$ satisfies $S \\in U_\\alpha(x,z)$"], "proof_info": ["Define $T$ on $\\{1,\\ldots,d\\}^3$ by $t_{ijk} = p_{ij}q_{jk}/y_j$ (and 0 when $y_j=0$); show $S = \\sum_j T$ has marginals $x$ and $z$; then use the data processing inequality on the Markov chain $X \\to Y \\to Z$ to get $h(S) \\geq h(x)+h(z)-\\alpha$."], "step_info": [{"id": "PSP5.5", "name": "Define the gluing distribution $T$", "subclass": "introduce_variable", "statement_clean": "", "statement": "Let $T$ be the joint on $\\{1,\\ldots,d\\}^3$ with $t_{ijk} \\defeq p_{ij}q_{jk}/y_j$ for $y_j>0$ (and $t_{ijk} = 0$ otherwise).", "step_order": 1}, {"id": "PSP5.6", "name": "Verify row and column sums of $S$", "subclass": "algebraic_manipulation", "statement_clean": "", "statement": "Set $S = [\\sum_j t_{ijk}]_{ik}$. Computing $\\sum_i \\sum_j s_{ijk}$ telescopes to $\\sum_j q_{jk} = z_k$ (column sums) and $\\sum_k \\sum_j s_{ijk}$ telescopes to $\\sum_j p_{ij} = x_i$ (row sums), so $S$ is a transportation matrix between $x$ and $z$.", "step_order": 2}, {"id": "PSP5.7", "name": "Entropy bound via data-processing inequality", "subclass": "apply_lemma", "statement_clean": "", "statement": "Since $p(X,Y,Z) = p(X)p(Y\\mid X)p(Z\\mid Y)$, $(X,Y,Z)$ is a Markov chain, so the data-processing inequality $I(X;Y) \\geq I(X;Z)$ yields $h(X,Z) - h(X) - h(Z) \\geq -\\alpha$, i.e. $h(S) \\geq h(x)+h(z)-\\alpha$.", "step_order": 3}], "input": [], "output": [], "equations": [], "foundation_links": ["Markov's Inequality", "Definition:Markov Chain"]}, "TP5.2": {"name": "Sinkhorn's Matrix-Scaling Theorem", "type": "theorem", "section": "4.1 (cited)", "statement": "Given a positive matrix $K = e^{-\\lambda M}$ and marginals $r, c$, there exist unique (up to scaling) positive vectors $u, v$ such that $P^\\lambda = \\mathrm{diag}(u)\\, K\\, \\mathrm{diag}(v)$ has row sums $r$ and column sums $c$.", "statement_clean": "A unique diagonal scaling of a positive matrix realizes any prescribed positive row and column sums.", "origin": "external", "origin_citation": "Sinkhorn 1967; Knight 2008", "assumptions": ["$K = e^{-\\lambda M}$ is a positive matrix", "Marginals $r, c$ are given"], "conclusions": ["$\\exists$ unique (up to scaling) positive $u, v$ such that $P^\\lambda = \\mathrm{diag}(u)\\,K\\,\\mathrm{diag}(v)$", "$P^\\lambda$ has row sums $r$ and column sums $c$"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "TP5.3": {"name": "Equality Condition in the Marginal Entropy Bound", "type": "theorem", "section": "Appendix (cited)", "statement": "For $P \\in U(r,c)$, equality $h(P) = h(r) + h(c)$ holds if and only if $P = rc^T$.", "statement_clean": "Joint entropy equals the sum of marginal entropies precisely when the joint is the product of its marginals.", "origin": "external", "origin_citation": "Cover & Thomas, Theorem 2.6.6", "assumptions": ["$P \\in U(r,c)$"], "conclusions": ["$h(P) = h(r) + h(c)$ if and only if $P = r c^T$"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "LP5.2": {"name": "Data Processing Inequality", "type": "lemma", "section": "Appendix (cited)", "statement": "If $X \\to Y \\to Z$ is a Markov chain, then $I(X;Y) \\geq I(X;Z)$.", "statement_clean": "Mutual information cannot increase along a Markov chain.", "origin": "external", "origin_citation": "Cover & Thomas, Theorem 2.8.1", "assumptions": ["$X \\to Y \\to Z$ is a Markov chain"], "conclusions": ["$I(X;Y) \\ge I(X;Z)$"], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [], "foundation_links": ["Markov's Inequality", "Definition:Markov Chain"]}, "AP5.2": {"name": "Network Simplex Method for Optimal Transportation", "type": "algorithm", "section": "2.2 (cited)", "statement": "Combinatorial LP solver computing the classical optimal transportation cost $d_M(r,c)$ with worst-case complexity $O(d^3 \\log d)$.", "statement_clean": "Classical LP solver for optimal transportation with super-cubic cost.", "origin": "external", "origin_citation": "Ahuja, Magnanti, Orlin 1993; Orlin 1993", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": ["Distance matrix $M \\in \\mathbb{R}^{d \\times d}$", "Marginals $r, c \\in \\Sigma_d$"], "output": ["Classical optimal-transport cost $d_M(r,c) = \\min_{P \\in U(r,c)} \\langle P, M\\rangle$"], "equations": [], "foundation_links": ["Simplex method"]}, "DP5.7": {"name": "Dual-Sinkhorn Divergence", "type": "definition", "section": "4", "statement": "$d_M^\\lambda(r,c) \\defeq \\langle P^\\lambda, M\\rangle$, where $P^\\lambda = \\arg\\min_{P \\in U(r,c)} \\langle P, M\\rangle - \\frac{1}{\\lambda} h(P)$. By duality, for each $\\alpha$ there is a $\\lambda \\in [0,\\infty]$ with $d_{M,\\alpha} = d_M^\\lambda$.", "statement_clean": "Lagrangian (entropically regularized) form of the Sinkhorn distance with multiplier $1/\\lambda$.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [], "foundation_links": ["Duality"]}, "AP5.1": {"name": "Sinkhorn-Knopp Algorithm", "type": "algorithm", "section": "4.1", "statement": "Iterative matrix-scaling algorithm that computes the dual-Sinkhorn divergence $d_M^\\lambda(r,c)$ via actor $L$ of the Gram matrix $K$; replace each histogram $r_i$ by $L r_i$ and store $r_i^T u$ to evaluate the Independence kernel quickly. The kernel is positive-definite on histograms with the same 1-norm but not on arbitrary vectors.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [], "foundation_links": ["Definition:Positive Definite"]}, "ExP5.1": {"name": "MNIST Digits Classification", "type": "example", "section": "5.1", "statement": "Classify MNIST digits (each treated as a normalized histogram on a $20\\times 20$ pixel grid) using SVMs with kernel $e^{-d/t}$, varying $N \\in \\{3,5,12,17,25\\}\\times 10^3$. Sinkhorn distance with $\\lambda=9$ outperforms EMD, Hellinger, $\\chi^2$, Total Variation, and Gaussian.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": [], "foundation_links": ["Definition:Total Variation"]}, "ExP5.2": {"name": "Convergence of Sinkhorn Distance to EMD", "type": "example", "section": "5.2", "statement": "Boxplot of $(d_M^\\lambda(r,c) - d_M(r,c))/d_M(r,c)$ over $40^2$ MNIST pairs as $\\lambda$ grows; even for large $\\lambda$, Sinkhorn hovers about 10\\% above EMD.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "ExP5.3": {"name": "Computational Speed Comparison", "type": "example", "section": "5.3", "statement": "Benchmark Sinkhorn (CPU and GPU) vs. Rubner's and Pele-Werman's EMD implementations on uniformly-sampled simplex points with random distance matrices. Sinkhorn is over $10^5$ times faster than EMD solvers at large $d$ with tolerance $0.01$; GPU adds another order of magnitude.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}, "ExP5.4": {"name": "Empirical Iteration-Count Complexity", "type": "example", "section": "5.4", "statement": "Replicates the speed experiment focusing on the number of Sinkhorn-Knopp iterations needed for $\\|x - x'\\|_2 \\leq 0.01$; iteration count grows as $e^{-\\lambda M}$ becomes diagonally dominant.", "statement_clean": "", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "step_info": [], "input": [], "output": [], "equations": []}};

    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // (Legacy "Proof Steps" panel removed: same data now rendered above as
  // "Decomposition" via d.step_info. Both used to read from step_chains and
  // produced duplicate sections on click.)
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  typesetMath(panel);
}
function resetView() {
  document.getElementById("detail-panel").className = "";
  document.getElementById("detail-panel").innerHTML = "";
}
function toggleOrphans() {
  var p = document.getElementById("orphan-panel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  var h = "";
  ORPHANS.forEach(function(e) { h += '<div class="orphan-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>'; });
  document.getElementById("orphan-list").innerHTML = h;
  p.style.display = "block";
  typesetMath(p);
}
// Foundation toggle (ghost nodes — both mathlib/proofwiki ("ghost_") and
// book entries ("ghostbook_") are picked up by the [id^="ghost"] selector).
function toggleGhosts() {
  var btn = document.getElementById("ghost-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  btn.dataset.showing = isShowing ? "0" : "1";
  _applyGhostVisibility();
}

// Apply current foundation visibility, respecting whether ghost edges' target
// nodes are currently hidden (aux/external toggles). A foundation arrow is
// only shown when (a) Foundation toggle is ON and (b) its target node is
// currently visible — otherwise it would float into empty space.
function _applyGhostVisibility() {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  var btn = document.getElementById("ghost-btn");
  var on = btn && btn.dataset.showing === "1";
  var auxBtn = document.getElementById("aux-btn");
  var extBtn = document.getElementById("ext-btn");
  var auxOn = auxBtn && auxBtn.dataset.showing === "1";
  var extOn = extBtn && extBtn.dataset.showing === "1";
  // Show/hide ghost boxes, headers, text, refs uniformly.
  var ghostEls = svgEl.querySelectorAll('[id^="ghost"]');
  ghostEls.forEach(function(el) {
    var gid = el.id;
    if (!on) {
      el.style.display = "none";
      return;
    }
    // Edge gid pattern: "<prefix>_edge_<gi>_<ti>". For these, check target.
    if (GHOST_EDGE_TO_TARGET.hasOwnProperty(gid)) {
      var target = GHOST_EDGE_TO_TARGET[gid];
      var targetHidden = (AUX_NODE_SET[target] && !auxOn) || (EXT_NODE_SET[target] && !extOn);
      el.style.display = targetHidden ? "none" : "";
    } else {
      el.style.display = "";
    }
  });
}

// Generic helper: hide/show a set of nodes (by id) and their incident edges.
function _setNodeVisibility(nodeIds, edgeGids, visible, extraClass) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  nodeIds.forEach(function(nid) {
    // Body rect
    var body = svgEl.querySelector('[id="node_' + nid + '"]');
    if (body) {
      body.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) body.classList.add(extraClass);
        else body.classList.remove(extraClass);
      }
    }
    // All sibling per-node elements (header rect, text labels, divider lines)
    var sibs = svgEl.querySelectorAll('[id^="node_' + nid + '__"]');
    sibs.forEach(function(el) {
      el.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) el.classList.add(extraClass);
        else el.classList.remove(extraClass);
      }
    });
  });
  edgeGids.forEach(function(gid) {
    var e = svgEl.querySelector('[id="' + gid + '"]');
    if (e) e.style.display = visible ? "" : "none";
  });
}

// Examples & Remarks toggle — hides nodes with type in {example, remark}
function toggleAux() {
  var btn = document.getElementById("aux-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  // Apply visual differentiation: lighter shade (opacity) when shown
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, nextShowing, "node-aux-shown");
  // Apply opacity styling on the body rect when shown
  AUX_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) body.style.opacity = nextShowing ? "0.75" : "";
  });
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
}

// Cited Results (External) toggle — hides nodes with origin === "external"
function toggleExternal() {
  var btn = document.getElementById("ext-btn");
  if (btn.disabled) return;
  var isShowing = btn.dataset.showing === "1";
  var nextShowing = !isShowing;
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, nextShowing, "node-external-shown");
  // Re-evaluate foundation edges (some now point to hidden/visible targets)
  _applyGhostVisibility();
  // Apply dashed border on body rect when shown (visual differentiation)
  EXT_NODE_IDS.forEach(function(nid) {
    var body = document.querySelector('#svg-container svg [id="node_' + nid + '"]');
    if (body) {
      // FancyBboxPatch is a <path>; modify its stroke-dasharray for a dashed look.
      var pathEl = body.tagName === "path" ? body : body.querySelector("path");
      if (pathEl) {
        if (nextShowing) {
          pathEl.setAttribute("stroke-dasharray", "6,3");
          pathEl.setAttribute("stroke-width", "2");
        } else {
          pathEl.removeAttribute("stroke-dasharray");
          pathEl.removeAttribute("stroke-width");
        }
      }
    }
  });
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements + aux + external elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all foundation ghost elements (mathlib/proofwiki AND book-derived).
    // The [id^="ghost"] selector covers both "ghost_*" and "ghostbook_*".
    var all = svgEl.querySelectorAll('[id^="ghost"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
  // Examples & Remarks: hidden by default (toggle starts in OFF state).
  _setNodeVisibility(AUX_NODE_IDS, AUX_EDGE_GIDS, false, null);
  // Cited Results (External): hidden by default.
  _setNodeVisibility(EXT_NODE_IDS, EXT_EDGE_GIDS, false, null);
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() {
  if (svgEl) {
    var container = document.getElementById("svg-container");
    var svgW = svgEl.getBoundingClientRect().width / currentZoom;
    var svgH = svgEl.getBoundingClientRect().height / currentZoom;
    var cW = container.clientWidth - 20;
    var cH = container.clientHeight - 20;
    currentZoom = Math.min(cW / svgW, cH / svgH, 1.0);
    applyZoom();
  }
}
// Auto-fit on load
zoomFit();

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
