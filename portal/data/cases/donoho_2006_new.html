in the proof.","statement_short":"","name":"","subclass":"","step_order":1,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":null}],"equations":[],"foundation_links":["Proof","relation","algorithm","Frame","Operator","matrix","optimization"]},"RP2":{"name":"Extension to general frames (referee remark)","type":"remark","section":"A. Tight Frames","statement":"A referee remarked that there is no need to restrict attention to tight frames here; if we have a general frame the same results go through, with constants involving the frame bounds. This is true and potentially very useful, although we will not use it in what follows.","statement_short":"","rigor":"semi_formal","confidence":0.75,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Frame"]},"DP32":{"name":"Weak $\\ell_p$ ball","type":"definition","section":"B. Weak $\\ell_{p}$ Balls","statement":"The weak $\\ell_{p}$ ball of radius $R$ consists of vectors $\\theta$ whose decreasing rearrangements $|\\theta|_{(1)} \\geq|\\theta|_{(2)} \\geq|\\theta|_{(3)} \\geq \\cdots$ obey\n\n$$\n|\\theta|_{(N)} \\leq R \\cdot N^{-1 / p}, \\quad N=1,2,3, \\ldots\n$$","statement_short":"","rigor":"","confidence":0.85,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"standard (uncited)","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Vectors"]},"DP33":{"name":"Weak $\\ell_p$ norm","type":"definition","section":"B. Weak $\\ell_{p}$ Balls","statement":"Conversely, for a given $\\theta$, the smallest $R$ for which these inequalities all hold is defined to be the norm: $\\|\\theta\\|_{w \\ell_{p}} \\equiv R$.","statement_short":"","rigor":"","confidence":0.85,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"standard (uncited)","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Inequalities","p-Norm"]},"ClP9":{"name":"Tail bound for weak $\\ell_p$ balls (V.1)","type":"claim","section":"B. Weak $\\ell_{p}$ Balls","statement":"Weak $\\ell_{p}$ constraints have the following key property: if $\\theta_{N}$ denotes a mutilated version of the vector $\\theta$ with all except the $N$ largest items set to zero, then the inequality\n\n\n\\begin{equation*}\n\\left\\|\\theta-\\theta_{N}\\right\\|_{q} \\leq \\zeta_{q, p} \\cdot R \\cdot(N+1)^{1 / q-1 / p} \\tag{V.1}\n\\end{equation*}\n\n\nis valid for $p<1$ and $q=1,2$, with $R=\\|\\theta\\|_{w \\ell_{p}}$.","statement_short":"","rigor":"","confidence":0.8,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"standard (uncited)","assumptions":["$\\theta_{N}$ denotes a mutilated version of the vector $\\theta$ with all except the $N$ largest items set to zero","$p<1$ and $q=1,2$"],"conclusions":["\\left\\|\\theta-\\theta_{N}\\right\\|_{q} \\leq \\zeta_{q, p} \\cdot R \\cdot(N+1)^{1 / q-1 / p}"],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[{"id":"EP14","statement":"\\left\\|\\theta-\\theta_{N}\\right\\|_{q} \\leq \\zeta_{q, p} \\cdot R \\cdot(N+1)^{1 / q-1 / p} \\tag{V.1}","section":"B. Weak $\\ell_{p}$ Balls","context":"statement","parent_step":""}],"foundation_links":["bound","vector","equation","inequality"]},"ClP10":{"name":"Results extend to weak $\\ell_p$ balls","type":"claim","section":"B. Weak $\\ell_{p}$ Balls","statement":"Hence, we can state results for spaces $Y_{p, m}(R)$ defined using only weak- $\\ell_{p}$ norms, and the proofs apply without change.","statement_short":"","rigor":"semi_formal","confidence":0.75,"tags":[],"inside":"","contains":[],"proofs":[{"id":"PP13","name":"Justification of the weak-$\\ell_p$ extension","proof_strategy":["direct"],"statement_short":"The proofs of Theorems 7 and 9 use only the tail bound (V.1) and $\\|\\theta\\|_p\\ge\\|\\theta\\|_{w\\ell_p}$.","rigor":"","confidence":0.7}],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":["direct"],"input":[],"output":[],"steps":[{"id":"PP13_s1","statement":"In fact, Theorems 7 and 9 only needed (V.1) in the proof, together with (implicitly) $\\|\\theta\\|_{p} \\geq\\|\\theta\\|_{w \\ell_{p}}$.","statement_clean":"In fact, Theorems 7 and 9 only needed (V.1) in the proof, together with (implicitly) $\\|\\theta\\|_{p} \\geq\\|\\theta\\|_{w \\ell_{p}}$.","statement_short":"","name":"","subclass":"","step_order":1,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":null}],"equations":[],"foundation_links":["Proof"]},"ExP3":{"name":"Compressed sensing for the Bump Algebra","type":"example","section":"A. Bump Algebra","statement":"Consider the class $\\mathcal{F}(B)$ of functions $f(t), t \\in[0,1]$ which are restrictions to the unit interval of functions belonging to the Bump Algebra $\\mathcal{B}$ [2], with bump norm $\\|f\\|_{\\mathcal{B}} \\leq B$. This was mentioned in the Introduction, which observed that the wavelet coefficients at level $j$ obey $\\left\\|\\theta^{(j)}\\right\\|_{1} \\leq C \\cdot B \\cdot 2^{-j}$ where $C$ depends only on the wavelet used. Here and later we use standard wavelet analysis notations as in [36], [37], [2].\n\nWe consider two ways of approximating functions in $f$. In the classic linear scheme, we fix a \"finest scale\" $j_{1}$ and measure the resum\u00e9 coefficients $\\beta_{j_{1}, k}=\\left\\langle f, \\varphi_{j_{1}, k}\\right\\rangle$ where $\\varphi_{j, k}= 2^{j / 2} \\varphi\\left(2^{j} t-k\\right)$, with $\\varphi$ a smooth function integrating to 1 . Think of these as point samples at scale $2^{-j_{1}}$ after applying an antialiasing filter. We reconstruct by $P_{j_{1}} f=\\sum_{k} \\beta_{j_{1}, k} \\varphi_{j_{1}, k}$ giving an approximation error\n\n$$\n\\left\\|f-P_{j_{1}} f\\right\\|_{2} \\leq C \\cdot\\|f\\|_{\\mathcal{B}} \\cdot 2^{-j_{1} / 2}\n$$\n\nwith $C$ depending only on the chosen wavelet. There are $N= 2^{j_{1}}$ coefficients $\\left(\\beta_{j_{1}, k}\\right)_{k}$ associated with the unit interval, and so the approximation error obeys\n\n$$\n\\left\\|f-P_{j_{1}} f\\right\\|_{2} \\leq C \\cdot\\|f\\|_{\\mathcal{B}} \\cdot N^{-1 / 2}\n$$\n\nIn the compressed sensing scheme, we need also wavelets $\\psi_{j, k}=2^{j / 2} \\psi\\left(2^{j} x-k\\right)$ where $\\psi$ is an oscillating function with mean zero. We pick a coarsest scale $j_{0}=j_{1} / 3$. We measure the resum\u00e9 coefficients $\\beta_{j_{0}, k}$-there are $2^{j_{0}}$ of these-and then let $\\theta \\equiv\\left(\\theta_{\\ell}\\right)_{\\ell=1}^{m}$ denote an enumeration of the detail wavelet coefficients $\\left(\\left(\\alpha_{j, k}: 0 \\leq k<2^{j}\\right): j_{0} \\leq j<j_{1}\\right)$. The dimension $m$ of $\\theta$ is $m=2^{j_{1}}-2^{j_{0}}$. The norm $\\|\\theta\\|_{1}$ satisfies\n\n$$\n\\|\\theta\\|_{1} \\leq \\sum_{j_{0}}^{j_{1}}\\left\\|\\left(\\alpha_{j, k}\\right)\\right\\|_{1} \\leq \\sum_{j_{0}}^{j_{1}} C \\cdot\\|f\\|_{\\mathcal{B}} \\cdot 2^{-j} \\leq c B 2^{-j_{0}} .\n$$\n\nThis establishes the constraint on $\\ell_{1}$ norm needed for our theory. We take $n=c \\cdot 2^{j_{0}} \\log \\left(2^{j_{1}}\\right)$ and apply a near-optimal information operator for this $n$ and $m$ (described in more detail later). We apply the near-optimal algorithm of $\\ell_{1}$ minimization, getting the error estimate\n\n$$\n\\begin{aligned}\n\\|\\hat{\\theta}-\\theta\\|_{2} & \\leq c\\|\\theta\\|_{1} \\cdot(n / \\log (m))^{-1 / 2} \\\\\n& \\leq c 2^{-\\frac{3}{2} j_{0}} \\leq c 2^{-j_{1} / 2}\n\\end{aligned}\n$$\n\nwith $c$ independent of $f \\in \\mathcal{F}(B)$. The overall reconstruction\n\n$$\n\\hat{f}=\\sum_{k} \\beta_{j_{0}, k} \\varphi_{j_{0}, k}+\\sum_{j=j_{0}}^{j_{1}-1} \\hat{\\alpha}_{j, k} \\psi_{j, k}\n$$\n\nhas error\n\n$$\n\\begin{aligned}\n\\|f-\\hat{f}\\|_{2} & \\leq\\left\\|f-P_{j_{1}} f\\right\\|_{2}+\\left\\|P_{j_{1}} f-\\hat{f}\\right\\|_{2} \\\\\n& =\\left\\|f-P_{j_{1}} f\\right\\|_{2}+\\|\\hat{\\theta}-\\theta\\|_{2} \\\\\n& \\leq c 2^{-j_{1} / 2}\n\\end{aligned}\n$$\n\nagain with $c$ independent of $f \\in \\mathcal{F}(B)$. This is of the same order of magnitude as the error of linear sampling.\n\nThe compressed sensing scheme takes a total of $2^{j_{0}}$ samples of resum\u00e9 coefficients and $n \\leq c 2^{j_{0}} \\log \\left(2^{j_{1}}\\right)$ samples associated with detail coefficients, for a total $\\leq c \\cdot j_{1} \\cdot 2^{j_{1} / 3}$ pieces of information. It achieves error comparable to classical sampling based on $2^{j_{1}}$ samples. Thus, it needs dramatically fewer samples for comparable accuracy: roughly speaking, only the cube root of the number of samples of linear sampling.\n\nTo achieve this dramatic reduction in sampling, we need an information operator based on some $\\Phi$ satisfying CS1-CS3. The underlying measurement kernels will be of the form\n\n\n\\begin{equation*}\n\\xi_{i}=\\sum_{j=1}^{m} \\Phi_{i, \\ell} \\phi_{\\ell}, \\quad i=1, \\ldots, n \\tag{VI.1}\n\\end{equation*}\n\n\nwhere the collection $\\left(\\phi_{\\ell}\\right)_{\\ell=1}^{m}$ is simply an enumeration of the wavelets $\\psi_{j, k}$, with $j_{0} \\leq j<j_{1}$ and $0 \\leq k<2^{j}$.","statement_short":"Bump Algebra functions: $\\ell_1$ minimization on wavelet details needs about the cube root of the linear-sampling count for comparable error.","rigor":"","confidence":0.75,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[{"id":"EP15","statement":"\\xi_{i}=\\sum_{j=1}^{m} \\Phi_{i, \\ell} \\phi_{\\ell}, \\quad i=1, \\ldots, n \\tag{VI.1}","section":"A. Bump Algebra","context":"statement","parent_step":""}],"foundation_links":["order of magnitude","Introduction","Definition:Cube Root","approximation","Wavelets","interval","Dimension","Compressed Sensing","equation","analysis","Function","algorithm","algebra","point","scale","Operator","magnitude","error","number"]},"ExP4":{"name":"Compressed sensing for images of Bounded Variation","type":"example","section":"B. Images of Bounded Variation","statement":"We consider now the model with images of Bounded Variation from the Introduction. Let $\\mathcal{F}(B)$ denote the class of functions $f(x)$ with domain $x \\in[0,1]^{2}$, having total variation at most $B$ [38], and bounded in absolute value by $\\|f\\|_{\\infty} \\leq B$ as well. In the Introduction, it was mentioned that the wavelet coefficients at level $j$ obey $\\left\\|\\theta^{(j)}\\right\\|_{1} \\leq C \\cdot B$ where $C$ depends only on the wavelet used. It is also true that $\\left\\|\\theta^{(j)}\\right\\|_{\\infty} \\leq C \\cdot B \\cdot 2^{-j}$.\n\nWe again consider two ways of approximating functions in $f$. The classic linear scheme uses a 2-D version of the scheme we have already discussed. We again fix a \"finest scale\" $j_{1}$ and measure the resum\u00e9 coefficients $\\beta_{j_{1}, k}=\\left\\langle f, \\varphi_{j_{1}, k}\\right\\rangle$ where now $k=\\left(k_{1}, k_{2}\\right)$ is a pair of integers $0 \\leq k_{1}, k_{2}<2^{j_{1}}$. indexing position. We use the Haar scaling function\n\n$$\n\\varphi_{j_{1}, k}=2^{j_{1}} \\cdot 1_{\\left\\{2^{j_{1}} x-k \\in[0,1]^{2}\\right\\}} .\n$$\n\nWe reconstruct by $P_{j_{1}} f=\\sum_{k} \\beta_{j_{1}, k} \\varphi_{j_{1}, k}$ giving an approximation error\n\n$$\n\\left\\|f-P_{j_{1}} f\\right\\|_{2} \\leq 4 \\cdot B \\cdot 2^{-j_{1} / 2}\n$$\n\nThere are $N=4^{j_{1}}$ coefficients $\\beta_{j_{1}, k}$ associated with the unit square, and so the approximation error obeys\n\n$$\n\\left\\|f-P_{j_{1}} f\\right\\|_{2} \\leq c \\cdot B \\cdot N^{-1 / 4}\n$$\n\nIn the compressed sensing scheme, we need also Haar wavelets $\\psi_{j_{1}, k}^{\\sigma}=2^{j_{1}} \\psi^{\\sigma}\\left(2^{j_{1}} x-k\\right)$ where $\\psi^{\\sigma}$ is an oscillating function with mean zero which is either horizontally oriented ( $\\sigma=v$ ), vertically oriented ( $\\sigma=h$ ), or diagonally oriented ( $\\sigma=d$ ). We pick a \"coarsest scale\" $j_{0}=j_{1} / 2$, and measure the resum\u00e9 coefficients $\\beta_{j_{0}, k}$-there are $4^{j_{0}}$ of these. Then let $\\theta \\equiv\\left(\\theta_{\\ell}\\right)_{\\ell=1}^{m}$ be the concatenation of the detail wavelet coefficients $\\left(\\left(\\alpha_{j, k}^{\\sigma}: 0 \\leq k_{1}, k_{2}<2^{j}, \\sigma \\in\\{h, v, d\\}\\right): j_{0} \\leq j<j_{1}\\right)$. The dimension $m$ of $\\theta$ is $m=4^{j_{1}}-4^{j_{0}}$. The norm $\\|\\theta\\|_{1}$ obeys\n\n$$\n\\|\\theta\\|_{1} \\leq \\sum_{j=j_{0}}^{j_{1}}\\left\\|\\left(\\theta^{(j)}\\right)\\right\\|_{1} \\leq c\\left(j_{1}-j_{0}+1\\right)\\|f\\|_{\\mathcal{B} \\mathcal{V}}\n$$\n\nThis establishes the constraint on $\\ell_{1}$ norm needed for applying our theory. We take $n=c \\cdot 4^{j_{0}} \\log ^{3}\\left(4^{j_{1}}\\right)$ and apply a near-optimal information operator for this $n$ and $m$. We apply the near-\\\\\noptimal algorithm of $\\ell_{1}$ minimization to the resulting information, getting the error estimate\n\n$$\n\\|\\hat{\\theta}-\\theta\\|_{2} \\leq c\\|\\theta\\|_{1} \\cdot(n / \\log (m))^{-1 / 2} \\leq c B \\cdot 2^{-j_{0}}\n$$\n\nwith $c$ independent of $f \\in \\mathcal{F}(B)$. The overall reconstruction\n\n$$\n\\hat{f}=\\sum_{k} \\beta_{j_{0}, k} \\varphi_{j_{0}, k}+\\sum_{j=j_{0}}^{j_{1}-1} \\hat{\\alpha}_{j, k} \\psi_{j, k}\n$$\n\nhas error\n\n$$\n\\begin{aligned}\n\\|f-\\hat{f}\\|_{2} & \\leq\\left\\|f-P_{j_{1}} f\\right\\|_{2}+\\left\\|P_{j_{1}} f-\\hat{f}\\right\\|_{2} \\\\\n& =\\left\\|f-P_{j_{1}} f\\right\\|_{2}+\\|\\hat{\\theta}-\\theta\\|_{2} \\\\\n& \\leq c 2^{-j_{1} / 2}\n\\end{aligned}\n$$\n\nagain with $c$ independent of $f \\in \\mathcal{F}(B)$. This is of the same order of magnitude as the error of linear sampling.\n\nThe compressed sensing scheme takes a total of $4^{j_{0}}$ samples of resum\u00e9 coefficients and $n \\leq c 4^{j_{0}} \\log ^{3}\\left(4^{j_{1}}\\right)$ samples associated with detail coefficients, for a total $\\leq c \\cdot j_{1}^{3} \\cdot 4^{j_{1} / 2}$ pieces of measured information. It achieves error comparable to classical sampling with $4^{j_{1}}$ samples. Thus, just as we have seen in the Bump Algebra case, we need dramatically fewer samples for comparable accuracy: roughly speaking, only the square root of the number of samples of linear sampling.","statement_short":"BV images: Haar-wavelet compressed sensing needs about the square root of the linear-sampling count.","rigor":"","confidence":0.75,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["order of magnitude","square","Introduction","approximation","Wavelets","Dimension","Compressed Sensing","Function","Definition:Bounded Variation","algorithm","algebra","scale","Definition:Total Variation","Operator","Definition:Absolute Value","Definition:Unit Square","magnitude","Definition:Square Root","error","number"]},"ExP5":{"name":"Compressed sensing for piecewise $C^2$ images with $C^2$ edges","type":"example","section":"C. Piecewise $C^{2}$ Images With $C^{2}$ Edges","statement":"We now consider an example where $p<1$, and we can apply the extensions to tight frames and to weak- $\\ell_{p}$ mentioned earlier. Again in the image processing setting, we use the $C^{2}-C^{2}$ model discussed in Cand\u00e8s and Donoho [39], [40]. Consider the collection $\\mathcal{C}^{2,2}(B, L)$ of piecewise smooth $f(x), x \\in[0,1]^{2}$, with values, first and second partial derivatives bounded by $B$, away from an exceptional set $\\Gamma$ which is a union of $C^{2}$ curves having first and second derivatives $\\leq B$ in an appropriate parametrization; the curves have total length $\\leq L$. More colorfully, such images are cartoons-patches of uniform smooth behavior separated by piecewise-smooth curvilinear boundaries. They might be reasonable models for certain kinds of technical imagery-e.g., in radiology.\n\nThe curvelets tight frame [40] is a collection of smooth frame elements offering a Parseval relation\n\n$$\n\\|f\\|_{2}^{2}=\\sum_{\\mu}\\left|\\left\\langle f, \\gamma_{\\mu}\\right\\rangle\\right|^{2}\n$$\n\nand reconstruction formula\n\n$$\nf=\\sum_{\\mu}\\left\\langle f, \\gamma_{\\mu}\\right\\rangle \\gamma_{\\mu} .\n$$\n\nThe frame elements have a multiscale organization, and frame coefficients $\\theta^{(j)}$ grouped by scale obey the weak $\\ell_{p}$ constraint\n\n$$\n\\left\\|\\theta^{(j)}\\right\\|_{w \\ell_{2 / 3}} \\leq c(B, L), \\quad f \\in \\mathcal{C}^{2,2}(B, L) ;\n$$\n\ncompare [40]. For such objects, classical linear sampling at scale $j_{1}$ by smooth 2-D scaling functions gives\n\n$$\n\\left\\|f-P_{j_{1}} f\\right\\|_{2} \\leq c \\cdot B \\cdot 2^{-j_{1} / 2}, \\quad f \\in \\mathcal{C}^{2,2}(B, L) .\n$$\n\nThis is no better than the performance of linear sampling for the Bounded Variation case, despite the piecewise $C^{2}$ character of $f$; the possible discontinuities in $f$ are responsible for the inability of linear sampling to improve its performance over $C^{2,2}(B, L)$ compared to Bounded Variation.\n\nIn the compressed sensing scheme, we pick a coarsest scale $j_{0}=j_{1} / 4$. We measure the resum\u00e9 coefficients $\\beta_{j_{0}, k}$ in a smooth wavelet expansion-there are $4^{j_{0}}$ of these-and then let $\\theta \\equiv\\left(\\theta_{\\ell}\\right)_{\\ell=1}^{m}$ denote a concatentation of the finer scale curvelet coefficients $\\left(\\theta^{(j)}: j_{0} \\leq j<j_{1}\\right)$. The dimension $m$ of $\\theta$ is $m=c\\left(4^{j_{1}}-4^{j_{0}}\\right)$, with $c>1$ due to overcompleteness of curvelets. The weak $\\ell^{2 / 3}$ \"norm\" obeys\n\n$$\n\\|\\theta\\|_{w \\ell_{2 / 3}} \\leq\\left(\\sum_{j_{0}}^{j_{1}}\\left\\|\\left(\\theta^{(j)}\\right)\\right\\|_{w \\ell_{2 / 3}}^{2 / 3}\\right)^{3 / 2} \\leq c\\left(j_{1}-j_{0}+1\\right)^{3 / 2}\n$$\n\nwith $c$ depending on $B$ and $L$. This establishes the constraint on weak $\\ell_{p}$ norm needed for our theory. We take\n\n$$\nn=c \\cdot 4^{j_{0}} \\log ^{5 / 2}\\left(4^{j_{1}}\\right)\n$$\n\nand apply a near-optimal information operator for this $n$ and $m$. We apply the near-optimal algorithm of $\\ell_{1}$ minimization to the resulting information, getting the error estimate\n\n$$\n\\|\\hat{\\theta}-\\theta\\|_{2} \\leq c\\|\\theta\\|_{2 / 3} \\cdot(n / \\log (m))^{-1} \\leq c^{\\prime} \\cdot 2^{-j_{1} / 2}\n$$\n\nwith $c^{\\prime}$ absolute. The overall reconstruction\n\n$$\n\\hat{f}=\\sum_{k} \\beta_{j_{0}, k} \\varphi_{j_{0}, k}+\\sum_{j=j_{0}}^{j_{1}-1} \\sum_{\\mu \\in M_{j}} \\hat{\\theta}_{\\mu}^{(j)} \\gamma_{\\mu}\n$$\n\nhas error\n\n$$\n\\begin{aligned}\n\\|f-\\hat{f}\\|_{2} & \\leq\\left\\|f-P_{j_{1}} f\\right\\|_{2}+\\left\\|P_{j_{1}} f-\\hat{f}\\right\\|_{2} \\\\\n& =\\left\\|f-P_{j_{1}} f\\right\\|_{2}+\\|\\hat{\\theta}-\\theta\\|_{2} \\\\\n& \\leq c 2^{-j_{1} / 2}\n\\end{aligned}\n$$\n\nagain with $c$ independent of $f \\in \\mathcal{C}^{2,2}(B, L)$. This is of the same order of magnitude as the error of linear sampling.\n\nThe compressed sensing scheme takes a total of $4^{j_{0}}$ samples of resum\u00e9 coefficients and $n \\leq c 4^{j_{0}} \\log ^{5 / 2}\\left(4^{j_{1}}\\right)$ samples associated with detail coefficients, for a total $\\leq c \\cdot j_{1}^{5 / 2} \\cdot 4^{j_{1} / 4}$ pieces of information. It achieves error comparable to classical sampling based on $4^{j_{1}}$ samples. Thus, even more so than in the Bump Algebra case, we need dramatically fewer samples for comparable accuracy: roughly speaking, only the fourth root of the number of samples of linear sampling.","statement_short":"Cartoon images in a curvelet frame (weak $\\ell_{2/3}$): compressed sensing needs about the fourth root of the linear-sampling count.","rigor":"","confidence":0.75,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["order of magnitude","length","Dimension","Union","Compressed Sensing","The Elements","Definition:Bounded Variation","formula","algorithm","algebra","p-Norm","scale","Operator","image","relation","Frame","Derivatives","magnitude","error","number"]},"TP15":{"name":"Theorem 10 (random matrices are CS matrices)","type":"theorem","section":"VII. Nearly All Matrices are CS Matrices","statement":"Theorem 10: Let $n, m_{n}$ be a sequence of problem sizes with $n \\rightarrow \\infty, n<m \\sim A n^{\\gamma}$, for $A>0$ and $\\gamma>1$. Let $\\Phi= \\Phi_{n, m}$ be a matrix with $m$ columns drawn independently and uniformly at random from $\\boldsymbol{S}^{n-1}$. Then for some $\\eta_{i}>0$ and $\\rho>0$, conditions CS1-CS3 hold for $\\Phi$ with overwhelming probability for all large $n$.","statement_short":"","rigor":"","confidence":0.95,"tags":["random_matrices","randomized"],"inside":"","contains":[],"proofs":[{"id":"PP15","name":"Proof of Theorem 10 (outline)","proof_strategy":["probabilistic"],"statement_short":"Show each of CS1, CS2, CS3 holds with probability tending to one (Sections VII-A-C) and intersect the events.","rigor":"","confidence":0.85}],"origin":"paper","origin_citation":"","assumptions":["$n, m_{n}$ be a sequence of problem sizes with $n \\rightarrow \\infty, n<m \\sim A n^{\\gamma}$, for $A>0$ and $\\gamma>1$","$\\Phi= \\Phi_{n, m}$ be a matrix with $m$ columns drawn independently and uniformly at random from $\\boldsymbol{S}^{n-1}$"],"conclusions":["for some $\\eta_{i}>0$ and $\\rho>0$, conditions CS1-CS3 hold for $\\Phi$ with overwhelming probability for all large $n$"],"proof_info":["probabilistic"],"input":[],"output":[],"steps":[{"id":"PSP55","statement":"The proof of Theorem 10 is conducted over Sections VII-A-C; it proceeds by studying events $\\Omega_{n}^{i}, i=1,2,3$, where $\\Omega_{n}^{1} \\equiv\\{\\mathrm{CS} 1$ Holds $\\}$, etc.","statement_clean":"The proof of Theorem 10 is conducted over Sections VII-A-C; it proceeds by studying events $\\Omega_{n}^{i}, i=1,2,3$, where $\\Omega_{n}^{1} \\equiv\\{\\mathrm{CS} 1$ Holds $\\}$, etc.","statement_short":"","name":"Events $\\Omega_n^i$","subclass":"setup","step_order":1,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP56","statement":"It will be shown that for parameters $\\eta_{i}>0$ and $\\rho_{i}>0$\n\n$$\nP\\left(\\Omega_{n}^{i}\\right) \\rightarrow 1, \\quad n \\rightarrow \\infty ;\n$$\n\nthen defining $\\rho=\\min _{i} \\rho_{i}$ and $\\Omega_{n}=\\cap_{i} \\Omega_{n}^{i}$, we have\n\n$$\nP\\left(\\Omega_{n}\\right) \\rightarrow 1, \\quad n \\rightarrow \\infty .\n$$\n\nSince, when $\\Omega_{n}$ occurs, our random draw has produced a matrix obeying CS1-CS3 with parameters $\\eta_{i}$ and $\\rho$, this proves Theorem 10.","statement_clean":"It will be shown that for parameters $\\eta_{i}>0$ and $\\rho_{i}>0$\n\n$$\nP\\left(\\Omega_{n}^{i}\\right) \\rightarrow 1, \\quad n \\rightarrow \\infty ;\n$$\n\nthen defining $\\rho=\\min _{i} \\rho_{i}$ and $\\Omega_{n}=\\cap_{i} \\Omega_{n}^{i}$, we have\n\n$$\nP\\left(\\Omega_{n}\\right) \\rightarrow 1, \\quad n \\rightarrow \\infty .\n$$\n\nSince, when $\\Omega_{n}$ occurs, our random draw has produced a matrix obeying CS1-CS3 with parameters $\\eta_{i}$ and $\\rho$, this proves Theorem 10.","statement_short":"","name":"Intersect the events","subclass":"conclude","step_order":2,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP57","statement":"The proof actually shows that for some $\\beta>0$, $P\\left(\\Omega_{n}^{c}\\right) \\leq \\exp (-\\beta n), n>n_{0}$; the convergence is exponentially fast.","stateme stic"],"input":[],"output":[],"steps":[{"id":"PSP58","statement":"The proof involves three ideas. The first idea is that the event of interest for Lemma 7.1 is representable in terms of events indexed by individual subsets $J$\n\n$$\n\\Omega_{n, m, \\rho, \\eta}=\\cap_{|J| \\leq \\rho n / \\log (m)} \\Omega_{n, J} .\n$$\n\nOur plan is to bound the probability of occurrence of every $\\Omega_{n, J}$.","statement_clean":"The proof involves three ideas. The first idea is that the event of interest for Lemma 7.1 is representable in terms of events indexed by individual subsets $J$\n\n$$\n\\Omega_{n, m, \\rho, \\eta}=\\cap_{|J| \\leq \\rho n / \\log (m)} \\Omega_{n, J} .\n$$\n\nOur plan is to bound the probability of occurrence of every $\\Omega_{n, J}$.","statement_short":"","name":"Intersection over subsets","subclass":"setup","step_order":1,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP59","statement":"The second idea is that for a specific subset $J$, we get large deviations bounds on the minimum eigenvalue; this can be stated as follows.\n\nLemma 7.2: For $J \\subset\\{1, \\ldots m\\}$, let $\\Omega_{n, J}$ denote the event that the minimum eigenvalue $\\lambda_{\\mathrm{min\\ }}\\left(\\Phi_{J}^{T} \\Phi_{J}\\right)$ exceeds $\\lambda<1$. Then there is $\\beta_{1}>0$ so that for sufficiently small $\\rho_{1}>0$ and all $n>n_{0}$\n\n$$\nP\\left(\\Omega_{n, J}^{c}\\right) \\leq \\exp \\left(-n \\beta_{1}\\right)\n$$\n\nuniformly in $|J| \\leq \\rho_{1} n$.\\\\[0pt]\nThis was derived in [11] and in [35], using the concentration of measure property of singular values of random matrices, e.g., see Szarek's work [41], [42].","statement_clean":"The second idea is that for a specific subset $J$, we get large deviations bounds on the minimum eigenvalue; this can be stated as follows.\n\nLemma 7.2: For $J \\subset\\{1, \\ldots m\\}$, let $\\Omega_{n, J}$ denote the event that the minimum eigenvalue $\\lambda_{\\ ction $\\phi_{i}: 1 \\leq i \\leq m- k$ ), there is an iterative algorithm, described below, producing a vector $y$ as output which obeys\n\n\n\\begin{equation*}\n\\left|\\left\\langle\\phi_{i}, y\\right\\rangle\\right| \\leq 1, \\quad i=1, \\ldots, m-k . \\tag{VII.9}\n\\end{equation*}\n\n\nLet $\\left(\\phi_{i}\\right)_{i=1}^{m-k}$ be i.i.d. uniform on $\\boldsymbol{S}^{n-1}$; there is an event $\\Omega_{\\sigma}$ described below, having probability controlled by\n\n\n\\begin{equation*}\n\\operatorname{Prob}\\left(\\Omega_{\\sigma}^{c}\\right) \\leq 2 n \\exp \\{-n \\beta\\} \\tag{VII.10}\n\\end{equation*}\n\n\nfor $\\beta>0$ which can be explicitly given in terms of $\\tau$ and $\\delta$. On this event\n\n\n\\begin{equation*}\n\\left\\|y-y_{0}\\right\\|_{2} \\leq \\delta \\cdot\\left\\|y_{0}\\right\\|_{2} \\tag{VII.11}\n\\end{equation*}","statement_short":"An iterative projection algorithm turns $\\epsilon_n\\sigma$ into a dual-feasible $y$ that, except with exponentially small probability, stays within $\\delta$ relative distance.","rigor":"semi_formal","confidence":0.95,"tags":[],"inside":"LP9","contains":[{"id":"AP5","name":"Sign-pattern embedding algorithm (iterative projection)","type":"algorithm","parent":"PSP79"},{"id":"LP11","name":"Lemma 7.8 (large deviations for Gaussian tail sums)","type":"lemma","parent":"PSP93"}],"proofs":[{"id":"PP21","name":"Proof of Individual Sign-Pattern Embedding (Lemma 7.7)","proof_strategy":["probabilistic","construction"],"statement_short":"Run the iterative projection algorithm from [11] and control its trajectory on nested events. The key step is a large-deviations bound for Gaussian tail sums (Lemma 7.8) at stage $\\ell=0$.","rigor":"","confidence":0.9}],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":["probabilistic, construction"],"input":[],"output":[],"steps":[{"id":"PSP79","statement":"An Embedding Algorithm: The companion paper [11] introduced an algorithm to create a dual feasible point $y$ starting from a nearby almost-feasible point $y_{0}$. It worked as follows.\n\\end{enumerate}\n\nLet $I_{0}$ be the collection of indices $1 \\leq i \\leq m$ with\n\n$$\n\\left|\\left\\langle\\phi_{i}, y_{0}\\right\\rangle\\right|>1 / 2\n$$\n\nand then set\n\n$$\ny_{1}=y_{0}-P_{I_{0}} y_{0},\n$$\n\nwhere $P_{I_{0}}$ denotes the least-squares projector $\\Phi_{I_{0}}\\left(\\Phi_{I_{0}}^{T} \\Phi_{I_{0}}\\right)^{-1} \\Phi_{I_{0}}^{T}$. In effect, identify the indices where $y_{0}$ exceeds half the forbidden level $\\left|\\left\\langle\\phi_{i}, y_{0}\\right\\rangle\\right|>1$, and \"kill\" those indices.\n\nContinue this process, producing $y_{2}, y_{3}$, etc., with stage-dependent thresholds $t_{\\ell} \\equiv 1-2^{-\\ell-1}$ successively closer to 1 . Set\n\n$$\nI_{\\ell}=\\left\\{i:\\left|\\left\\langle\\phi_{i}, y_{\\ell}\\right\\rangle\\right|>t_{\\ell}\\right\\}\n$$\n\nand, putting $J_{\\ell} \\equiv I_{0} \\cup \\cdots \\cup I_{\\ell}$,\n\n$$\ny_{\\ell+1}=y_{0}-P_{J_{\\ell}} y_{0} .\n$$\n\nIf $I_{\\ell}$ is empty, then the process terminates, and set $y=y_{\\ell}$. Termination must occur at stage $\\ell^{*} \\leq n$. At termination\n\n$$\n\\left|\\left\\langle\\phi_{i}, y\\right\\rangle\\right| \\leq 1-2^{-\\ell^{*}-1}, \\quad i=1, \\ldots, m .\n$$\n\nHence, $y$ is definitely dual feasible. The only question is how close to $y_{0}$ it is.","statement_clean":"An Embedding Algorithm: The companion paper [11] introduced an algorithm to create a dual feasible point $y$ starting from a nearby almost-feasible point $y_{0}$. It worked as follows.\n\\end{enumerate}\n\nLet $I_{0}$ be the collection of indices $1 \\leq i \\leq m$ with\n\n$$\n\\left|\\left\\langle\\phi_{i}, y_{0}\\right\\rangle\\right|>1 / 2\n$$\n\nand then set\n\n$$\ny_{1}=y_{0}-P_{I_{0}} y_{0},\n$$\n\nwhere $P_{I_{0}}$ denotes the least-squares projector $\\Phi_{I_{0}}\\left(\\Phi_{I_{0}}^{T} \\Phi_{I_{0}}\\right)^{-1} \\Phi_{I_{0}}^{T}$. In effect, identify the indices where $y_{0}$ exceeds half the forbidden level $\\left|\\left\\langle\\phi_{i}, y_{0}\\right\\rangle\\right|>1$, and \"kill\" those indices.\n\nContinue this process, producing $y_{2}, y_{3}$, etc., with stage-dependent thresholds $t_{\\ell} \\equiv 1-2^{-\\ell-1}$ successively closer to 1 . Set\n\n$$\nI_{\\ell}=\\left\\{i:\\left|\\left\\langle\\phi_{i}, y_{\\ell}\\right\\rangle\\right|>t_{\\ell}\\right\\}\n$$\n\nand, putting $J_{\\ell} \\equiv I_{0} \\cup \\cdots \\cup I_{\\ell}$,\n\n$$\ny_{\\ell+1}=y_{0}-P_{J_{\\ell}} y_{0} .\n$$\n\nIf $I_{\\ell}$ is empty, then the process terminates, and set $y=y_{\\ell}$. Termination must occur at stage $\\ell^{*} \\leq n$. At termination\n\n$$\n\\left|\\left\\langle\\phi_{i}, y\\right\\rangle\\right| \\leq 1-2^{-\\ell^{*}-1}, \\quad i=1, \\ldots, m .\n$$\n\nHence, $y$ is definitely dual feasible. The only question is how close to $y_{0}$ it is.","statement_short":"","name":"An Embedding Algorithm","subclass":"other","step_order":1,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.95},{"id":"PSP80","statement":"An Embedding Algorithm: The companion paper [11] introduced an algorithm to create a dual feasible point $y$ starting from a nearby almost-feasible point $y_{0}$. It worked as follows.","statement_clean":"An Embedding Algorithm: The companion paper [11] introduced an algorithm to create a dual feasible point $y$ starting from a nearby almost-feasible point $y_{0}$. It worked as follows.","statement_short":"","name":"From [11]","subclass":"setup","step_order":1,"type":"proof_step","depth":1,"parent_step":"PSP79","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP81","statement":"Let $I_{0}$ be the collection of indices $1 \\leq i \\leq m$ with\n\n$$\n\\left|\\left\\langle\\phi_{i}, y_{0}\\right\\rangle\\right|>1 / 2\n$$\n\nand then set\n\n$$\ny_{1}=y_{0}-P_{I_{0}} y_{0},\n$$\n\nwhere $P_{I_{0}}$ denotes the least-squares projector $\\Phi_{I_{0}}\\left(\\Phi_{I_{0}}^{T} \\Phi_{I_{0}}\\right)^{-1} \\Phi_{I_{0}}^{T}$. In effect, identify the indices where $y_{0}$ exceeds half the forbidden level $\\left|\\left\\langle\\phi_{i}, y_{0}\\right\\rangle\\right|>1$, and \"kill\" those indices.\n\nContinue this process, producing $y_{2}, y_{3}$, etc., with stage-dependent thresholds $t_{\\ell} \\equiv 1-2^{-\\ell-1}$ successively closer to 1 . Set\n\n$$\nI_{\\ell}=\\left\\{i:\\left|\\left\\langle\\phi_{i}, y_{\\ell}\\right\\rangle\\right|>t_{\\ell}\\right\\}\n$$\n\nand, putting $J_{\\ell} \\equiv I_{0} \\cup \\cdots \\cup I_{\\ell}$,\n\n$$\ny_{\\ell+1}=y_{0}-P_{J_{\\ell}} y_{0} .\n$$\n\nIf $I_{\\ell}$ is empty, then the process terminates, and set $y=y_{\\ell}$.","statement_clean":"Let $I_{0}$ be the collection of indices $1 \\leq i \\leq m$ with\n\n$$\n\\left|\\left\\langle\\phi_{i}, y_{0}\\right\\rangle\\right|>1 / 2\n$$\n\nand then set\n\n$$\ny_{1}=y_{0}-P_{I_{0}} y_{0},\n$$\n\nwhere $P_{I_{0}}$ denotes the least-squares projector $\\Phi_{I_{0}}\\left(\\Phi_{I_{0}}^{T} \\Phi_{I_{0}}\\right)^{-1} \\Phi_{I_{0}}^{T}$. In effect, identify the indices where $y_{0}$ exceeds half the forbidden level $\\left|\\left\\langle\\phi_{i}, y_{0}\\right\\rangle\\right|>1$, and \"kill\" those indices.\n\nContinue this process, producing $y_{2}, y_{3}$, etc., with stage-dependent thresholds $t_{\\ell} \\equiv 1-2^{-\\ell-1}$ successively closer to 1 . Set\n\n$$\nI_{\\ell}=\\left\\{i:\\left|\\left\\langle\\phi_{i}, y_{\\ell}\\right\\rangle\\right|>t_{\\ell}\\right\\}\n$$\n\nand, putting $J_{\\ell} \\equiv I_{0} \\cup \\cdots \\cup I_{\\ell}$,\n\n$$\ny_{\\ell+1}=y_{0}-P_{J_{\\ell}} y_{0} .\n$$\n\nIf $I_{\\ell}$ is empty, then the process terminates, and set $y=y_{\\ell}$.","statement_short":"","name":"The algorithm","subclass":"setup","step_order":2,"type":"proof_step","depth":1,"parent_step":"PSP79","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP82","statement":"Termination must occur at stage $\\ell^{*} \\leq n$. At termination\n\n$$\n\\left|\\left\\langle\\phi_{i}, y\\right\\rangle\\right| \\leq 1-2^{-\\ell^{*}-1}, \\quad i=1, \\ldots, m .\n$$\n\nHence, $y$ is definitely dual feasible. The only question is how close to $y_{0}$ it is.","statement_clean":"Termination must occur at stage $\\ell^{*} \\leq n$. At termination\n\n$$\n\\left|\\left\\langle\\phi_{i}, y\\right\\rangle\\right| \\leq 1-2^{-\\ell^{*}-1}, \\quad i=1, \\ldots, m .\n$$\n\nHence, $y$ is definitely dual feasible. The only question is how close to $y_{0}$ it is.","statement_short":"","name":"Dual feasibility at termination","subclass":"conclude","step_order":3,"type":"proof_step","depth":1,"parent_step":"PSP79","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP83","statement":"2) Analysis Framework: Also in [11] bounds were developed for two key descriptors of the algorithm trajectory\n\n$$\n\\alpha_{\\ell}=\\left\\|y_{\\ell}-y_{\\ell-1}\\right\\|_{2}\n$$\n\nand\n\n$$\n\\left|I_{\\ell}\\right|=\\#\\left\\{i:\\left|\\left\\langle\\phi_{i}, y_{\\ell}\\right\\rangle\\right|>1-2^{-\\ell-1}\\right\\} .\n$$\n\nWe adapt the arguments deployed there. We define bounds $\\delta_{\\ell} \\equiv \\delta_{\\ell ; n}$ and $\\nu_{\\ell} \\equiv \\nu_{\\ell ; n}$ for $\\alpha_{\\ell}$ and $\\left|I_{\\ell}\\right|$, of the form\n\n$$\n\\begin{gathered}\n\\delta_{\\ell ; n}=\\left\\|y_{0}\\right\\|_{2} \\cdot \\omega^{\\ell}, \\quad \\ell=1,2, \\ldots \\\\\n\\nu_{\\ell ; n}=n \\cdot \\lambda_{0} \\cdot \\epsilon_{n}^{2} \\cdot \\omega^{2 \\ell+2} / 4, \\quad \\ell=0,1,2, \\ldots ;\n\\end{gathered}\n$$\n\nhere $\\lambda_{0}=1 / 2$ and $\\omega=\\min \\left(1 / 2, \\delta / 2, \\omega_{0}\\right)$, where $\\omega_{0}>0$ will be defined later. We define subevents\n\n$$\n\\begin{aligned}\nE_{\\ell}=\\{ & \\alpha_{j} \\leq \\delta_{j}, j=1, \\ldots, \\ell, \\\\\n& \\left.\\left|I_{j}\\right| \\leq \\nu_{j}, j=0, \\ldots, \\ell-1\\right\\} .\n\\end{aligned}\n$$\n\nNow define\n\n$$\n\\Omega_{\\sigma}=\\cap_{\\ell=1}^{n} E_{\\ell} ;\n$$\n\nthis event implies, because $\\omega \\leq 1 / 2$\n\n$$\n\\begin{aligned}\n\\left\\|y-y_{0}\\right\\|_{2} & \\leq\\left(\\sum \\alpha_{\\ell}^{2}\\right)^{1 / 2} \\leq\\left\\|y_{0}\\right\\|_{2} \\cdot \\omega /\\left(1-\\omega^{2}\\right)^{1 / 2} \\\\\n& \\leq\\left\\|y_{0}\\right\\|_{2} \\cdot \\delta\n\\end{aligned}\n$$\n\nWe will show that, for $\\beta>0$ chosen in conjunction with $\\tau>0$\n\n\n\\begin{equation*}\nP\\left(E_{\\ell+1}^{c} \\mid E_{\\ell}\\right) \\leq 2 \\exp \\{-\\beta n\\} . \\tag{VII.12}\n\\end{equation*}\n\n\nThis implies\n\n$$\nP\\left(\\Omega_{\\sigma}^{c}\\right) \\leq 2 n \\exp \\{-\\beta n\\}\n$$\n\nand the lemma follows. \\(\\square\\)","statement_clean":"2) Analysis Framework: Also in [11] bounds were developed for two key descriptors of the algorithm trajectory\n\n$$\n\\alpha_{\\ell}=\\left\\|y_{\\ell}-y_{\\ell-1}\\right\\|_{2}\n$$\n\nand\n\n$$\n\\left|I_{\\ell}\\right|=\\#\\left\\{i:\\left|\\left\\langle\\phi_{i}, y_{\\ell}\\right\\rangle\\right|>1-2^{-\\ell-1}\\right\\} .\n$$\n\nWe adapt the arguments deployed there. We define bounds $\\delta_{\\ell} \\equiv \\delta_{\\ell ; n}$ and $\\nu_{\\ell} \\equiv \\nu_{\\ell ; n}$ for $\\alpha_{\\ell}$ and $\\left|I_{\\ell}\\right|$, of the form\n\n$$\n\\begin{gathered}\n\\delta_{\\ell ; n}=\\left\\|y_{0}\\right\\|_{2} \\cdot \\omega^{\\ell}, \\quad \\ell=1,2, \\ldots \\\\\n\\nu_{\\ell ; n}=n \\cdot \\lambda_{0} \\cdot \\epsilon_{n}^{2} \\cdot \\omega^{2 \\ell+2} / 4, \\quad \\ell=0,1,2, \\ldots ;\n\\end{gathered}\n$$\n\nhere $\\lambda_{0}=1 / 2$ and $\\omega=\\min \\left(1 / 2, \\delta / 2, \\omega_{0}\\right)$, where $\\omega_{0}>0$ will be defined later. We define subevents\n\n$$\n\\begin{aligned}\nE_{\\ell}=\\{ & \\alpha_{j} \\leq \\delta_{j}, j=1, \\ldots, \\ell, \\\\\n& \\left.\\left|I_{j}\\right| \\leq \\nu_{j}, j=0, \\ldots, \\ell-1\\right\\} .\n\\end{aligned}\n$$\n\nNow define\n\n$$\n\\Omega_{\\sigma}=\\cap_{\\ell=1}^{n} E_{\\ell} ;\n$$\n\nthis event implies, because $\\omega \\leq 1 / 2$\n\n$$\n\\begin{aligned}\n\\left\\|y-y_{0}\\right\\|_{2} & \\leq\\left(\\sum \\alpha_{\\ell}^{2}\\right)^{1 / 2} \\leq\\left\\|y_{0}\\right\\|_{2} \\cdot \\omega /\\left(1-\\omega^{2}\\right)^{1 / 2} \\\\\n& \\leq\\left\\|y_{0}\\right\\|_{2} \\cdot \\delta\n\\end{aligned}\n$$\n\nWe will show that, for $\\beta>0$ chosen in conjunction with $\\tau>0$\n\n\n\\begin{equation*}\nP\\left(E_{\\ell+1}^{c} \\mid E_{\\ell}\\right) \\leq 2 \\exp \\{-\\beta n\\} . \\tag{VII.12}\n\\end{equation*}\n\n\nThis implies\n\n$$\nP\\left(\\Omega_{\\sigma}^{c}\\right) \\leq 2 n \\exp \\{-\\beta n\\}\n$$\n\nand the lemma follows. \\(\\square\\)","statement_short":"","name":"Analysis Framework","subclass":"other","step_order":2,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.95},{"id":"PSP84","statement":"2) Analysis Framework: Also in [11] bounds were developed for two key descriptors of the algorithm trajectory\n\n$$\n\\alpha_{\\ell}=\\left\\|y_{\\ell}-y_{\\ell-1}\\right\\|_{2}\n$$\n\nand\n\n$$\n\\left|I_{\\ell}\\right|=\\#\\left\\{i:\\left|\\left\\langle\\phi_{i}, y_{\\ell}\\right\\rangle\\right|>1-2^{-\\ell-1}\\right\\} .\n$$","statement_clean":"2) Analysis Framework: Also in [11] bounds were developed for two key descriptors of the algorithm trajectory\n\n$$\n\\alpha_{\\ell}=\\left\\|y_{\\ell}-y_{\\ell-1}\\right\\|_{2}\n$$\n\nand\n\n$$\n\\left|I_{\\ell}\\right|=\\#\\left\\{i:\\left|\\left\\langle\\phi_{i}, y_{\\ell}\\right\\rangle\\right|>1-2^{-\\ell-1}\\right\\} .\n$$","statement_short":"","name":"Trajectory descriptors","subclass":"setup","step_order":1,"type":"proof_step","depth":1,"parent_step":"PSP83","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP85","statement":"We adapt the arguments deployed there. We define bounds $\\delta_{\\ell} \\equiv \\delta_{\\ell ; n}$ and $\\nu_{\\ell} \\equiv \\nu_{\\ell ; n}$ for $\\alpha_{\\ell}$ and $\\left|I_{\\ell}\\right|$, of the form\n\n$$\n\\begin{gathered}\n\\delta_{\\ell ; n}=\\left\\|y_ t\n\n$$\n\\rho_{0}(\\tau, \\omega ; n)=(128)^{-1} \\frac{\\log \\left(A n^{\\gamma}\\right)}{\\log \\left(A n^{\\gamma} / \\tau n\\right)} \\frac{\\omega^{2}}{1-\\omega^{2}}\n$$\n\nand note that this depends quite weakly on $n$. Recall that the event $E_{\\ell}$ is defined in terms of $\\omega$ and $\\tau$. On the event $E_{\\ell}$, $\\left|J_{\\ell}\\right| \\leq \\rho_{0} n / \\log (m)$. Lemma 7.1 implicitly defined a quantity $\\lambda_{1}(\\rho, A, \\gamma)$ lowerbounding the minimum eigenvalue of\\\\\nevery $\\Phi_{J}^{T} \\Phi_{J}$ where $|J| \\leq \\rho n / \\log (m)$. Pick $\\rho_{1 / 2}>0$ so that $\\lambda_{1}\\left(\\rho_{1 / 2}, A, \\gamma\\right)>1 / 2$. Pick $\\omega_{0}$ so that\n\n$$\n\\rho_{0}\\left(\\tau, \\omega_{0} ; n\\right)<\\rho_{1 / 2}, \\quad n>n_{0}\n$$\n\nWith this choice of $\\omega_{0}$, when the event $E_{\\ell}$ occurs,\n\n$$\n\\lambda_{\\min }\\left(\\Phi_{I_{\\ell}}^{T} \\Phi_{I_{\\ell}}\\right)>\\lambda_{0}\n$$\n\nAlso, on $E_{\\ell}, u_{j}=2^{-j-1} / \\alpha_{j}>2^{-j-1} / \\delta_{j}=v_{j}$ (say) for $j \\leq \\ell$.\\\\[0pt]\nIn [11], an analysis framework was developed in which a family $\\left(Z_{i}^{\\ell}: 1 \\leq i \\leq m, 0 \\leq \\ell<n\\right)$ of random variables i.i.d. $N\\left(0, \\frac{1}{n}\\right)$ was introduced, and it was shown that\n\n$$\nP\\left\\{G_{\\ell}^{c} \\mid E_{\\ell}\\right\\} \\leq P\\left\\{\\sum_{i} 1_{\\left\\{\\left|Z_{i}^{\\ell}\\right|>v_{\\ell}\\right\\}}>\\nu_{\\ell}\\right\\}\n$$\n\nand\n\n$$\n\\begin{aligned}\nP & \\left\\{F_{\\ell+1}^{c} \\mid G_{\\ell}, E_{\\ell}\\right\\} \\\\\n& \\leq P\\left\\{2 \\cdot \\lambda_{0}^{-1}\\left[\\nu_{\\ell}+\\delta_{\\ell}^{2}\\left(\\sum_{i}\\left(Z_{i}^{\\ell}\\right)^{2} 1_{\\left\\{\\left|Z_{i}^{\\ell}\\right|>v_{\\ell}\\right\\}}\\right)\\right]>\\delta_{\\ell+1}^{2}\\right\\} .\n\\end{aligned}\n$$\n\nThat paper also stated two simple large deviations bounds.\\\\\nLemma 7.8: Let $Z_{i}$ be i.i.d. $N(0,1), k \\geq 0, t>2$\n\n$$\n\\frac{1}{m} \\log P\\left\\{\\sum_{i=1}^{m-k} Z_{i}^{2} 1_{\\left\\{\\left|Z_{i}\\right|>t\\right\\}}>m \\Delta\\right\\} \\leq e^{-t^{2} / 4}-\\Delta / 4\n$$\n\nand\n\n$$\n\\frac{1}{m} \\log P\\left\\{\\sum_{i=1}^{m-k} 1_{\\left\\{\\left|Z_{i}\\right|>t\\right\\}}>m \\Delta\\right\\} \\leq e^{-t^{2} / 2}-\\Delta / 4\n$$\n\nApplying this, we note that the event\n\n$$\n\\left\\{2 \\cdot \\lambda_{0}^{-1}\\left[\\nu_{\\ell}+\\delta_{\\ell}^{2}\\left(\\sum_{i}\\left(Z_{i}^{\\ell}\\right)^{2} 1_{\\left\\{\\left|Z_{i}^{\\ell}\\right|>v_{\\ell}\\right\\}}\\right)\\right]>\\delta_{\\ell+1}^{2}\\right\\}\n$$\n\nstated in terms of $N\\left(0, \\frac{1}{n}\\right)$ variables, is equivalent to an event\n\n$$\n\\left\\{\\sum_{i=1}^{m-k} Z_{i}^{2} 1_{\\left\\{\\left|Z_{i}\\right|>\\tau_{\\ell}\\right\\}}>m \\Delta_{\\ell}\\right\\}\n$$\n\nstated in terms of standard $N(0,1)$ random variables, where\n\n$$\n\\tau_{\\ell}^{2}=n \\cdot v_{\\ell}^{2}=\\epsilon_{n}^{-2}(2 \\omega)^{-2 \\ell} / 4\n$$\n\nand\n\n$$\n\\Delta_{\\ell}=\\frac{n}{m}\\left(\\lambda_{0} \\delta_{\\ell+1}^{2} / 2-\\nu_{\\ell}\\right) / \\delta_{\\ell}^{2}\n$$\n\nWe therefore have for $n>n_{0}$ the inequality\n\n$$\n\\frac{1}{m} \\log P\\left\\{F_{\\ell+1}^{c} \\mid G_{\\ell}, E_{\\ell}\\right\\} \\leq e^{-\\tau_{\\ell}^{2} / 4}-\\Delta_{\\ell} / 4\n$$\n\nNow\n\n$$\n\\begin{aligned}\ne^{-\\tau_{\\ell}^{2} / 4} & =e^{-[(16 \\log (m / \\tau n)) / 16] \\cdot(2 \\omega)^{-2 \\ell}} \\\\\n& =(\\tau n / m)^{(2 \\omega)^{-2 \\ell}}\n\\end{aligned}\n$$\n\nand\n\n$$\n\\Delta_{\\ell}=\\frac{n}{m}\\left(\\omega^{2} / 4-\\omega^{2} / 8\\right)=\\frac{n}{m} \\omega^{2} / 8\n$$\n\nSince $\\omega \\leq 1 / 2$, the term of most concern in $(\\tau n / m)^{(2 \\omega)^{-2 \\ell}}$ is at $\\ell=0$; the other terms are always better. Also $\\Delta_{\\ell}$ in fact does not depend on $\\ell$. Focusing now on $\\ell=0$, we may write\n\n$$\n\\begin{aligned}\n\\log P\\left\\{F_{1}^{c} \\mid G_{0}\\right\\} & \\leq m\\left(\\tau \\cdot n / m-n / m \\cdot
