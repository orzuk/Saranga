t\\langle x, \\psi_{i}\\right\\rangle$, and these are assumed sparse in the sense that, for some $0<p<2$ and for some $R>0$ $\\|\\theta\\|_{p} \\equiv\\left(\\sum_{i}\\left|\\theta_{i}\\right|^{p}\\right)^{1 / p} \\leq R . \\tag{I.1}$\u2026","tex_name":"Transform sparsity ($\\ell_p$ constraint)"},{"id":"ExP1","type":"example","name":"Bounded Variation model for images","short":"BV images: wavelet coefficients at each scale have \u2113\u2081 norm at most 4R.","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.75,"imp":1.9,"desc":1,"res":0,"nsteps":0,"tex":"Bounded Variation model for images. Here image brightness is viewed as an underlying function $f(x, y)$ on the unit square $0 \\leq x, y \\leq 1$ which obeys (essentially) $\\int_{0}^{1} \\int_{0}^{1}|\\nabla f| d x d y \\leq R$\u2026","tex_name":"Bounded Variation model for images"},{"id":"ExP2","type":"example","name":"Bump Algebra model for spectra","short":"Spectra as superpositions of spectral lines with total mass \u2264 R; wavelet coefficients at scale j have \u2113\u2081 norm \u2264 cR2^(-j/2).","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.75,"imp":1.9,"desc":1,"res":0,"nsteps":0,"tex":"Bump Algebra model for spectra. Here a spectrum (e.g., mass spectrum or magnetic resonance spectrum) is modeled as digital samples ( $f(i / n)$ ) of an\u2026","tex_name":"Bump Algebra model for spectra"},{"id":"ClP1","type":"claim","name":"N-term approximation bound for \u2113\u209a balls","short":"Keeping the N largest coefficients of an \u2113\u209a-bounded vector leaves \u2113\u2082 error O(N^(1/2-1/p)).","top":"sec:A","sub":"","inside":"","origin":"external","conf":0.75,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"Indeed, we have trivially that, if $\\theta_{N}$ denotes the vector $\\theta$ with everything except the $N$ largest coefficients set to 0 $\\left\\|\\theta-\\theta_{N}\\right\\|_{2} \\leq \\zeta_{2, p} \\cdot\\|\\theta\\|_{p} \\cdot(N+1)^{1 / 2-1 / p} \\tag{I.2}$\u2026","tex_name":"$N$-term approximation bound for $\\ell_p$ balls"},{"id":"DP2","type":"definition","name":"Information operator and reconstruction algorithm","short":"We have a class X of possible objects of interest, and are interested in designing an information operator I\u2099: X \u21a6 R\u207f that samples n pieces of\u2026","top":"sec:B","sub":"","inside":"","origin":"external","conf":0.8,"imp":4.3,"desc":32,"res":1,"nsteps":0,"tex":"We have a class $X$ of possible objects of interest, and are interested in designing an information operator $I_{n}: X \\mapsto \\boldsymbol{R}^{n}$ that samples $n$ pieces of\u2026","tex_name":"Information operator and reconstruction algorithm"},{"id":"DP3","type":"definition","name":"Nonadaptive sampling kernels","short":"Here the information operator takes the form I_n(x)=(\u27e8\u03be_1, x\u27e9, \u2026,\u27e8\u03be_n, x\u27e9) where the \u03be\u1d62 are sampling kernels, not necessarily sampling pixels or\u2026","top":"sec:B","sub":"","inside":"","origin":"external","conf":0.8,"imp":2.5,"desc":3,"res":1,"nsteps":0,"tex":"Here the information operator takes the form $I_{n}(x)=\\left(\\left\\langle\\xi_{1}, x\\right\\rangle, \\ldots,\\left\\langle\\xi_{n}, x\\right\\rangle\\right)$ where the $\\xi_{i}$ are sampling kernels, not necessarily sampling pixels or\u2026","tex_name":"Nonadaptive sampling kernels"},{"id":"DP4","type":"definition","name":"Minimax \u2113\u2082 error E\u2099(X)","short":"Best worst-case \u2113\u2082 reconstruction error over all nonadaptive information operators and algorithms.","top":"sec:B","sub":"","inside":"","origin":"external","conf":0.85,"imp":3.5,"desc":12,"res":1,"nsteps":0,"tex":"Hence, we consider the minimax $\\ell_{2}$ error as a standard of comparison $E_{n}(X)=\\inf _{A_{n}, I_{n}} \\sup _{x \\in X}\\left\\|x-A_{n}\\left(I_{n}(x)\\right)\\right\\|_{2}$","tex_name":"Minimax $\\ell_2$ error $E_n(X)$"},{"id":"DP5","type":"definition","name":"Signal class X\u209a,\u2098(R)","short":"In our application, the class X of objects of interest is the set of objects x=\u03a3\u1d62 \u03b8\u1d62 \u03c8\u1d62 where \u03b8=\u03b8(x) obeys (I.1) for a given p and R. Denote then\u2026","top":"sec:B","sub":"","inside":"","origin":"paper","conf":0.85,"imp":5.0,"desc":27,"res":1,"nsteps":0,"tex":"In our application, the class $X$ of objects of interest is the set of objects $x=\\sum_{i} \\theta_{i} \\psi_{i}$ where $\\theta=\\theta(x)$ obeys (I.1) for a given $p$ and $R$. Denote then $X_{p, m}(R)=\\left\\{x:\\|\\theta(x)\\|_{p} \\leq R\\right\\}$\u2026","tex_name":"Signal class $X_{p,m}(R)$"},{"id":"TP1","type":"theorem","name":"Theorem 1","short":"The minimax error for \u2113\u209a balls, 0<p\u22641, is O(R(n/log m)^(1/2-1/p)) when m grows polynomially in n.","top":"sec:C","sub":"","inside":"","origin":"paper","conf":0.95,"imp":5.0,"desc":4,"res":1,"nsteps":6,"tex":"Theorem 1: Let $\\left(n, m_{n}\\right)$ be a sequence of problem sizes with $n<m_{n}, n \\rightarrow \\infty$, and $m_{n} \\sim A n^{\\gamma}, \\gamma>1, A>0$. Then for $0<p \\leq 1$ there is $C_{p}=C_{p}(A, \\gamma)>0$ so that $E_{n}\\left(X_{p, m}(R)\\right) \\leq C_{p} \\cdot R \\cdot\\left(n / \\log \\left(m_{n}\\right)\\right)^{1 / 2-1 / p} . \\tag{I.3}$\u2026","tex_name":"Theorem 1"},{"id":"DP6","type":"definition","name":"Minimax error under adaptive information E\u2099\u1d2c\u1d48\u1d43\u1d56\u1d57","short":"Minimax error when each measurement kernel may depend on earlier measurements.","top":"sec:C","sub":"","inside":"","origin":"external","conf":0.8,"imp":1.9,"desc":1,"res":1,"nsteps":0,"tex":"Define the minimax error under adaptive information $E_{n}^{\\mathrm{Adapt\\ }}$ allowing adaptive operators $I_{n}^{A}=\\left(\\left\\langle\\xi_{1}, x\\right\\rangle,\\left\\langle\\xi_{2, x}, x\\right\\rangle, \\ldots\\left\\langle\\xi_{n, x}, x\\right\\rangle\\right)$ where, for $i \\geq 2$\u2026","tex_name":"Minimax error under adaptive information $E_n^{\\mathrm{Adapt}}$"},{"id":"TP2","type":"theorem","name":"Theorem 2 (adaptivity does not help)","short":"Nonadaptive minimax error is within a factor 2^(1/p) of the adaptive minimax error.","top":"sec:C","sub":"","inside":"","origin":"paper","conf":0.95,"imp":5.0,"desc":0,"res":1,"nsteps":4,"tex":"Theorem 2: For $0<p \\leq 1$, there is $C_{p}>0$ so that for $R>0$ $E_{n}\\left(X_{p, m}(R)\\right) \\leq 2^{1 / p} \\cdot E_{n}^{Adapt }\\left(X_{p, m}(R)\\right) .$","tex_name":"Theorem 2 (adaptivity does not help)"},{"id":"RP1","type":"remark","name":"Theorems 1 and 2 for p=1 follow from OR/IBC","short":"An additional surprise is that, in the already-interesting case p=1, Theorems 1 and 2 are easily derivable from known results in OR/IBC and\u2026","top":"sec:C","sub":"","inside":"","origin":"paper","conf":0.7,"imp":1.1,"desc":0,"res":0,"nsteps":0,"tex":"An additional surprise is that, in the already-interesting case $p=1$, Theorems 1 and 2 are easily derivable from known results in OR/IBC and\u2026","tex_name":"Theorems 1 and 2 for $p=1$ follow from OR/IBC"},{"id":"DP7","type":"definition","name":"Gel'fand n-width","short":"Smallest worst-case \u2113\u2082 norm of X intersected with the orthocomplement of an n-dimensional subspace.","top":"sec:D","sub":"","inside":"","origin":"external","conf":0.95,"imp":3.5,"desc":11,"res":1,"nsteps":0,"tex":"Definition 1.1: The Gel'fand $n$-width of $X$ with respect to the $\\ell_{2}^{m}$ norm is defined as $d^{n}\\left(X ; \\ell_{2}\\right)=\\inf _{V_{n}} \\sup \\left\\{\\|x\\|_{2}: x \\in V_{n}^{\\perp} \\cap X\\right\\}$ where the infimum is over $n$-d\u2026","tex_name":"Gel'fand $n$-width"},{"id":"TP3","type":"theorem","name":"Theorem 3 (Gel'fand widths equal optimal recovery error)","short":"The minimax error is bracketed by the Gel'fand n-width and 2^(1/p-1) times it.","top":"sec:D","sub":"","inside":"","origin":"paper","conf":0.95,"imp":4.1,"desc":5,"res":1,"nsteps":6,"tex":"Theorem 3: For $0<p \\leq 1$ and $R>0$ $d^{n}\\left(X_{p, m}(R)\\right) \\leq E_{n}\\left(X_{p, m}(R)\\right) \\tag{I.4} \\leq 2^{1 / p-1} \\cdot d^{n}\\left(X_{p, m}(R)\\right) . \\tag{I.5}$","tex_name":"Theorem 3 (Gel'fand widths equal optimal recovery error)"},{"id":"DP8","type":"definition","name":"Kolmogorov n-width","short":"Definition 1.2: Let X \u2282 R\u1d50 be a bounded set. The Kolmogorov n-width of X with respect the \u2113\u2082 norm is defined as d_n(X ; \u2113_2)=inf _V_n sup _x \u2208 X inf\u2026","top":"sec:D","sub":"","inside":"","origin":"external","conf":0.95,"imp":3.1,"desc":7,"res":1,"nsteps":0,"tex":"Definition 1.2: Let $X \\subset \\boldsymbol{R}^{m}$ be a bounded set. The Kolmogorov $n$-width of $X$ with respect the $\\ell_{2}$ norm is defined as $d_{n}\\left(X ; \\ell_{2}\\right)=\\inf _{V_{n}} \\sup _{x \\in X} \\inf _{y \\in V_{n}}\\|x-y\\|_{2}$\u2026","tex_name":"Kolmogorov $n$-width"},{"id":"DP9","type":"definition","name":"Gel'fand width in \u2113_q norm","short":"To state it, let d\u207f(X, \u2113_q) be defined in the obvious way, based on approximation in \u2113_q rather than \u2113\u2082 norm.","top":"sec:D","sub":"","inside":"","origin":"external","conf":0.75,"imp":3.0,"desc":6,"res":1,"nsteps":0,"tex":"To state it, let $d^{n}\\left(X, \\ell_{q}\\right)$ be defined in the obvious way, based on approximation in $\\ell_{q}$ rather than $\\ell_{2}$ norm.","tex_name":"Gel'fand width in $\\ell_q$ norm"},{"id":"DP10","type":"definition","name":"Dual indices","short":"Also, for given p \u2265 1 and q \u2265 1, let p^() and q^() be the standard dual indices 1 / p^()= 1-1 / p, 1 / q^()=1-1 / q.","top":"sec:D","sub":"","inside":"","origin":"external","conf":0.75,"imp":3.0,"desc":6,"res":1,"nsteps":0,"tex":"Also, for given $p \\geq 1$ and $q \\geq 1$, let $p^{\\prime}$ and $q^{\\prime}$ be the standard dual indices $1 / p^{\\prime}= 1-1 / p, 1 / q^{\\prime}=1-1 / q$.","tex_name":"Dual indices"},{"id":"DP11","type":"definition","name":"Unit ball b\u209a,\u2098 of \u2113\u209a\u1d50","short":"Also, let b\u209a, \u2098 denote the standard unit ball of \u2113\u209a\u1d50.","top":"sec:D","sub":"","inside":"","origin":"external","conf":0.8,"imp":3.8,"desc":17,"res":1,"nsteps":0,"tex":"Also, let $b_{p, m}$ denote the standard unit ball of $\\ell_{p}^{m}$.","tex_name":"Unit ball $b_{p,m}$ of $\\ell_p^m$"},{"id":"TP4","type":"theorem","name":"Duality between Kolmogorov and Gel'fand widths (I.6)","short":"Then [8] d_n(b_p, m ; \u2113_q)=d^n(b_q^, m, \u2113_p^) I.6","top":"sec:D","sub":"","inside":"","origin":"external","conf":0.9,"imp":3.5,"desc":5,"res":1,"nsteps":0,"tex":"Then [8] $d_{n}\\left(b_{p, m} ; \\ell_{q}\\right)=d^{n}\\left(b_{q^{\\prime}, m}, \\ell_{p^{\\prime}}\\right) \\tag{I.6}$","tex_name":"Duality between Kolmogorov and Gel'fand widths (I.6)"},{"id":"TP5","type":"theorem","name":"Kashin-Garnaev-Gluskin theorem (KGG)","short":"Theorem 4: (Kashin, Garnaev, and Gluskin (KGG)) For all n and m>n d_n(b_2, m, \u2113_\u221e) (n /(1+log (m / n)))^-1 / 2 .","top":"sec:D","sub":"","inside":"","origin":"external","conf":0.95,"imp":3.5,"desc":5,"res":1,"nsteps":0,"tex":"Theorem 4: (Kashin, Garnaev, and Gluskin (KGG)) For all $n$ and $m>n$ $d_{n}\\left(b_{2, m}, \\ell_{\\infty}\\right) \\asymp(n /(1+\\log (m / n)))^{-1 / 2} .$","tex_name":"Kashin-Garnaev-Gluskin theorem (KGG)"},{"id":"AP1","type":"algorithm","name":"Central algorithm","short":"Reconstruct by the Chebyshev center of all objects in the class consistent with the measured information.","top":"sec:E","sub":"","inside":"","origin":"external","conf":0.75,"imp":3.6,"desc":10,"res":1,"nsteps":2,"tex":"This \"algorithm\" asks us to consider, for given information $y_{n}=I_{n}\\left(x_{0}\\right)$, the collection of all objects $x$ which could have given rise to the data $y_{n}$ $I_{n}^{-1}\\left(y_{n}\\right)=\\left\\{x: I_{n}(x)=y_{n}\\right\\} .$\u2026","tex_name":"Central algorithm"},{"id":"DP12","type":"definition","name":"Random matrix with i.i.d. uniform spherical columns","short":"Let \u03a6 be an n \u00d7 m matrix generated by randomly sampling the columns, with different columns independent and identically distributed (i.i.d.) random\u2026","top":"sec:F","sub":"","inside":"","origin":"paper","conf":0.8,"imp":4.6,"desc":18,"res":1,"nsteps":0,"tex":"Let $\\Phi$ be an $n \\times m$ matrix generated by randomly sampling the columns, with different columns independent and identically distributed (i.i.d.) random\u2026","tex_name":"Random matrix with i.i.d. uniform spherical columns"},{"id":"DP13","type":"definition","name":"Basis matrix \u03a8","short":"Let \u03a8 be the m \u00d7 m basis matrix with basis vector \u03c8\u1d62 as the i th column.","top":"sec:F","sub":"","inside":"","origin":"paper","conf":0.8,"imp":4.8,"desc":22,"res":1,"nsteps":0,"tex":"Let $\\Psi$ be the $m \\times m$ basis matrix with basis vector $\\psi_{i}$ as the $i$ th column.","tex_name":"Basis matrix $\\Psi$"},{"id":"DP14","type":"definition","name":"CS Information operator I\u2099^(CS)","short":"The CS Information operator I\u2099^(CS) is the n \u00d7 m matrix \u03a6 \u03a8\u1d40.","top":"sec:F","sub":"","inside":"","origin":"paper","conf":0.85,"imp":4.2,"desc":13,"res":1,"nsteps":0,"tex":"The CS Information operator $I_{n}^{\\mathrm{CS}}$ is the $n \\times m$ matrix $\\Phi \\Psi^{T}$.","tex_name":"CS Information operator $I_n^{\\mathrm{CS}}$"},{"id":"ProbP1","type":"problem","name":"(L\u2081) \u2113\u2081-minimization","short":"Minimize the \u2113\u2081 norm of the transform coefficients subject to matching the CS measurements.","top":"sec:F","sub":"","inside":"","origin":"paper","conf":0.85,"imp":4.3,"desc":12,"res":0,"nsteps":0,"tex":"$\\ell_{1}$-minimization. To reconstruct from CS Information, we solve the convex optimization problem $\\left(L_{1}\\right) \\quad \\min \\left\\|\\Psi^{T} x\\right\\|_{1} subject to y_{n}=I_{n}^{\\mathrm{CS}}(x) .$","tex_name":"$(L_1)$ $\\ell_1$-minimization"},{"id":"DP15","type":"definition","name":"Error of an information operator E\u2099(I\u2099,X)","short":"To evaluate the quality of an information operator I\u2099, set E_n(I_n, X) \u2261 inf _A_n sup _x \u2208 X\u2016x-A_n(I_n(x))\u2016_2","top":"sec:F","sub":"","inside":"","origin":"paper","conf":0.85,"imp":3.8,"desc":8,"res":1,"nsteps":0,"tex":"To evaluate the quality of an information operator $I_{n}$, set $E_{n}\\left(I_{n}, X\\right) \\equiv \\inf _{A_{n}} \\sup _{x \\in X}\\left\\|x-A_{n}\\left(I_{n}(x)\\right)\\right\\|_{2}$","tex_name":"Error of an information operator $E_n(I_n,X)$"},{"id":"DP16","type":"definition","name":"Error of an algorithm/information pair E\u2099(A\u2099,I\u2099,X)","short":"To evaluate the quality of a combined algorithm/information pair ( A\u2099, I\u2099 ), set E_n(A_n, I_n, X) \u2261 sup _x \u2208 X\u2016x-A_n(I_n(x))\u2016_2 .","top":"sec:F","sub":"","inside":"","origin":"paper","conf":0.85,"imp":3.6,"desc":7,"res":1,"nsteps":0,"tex":"To evaluate the quality of a combined algorithm/information pair ( $A_{n}, I_{n}$ ), set $E_{n}\\left(A_{n}, I_{n}, X\\right) \\equiv \\sup _{x \\in X}\\left\\|x-A_{n}\\left(I_{n}(x)\\right)\\right\\|_{2} .$","tex_name":"Error of an algorithm/information pair $E_n(A_n,I_n,X)$"},{"id":"TP6","type":"theorem","name":"Theorem 5 (near-optimality of CS information and \u2113\u2081 reconstruction)","short":"CS information operators and \u2113\u2081 reconstruction are both within a constant of the minimax error over \u2113\u209a balls.","top":"sec:F","sub":"","inside":"","origin":"paper","conf":0.95,"imp":5.0,"desc":3,"res":1,"nsteps":0,"tex":"Theorem 5: Let $n, m_{n}$ be a sequence of problem sizes obeying $n<m_{n} \\sim A n^{\\gamma}, A>0, \\gamma \\geq 1$; and let $I_{n}^{\\mathrm{CS}}$ be a corresponding sequence of operators deriving from CS\u2026","tex_name":"Theorem 5 (near-optimality of CS information and $\\ell_1$ reconstruction)"},{"id":"DP17","type":"definition","name":"Nullspace ker(\u03a6)","short":"Let ker(\u03a6) denote as usual the nullspace x: \u03a6 x=0.","top":"sec:II. Information","sub":"","inside":"","origin":"external","conf":0.8,"imp":3.8,"desc":16,"res":1,"nsteps":0,"tex":"Let $\\operatorname{ker}(\\Phi)$ denote as usual the nullspace $\\{x: \\Phi x=0\\}$.","tex_name":"Nullspace $\\ker(\\Phi)$"},{"id":"DP18","type":"definition","name":"Width of a set relative to an operator w(\u03a6,X)","short":"We define the width of a set X relative to an operator \u03a6 w(\u03a6, X) \u2261 sup \u2016x\u2016_2 subject to x \u2208 X \u2229 ker(\u03a6) . II.1","top":"sec:II. Information","sub":"","inside":"","origin":"paper","conf":0.9,"imp":4.3,"desc":14,"res":1,"nsteps":0,"tex":"We define the width of a set $X$ relative to an operator $\\Phi$ $w(\\Phi, X) \\equiv \\sup \\|x\\|_{2} subject to x \\in X \\cap \\operatorname{ker}(\\Phi) . \\tag{II.1}$","tex_name":"Width of a set relative to an operator $w(\\Phi,X)$"},{"id":"ClP2","type":"claim","name":"Gel'fand width as the smallest operator width","short":"In general, the Gel'fand n-width is the smallest value of w obtainable by choice of \u03a6 d^n(X)=inf w(\u03a6, X): \u03a6 is an n \u00d7 m matrix .","top":"sec:II. Information","sub":"","inside":"","origin":"external","conf":0.7,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"In general, the Gel'fand $n$-width is the smallest value of $w$ obtainable by choice of $\\Phi$ $d^{n}(X)=\\inf \\{w(\\Phi, X): \\Phi is an n \\times m matrix \\} .$","tex_name":"Gel'fand width as the smallest operator width"},{"id":"DP19","type":"definition","name":"Column submatrix \u03a6_J","short":"In the following, with J \u22821, \u2026, m let \u03a6_J denote a submatrix of \u03a6 obtained by selecting just the indicated columns of \u03a6.","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.8,"imp":5.0,"desc":26,"res":1,"nsteps":0,"tex":"In the following, with $J \\subset\\{1, \\ldots, m\\}$ let $\\Phi_{J}$ denote a submatrix of $\\Phi$ obtained by selecting just the indicated columns of $\\Phi$.","tex_name":"Column submatrix $\\Phi_J$"},{"id":"DP20","type":"definition","name":"Range V_J of \u03a6_J","short":"We let V_J denote the range of \u03a6_J in R\u207f.","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.8,"imp":4.5,"desc":16,"res":1,"nsteps":0,"tex":"We let $V_{J}$ denote the range of $\\Phi_{J}$ in $\\boldsymbol{R}^{n}$.","tex_name":"Range $V_J$ of $\\Phi_J$"},{"id":"DP21","type":"definition","name":"Quotient norm Q_(J\u1d9c)","short":"Minimal \u2113\u2081 norm of a representation of v using only the columns outside J.","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.85,"imp":4.4,"desc":15,"res":1,"nsteps":0,"tex":"Finally, we consider a family of quotient norms on $\\boldsymbol{R}^{n}$; with $\\ell_{1}\\left(J^{c}\\right)$ denoting the $\\ell_{1}$ norm on vectors indexed by $\\{1, \\ldots, m\\} \\backslash J$ $Q_{J^{c}}(v)=\\min \\|\\theta\\|_{\\ell_{1}\\left(J^{c}\\right)} subject to \\Phi_{J^{c}} \\theta=v .$\u2026","tex_name":"Quotient norm $Q_{J^c}$"},{"id":"DP22","type":"definition","name":"Conditions CS1-CS3","short":"Three conditions on small column subsets of \u03a6: well-conditioning, near-spherical \u2113\u2081 sections, and quotient-norm lower bounds.","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.9,"imp":4.5,"desc":16,"res":1,"nsteps":0,"tex":"We define three conditions to impose on an $n \\times m$ matrix $\\Phi$, indexed by strictly positive parameters $\\eta_{i}, 1 \\leq i \\leq 3$, and $\\rho$. CS1: The minimal singular value of $\\Phi_{J}$\u2026","tex_name":"Conditions CS1-CS3"},{"id":"DP23","type":"definition","name":"Condition CS1 (minimal singular value)","short":"CS1: The minimal singular value of \u03a6_J exceeds \u03b7\u2081>0 uniformly in |J|<\u03c1 n / log (m).","top":"sec:A","sub":"","inside":"DP22","origin":"paper","conf":0.9,"imp":4.2,"desc":13,"res":0,"nsteps":0,"tex":"CS1: The minimal singular value of $\\Phi_{J}$ exceeds $\\eta_{1}>0$ uniformly in $|J|<\\rho n / \\log (m)$.","tex_name":"Condition CS1 (minimal singular value)"},{"id":"DP24","type":"definition","name":"Condition CS2 (spherical sections)","short":"CS2: On each subspace V_J we have the inequality \u2016v\u2016_1 \u2265 \u03b7_2 \u00b7 \u221a(n) \u00b7\u2016v\u2016_2, \u2200 v \u2208 V_J uniformly in |J|<\u03c1 n / log (m).","top":"sec:A","sub":"","inside":"DP22","origin":"paper","conf":0.9,"imp":4.2,"desc":13,"res":0,"nsteps":0,"tex":"CS2: On each subspace $V_{J}$ we have the inequality $\\|v\\|_{1} \\geq \\eta_{2} \\cdot \\sqrt{n} \\cdot\\|v\\|_{2}, \\quad \\forall v \\in V_{J}$ uniformly in $|J|<\\rho n / \\log (m)$.","tex_name":"Condition CS2 (spherical sections)"},{"id":"DP25","type":"definition","name":"Condition CS3 (quotient norm inequality)","short":"CS3: On each subspace V_J Q_J^c(v) \u2265 \u03b7_3 / \u221a(log (m / n)) \u00b7\u2016v\u2016_1, v \u2208 V_J uniformly in |J|<\u03c1 n / log (m).","top":"sec:A","sub":"","inside":"DP22","origin":"paper","conf":0.9,"imp":4.3,"desc":14,"res":0,"nsteps":0,"tex":"CS3: On each subspace $V_{J}$ $Q_{J^{c}}(v) \\geq \\eta_{3} / \\sqrt{\\log (m / n)} \\cdot\\|v\\|_{1}, \\quad v \\in V_{J}$ uniformly in $|J|<\\rho n / \\log (m)$.","tex_name":"Condition CS3 (quotient norm inequality)"},{"id":"DP26","type":"definition","name":"Set of matrices with unit-normalized columns","short":"Consider the set S^n-m terms \u00d7 \u22ef \u00d7 S^n-1 of all n \u00d7 m matrices having unit-normalized columns.","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.7,"imp":3.8,"desc":8,"res":1,"nsteps":0,"tex":"Consider the set $\\boldsymbol{S}^{n-\\overleftarrow{m} terms } \\times \\cdots \\times \\boldsymbol{S}^{n-1}$ of all $n \\times m$ matrices having unit-normalized columns.","tex_name":"Set of matrices with unit-normalized columns"},{"id":"DP27","type":"definition","name":"Natural uniform measure on matrices","short":"On this set, measure frequency of occurrence with the natural uniform measure (the product measure, uniform on each factor S\u207f\u207b\u00b9 ).","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.75,"imp":3.6,"desc":7,"res":1,"nsteps":0,"tex":"On this set, measure frequency of occurrence with the natural uniform measure (the product measure, uniform on each factor $S^{n-1}$ ).","tex_name":"Natural uniform measure on matrices"},{"id":"TP7","type":"theorem","name":"Theorem 6 (most matrices satisfy CS1-CS3)","short":"Theorem 6: Let (n, m\u2099) be a sequence of problem sizes with n \u2192 \u221e, n<m\u2099, and m \u223c A n\u1d5e, A>0, and \u03b3 \u2265 1. There exist \u03b7\u1d62>0 and \u03c1>0 depending only on A\u2026","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.95,"imp":5.0,"desc":6,"res":1,"nsteps":1,"tex":"Theorem 6: Let $\\left(n, m_{n}\\right)$ be a sequence of problem sizes with $n \\rightarrow \\infty, n<m_{n}$, and $m \\sim A n^{\\gamma}, A>0$, and $\\gamma \\geq 1$. There exist $\\eta_{i}>0$ and $\\rho>0$ depending only on $A$ and $\\gamma$ so\u2026","tex_name":"Theorem 6 (most matrices satisfy CS1-CS3)"},{"id":"DP28","type":"definition","name":"CS matrices","short":"For later use, we will leave the constants \u03b7\u1d62 and \u03c1 implicit and speak simply of CS matrices, meaning matrices that satisfy the given conditions with\u2026","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.85,"imp":1.3,"desc":0,"res":1,"nsteps":0,"tex":"For later use, we will leave the constants $\\eta_{i}$ and $\\rho$ implicit and speak simply of CS matrices, meaning matrices that satisfy the given conditions with\u2026","tex_name":"CS matrices"},{"id":"TP8","type":"theorem","name":"Theorem 7 (CS conditions imply near-optimal widths)","short":"The nullspace of a CS matrix cuts \u2113\u209a balls in sections of radius O((n/log(m/n))^(1/2-1/p)).","top":"sec:B","sub":"","inside":"","origin":"paper","conf":0.95,"imp":5.0,"desc":12,"res":1,"nsteps":8,"tex":"Theorem 7: Let $\\left(n, m_{n}\\right)$ be a sequence of problem sizes with $n \\rightarrow \\infty$ and $m_{n} \\sim A \\cdot n^{\\gamma}$. Consider a sequence of $n$ by $m_{n}$ matrices $\\Phi_{n, m_{n}}$ obeying the conditions\u2026","tex_name":"Theorem 7 (CS conditions imply near-optimal widths)"},{"id":"AP2","type":"algorithm","name":"Feasible-point method","short":"Return any object in the class that is consistent with the observed information.","top":"sec:A","sub":"","inside":"","origin":"external","conf":0.8,"imp":4.3,"desc":25,"res":1,"nsteps":2,"tex":"Another general abstract algorithm from the OR/IBC literature is the so-called feasible-point method, which aims simply to find any reconstruction\u2026","tex_name":"Feasible-point method"},{"id":"LP1","type":"lemma","name":"Lemma 3.1 (any feasible point is within a factor two of optimal)","short":"Lemma 3.1: Let y\u2099=I\u2099(x\u2080) where x\u2080 \u2208 X\u209a, \u2098(R) and I\u2099 is an optimal information operator, and let x be any element of X_(p, R)(y\u2099). Then for 0<p \u2264 1\u2026","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.95,"imp":4.0,"desc":9,"res":1,"nsteps":5,"tex":"Lemma 3.1: Let $y_{n}=I_{n}\\left(x_{0}\\right)$ where $x_{0} \\in X_{p, m}(R)$ and $I_{n}$ is an optimal information operator, and let $\\hat{x}$ be any element of $\\hat{X}_{p, R}\\left(y_{n}\\right)$. Then for $0<p \\leq 1$ $\\left\\|x_{0}-\\hat{x}\\right\\|_{2} \\leq 2 \\cdot E_{n}\\left(X_{p, m}(R)\\right) . \\tag{III.1}$\u2026","tex_name":"Lemma 3.1 (any feasible point is within a factor two of optimal)"},{"id":"ClP3","type":"claim","name":"Feasible-point bound under near-optimal information (III.2)","short":"More generally, if the information operator I\u2099 is only nearoptimal, then the same argument gives \u2016x_0-x\u2016_2 \u2264 2 \u00b7 E_n(I_n, X_p, m(R)) . III.2","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.8,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"More generally, if the information operator $I_{n}$ is only nearoptimal, then the same argument gives $\\left\\|x_{0}-\\hat{x}\\right\\|_{2} \\leq 2 \\cdot E_{n}\\left(I_{n}, X_{p, m}(R)\\right) . \\tag{III.2}$","tex_name":"Feasible-point bound under near-optimal information (III.2)"},{"id":"ProbP2","type":"problem","name":"(P\u209a) least-\u2113\u209a-norm problem","short":"Minimize the \u2113\u209a norm of the transform coefficients subject to the measurements.","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.85,"imp":4.7,"desc":18,"res":0,"nsteps":0,"tex":"A popular choice of feasible point is to take an element of least norm, i.e., a solution of the problem $\\left(P_{p}\\right) \\quad \\min _{x}\\|\\theta(x)\\|_{p} subject to y_{n}=I_{n}(x)$ where here $\\theta(x)=\\Psi^{T} x$\u2026","tex_name":"$(P_p)$ least-$\\ell_p$-norm problem"},{"id":"ClP4","type":"claim","name":"Near-minimaxity of the least-norm solution","short":"For later use, call the solution x\u209a, \u2099. By the preceding lemma, this procedure is near-minimax: with y\u2099=I\u2099(x\u2080) where x\u2080 \u2208 X\u209a, \u2098(R) for given 0<p \u2264 1\u2026","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.75,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"For later use, call the solution $\\hat{x}_{p, n}$. By the preceding lemma, this procedure is near-minimax: with $y_{n}=I_{n}\\left(x_{0}\\right)$ where $x_{0} \\in X_{p, m}(R)$ for given $0<p \\leq 1$ and $R>0$ $\\left\\|x_{0}-\\hat{x}_{p, n}\\right\\|_{2} \\leq 2 \\cdot E_{n}\\left(X_{p, m}(R)\\right) .$\u2026","tex_name":"Near-minimaxity of the least-norm solution"},{"id":"TP9","type":"theorem","name":"p-triangle inequality","short":"The key point will be to apply the p-triangle inequality \u2016\u03b8+\u03b8^\u2016_p^p \u2264\u2016\u03b8\u2016_p^p+\u2016\u03b8^\u2016_p^p valid for 0<p<1; this inequality is well known in interpolation\u2026","top":"sec:B","sub":"","inside":"TP3","origin":"external","conf":0.85,"imp":1.9,"desc":0,"res":0,"nsteps":0,"tex":"The key point will be to apply the $p$-triangle inequality $\\left\\|\\theta+\\theta^{\\prime}\\right\\|_{p}^{p} \\leq\\|\\theta\\|_{p}^{p}+\\left\\|\\theta^{\\prime}\\right\\|_{p}^{p}$ valid for $0<p<1$; this inequality is well known in\u2026","tex_name":"$p$-triangle inequality"},{"id":"TP10","type":"theorem","name":"Carl's theorem (Gel'fand widths dominate entropy numbers)","short":"From Carl's theorem [18]-see the exposition in Pisier's book [19]-there is a constant c>0 so that the Gel'fand n-widths dominate the entropy numbers.\u2026","top":"sec:C","sub":"","inside":"TP1","origin":"external","conf":0.85,"imp":1.9,"desc":0,"res":0,"nsteps":0,"tex":"From Carl's theorem [18]-see the exposition in Pisier's book [19]-there is a constant $c>0$ so that the Gel'fand $n$-widths dominate the entropy numbers. $d^{n}\\left(b_{p, m}\\right) \\geq c e_{n}\\left(b_{p, m}\\right)$\u2026","tex_name":"Carl's theorem (Gel'fand widths dominate entropy numbers)"},{"id":"TP11","type":"theorem","name":"Entropy numbers of \u2113\u209a balls","short":"Secondly, the entropy numbers obey [20], [21] e_n(b_p, m) (n / log (m / n))^1 / 2-1 / p","top":"sec:C","sub":"","inside":"TP1","origin":"external","conf":0.85,"imp":1.9,"desc":0,"res":0,"nsteps":0,"tex":"Secondly, the entropy numbers obey [20], [21] $e_{n}\\left(b_{p, m}\\right) \\asymp(n / \\log (m / n))^{1 / 2-1 / p}$","tex_name":"Entropy numbers of $\\ell_p$ balls"},{"id":"ProbP3","type":"problem","name":"(P\u2081) \u2113\u2081 minimization","short":"In the case p=1,(P\u2081) is a convex optimization problem. Written in an equivalent form, with \u03b8 being the optimization variable, gives (P_1) min _\u03b8\u2016\u03b8\u2016_1\u2026","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.85,"imp":4.6,"desc":16,"res":0,"nsteps":0,"tex":"In the case $p=1,\\left(P_{1}\\right)$ is a convex optimization problem. Written in an equivalent form, with $\\theta$ being the optimization variable, gives $\\left(P_{1}\\right) \\quad \\min _{\\theta}\\|\\theta\\|_{1} subject to \\Phi \\theta=y_{n} .$\u2026","tex_name":"$(P_1)$ $\\ell_1$ minimization"},{"id":"AP3","type":"algorithm","name":"Basis Pursuit","short":"Solve (P\u2081) as a linear program over split positive/negative parts, then synthesize \u03a8\u03b8*.","top":"sec:A","sub":"","inside":"","origin":"external","conf":0.85,"imp":3.3,"desc":7,"res":1,"nsteps":4,"tex":"This can be formulated as a linear programming problem: let $A$ be the $n$ by $2 m$ matrix $\\left[\\begin{array}{ll}\\Phi & -\\Phi\\end{array}\\right]$. The linear program $\\min _{z} 1^{T} z subject to A z=y_{n}, \\quad z \\geq 0 \\tag{LP}$ has a\u2026","tex_name":"Basis Pursuit"},{"id":"CP1","type":"corollary","name":"Corollary 4.1 (near-optimality of Basis Pursuit for p=1)","short":"Corollary 4.1: Suppose that I\u2099 is an information operator achieving, for some C>0 E_n(I_n, X_1, m(1)) \u2264 C \u00b7 E_n(X_1, m(1)) ; then the Basis Pursuit\u2026","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.95,"imp":3.5,"desc":4,"res":1,"nsteps":1,"tex":"Corollary 4.1: Suppose that $I_{n}$ is an information operator achieving, for some $C>0$ $E_{n}\\left(I_{n}, X_{1, m}(1)\\right) \\leq C \\cdot E_{n}\\left(X_{1, m}(1)\\right) ;$ then the Basis Pursuit algorithm $A_{1, n}\\left(y_{n}\\right)=\\hat{x}_{1, n}$\u2026","tex_name":"Corollary 4.1 (near-optimality of Basis Pursuit for $p=1$)"},{"id":"AP4","type":"algorithm","name":"Universal compressed sensing procedure for X\u2081,\u2098(R)","short":"Measure with a near-optimal information operator, then reconstruct by Basis Pursuit.","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.75,"imp":3.3,"desc":4,"res":1,"nsteps":2,"tex":"In particular, we have a universal algorithm for dealing with any class $X_{1, m}(R)$-i.e., any $\\Psi$, any $m$, any $R$. First, apply a near-optimal information\u2026","tex_name":"Universal compressed sensing procedure for $X_{1,m}(R)$"},{"id":"ClP5","type":"claim","name":"Basis Pursuit error bound for \u2113\u2081-bounded coefficients","short":"The result obeys \u2016x_0-x_1, n\u2016_2 \u2264 c_1 \u00b7\u2016\u03b8\u2016_1 \u00b7(n / log m)^-1 / 2 for c\u2081 a constant depending at most on log (m) / log (n).","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.75,"imp":2.7,"desc":3,"res":1,"nsteps":0,"tex":"The result obeys $\\left\\|x_{0}-\\hat{x}_{1, n}\\right\\|_{2} \\leq c_{1} \\cdot\\|\\theta\\|_{1} \\cdot(n / \\log m)^{-1 / 2}$ for $c_{1}$ a constant depending at most on $\\log (m) / \\log (n)$.","tex_name":"Basis Pursuit error bound for $\\ell_1$-bounded coefficients"},{"id":"ClP6","type":"claim","name":"Measurement savings for highly compressible objects","short":"Relative error \u03b5 needs only n\u223c K_\u03b5 m\u00b2\u1d45log m measurements when \u2016\u03b8\u2016\u2081\u2264 c\u2082 m\u1d45.","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.7,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"Fix $\\epsilon>0$. Suppose the unknown object $x_{0}$ is known to be highly compressible, say obeying the a priori bound $\\|\\theta\\|_{1} \\leq c_{2} m^{\\alpha}, \\alpha<1 / 2$. Let $K_{\\epsilon}=\\left(c_{1} c_{2} / \\epsilon\\right)^{2}$. For\u2026","tex_name":"Measurement savings for highly compressible objects"},{"id":"ProbP4","type":"problem","name":"(P\u2080) sparsest solution (\u2113\u2080 minimization)","short":"Let us define (P_0) min \u2016\u03b8\u2016_0 subject to \u03a6 \u03b8=y where \u2016\u03b8\u2016\u2080 is just the number of nonzeros in \u03b8.","top":"sec:B","sub":"","inside":"","origin":"paper","conf":0.85,"imp":2.2,"desc":1,"res":0,"nsteps":0,"tex":"Let us define $\\left(P_{0}\\right) \\quad \\min \\|\\theta\\|_{0} subject to \\Phi \\theta=y$ where $\\|\\theta\\|_{0}$ is just the number of nonzeros in $\\theta$.","tex_name":"$(P_0)$ sparsest solution ($\\ell_0$ minimization)"},{"id":"TP12","type":"theorem","name":"Theorem 8 (equivalence of \u2113\u2081 and \u2113\u2080 minimization)","short":"Theorem 8: Suppose that \u03a6 satisfies CS1-CS3 with given positive constants \u03c1,(\u03b7\u1d62). There is a constant \u03c1\u2080>0 depending only on \u03c1 and (\u03b7\u1d62) and not on n\u2026","top":"sec:B","sub":"","inside":"","origin":"paper","conf":0.95,"imp":5.0,"desc":0,"res":1,"nsteps":6,"tex":"Theorem 8: Suppose that $\\Phi$ satisfies CS1-CS3 with given positive constants $\\rho,\\left(\\eta_{i}\\right)$. There is a constant $\\rho_{0}>0$ depending only on $\\rho$ and $\\left(\\eta_{i}\\right)$ and not\u2026","tex_name":"Theorem 8 (equivalence of $\\ell_1$ and $\\ell_0$ minimization)"},{"id":"TP13","type":"theorem","name":"\u2113\u2081/\u2113\u2080 equivalence for nearly all matrices with m<An","short":"In [11], it was shown that for 'nearly all' n by m matrices with n<m<A n, equivalence held for \u2264 \u03c1 n nonzeros, \u03c1=\u03c1(A).","top":"sec:B","sub":"","inside":"","origin":"external","conf":0.75,"imp":1.9,"desc":0,"res":1,"nsteps":0,"tex":"In [11], it was shown that for 'nearly all' $n$ by $m$ matrices with $n<m<A n$, equivalence held for $\\leq \\rho n$ nonzeros, $\\rho=\\rho(A)$.","tex_name":"$\\ell_1$/$\\ell_0$ equivalence for nearly all matrices with $m<An$"},{"id":"DP29","type":"definition","name":"Mutilated vector 1_J\u03b2","short":"Let J \u22821, \u2026, m and, for a given vector \u03b2 \u2208 R\u1d50, let 1_J \u03b2 denote the mutilated vector with entries \u03b2\u1d62 1_J(i).","top":"sec:B","sub":"","inside":"","origin":"paper","conf":0.8,"imp":4.0,"desc":10,"res":1,"nsteps":0,"tex":"Let $J \\subset\\{1, \\ldots, m\\}$ and, for a given vector $\\beta \\in R^{m}$, let $1_{J} \\beta$ denote the mutilated vector with entries $\\beta_{i} 1_{J}(i)$.","tex_name":"Mutilated vector $1_J\\beta$"},{"id":"DP30","type":"definition","name":"Concentration \u03bd(\u03a6,J)","short":"Largest fraction of the \u2113\u2081 norm of a nullspace vector of \u03a6 that can sit on the index set J.","top":"sec:B","sub":"","inside":"","origin":"paper","conf":0.85,"imp":3.9,"desc":9,"res":1,"nsteps":0,"tex":"Define the concentration $\\nu(\\Phi, J)=\\sup \\left\\{\\frac{\\left\\|1_{J} \\beta\\right\\|_{1}}{\\|\\beta\\|_{1}}: \\Phi \\beta=0\\right\\} .$","tex_name":"Concentration $\\nu(\\Phi,J)$"},{"id":"LP2","type":"lemma","name":"Lemma 4.1 (low concentration of nullspace vectors)","short":"Lemma 4.1: Suppose that \u03a6 satisfies CS1-CS3, with constants \u03b7\u1d62 and \u03c1. There is a constant \u03b7\u2080 depending on the \u03b7\u1d62 so that if J \u22821, \u2026, m satisfies |J|\u2026","top":"sec:B","sub":"","inside":"","origin":"paper","conf":0.95,"imp":3.8,"desc":7,"res":1,"nsteps":6,"tex":"Lemma 4.1: Suppose that $\\Phi$ satisfies CS1-CS3, with constants $\\eta_{i}$ and $\\rho$. There is a constant $\\eta_{0}$ depending on the $\\eta_{i}$ so that if $J \\subset\\{1, \\ldots, m\\}$ satisfies $|J| \\leq \\rho_{1} n / \\log (m), \\quad \\rho_{1} \\leq \\rho$\u2026","tex_name":"Lemma 4.1 (low concentration of nullspace vectors)"},{"id":"TP14","type":"theorem","name":"Theorem 9 (near-optimality of Basis Pursuit for 0<p\u22641)","short":"The \u2113\u2081 minimizer recovers \u03b8\u2080 with \u2113\u2082 error O(\u2016\u03b8\u2080\u2016\u209a (n/log m)^(1/2-1/p)).","top":"sec:C","sub":"","inside":"","origin":"paper","conf":0.95,"imp":5.0,"desc":5,"res":1,"nsteps":6,"tex":"Theorem 9: Suppose that $\\Phi$ satisifies CS1-CS3 with constants $\\eta_{i}$ and $\\rho$. There is $C=C\\left(p,\\left(\\eta_{i}\\right), \\rho, A, \\gamma\\right)$ so that a solution $\\hat{\\theta}_{1, n}$ to a problem instance of $\\left(P_{1}\\right)$\u2026","tex_name":"Theorem 9 (near-optimality of Basis Pursuit for $0<p\\le1$)"},{"id":"LP3","type":"lemma","name":"Lemma 4.2 (\u2113\u2081 stability lemma)","short":"Lemma 4.2: Let \u03b8\u2080 be a vector in R\u1d50 and 1_J \u03b8\u2080 be the corresponding mutilated vector with entries \u03b8\u2080(i) 1_J(i). Suppose that \u2016\u03b8_0-1_J \u03b8_0\u2016_1 \u2264 \u03b5\u2026","top":"sec:C","sub":"","inside":"","origin":"paper","conf":0.95,"imp":3.6,"desc":6,"res":1,"nsteps":5,"tex":"Lemma 4.2: Let $\\theta_{0}$ be a vector in $R^{m}$ and $1_{J} \\theta_{0}$ be the corresponding mutilated vector with entries $\\theta_{0}(i) 1_{J}(i)$. Suppose that $\\left\\|\\theta_{0}-1_{J} \\theta_{0}\\right\\|_{1} \\leq \\epsilon$ where $\\nu(\\Phi, J) \\leq \\nu_{0}<1 / 2$\u2026","tex_name":"Lemma 4.2 ($\\ell_1$ stability lemma)"},{"id":"DP31","type":"definition","name":"Tight frame","short":"These are collections of vectors which, when joined together as columns in an m \u00d7 m^() matrix \u03a8(m<m^()) have \u03a8 \u03a8\u1d40=I\u2098.","top":"sec:A","sub":"","inside":"","origin":"external","conf":0.8,"imp":2.7,"desc":4,"res":1,"nsteps":0,"tex":"These are collections of vectors which, when joined together as columns in an $m \\times m^{\\prime}$ matrix $\\Psi\\left(m<m^{\\prime}\\right)$ have $\\Psi \\Psi^{T}=I_{m}$.","tex_name":"Tight frame"},{"id":"ClP7","type":"claim","name":"Parseval relation for tight frames","short":"It follows that, if \u03b8(x)=\u03a8\u1d40 x, then we have the Parseval relation \u2016x\u2016_2=\u2016\u03b8(x)\u2016_2 and the reconstruction formula x=\u03a8 \u03b8(x).","top":"sec:A","sub":"","inside":"","origin":"external","conf":0.75,"imp":2.4,"desc":3,"res":1,"nsteps":0,"tex":"It follows that, if $\\theta(x)=\\Psi^{T} x$, then we have the Parseval relation $\\|x\\|_{2}=\\|\\theta(x)\\|_{2}$ and the reconstruction formula $x=\\Psi \\theta(x)$.","tex_name":"Parseval relation for tight frames"},{"id":"ClP8","type":"claim","name":"Results extend to tight frames","short":"Hence, the same results hold without change when the relation between x and \u03b8 involves a tight frame. In particular, if \u03a6 is an n \u00d7 m matrix\u2026","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.75,"imp":2.4,"desc":2,"res":1,"nsteps":1,"tex":"Hence, the same results hold without change when the relation between $x$ and $\\theta$ involves a tight frame. In particular, if $\\Phi$ is an $n \\times m$ matrix\u2026","tex_name":"Results extend to tight frames"},{"id":"RP2","type":"remark","name":"Extension to general frames (referee remark)","short":"A referee remarked that there is no need to restrict attention to tight frames here; if we have a general frame the same results go through, with\u2026","top":"sec:A","sub":"","inside":"","origin":"paper","conf":0.75,"imp":1.1,"desc":0,"res":0,"nsteps":0},{"id":"DP32","type":"definition","name":"Weak \u2113\u209a ball","short":"The weak \u2113\u209a ball of radius R consists of vectors \u03b8 whose decreasing rearrangements |\u03b8|\u208d\u2081\u208e \u2265|\u03b8|\u208d\u2082\u208e \u2265|\u03b8|\u208d\u2083\u208e \u2265 \u22ef obey |\u03b8|_(N) \u2264 R \u00b7 N^-1 / p, N=1,2,3, \u2026","top":"sec:B","sub":"","inside":"","origin":"external","conf":0.85,"imp":2.7,"desc":4,"res":1,"nsteps":0,"tex":"The weak $\\ell_{p}$ ball of radius $R$ consists of vectors $\\theta$ whose decreasing rearrangements $|\\theta|_{(1)} \\geq|\\theta|_{(2)} \\geq|\\theta|_{(3)} \\geq \\cdots$ obey $|\\theta|_{(N)} \\leq R \\cdot N^{-1 / p}, \\quad N=1,2,3, \\ldots$","tex_name":"Weak $\\ell_p$ ball"},{"id":"DP33","type":"definition","name":"Weak \u2113\u209a norm","short":"Conversely, for a given \u03b8, the smallest R for which these inequalities all hold is defined to be the norm: \u2016\u03b8\u2016_(w \u2113\u209a) \u2261 R.","top":"sec:B","sub":"","inside":"","origin":"external","conf":0.85,"imp":2.5,"desc":3,"res":1,"nsteps":0,"tex":"Conversely, for a given $\\theta$, the smallest $R$ for which these inequalities all hold is defined to be the norm: $\\|\\theta\\|_{w \\ell_{p}} \\equiv R$.","tex_name":"Weak $\\ell_p$ norm"},{"id":"ClP9","type":"claim","name":"Tail bound for weak \u2113\u209a balls (V.1)","short":"Weak \u2113\u209a constraints have the following key property: if \u03b8_N denotes a mutilated version of the vector \u03b8 with all except the N largest items set to\u2026","top":"sec:B","sub":"","inside":"","origin":"external","conf":0.8,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"Weak $\\ell_{p}$ constraints have the following key property: if $\\theta_{N}$ denotes a mutilated version of the vector $\\theta$ with all except var DETAILS = {"DP1":{"name":"Signal vector and orthonormal basis","type":"definition","section":"A. Transform Compression Background","statement":"We suppose that the object of interest is a vector $x \\in \\boldsymbol{R}^{m}$, which can be a signal or image with $m$ samples or pixels, and that there is an orthonormal basis ( $\\psi_{i}: i=1, \\ldots, m$ ) for $\\boldsymbol{R}^{m}$ which can be, for example, an orthonormal wavelet basis, a Fourier basis, or a local Fourier basis, depending on the application.","statement_short":"","rigor":"","confidence":0.75,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Fourier Transform","Basis","Orthonormal","vector","Definition:Orthonormal Basis","image","interest"]},"AssumP1":{"name":"Transform sparsity ($\\ell_p$ constraint)","type":"assumption","section":"A. Transform Compression Background","statement":"The object has transform coefficients $\\theta_{i}=\\left\\langle x, \\psi_{i}\\right\\rangle$, and these are assumed sparse in the sense that, for some $0<p<2$ and for some $R>0$\n\n\n\\begin{equation*}\n\\|\\theta\\|_{p} \\equiv\\left(\\sum_{i}\\left|\\theta_{i}\\right|^{p}\\right)^{1 / p} \\leq R . \\tag{I.1}\n\\end{equation*}","statement_short":"The transform coefficients $\\theta_i=\\langle x,\\psi_i\\rangle$ lie in an $\\ell_p$ ball of radius $R$, $0<p<2$.","rigor":"","confidence":0.8,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[{"id":"EP1","statement":"\\|\\theta\\|_{p} \\equiv\\left(\\sum_{i}\\left|\\theta_{i}\\right|^{p}\\right)^{1 / p} \\leq R . \\tag{I.1}","section":"A. Transform Compression Background","context":"statement","parent_step":""}],"foundation_links":["equation"]},"ExP1":{"name":"Bounded Variation model for images","type":"example","section":"A. Transform Compression Background","statement":"Bounded Variation model for images. Here image brightness is viewed as an underlying function $f(x, y)$ on the unit square $0 \\leq x, y \\leq 1$ which obeys (essentially)\n\\end{itemize}\n\n$$\n\\int_{0}^{1} \\int_{0}^{1}|\\nabla f| d x d y \\leq R\n$$\n\nThe digital data of interest consist of $m=n^{2}$ pixel samples of $f$ produced by averaging over $1 / n \\times 1 / n$ pixels. We take a wavelet point of view; the data are seen as a superposition of contributions from various scales. Let $x^{(j)}$ denote the component of the data at scale $j$, and let $\\left(\\psi_{i}^{j}\\right)$ denote the orthonormal basis of wavelets at scale $j$, containing $3 \\cdot 4^{j}$ elements. The corresponding coefficients obey $\\left\\|\\theta^{(j)}\\right\\|_{1} \\leq 4 R$.","statement_short":"BV images: wavelet coefficients at each scale have $\\ell_1$ norm at most $4R$.","rigor":"","confidence":0.75,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["interest","Basis","Function","Definition:Bounded Variation","image","Orthonormal","point","square","Definition:Orthonormal Basis","scale","Definition:Unit Square","The Elements","Wavelets"]},"ExP2":{"name":"Bump Algebra model for spectra","type":"example","section":"A. Transform Compression Background","statement":"Bump Algebra model for spectra. Here a spectrum (e.g., mass spectrum or magnetic resonance spectrum) is modeled as digital samples ( $f(i / n)$ ) of an underlying function $f$ on the real line which is a superposition of so-called spectral lines of varying positions, amplitudes, and linewidths. Formally\n\\end{itemize}\n\n$$\nf(t)=\\sum_{i=1}^{\\infty} a_{i} g\\left(\\left(t-t_{i}\\right) / s_{i}\\right)\n$$\n\nHere the parameters $t_{i}$ are line locations, $a_{i}$ are amplitudes/polarities, and $s_{i}$ are linewidths, and $g$ represents a lineshape, for example the Gaussian, although other profiles could be considered. We assume the constraint where $\\sum_{i}\\left|a_{i}\\right| \\leq R$, which in applications represents an energy or total mass constraint. Again we take a wavelet viewpoint, this time specifically using smooth wavelets. The data can be represented as a superposition of contributions from various scales. Let $x^{(j)}$ denote the component of the spectrum at scale $j$, and let $\\left(\\psi_{i}^{j}\\right)$ denote the orthonormal basis of wavelets at scale $j$, containing $2^{j}$ elements. The corresponding coefficients again obey $\\left\\|\\theta^{(j)}\\right\\|_{1} \\leq c \\cdot R \\cdot 2^{-j / 2},[2]$.","statement_short":"Spectra as superpositions of spectral lines with total mass $\\le R$; wavelet coefficients at scale $j$ have $\\ell_1$ norm $\\le cR2^{-j/2}$.","rigor":"","confidence":0.75,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Basis","Function","The Spectrum","Orthonormal","algebra","Definition:Orthonormal Basis","scale","The Elements","Wavelets"]},"ClP1":{"name":"$N$-term approximation bound for $\\ell_p$ balls","type":"claim","section":"A. Transform Compression Background","statement":"Indeed, we have trivially that, if $\\theta_{N}$ denotes the vector $\\theta$ with everything except the $N$ largest coefficients set to 0\n\n\n\\begin{equation*}\n\\left\\|\\theta-\\theta_{N}\\right\\|_{2} \\leq \\zeta_{2, p} \\cdot\\|\\theta\\|_{p} \\cdot(N+1)^{1 / 2-1 / p} \\tag{I.2}\n\\end{equation*}\n\n\nfor $N=0,1,2, \\ldots$, with a constant $\\zeta_{2, p}$ depending only on $p \\in(0,2)$.","statement_short":"Keeping the $N$ largest coefficients of an $\\ell_p$-bounded vector leaves $\\ell_2$ error $O(N^{1/2-1/p})$.","rigor":"","confidence":0.75,"tags":["bound","approximation"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"standard (uncited)","assumptions":["$\\theta_{N}$ denotes the vector $\\theta$ with everything except the $N$ largest coefficients set to 0"],"conclusions":["\\left\\|\\theta-\\theta_{N}\\right\\|_{2} \\leq \\zeta_{2, p} \\cdot\\|\\theta\\|_{p} \\cdot(N+1)^{1 / 2-1 / p}"],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[{"id":"EP2","statement":"\\left\\|\\theta-\\theta_{N}\\right\\|_{2} \\leq \\zeta_{2, p} \\cdot\\|\\theta\\|_{p} \\cdot(N+1)^{1 / 2-1 / p} \\tag{I.2}","section":"A. Transform Compression Background","context":"statement","parent_step":""}],"foundation_links":["constant","bound","vector","approximation","equation"]},"DP2":{"name":"Information operator and reconstruction algorithm","type":"definition","section":"B. Optimal Recovery/Information-Based Complexity Background","statement":"We have a class $X$ of possible objects of interest, and are interested in designing an information operator $I_{n}: X \\mapsto \\boldsymbol{R}^{n}$ that samples $n$ pieces of information about $x$, and an algorithm $A_{n}: \\boldsymbol{R}^{n} \\mapsto \\boldsymbol{R}^{m}$ that offers an approximate reconstruction of $x$.","statement_short":"","rigor":"","confidence":0.8,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"OR/IBC (Pinkus [5]; Traub & Wozniakowski [6])","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["algorithm","Operator","interest"]},"DP3":{"name":"Nonadaptive sampling kernels","type":"definition","section":"B. Optimal Recovery/Information-Based Complexity Background","statement":"Here the information operator takes the form\n\n$$\nI_{n}(x)=\\left(\\left\\langle\\xi_{1}, x\\right\\rangle, \\ldots,\\left\\langle\\xi_{n}, x\\right\\rangle\\right)\n$$\n\nwhere the $\\xi_{i}$ are sampling kernels, not necessarily sampling pixels or other simple features of the signal; however, they are nonadaptive, i.e., fixed independently of $x$.","statement_short":"","rigor":"","confidence":0.8,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"OR/IBC (Pinkus [5]; Traub & Wozniakowski [6])","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Operator"]},"DP4":{"name":"Minimax $\\ell_2$ error $E_n(X)$","type":"definition","section":"B. Optimal Recovery/Information-Based Complexity Background","statement":"Hence, we consider the minimax $\\ell_{2}$ error as a standard of comparison\n\n$$\nE_{n}(X)=\\inf _{A_{n}, I_{n}} \\sup _{x \\in X}\\left\\|x-A_{n}\\left(I_{n}(x)\\right)\\right\\|_{2}\n$$","statement_short":"Best worst-case $\\ell_2$ reconstruction error over all nonadaptive information operators and algorithms.","rigor":"","confidence":0.85,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"OR/IBC (Pinkus [5]; Traub & Wozniakowski [6])","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["error"]},"DP5":{"name":"Signal class $X_{p,m}(R)$","type":"definition","section":"B. Optimal Recovery/Information-Based Complexity Background","statement":"In our application, the class $X$ of objects of interest is the set of objects $x=\\sum_{i} \\theta_{i} \\psi_{i}$ where $\\theta=\\theta(x)$ obeys (I.1) for a given $p$ and $R$. Denote then\n\n$$\nX_{p, m}(R)=\\left\\{x:\\|\\theta(x)\\|_{p} \\leq R\\right\\}\n$$","statement_short":"","rigor":"","confidence":0.85,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["interest"]},"TP1":{"name":"Theorem 1","type":"theorem","section":"C. Four Surprises","statement":"Theorem 1: Let $\\left(n, m_{n}\\right)$ be a sequence of problem sizes with ality","Definition:Upper Bound","number","Cardinality","equation","combination"]},"DP6":{"name":"Minimax error under adaptive information $E_n^{\\mathrm{Adapt}}$","type":"definition","section":"C. Four Surprises","statement":"Define the minimax error under adaptive information $E_{n}^{\\mathrm{Adapt\\ }}$ allowing adaptive operators\n\n$$\nI_{n}^{A}=\\left(\\left\\langle\\xi_{1}, x\\right\\rangle,\\left\\langle\\xi_{2, x}, x\\right\\rangle, \\ldots\\left\\langle\\xi_{n, x}, x\\right\\rangle\\right)\n$$\n\nwhere, for $i \\geq 2$, each kernel $\\xi_{i, x}$ is allowed to depend on the information $\\left\\langle\\xi_{j, x}, x\\right\\rangle$ gathered at previous stages $1 \\leq j<i$. Formally setting\n\n$$\nE_{n}^{Adapt }(X)=\\inf _{A_{n}, I_{n}^{A}} \\sup _{x \\in X}\\left\\|x-A_{n}\\left(I_{n}^{A}(x)\\right)\\right\\|_{2}\n$$\n\nwe have the following.","statement_short":"Minimax error when each measurement kernel may depend on earlier measurements.","rigor":"","confidence":0.8,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"OR/IBC (Gal & Micchelli [22]; Novak [25])","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["error"]},"TP2":{"name":"Theorem 2 (adaptivity does not help)","type":"theorem","section":"C. Four Surprises","statement":"Theorem 2: For $0<p \\leq 1$, there is $C_{p}>0$ so that for $R>0$\n\n$$\nE_{n}\\left(X_{p, m}(R)\\right) \\leq 2^{1 / p} \\cdot E_{n}^{Adapt }\\left(X_{p, m}(R)\\right) .\n$$","statement_short":"Nonadaptive minimax error is within a factor $2^{1/p}$ of the adaptive minimax error.","rigor":"","confidence":0.95,"tags":["bound","adaptivity"],"inside":"","contains":[],"proofs":[{"id":"PP6","name":"Proof of Theorem 2","proof_strategy":["direct"],"statement_short":"Run the adaptive scheme on $x=0$; all objects in the resulting subspace give the same information, so the adaptive error is at least the Gel'fand width.","rigor":"","confid ,"Definition:Approximation Theory"]},"DP7":{"name":"Gel'fand $n$-width","type":"definition","section":"D. Geometry and Widths","statement":"Definition 1.1: The Gel'fand $n$-width of $X$ with respect to the $\\ell_{2}^{m}$ norm is defined as\n\n$$\nd^{n}\\left(X ; \\ell_{2}\\right)=\\inf _{V_{n}} \\sup \\left\\{\\|x\\|_{2}: x \\in V_{n}^{\\perp} \\cap X\\right\\}\n$$\n\nwhere the infimum is over $n$-dimensional linear subspaces of $R^{m}$, and $V_{n}^{\\perp}$ denotes the orthocomplement of $V_{n}$ with respect to the standard Euclidean inner product.","statement_short":"Smallest worst-case $\\ell_2$ norm of $X$ intersected with the orthocomplement of an $n$-dimensional subspace.","rigor":"","confidence":0.95,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"Pinkus [5]","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Definition 1","Definition 1.1","Definition:Inner Product"]},"TP3":{"name":"Theorem 3 (Gel'fand widths equal optimal recovery error)","type":"theorem","section":"D. Geometry and Widths","statement":"Theorem 3: For $0<p \\leq 1$ and $R>0$\n\n\n\\begin{align*}\nd^{n}\\left(X_{p, m}(R)\\right) & \\leq E_{n}\\left(X_{p, m}(R)\\right)  \\tag{I.4}\\\\\n& \\leq 2^{1 / p-1} \\cdot d^{n}\\left(X_{p, m}(R)\\right) . \\tag{I.5}\n\\end{align*}","statement_render":"Theorem 3: For $0<p \\leq 1$ and $R>0$\n\n\n\\begin{align*}\nd^{n}\\left(X_{p, m}(R)\\right) & \\leq E_{n}\\left(X_{p, m}(R)\\right) \\tag{I.4}\\\\\n& \\leq 2^{1 / p-1} \\cdot d^{n}\\left(X_{p, m}(R)\\right) . \\tag{I.5}\n\\end{align*}","statement_short":"The minimax error is bracketed by the Gel'fand $n$-width and $2^{1/p-1}$ times it.","rigor":"","confidence":0.95,"tags":["bound","n_widths"],"inside":"","contains":[{"id":"TP9","name":"$p$-triangle inequality","type":"theorem","parent":"PP4"}],"proofs":[{"id":"PP4","name":"Proof of Theorem 3","proof_strategy":["direct","construction"],"statement_sho {\\log (m / n)} \\cdot\\|v\\|_{1}, \\quad v \\in V_{J}\n$$\n\nuniformly in $|J|<\\rho n / \\log (m)$.","statement_short":"Three conditions on small column subsets of $\\Phi$: well-conditioning, near-spherical $\\ell_1$ sections, and quotient-norm lower bounds.","rigor":"","confidence":0.9,"tags":[],"inside":"","contains":[{"id":"DP23","name":"Condition CS1 (minimal singular value)","type":"definition","parent":"DP22"},{"id":"DP24","name":"Condition CS2 (spherical sections)","type":"definition","parent":"DP22"},{"id":"DP25","name":"Condition CS3 (quotient norm inequality)","type":"definition","parent":"DP22"}],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["positive","Subspace","singular","Definition:Strictly Positive","matrix","inequality"]},"DP23":{"name":"Condition CS1 (minimal singular value)","type":"definition","section":"A. Conditions CS1-CS3","statement":"CS1: The minimal singular value of $\\Phi_{J}$ exceeds $\\eta_{1}>0$ uniformly in $|J|<\\rho n / \\log (m)$.","statement_short":"","rigor":"","confidence":0.9,"tags":[],"inside":"DP22","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["singular"]},"DP24":{"name":"Condition CS2 (spherical sections)","type":"definition","section":"A. Conditions CS1-CS3","statement":"CS2: On each subspace $V_{J}$ we have the inequality\n\n$$\n\\|v\\|_{1} \\geq \\eta_{2} \\cdot \\sqrt{n} \\cdot\\|v\\|_{2}, \\quad \\forall v \\in V_{J}\n$$\n\nuniformly in $|J|<\\rho n / \\log (m)$.","statement_short":"","rigor":"","confidence":0.9,"tags":[],"inside":"DP22","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Subspace","inequality"]},"DP25":{"name":"Co CS1-CS3","statement":"Theorem 6: Let $\\left(n, m_{n}\\right)$ be a sequence of problem sizes with $n \\rightarrow \\infty, n<m_{n}$, and $m \\sim A n^{\\gamma}, A>0$, and $\\gamma \\geq 1$. There exist $\\eta_{i}>0$ and $\\rho>0$ depending only on $A$ and $\\gamma$ so that, for each $\\delta>0$ the proportion of all $n \\times m$ matrices $\\Phi$ satisfying CS1-CS3 with parameters $\\left(\\eta_{i}\\right)$ and $\\rho$ eventually exceeds $1-\\delta$.","statement_short":"","rigor":"","confidence":0.95,"tags":["random_matrices","compressed_sensing"],"inside":"","contains":[],"proofs":[{"id":"PP14","name":"Proof of Theorem 6 (from Theorem 10)","proof_strategy":["direct"],"statement_short":"Sampling columns uniformly on the sphere is the natural uniform measure, so Theorem 10 gives Theorem 6.","rigor":"","confidence":0.85}],"origin":"paper","origin_citation":"","assumptions":["$\\left(n, m_{n}\\right)$ be a sequence of problem sizes with $n \\rightarrow \\infty, n<m_{n}$, and $m \\sim A n^{\\gamma}, A>0$, and $\\gamma \\geq 1$"],"conclusions":["There exist $\\eta_{i}>0$ and $\\rho>0$ depending only on $A$ and $\\gamma$ so that, for each $\\delta>0$ the proportion of all $n \\times m$ matrices $\\Phi$ satisfying CS1-CS3 with parameters $\\left(\\eta_{i}\\right)$ and $\\rho$ eventually exceeds $1-\\delta$"],"proof_info":["direct"],"input":[],"output":[],"steps":[{"id":"PP14_s1","statement":"Indeed, note that the probability measure on $\\boldsymbol{\\Phi}_{n, m}$ induced by sampling columns i.i.d. uniform on $\\boldsymbol{S}^{n-1}$ is exactly the natural uniform measure on $\\boldsymbol{\\Phi}_{n, m}$. Hence, Theorem 6 follows immediately from Theorem 10.","statement_clean":"Indeed, note that the probability measure on $\\boldsymbol{\\Phi}_{n, m}$ induced by sampling columns i.i.d. uniform on $\\boldsymbol{S}^{n-1}$ is exactly the natural uniform measure on $\\boldsymbol{\\Phi}_{n, m}$. Hence, Theorem 6 follows immediately from Theorem 10.","statement_short":"","name":"","subclass":"","step_order":1,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":null}],"equations":[],"foundation_links":["Proof","probability","theorem","Independent and Identically Distributed","Theorem 6","sequence","Theorem 10","Definition:Probability Measure"]},"DP28":{"name":"CS matrices","type":"definition","section":"A. Conditions CS1-CS3","statement":"For later use, we will leave the constants $\\eta_{i}$ and $\\rho$ implicit and speak simply of CS matrices, meaning matrices that satisfy the given conditions with values of parameters of the type described by this theorem, namely, with $\\eta_{i}$ and $\\rho$ not depending on $n$ and permitting the above ubiquity.","statement_short":"","rigor":"","confidence":0.85,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["theorem"]},"TP8":{"name":"Theorem 7 (CS conditions imply near-optimal widths)","type":"theorem","section":"B. Near-Optimality of CS Matrices","statement":"Theorem 7: Let $\\left(n, m_{n}\\right)$ be a sequence of problem sizes with $n \\rightarrow \\infty$ and $m_{n} \\sim A \\cdot n^{\\gamma}$. Consider a sequence of $n$ by $m_{n}$ matrices $\\Phi_{n, m_{n}}$ obeying the conditions CS1-CS3 with $\\eta_{i}$ and $\\rho$ positive and independent of $n$. Then for each $p \\in(0,1]$, there is $C=C\\left(p, \\eta_{1}, \\eta_{2}, \\eta_{3}, \\rho, A, \\gamma\\right)$ so that for $n>n_{0}$\n\n$$\nw\\left(\\Phi_{n, m_{n}}, b_{p, m_{n}}\\right) \\leq C \\cdot(n / \\log (m / n))^{1 / 2-1 / p} .\n$$","statement_short":"The nullspace of a CS matrix cuts $\\ell_p$ balls in sections of radius $O((n/\\log(m/n))^{1/2-1/p})$.","rigor":"","confidence":0.95,"tags":["n_widths","bound"],"inside":"","contains":[],"proofs":[{"id":"PP2","name":"Proof of Theorem 7","proof_strategy":["direct"],"statement_short":"Split a nullspace vector into its $k$ largest entries and the tail; bound the tail by (I.2), then control the head via CS3, CS2 and CS1.","rigor":"","confidence":0.9}],"origin":"paper","origin_citation":"","assumptions":["$\\left(n, m_{n}\\right)$ be a sequence of problem sizes with $n \\rightarrow \\infty$ and $m_{n} \\sim A \\cdot n^{\\gamma}$","a sequence of $n$ by $m_{n}$ matrices $\\Phi_{n, m_{n}}$ obeying the conditions CS1-CS3 with $\\eta_{i}$ and $\\rho$ positive and independent of $n$","$p \\in(0,1]$"],"conclusions":["w\\left(\\Phi_{n, m_{n}}, b_{p, m_{n}}\\right) \\leq C \\cdot(n / \\log (m / n))^{1 / 2-1 / p} ."],"proof_info":["direct"],"input":[],"output":[],"steps":[{"id":"PSP1","statement":"Proof: Consider the optimization problem\n\n$$\n\\left(Q_{p}\\right) \\quad \\sup \\|\\theta\\|_{2}  subject to  \\Phi \\theta=0, \\quad\\|\\theta\\|_{p} \\leq 1 .\n$$\n\nOur goal is to bound the value of $\\left(Q_{p}\\right)$\n\n$$\n\\operatorname{val}\\left(Q_{p}\\right) \\leq C \\cdot(n / \\log (m / n))^{1 / 2-1 / p} .\n$$","statement_clean":"Proof: Consider the optimization problem\n\n$$\n\\left(Q_{p}\\right) \\quad \\sup \\|\\theta\\|_{2}  subject to  \\Phi \\theta=0, \\quad\\|\\theta\\|_{p} \\leq 1 .\n$$\n\nOur goal is to bound the value of $\\left(Q_{p}\\right)$\n\n$$\n\\operatorname{val}\\left(Q_{p}\\right) \\leq C \\cdot(n / \\log (m / n))^{1 / 2-1 / p} .\n$$","statement_short":"Restate the goal as bounding the value of the program $(Q_p)$.","name":"Reduce to bounding val$(Q_p)$","subclass":"setup","step_order":1,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP2","statement":"Choose $\\theta$ so that $0=\\Phi \\theta$. Let $J$ denote the indices of the $k= \\lfloor\\rho n / \\log (m)\\rfloor$ largest values in $\\theta$. Without loss of generality, suppose coordinates are ordered so that $J$ comes first among the $m$ entries, and partition $\\theta=\\left[\\theta_{J}, \\theta_{J^{c}}\\right]$.","statement_clean":"Choose $\\theta$ so that $0=\\Phi \\theta$. Let $J$ denote the indices of the $k= \\lfloor\\rho n / \\log (m)\\rfloor$ largest values in $\\theta$. Without loss of generality, suppose coordinates are ordered so that $J$ comes first among the $m$ entries, and partition $\\theta=\\left[\\theta_{J}, \\theta_{J^{c}}\\right]$.","statement_short":"Take a nullspace vector and split it into its $k$ largest entries and the rest.","name":"Split into head and tail","subclass":"introduce_variable","step_order":2,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP3","statement":"Clearly\n\n\n\\begin{equation*}\n\\left\\|\\theta_{J^{c}}\\right\\|_{p} \\leq\\|\\theta\\|_{p} \\leq 1 \\tag{II.2}\n\\end{equation*}\n\n\nwhile, because each entry in $\\theta_{J}$ is at least as big as any entry in $\\theta_{J^{c}}$, (I.2) gives\n\n\n\\begin{equation*}\n\\left\\|\\theta_{J^{c}}\\right\\|_{2} \\leq \\zeta_{2, p} \\cdot(k+1)^{1 / 2-1 / p} \\tag{II.3}\n\\end{equation*}\n\n\nA similar argument for $\\ell_{1}$ approximation gives, in case $p<1$\n\n\n\\begin{equation*}\n\\left\\|\\theta_{J^{c}}\\right\\|_{1} \\leq \\zeta_{1, p} \\cdot(k+1)^{1-1 / p} \\tag{II.4}\n\\end{equation*}","statement_clean":"Clearly\n\n\n\\begin{equation*}\n\\left\\|\\theta_{J^{c}}\\right\\|_{p} \\leq\\|\\theta\\|_{p} \\leq 1 \\tag{II.2}\n\\end{equation*}\n\n\nwhile, because each entry in $\\theta_{J}$ is at least as big as any entry in $\\theta_{J^{c}}$, (I.2) gives\n\n\n\\begin{equation*}\n\\left\\|\\theta_{J^{c}}\\right\\|_{2} \\leq \\zeta_{2, p} \\cdot(k+1)^{1 / 2-1 / p} \\tag{II.3}\n\\end{equation*}\n\n\nA similar argument for $\\ell_{1}$ approximation gives, in case $p<1$\n\n\n\\begin{equation*}\n\\left\\|\\theta_{J^{c}}\\right\\|_{1} \\leq \\zeta_{1, p} \\cdot(k+1)^{1-1 / p} \\tag{II.4}\n\\end{equation*}","statement_short":"Bound the tail in $\\ell_p$, $\\ell_2$ (via (I.2)) and $\\ell_1$.","name":"Tail bounds","subclass":"bound_estimate","step_order":3,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP4","statement":"Now $0=\\Phi_{J} \\theta_{J}+\\Phi_{J J^{c}} \\theta_{J}{ }^{c}$. Hence, with $v=\\Phi_{J} \\theta_{J}$, we have $-v=\\Phi_{J^{c}} \\theta_{J^{c}}$. As $v \\in V_{J}$ and $|J|=k<\\rho n / \\log (m)$, we can invoke CS3, getting\n\n$$\n\\left\\|\\theta_{J^{c}}\\right\\|_{1} \\geq Q_{J^{c}}(-v) \\geq \\eta_{3} / \\sqrt{\\log (m / n)} \\cdot\\|v\\|_{1} .\n$$","statement_clean":"Now $0=\\Phi_{J} \\theta_{J}+\\Phi_{J J^{c}} \\theta_{J}{ }^{c}$. Hence, with $v=\\Phi_{J} \\theta_{J}$, we have $-v=\\Phi_{J^{c}} \\theta_{J^{c}}$. As $v \\in V_{J}$ and $|J|=k<\\rho n / \\log (m)$, we can invoke CS3, getting\n\n$$\n\\left\\|\\theta_{J^{c}}\\right\\|_{1} \\geq Q_{J^{c}}(-v) \\geq \\eta_{3} / \\sqrt{\\log (m / n)} \\cdot\\|v\\|_{1} .\n$$","statement_short":"With $v=\\Phi_J\\theta_J$, CS3 bounds $\\|v\\|_1$ by the tail $\\ell_1$ norm.","name":"Invoke CS3","subclass":"apply_lemma","step_order":4,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP5","statement":"On the other hand, again using $v \\in V_{J}$ and $|J|=k< \\rho n / \\log (m)$, invoke CS2, getting\n\n$$\n\\|v\\|_{1} \\geq \\eta_{2} \\cdot \\sqrt{n} \\cdot\\|v\\|_{2} .\n$$","statement_clean":"On the other hand, again using $v \\in V_{J}$ and $|J|=k< \\rho n / \\log (m)$, invoke CS2, getting\n\n$$\n\\|v\\|_{1} \\geq \\eta_{2} \\cdot \\sqrt{n} \\cdot\\|v\\|_{2} .\n$$","statement_short":"CS2 compares $\\|v\\|_1$ and $\\|v\\|_2$.","name":"Invoke CS2","subclass":"apply_lemma","step_order":5,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP6","statement":"Combining these with the above\n\n$$\n\\begin{aligned}\n\\|v\\|_{2} & \\leq\\left(\\eta_{2} \\eta_{3}\\right)^{-1} \\cdot(\\sqrt{\\log (m / n)} / \\sqrt{n}) \\cdot\\left\\|\\theta_{J^{c}}\\right\\|_{1} \\\\\n& \\leq c_{1} \\cdot(n / \\log (m))^{1 / 2-1 / p}\n\\end{aligned}\n$$\n\nwith $c_{1}=\\zeta_{1, p} \\rho^{1-1 / p} / \\eta_{2} \\eta_{3}$.","statement_clean":"Combining these with the above\n\n$$\n\\begin{aligned}\n\\|v\\|_{2} & \\leq\\left(\\eta_{2} \\eta_{3}\\right)^{-1} \\cdot(\\sqrt{\\log (m / n)} / \\sqrt{n}) \\cdot\\left\\|\\theta_{J^{c}}\\right\\|_{1} \\\\\n& \\leq c_{1} \\cdot(n / \\log (m))^{1 / 2-1 / p}\n\\end{aligned}\n$$\n\nwith $c_{1}=\\zeta_{1, p} \\rho^{1-1 / p} / \\eta_{2} \\eta_{3}$.","statement_short":"Combine to bound $\\|v\\|_2$.","name":"Bound $\\|v\\|_2$","subclass":"bound_estimate","step_order":6,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP7","statement":"Recalling $|J|=k<\\rho n / \\log (m)$, and invoking CS1 we have\n\n$$\n\\left\\|\\theta_{J}\\right\\|_{2} \\leq\\left\\|\\Phi_{J} \\theta_{J}\\right\\|_{2} / \\eta_{1}=\\|v\\|_{2} / \\eta_{1}\n$$","statement_clean":"Recalling $|J|=k<\\rho n / \\log (m)$, and invoking CS1 we have\n\n$$\n\\left\\|\\theta_{J}\\right\\|_{2} \\leq\\left\\|\\Phi_{J} \\theta_{J}\\right\\|_{2} / \\eta_{1}=\\|v\\|_{2} / \\eta_{1}\n$$","statement_short":"CS1 transfers the bound to $\\|\\theta_J\\|_2$.","name":"Invoke CS1","subclass":"apply_lemma","step_order":7,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP8","statement":"In short, with $c_{2}=c_{1} / \\eta_{1}$\n\n$$\n\\begin{aligned}\n\\|\\theta\\|_{2} \\leq & \\left\\|\\theta_{J}\\right\\|_{2}+\\left\\|\\theta_{J^{c}}\\right\\|_{2} \\\\\n\\leq & c_{2} \\cdot(n / \\log (m))^{1 / 2-1 / p} \\\\\n& +\\zeta_{2, p} \\cdot(\\rho n / \\log (m))^{1 / 2-1 / p}\n\\end{aligned}\n$$\n\nThe theorem follows with\n\n$$\nC=\\left(\\zeta_{1, p} \\rho^{1-1 / p} /\\left(\\eta_{1} \\eta_{2} \\eta_{3}\\right)+\\zeta_{2, p} \\rho^{1 / 2-1 / p}\\right)\n$$","statement_clean":"In short, with $c_{2}=c_{1} / \\eta_{1}$\n\n$$\n\\begin{aligned}\n\\|\\theta\\|_{2} \\leq & \\left\\|\\theta_{J}\\right\\|_{2}+\\left\\|\\theta_{J^{c}}\\right\\|_{2} \\\\\n\\leq & c_{2} \\cdot(n / \\log (m))^{1 / 2-1 / p} \\\\\n& +\\zeta_{2, p} \\cdot(\\rho n / \\log (m))^{1 / 2-1 / p}\n\\end{aligned}\n$$\n\nThe theorem follows with\n\n$$\nC=\\left(\\zeta_{1, p} \\rho^{1-1 / p} /\\left(\\eta_{1} \\eta_{2} \\eta_{3}\\right)+\\zeta_{2, p} \\rho^{1 / 2-1 / p}\\right)\n$$","statement_short":"Add head and tail bounds to get the constant $C$.","name":"Conclude","subclass":"conclude","step_order":8,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75}],"equations":[{"id":"EP6","statement":"\\left\\|\\theta_{J^{c}}\\right\\|_{p} \\leq\\|\\theta\\|_{p} \\leq 1 \\tag{II.2}","section":"B. Near-Optimality of CS Matrices","context":"","parent_step":"PSP3"},{"id":"EP7","statement":"\\left\\|\\theta_{J^{c}}\\right\\|_{2} \\leq \\zeta_{2, p} \\cdot(k+1)^{1 / 2-1 / p} \\tag{II.3}","section":"B. Near-Optimality of CS Matrices","context":"","parent_step":"PSP3"},{"id":"EP8","statement":"\\left\\|\\theta_{J^{c}}\\right\\|_{1} \\leq \\zeta_{1, p} \\cdot(k+1)^{1-1 / p} \\tag{II.4}","section":"B. Near-Optimality of CS Matrices","context":"","parent_step":"PSP3"}],"foundation_links":["Proof","coordinates","positive","theorem","bound","approximation","argument","Theorem 7","partition","sequence","equation","optimization"]},"AP2":{"name":"Feasible-point method","type":"algorithm","section":"A. Feasible-Point Methods","statement":"Another general abstract algorithm from the OR/IBC literature is the so-called feasible-point method, which aims simply to find any reconstruction compatible with the observed information and constraints.\n\nAs in the case of the central algorithm, we consider, for given information $y_{n}=I_{n}\\left(x_{0}\\right)$, the collection of all objects $x \\in X_{p, m}(R)$ which could have given rise to the information $y_{n}$\n\n$$\n\\hat{X}_{p, R}\\left(y_{n}\\right)=\\left\\{x: y_{n}=I_{n}(x), \\quad x \\in X_{p, m}(R)\\right\\} .\n
