itle":"4 Numerical Experiments","subs":[],"nodes":["AP1","ClP8","ClP9"]},{"id":"sec:5","key":"5","title":"5 Optimal Signal Recovery","subs":[],"nodes":["DP11","DP12","DP13","TP11","RP6","ClP10","TP12","DP14","DP15","TP13","RP7"]},{"id":"sec:6","key":"6","title":"Section 6","subs":["sec:6.2","sec:6.3"],"nodes":["DP16","TP14","ClP11","CnjP1"]}],"subsections":[{"id":"sec:1.1","key":"1.1","title":"1.1 Decoding of linear codes","parent":"sec:1","nodes":["ProbP1","DP1","RP1","AssumP1","DP2","DP3","DP4"]},{"id":"sec:1.2","key":"1.2","title":"1.2 Sparse solutions to underdetermined systems","parent":"sec:1","nodes":["TP1","ProbP2","ProbP3","TP2","TP3","TP4","TP5"]},{"id":"sec:1.3","key":"1.3","title":"1.3 Innovations","parent":"sec:1","nodes":["DP5","ProbP4","ClP1","ClP2"]},{"id":"sec:1.4","key":"1.4","title":"1.4 Restricted isometries","parent":"sec:1","nodes":["DP6","DP7","RP2","DP8","ClP3","ClP4","LP1","LP2"]},{"id":"sec:1.5","key":"1.5","title":"1.5 Main results","parent":"sec:1","nodes":["TP6","RP3","TP7"]},{"id":"sec:1.6","key":"1.6","title":"1.6 Gaussian random matrices","parent":"sec:1","nodes":["TP8","CP1"]},{"id":"sec:2.1","key":"2.1","title":"2.1 Exact reconstruction property","parent":"sec:2","nodes":["LP3","LP4","ClP6"]},{"id":"sec:2.2","key":"2.2","title":"2.2 Proof of Theorem 1.4","parent":"sec:2","nodes":["RP4"]},{"id":"sec:6.2","key":"6.2","title":"6.2 Improvements","parent":"sec:6","nodes":["DP16","TP14","ClP11"]},{"id":"sec:6.3","key":"6.3","title":"6.3 Other coding matrices","parent":"sec:6","nodes":["CnjP1"]}],"nodes":[{"id":"ProbP1","type":"problem","name":"Decoding problem (recover f from y = Af + e)","short":"Recover the input f exactly from corrupted measurements y=Af+e with A an m\u00d7 n matrix and e arbitrary errors.","top":"sec:1","sub":"sec:1.1","inside":"","origin":"paper","conf":0.85,"imp":5.0,"desc":54,"res":0,"nsteps":0,"tex":"This paper considers the model problem of recovering an input vector $f \\in {{\\mathbf{R}}}^n$ from corrupted measurements $y = A f + e$. Here, $A$ is an $m$ by $n$ matrix (we will\u2026","tex_name":"Decoding problem (recover f from y = Af + e)"},{"id":"DP1","type":"definition","name":"Linear code","short":"In its abstract form, our problem is of course equivalent to the classical error correcting problem which arises in coding theory as we may think of\u2026","top":"sec:1","sub":"sec:1.1","inside":"","origin":"external","conf":0.75,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"In its abstract form, our problem is of course equivalent to the classical error correcting problem which arises in coding theory as we may think of $A$\u2026","tex_name":"Linear code"},{"id":"RP1","type":"remark","name":"Decoding impossible when half the entries are corrupted","short":"If half of the entries of Af can be corrupted, two plaintexts give the same corrupted ciphertext, so decoding is impossible.","top":"sec:1","sub":"sec:1.1","inside":"","origin":"external","conf":0.7,"imp":1.1,"desc":0,"res":0,"nsteps":0,"tex":"As is well-known, if the fraction of the corrupted entries is too large, then of course we have no hope of reconstructing $f$ from $Af+e$; for instance\u2026","tex_name":"Decoding impossible when half the entries are corrupted"},{"id":"AssumP1","type":"assumption","name":"Sparse error assumption","short":"Only a fraction \u03c1 of the entries of e are nonzero: \u2016e\u2016_(\u2113\u2080)\u2264\u03c1 m.","top":"sec:1","sub":"sec:1.1","inside":"","origin":"external","conf":0.75,"imp":1.1,"desc":0,"res":0,"nsteps":0,"tex":"Therefore, a common assumption in the literature is to assume that only a small fraction of the entries are actually damaged $\\|e\\|_{\\ell_0} := |\\{i : e_i \\neq 0\\}| \\le \\rho \\cdot m.$","tex_name":"Sparse error assumption"},{"id":"DP2","type":"definition","name":"Annihilator matrix F","short":"F is a matrix with FA=0, e.g. the projection onto the cokernel of A.","top":"sec:1","sub":"sec:1.1","inside":"","origin":"paper","conf":0.8,"imp":4.7,"desc":44,"res":1,"nsteps":0,"tex":"We construct a matrix which annihilates the $m \\times n$ matrix $A$ on the left, i.e. such that $F A = 0$. This can be done in an obvious fashion by taking a matrix $F$\u2026","tex_name":"Annihilator matrix F"},{"id":"DP3","type":"definition","name":"Syndrome observation tilde y = F e","short":"We then apply F to the output y = A f + e and obtain y = F(Af + e) = F e since F A = 0.","top":"sec:1","sub":"sec:1.1","inside":"","origin":"paper","conf":0.8,"imp":4.0,"desc":19,"res":1,"nsteps":0,"tex":"We then apply $F$ to the output $y = A f + e$ and obtain $\\tilde y = F(Af + e) = F e$ since $F A = 0$.","tex_name":"Syndrome observation tilde y = F e"},{"id":"DP4","type":"definition","name":"Sparse vector","short":"Decoding reduces to recovering a sparse e (few nonzero entries) from Fe.","top":"sec:1","sub":"sec:1.1","inside":"","origin":"paper","conf":0.7,"imp":3.2,"desc":7,"res":1,"nsteps":0,"tex":"Therefore, the decoding problem is reduced to that of reconstructing a sparse vector $e$ from the observations $F e$ (by sparse, we mean that only a\u2026","tex_name":"Sparse vector"},{"id":"TP1","type":"theorem","name":"NP-hardness of sparsest solutions","short":"Finding sparse solutions to underdetermined systems of linear equations is in general NP-hard [Natarajan, Equivl0l1].","top":"sec:1","sub":"sec:1.2","inside":"","origin":"external","conf":0.75,"imp":1.8,"desc":0,"res":1,"nsteps":0,"tex":"Finding sparse solutions to underdetermined systems of linear equations is in general $NP$-hard [Natarajan, Equivl0l1].","tex_name":"NP-hardness of sparsest solutions"},{"id":"ProbP2","type":"problem","name":"(P_0) l0 minimization","short":"(P\u2080): minimize \u2016d\u2016_(\u2113\u2080) subject to Fd= y, which needs combinatorial search.","top":"sec:1","sub":"sec:1.2","inside":"","origin":"external","conf":0.8,"imp":2.1,"desc":2,"res":0,"nsteps":0,"tex":"For example, the sparsest solution is given by $(P_0) \\quad \\quad \\min_{d \\in {{\\mathbf{R}}}^m} \\|d\\|_{\\ell_0} \\quad subject to \\quad F d = \\tilde y \\,\\, ( = F e),$ and to the best of our knowledge, solving this problem\u2026","tex_name":"($P_0$) l0 minimization"},{"id":"ProbP3","type":"problem","name":"Basis Pursuit","short":"(P\u2081): minimize \u2016d\u2016_(\u2113\u2081) subject to Fd= y.","top":"sec:1","sub":"sec:1.2","inside":"","origin":"external","conf":0.85,"imp":3.1,"desc":11,"res":0,"nsteps":0,"tex":"This computational intractability has recently led researchers to develop alternatives to $(P_0)$, and a frequently discussed approach considers a similar\u2026","tex_name":"Basis Pursuit"},{"id":"TP2","type":"theorem","name":"Basis Pursuit is a linear program","short":"It is also well-known [Bloomfield] that (P\u2081) can be recast as a linear program (LP).","top":"sec:1","sub":"sec:1.2","inside":"","origin":"external","conf":0.7,"imp":1.8,"desc":0,"res":1,"nsteps":0,"tex":"It is also well-known [Bloomfield] that $(P_1)$ can be recast as a linear program (LP).","tex_name":"Basis Pursuit is a linear program"},{"id":"TP3","type":"theorem","name":"l0/l1 equivalence for unions of two orthobases","short":"Motivated by the problem of finding sparse decompositions of special signals in the field of mathematical signal processing and following upon the\u2026","top":"sec:1","sub":"sec:1.2","inside":"","origin":"external","conf":0.7,"imp":2.3,"desc":1,"res":1,"nsteps":0,"tex":"Motivated by the problem of finding sparse decompositions of special signals in the field of mathematical signal processing and following upon the\u2026","tex_name":"l0/l1 equivalence for unions of two orthobases"},{"id":"TP4","type":"theorem","name":"l0/l1 equivalence for random matrices at sparsity m/log m","short":"Using very different ideas and together with Romberg [CRT], the authors proved that the equivalence holds with overwhelming probability for various\u2026","top":"sec:1","sub":"sec:1.2","inside":"","origin":"external","conf":0.7,"imp":1.8,"desc":0,"res":1,"nsteps":0,"tex":"Using very different ideas and together with Romberg [CRT], the authors proved that the equivalence holds with overwhelming probability for various\u2026","tex_name":"l0/l1 equivalence for random matrices at sparsity m/log m"},{"id":"TP5","type":"theorem","name":"Donoho's l0/l1 equivalence for Gaussian matrices","short":"In the special case where F is an m/2 by m random matrix with independent standard normal entries, [Equivl0l1] proved that the number of nonzero\u2026","top":"sec:1","sub":"sec:1.2","inside":"","origin":"external","conf":0.7,"imp":1.8,"desc":0,"res":1,"nsteps":0,"tex":"In the special case where $F$ is an $m/2$ by $m$ random matrix with independent standard normal entries, [Equivl0l1] proved that the number of nonzero\u2026","tex_name":"Donoho's l0/l1 equivalence for Gaussian matrices"},{"id":"DP5","type":"definition","name":"Restrictedly almost orthonormal system","short":"This paper introduces the concept of a restrictedly almost orthonormal system\u2014a collection of vectors which behaves like an almost orthonormal system\u2026","top":"sec:1","sub":"sec:1.3","inside":"","origin":"paper","conf":0.8,"imp":1.3,"desc":0,"res":1,"nsteps":0},{"id":"ProbP4","type":"problem","name":"(P'_1) l1 decoding program","short":"(P'\u2081): minimize \u2016y-Ag\u2016_(\u2113\u2081) over g\u207f.","top":"sec:1","sub":"sec:1.3","inside":"","origin":"paper","conf":0.85,"imp":3.4,"desc":8,"res":0,"nsteps":0,"tex":"To recover $f$ from corrupted data $y = Af + e$, we consider solving the following $\\ell_1$-minimization problem $(P'_1) \\quad \\quad \\min_{g \\in {{\\mathbf{R}}}^n} \\|y - A g\\|_{\\ell_1}.$","tex_name":"(P'_1) l1 decoding program"},{"id":"ClP1","type":"claim","name":"Equivalence of (P_1) and (P'_1)","short":"Now f is the unique solution of (P'\u2081) if and only if e is the unique solution of (P\u2081). In other words, (P\u2081) and (P'\u2081) are equivalent programs.","top":"sec:1","sub":"sec:1.3","inside":"","origin":"paper","conf":0.85,"imp":1.8,"desc":1,"res":1,"nsteps":1,"tex":"Now $f$ is the unique solution of $(P'_1)$ if and only if $e$ is the unique solution of $(P_1)$. In other words, $(P_1)$ and $(P'_1)$ are equivalent programs.","tex_name":"Equivalence of ($P_1$) and (P'_1)"},{"id":"ClP2","type":"claim","name":"(P'_1) is a linear program","short":"(P'\u2081) is equivalent to the LP min 1\u1d40t s.t. -t\u2264 y-Ag\u2264 t.","top":"sec:1","sub":"sec:1.3","inside":"","origin":"paper","conf":0.75,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"The program $(P'_1)$ may also be re-expressed as an LP\u2014hence the title of this paper. Indeed, the $\\ell_1$-minimization problem is equivalent to $\\min 1^T t , \\qquad -t \\le y - A g \\le t,$\u2026","tex_name":"(P'_1) is a linear program"},{"id":"DP6","type":"definition","name":"Columns v_j and Hilbert space H","short":"We denote by (v\u2c7c)_(j \u2208 J) \u2208 R\u1d56 the columns of the matrix F and by H the Hilbert space spanned by these vectors.","top":"sec:1","sub":"sec:1.4","inside":"","origin":"paper","conf":0.85,"imp":4.4,"desc":32,"res":1,"nsteps":0,"tex":"We denote by $(v_j)_{j \\in J} \\in R^p$ the columns of the matrix $F$ and by $H$ the Hilbert space spanned by these vectors.","tex_name":"Columns $v_j$ and Hilbert space H"},{"id":"DP7","type":"definition","name":"Submatrix F_T","short":"Further, for any T \u2286 J, we let F_T be the submatrix with column indices j \u2208 T so that F_T c = \u03a3_j \u2208 T c_j v_j \u2208 H.","top":"sec:1","sub":"sec:1.4","inside":"","origin":"paper","conf":0.85,"imp":4.3,"desc":28,"res":1,"nsteps":0,"tex":"Further, for any $T \\subseteq J$, we let $F_T$ be the submatrix with column indices $j \\in T$ so that $F_T \\, c = \\sum_{j \\in T} c_j v_j \\in H.$","tex_name":"Submatrix $F_T$"},{"id":"RP2","type":"remark","name":"Degenerate columns prevent recovery","short":"A sparse vanishing linear combination of the columns yields a vector with two distinct sparse representations.","top":"sec:1","sub":"sec:1.4","inside":"","origin":"paper","conf":0.7,"imp":1.1,"desc":0,"res":0,"nsteps":0,"tex":"To introduce the notion of almost orthonormal system, we first observe that if the columns of $F$ are sufficiently \u201cdegenerate,\u201d the recovery problem\u2026","tex_name":"Degenerate columns prevent recovery"},{"id":"DP8","type":"definition","name":"Restricted isometry constants","short":"\u03b4_S: smallest constant with (1-\u03b4_S)\u2016c\u2016\u00b2\u2264\u2016F_Tc\u2016\u00b2\u2264(1+\u03b4_S)\u2016c\u2016\u00b2 for |T|\u2264 S; \u03b8_(S,S') bounds inner products of disjoint sparse combinations.","top":"sec:1","sub":"sec:1.4","inside":"","origin":"paper","conf":1.0,"imp":4.1,"desc":22,"res":1,"nsteps":0,"tex":"Let $F$ be the matrix with the finite collection of vectors $(v_j)_{j \\in J} \\in {{\\mathbf{R}}}^p$ as columns. For every integer $1 \\leq S \\leq |J|$, we define the $S$-restricted isometry\u2026","tex_name":"Restricted isometry constants"},{"id":"ClP3","type":"claim","name":"Monotonicity of restricted isometry constants","short":"These numbers are clearly non-decreasing in S, S'.","top":"sec:1","sub":"sec:1.4","inside":"","origin":"paper","conf":0.7,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"These numbers are clearly non-decreasing in $S$, $S'$.","tex_name":"Monotonicity of restricted isometry constants"},{"id":"ClP4","type":"claim","name":"delta_1 controls column lengths","short":"For S = 1, the value \u03b4\u2081 only conveys magnitude information about the vectors v\u2c7c; indeed \u03b4\u2081 is the best constant such that 1 - \u03b4_1 \u2264 \u2016v_j \u2016_H^2 \u2264 1 +\u2026","top":"sec:1","sub":"sec:1.4","inside":"","origin":"paper","conf":0.7,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"For $S = 1$, the value $\\delta_1$ only conveys magnitude information about the vectors $v_j$; indeed $\\delta_1$ is the best constant such that $1 - \\delta_1 \\leq \\|v_j \\|_H^2 \\leq 1 + \\delta_1 for all j \\in J.$ In\u2026","tex_name":"delta_1 controls column lengths"},{"id":"LP1","type":"lemma","name":"Orthogonality constants controlled by isometry constants","short":"We have \u03b8_(S,S') \u2264 \u03b4_(S+S') \u2264 \u03b8_(S,S') + max(\u03b4_S,\u03b4_(S')) for all S, S'.","top":"sec:1","sub":"sec:1.4","inside":"","origin":"paper","conf":1.0,"imp":3.1,"desc":3,"res":1,"nsteps":5,"tex":"We have $\\theta_{S,S'} \\leq \\delta_{S+S'} \\leq \\theta_{S,S'} + \\max(\\delta_S,\\delta_{S'})$ for all $S$, $S'$.","tex_name":"Orthogonality constants controlled by isometry constants"},{"id":"LP2","type":"lemma","name":"Unique sparse representation when delta_2S < 1","short":"Suppose that S \u2265 1 is such that \u03b4_(2S) < 1, and let T \u2282 J be such that |T| \u2264 S. Let f := F_T c for some arbitrary |T|-dimensional vector c. Then the\u2026","top":"sec:1","sub":"sec:1.4","inside":"","origin":"paper","conf":1.0,"imp":1.9,"desc":0,"res":1,"nsteps":3,"tex":"Suppose that $S \\geq 1$ is such that $\\delta_{2S} < 1$, and let $T \\subset J$ be such that $|T| \\leq S$. Let $f := F_T \\, c$ for some arbitrary $|T|$-dimensional vector $c$. Then the set $T$ and the\u2026","tex_name":"Unique sparse representation when delta_2S < 1"},{"id":"TP6","type":"theorem","name":"Exact recovery by l1 minimization under restricted isometry","short":"If \u03b4_S+\u03b8_S+\u03b8_(S,2S)<1, every S-sparse c is the unique \u2113\u2081 minimizer subject to Fd=Fc.","top":"sec:1","sub":"sec:1.5","inside":"","origin":"paper","conf":1.0,"imp":5.0,"desc":3,"res":1,"nsteps":5,"tex":"Suppose that $S \\geq 1$ is such that $\\delta_S + \\theta_S + \\theta_{S,2S} < 1,$ and let $c$ be a real vector supported on a set $T \\subset J$ obeying $|T| \\leq S$. Put $f := F c$. Then $c$ is the unique minimizer to $(P_1) \\quad \\quad \\min \\|d\\|_{\\ell_1} \\qquad F d = f.$\u2026","tex_name":"Exact recovery by l1 minimization under restricted isometry"},{"id":"RP3","type":"remark","name":"Strength of the condition (1.10)","short":"Condition (1.10) implies \u03b4_(2S)<1 and is implied by \u03b4_S+\u03b4_(2S)+\u03b4_(3S)<1/4, roughly three times stricter than Lemma 1.3's.","top":"sec:1","sub":"sec:1.5","inside":"","origin":"paper","conf":0.75,"imp":1.1,"desc":0,"res":0,"nsteps":0,"tex":"Note from Lemma Lem 1 that (Eq 10) implies $\\delta_{2S} < 1$, and is in turn implied by $\\delta_S + \\delta_{2S}+\\delta_{3S} < 1/4$. Thus the condition (Eq 10) is roughly \u201cthree times as\u2026","tex_name":"Strength of the condition (1.10)"},{"id":"TP7","type":"theorem","name":"Exact decoding by l1 minimization","short":"Under the condition of Theorem 1.4 with FA=0, \u2113\u2081 decoding recovers f exactly when e is S-sparse.","top":"sec:1","sub":"sec:1.5","inside":"","origin":"paper","conf":1.0,"imp":5.0,"desc":0,"res":1,"nsteps":1,"tex":"Suppose $F$ is such that $F A = 0$ and let $S \\geq 1$ be a number obeying the hypothesis of Theorem Thm 6. Set $y = A f + e$, where $e$ is a real vector supported on a set of\u2026","tex_name":"Exact decoding by l1 minimization"},{"id":"TP8","type":"theorem","name":"Gaussian matrices satisfy the restricted isometry condition","short":"A p\u00d7 m Gaussian matrix satisfies condition (1.10) with overwhelming probability when S/m<r*(p,m); numerically r*\u2248 10\u207b\u2074 scale.","top":"sec:1","sub":"sec:1.6","inside":"","origin":"paper","conf":1.0,"imp":5.0,"desc":1,"res":1,"nsteps":3,"tex":"Assume $p \\le m$ and let $F$ be a $p$ by $m$ matrix whose entries are i.i.d. Gaussian with mean zero and variance $1/p$. Then the condition of Theorem Thm 6 holds\u2026","tex_name":"Gaussian matrices satisfy the restricted isometry condition"},{"id":"CP1","type":"corollary","name":"Exact decoding for Gaussian coding matrices","short":"Suppose A is an n by m Gaussian matrix and set p = m - n. Under the hypotheses of Theorem Thm 8, the solution to (P\u2081') is unique and equal to f.","top":"sec:1","sub":"sec:1.6","inside":"","origin":"paper","conf":1.0,"imp":5.0,"desc":0,"res":1,"nsteps":2,"tex":"Suppose $A$ is an $n$ by $m$ Gaussian matrix and set $p = m - n$. Under the hypotheses of Theorem Thm 8, the solution to $(P_1')$ is unique and equal to $f$.","tex_name":"Exact decoding for Gaussian coding matrices"},{"id":"ClP5","type":"claim","name":"Dual certificate criterion for l1 uniqueness","short":"c is the unique \u2113\u2081 minimizer if F_T has full rank and a dual vector w has \u27e8 w,v\u2c7c\u27e9=sgn(c\u2c7c) on T and |\u27e8 w,v\u2c7c\u27e9|<1 off T.","top":"sec:2","sub":"","inside":"","origin":"paper","conf":0.8,"imp":2.9,"desc":6,"res":1,"nsteps":0,"tex":"As we will see in section sec:main-proof, $c$ is the unique minimizer if the matrix $F_T$ has full rank and if one can find a vector $w$ with the two\u2026","tex_name":"Dual certificate criterion for l1 uniqueness"},{"id":"DP9","type":"definition","name":"Exact reconstruction property (dual feasibility)","short":"The two conditions above say that a specific dual program is feasible and is called the exact reconstruction property in [OptimalRecovery], see also\u2026","top":"sec:2","sub":"","inside":"","origin":"external","conf":0.8,"imp":1.2,"desc":0,"res":1,"nsteps":0},{"id":"LP3","type":"lemma","name":"Dual sparse reconstruction property, l2 version","short":"With \u03b4_S<1 there is w matching c on T whose correlations off T are small except on an exceptional set of size \u2264 S', which is small in \u2113\u2082.","top":"sec:2","sub":"sec:2.1","inside":"","origin":"paper","conf":1.0,"imp":4.0,"desc":9,"res":1,"nsteps":5,"tex":"Let $S,S' \\geq 1$ be such that $\\delta_S < 1$, and $c$ be a real vector supported on $T \\subset J$ such that $|T| \\leq S$. Then there exists a vector $w \\in H$ such that $\\langle w, v_j \\rangle_H = c_j$ for all $j \\in T$.\u2026","tex_name":"Dual sparse reconstruction property, l2 version"},{"id":"LP4","type":"lemma","name":"Dual sparse reconstruction property, l_infty version","short":"If \u03b4_S+\u03b8_(S,2S)<1, there is w matching c on T with all correlations off T bounded by \u03b8_S\u2016c\u2016/((1-\u03b4_S-\u03b8_(S,2S)) S).","top":"sec:2","sub":"sec:2.1","inside":"","origin":"paper","conf":1.0,"imp":3.9,"desc":8,"res":1,"nsteps":10,"tex":"Let $S \\geq 1$ be such that $\\delta_S + \\theta_{S,2S} < 1$, and $c$ be a real vector supported on $T \\subset J$ obeying $|T| \\le S$. Then there exists a vector $w \\in H$ such that $\\langle w, v_j \\rangle_H = c_j$ for all $j \\in T$.\u2026","tex_name":"Dual sparse reconstruction property, $l_i$nfty version"},{"id":"ClP6","type":"claim","name":"Lemma 2.2 solves the dual recovery problem","short":"Lemma Lem 4 actually solves the dual recovery problem. Indeed, our result states that one can find a vector w \u2208 H obeying both properties (i) and\u2026","top":"sec:2","sub":"sec:2.1","inside":"","origin":"paper","conf":0.8,"imp":2.6,"desc":4,"res":1,"nsteps":1,"tex":"Lemma Lem 4 actually solves the dual recovery problem. Indeed, our result states that one can find a vector $w \\in H$ obeying both properties (i) and (ii)\u2026","tex_name":"Lemma 2.2 solves the dual recovery problem"},{"id":"RP4","type":"remark","name":"The condition of Theorem 1.4 can likely be relaxed","short":"The condition can likely be weakened by making w\u2099 only moderate, not annihilate, the influence of w\u2099\u208b\u2081 on the exceptional sets.","top":"sec:2","sub":"sec:2.2","inside":"","origin":"paper","conf":0.8,"imp":1.1,"desc":0,"res":0,"nsteps":0,"tex":"Remark. It is likely that one may push the condition $\\delta_S + \\theta_{S,S} + \\theta_{S,2S} < 1$ a little further. The key idea is as follows. Each vector $w_n$ in the iteration\u2026","tex_name":"The condition of Theorem 1.4 can likely be relaxed"},{"id":"DP10","type":"definition","name":"Gaussian matrix","short":"Consider a p by m matrix F whose entries are i.i.d. Gaussian with mean zero and variance 1/p and let T be a subset of the columns.","top":"sec:3","sub":"","inside":"","origin":"paper","conf":0.7,"imp":3.2,"desc":7,"res":1,"nsteps":0,"tex":"Consider a $p$ by $m$ matrix $F$ whose entries are i.i.d. Gaussian with mean zero and variance $1/p$ and let $T$ be a subset of the columns.","tex_name":"Gaussian matrix"},{"id":"TP9","type":"theorem","name":"Marchenko-Pastur / Geman / Silverstein extreme eigenvalue limits","short":"Following upon the work of Marchenko and Pastur [MarchenkoPastur], Geman [Geman] and Silverstein [Silverstein] (see also [BaiYin]) proved that &\u2026","top":"sec:3","sub":"","inside":"","origin":"external","conf":0.85,"imp":2.3,"desc":1,"res":1,"nsteps":0,"tex":"Following upon the work of Marchenko and Pastur [MarchenkoPastur], Geman [Geman] and Silverstein [Silverstein] (see also [BaiYin]) proved that $\\lambda_{\\min}(F_T^* F_T) \\rightarrow (1 - \\sqrt{\\gamma})^2 a.s. \\lambda_{\\max}(F_T^* F_T) \\rightarrow (1 + \\sqrt{\\gamma})^2 a.s.,$\u2026","tex_name":"Marchenko-Pastur / Geman / Silverstein extreme eigenvalue limits"},{"id":"RP5","type":"remark","name":"Heuristic size of delta(F_T)","short":"For fixed T and large p, \u03b4(F_T)\u2248 2\u221a(|T|/p)+|T|/p.","top":"sec:3","sub":"","inside":"","origin":"paper","conf":0.7,"imp":1.1,"desc":0,"res":0,"nsteps":0,"tex":"In other words, this says that loosely speaking and in the limit of large $p$, the restricted isometry constant $\\delta(F_T)$ for a fixed $T$ behaves like $1 - \\delta(F_T) \\le \\lambda_{\\min}(F_T^* F_T) \\le \\lambda_{\\max}(F_T) \\le 1 + \\delta(F_T), \\qquad \\delta(F_T) \\approx 2 \\sqrt{|T|/p} + |T|/p.$\u2026","tex_name":"Heuristic size of delta($F_T$)"},{"id":"ClP7","type":"claim","name":"Eigenvalue interlacing for column subsets","short":"Note that for T' \u2282 T, we obviously have \u03bb_min(F_T^* F_T) \u2264 \u03bb_min(F_T'^* F_T') \u2264 \u03bb_max(F_T'^* F_T') \u2264 \u03bb_max(F_T^* F_T) and, therefore, attention may\u2026","top":"sec:3","sub":"","inside":"","origin":"paper","conf":0.75,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"Note that for $T' \\subset T$, we obviously have $\\lambda_{\\min}(F_T^* F_T) \\le \\lambda_{\\min}(F_{T'}^* F_{T'}) \\le \\lambda_{\\max}(F_{T'}^* F_{T'}) \\le \\lambda_{\\max}(F_T^* F_T)$ and, therefore, attention may be restricted to matrices of size $S$.","tex_name":"Eigenvalue interlacing for column subsets"},{"id":"TP10","type":"theorem","name":"Ledoux's concentration bounds for extreme singular values","short":"Gaussian concentration: extreme singular values of F_T deviate from 1\u00b1\u221a(|T|/p) by more than t with probability \u2264 e^(-pt\u00b2/2).","top":"sec:3","sub":"","inside":"","origin":"external","conf":0.85,"imp":2.8,"desc":3,"res":1,"nsteps":0,"tex":"For example, letting $\\sigma_{\\max}(F_T)$ (resp. $\\sigma_{\\min}$) be the largest singular value of $F_T$ so that $\\sigma^2_{\\max}(F_T) = \\lambda_{\\max}(F_T^*F_T)$ (resp. $\\sigma^2_{\\min}(F_T) = \\lambda_{\\min}(F_T^*F_T)$), Ledoux [LedouxAMS]\u2026","tex_name":"Ledoux's concentration bounds for extreme singular values"},{"id":"LP5","type":"lemma","name":"Large deviation bound for delta_S of Gaussian matrices","short":"P(1+\u03b4_S>[1+(1+\u03b5)f(r)]\u00b2)\u2264 2e^(-mH(r)\u03b5/2) with f(r)=\u221a(m/p)( r+\u221a(2H(r))).","top":"sec:3","sub":"","inside":"","origin":"paper","conf":1.0,"imp":2.9,"desc":2,"res":1,"nsteps":5,"tex":"Put $r = S/m$ and set $f(r) := \\sqrt{m/p} \\cdot \\left(\\sqrt{r} + \\sqrt{2H(r)}\\right),$ where $H$ is the entropy function $H(q) := - q\\log q - (1-q) \\log(1-q)$ defined for $0 < q < 1$. For each $\\epsilon> 0$, the restricted isometry constant $\\delta_S$ of\u2026","tex_name":"Large deviation bound for delta_S of Gaussian matrices"},{"id":"AP1","type":"algorithm","name":"l1 decoding recovery experiment","short":"Monte Carlo experiment: sample Gaussian A and sparse Gaussian errors, solve (P'\u2081), and record exact recovery over 100 trials per sparsity level.","top":"sec:4","sub":"","inside":"","origin":"paper","conf":0.75,"imp":2.5,"desc":2,"res":1,"nsteps":10,"tex":"In order to do this, we performed a series of experiments designed as follows: \u2022 select $n$ (the size of the input signal) and $m$ so that with the same\u2026","tex_name":"l1 decoding recovery experiment"},{"id":"ClP8","type":"claim","name":"Empirical recovery threshold 17% for m = 2n","short":"Our experiments show that one recovers the input vector all the time as long as the fraction of the corrupted entries is below 17%. This holds for m\u2026","top":"sec:4","sub":"","inside":"","origin":"paper","conf":0.75,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"Our experiments show that one recovers the input vector all the time as long as the fraction of the corrupted entries is below 17%. This holds for $m = 512$\u2026","tex_name":"Empirical recovery threshold 17% for m = 2n"},{"id":"ClP9","type":"claim","name":"Empirical recovery threshold 34% for m = 4n","short":"In Figure fig:reccurves4, we investigate how these results change as the length of the codewords increases compared to the length of the input, and\u2026","top":"sec:4","sub":"","inside":"","origin":"paper","conf":0.75,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"In Figure fig:reccurves4, we investigate how these results change as the length of the codewords increases compared to the length of the input, and\u2026","tex_name":"Empirical recovery threshold 34% for m = 4n"},{"id":"DP11","type":"definition","name":"Linear measurement model","short":"Suppose we wish to reconstruct an object \u03b1 in R\u1d50 from the K linear measurements y_k = \u03b1,\u03c6_k k = 1,\u2026,K or y = F \u03b1, with \u03c6\u2096, the kth row of the matrix\u2026","top":"sec:5","sub":"","inside":"","origin":"paper","conf":0.8,"imp":3.0,"desc":6,"res":1,"nsteps":0,"tex":"Suppose we wish to reconstruct an object $\\alpha$ in ${{\\mathbf{R}}}^m$ from the $K$ linear measurements $y_k = \\<\\alpha,\\phi_k\\> \\quad k = 1,\\ldots,K \\qquad or\\quad\\quad y = F \\alpha,$ with $\\phi_k$, the $k$th row of the matrix $F$.","tex_name":"Linear measurement model"},{"id":"DP12","type":"definition","name":"Compressible signal","short":"Suppose now that the object of interest is compressible in the sense that the reordered entries of \u03b1 decay like a power-law; concretely, suppose that\u2026","top":"sec:5","sub":"","inside":"","origin":"paper","conf":0.85,"imp":2.9,"desc":5,"res":1,"nsteps":0,"tex":"Suppose now that the object of interest is compressible in the sense that the reordered entries of $\\alpha$ decay like a power-law; concretely, suppose\u2026","tex_name":"Compressible signal"},{"id":"DP13","type":"definition","name":"Signal class F_s(B)","short":"We will denote by F\u209b(B) the class of all signals \u03b1 \u2208 R\u1d50 obeying (Eq 23).","top":"sec:5","sub":"","inside":"","origin":"paper","conf":0.9,"imp":2.7,"desc":4,"res":1,"nsteps":0,"tex":"We will denote by ${\\cal F}_s(B)$ the class of all signals $\\alpha \\in {{\\mathbf{R}}}^m$ obeying (Eq 23).","tex_name":"Signal class $F_s$(B)"},{"id":"TP11","type":"theorem","name":"Optimal recovery of compressible signals","short":"Under \u03b4_S+2\u03b8_S+\u03b8_(S,2S)<1, the \u2113\u2081 reconstruction has worst-case error O((K/\u03bb)^(-(s-1/2))) over F\u209b(B).","top":"sec:5","sub":"","inside":"","origin":"paper","conf":1.0,"imp":3.0,"desc":1,"res":1,"nsteps":3,"tex":"Let $F$ be the measurement matrix as in (Eq 22) and consider the solution $\\alpha^\\sharp$ to $\\min_{\\tilde \\alpha \\in {{\\mathbf{R}}}^m} \\, \\|\\tilde \\alpha\\|_{\\ell_1} \\quad subject to \\quad F \\tilde \\alpha = y.$ Let $S \\le K$ such that $\\delta_S + 2\\theta_S + \\theta_{S,2S} < 1$\u2026","tex_name":"Optimal recovery of compressible signals"},{"id":"RP6","type":"remark","name":"Oracle K-term approximation error","short":"An oracle knowing the K largest coefficients gets error of order K^(-(s-1/2)) for generic elements of F\u209b(B).","top":"sec:5","sub":"","inside":"","origin":"paper","conf":0.7,"imp":1.1,"desc":0,"res":0,"nsteps":0,"tex":"To appreciate the content of the theorem, suppose one would have available an oracle letting us know which coefficients $\\alpha_k$, $1 \\le k \\le m$, are large (e.g. in\u2026","tex_name":"Oracle K-term approximation error"},{"id":"ClP10","type":"claim","name":"Gaussian measurement matrices satisfy Theorem 5.1's hypothesis","short":"Suppose for example that F is a Gaussian random matrix as in Section sec:random. We will assume the same special normalization so that the variance\u2026","top":"sec:5","sub":"","inside":"","origin":"paper","conf":0.75,"imp":1.2,"desc":0,"res":1,"nsteps":0,"tex":"Suppose for example that $F$ is a Gaussian random matrix as in Section sec:random. We will assume the same special normalization so that the variance\u2026","tex_name":"Gaussian measurement matrices satisfy Theorem 5.1's hypothesis"},{"id":"TP12","type":"theorem","name":"Measurement lower bound for compressible signals","short":"In short, it is impossible to obtain a precision of about K^(-(s-1/2)) with fewer than K log (m/K) measurements, see [OptimalRecovery\u2026","top":"sec:5","sub":"","inside":"","origin":"external","conf":0.7,"imp":1.8,"desc":0,"res":1,"nsteps":0,"tex":"In short, it is impossible to obtain a precision of about $K^{-(s-1/2)}$ with fewer than $K \\log (m/K)$ measurements, see [OptimalRecovery, CompressedSensing].","tex_name":"Measurement lower bound for compressible signals"},{"id":"DP14","type":"definition","name":"Uniform uncertainty principle (UUP)","short":"In a nutshell, a random matrix F obeys the UUP with oversampling factor \u03bb if F obeys \u03b4_S \u2264 1/2, S = \u03c1 \u00b7 K/\u03bb, with probability at least 1 -\u2026","top":"sec:5","sub":"","inside":"","origin":"external","conf":0.85,"imp":2.5,"desc":5,"res":1,"nsteps":0,"tex":"In a nutshell, a random matrix $F$ obeys the UUP with oversampling factor $\\lambda$ if $F$ obeys $\\delta_S \\le 1/2, \\qquad S = \\rho \\cdot K/\\lambda,$ with probability at least $1 - O(N^{-\\gamma/\\rho})$ for some\u2026","tex_name":"Uniform uncertainty principle (UUP)"},{"id":"DP15","type":"definition","name":"Exact reconstruction principle (ERP)","short":"Second, a measurement matrix F obeys the ERP with oversampling factor \u03bb if for each fixed subset T of size |T| \u2264 S (Eq 26) and each `sign' vector c\u2026","top":"sec:5","sub":"","inside":"","origin":"external","conf":0.85,"imp":2.4,"desc":4,"res":1,"nsteps":0,"tex":"Second, a measurement matrix $F$ obeys the ERP with oversampling factor $\\lambda$ if for each fixed subset $T$ of size $|T| \\le S$ (Eq 26) and each `sign' vector $c$\u2026","tex_name":"Exact reconstruction principle (ERP)"},{"id":"TP13","type":"theorem","name":"Candes-Tao Theorem 1.4 (UUP + ERP give optimal recovery)","short":"Fix \u03b1 \u2208 F\u209b(B). [OptimalRecovery] argued that if a random matrix obeyed the UUP and the ERP both with oversampling factor \u03bb, then \u2016\u03b1 - \u03b1^\u2016 \u2264 C \u00b7\u2026","top":"sec:5","sub":"","inside":"","origin":"external","conf":0.8,"imp":2.5,"desc":2,"res":1,"nsteps":0,"tex":"Fix $\\alpha \\in {\\cal F}_s(B)$. [OptimalRecovery] argued that if a random matrix obeyed the UUP and the ERP both with oversampling factor $\\lambda$, then $\\|\\alpha - \\alpha^\\sharp\\| \\le C \\cdot (K/\\lambda)^{-(s-1/2)},$\u2026","tex_name":"Candes-Tao Theorem 1.4 (UUP + ERP give optimal recovery)"},{"id":"RP7","type":"remark","name":"Comparison of Theorem 5.1 with the earlier result","short":"Theorem 5.1 applies to all matrices, is uniform over the class for a fixed F, and shows the ERP hypothesis is redundant.","top":"sec:5","sub":"","inside":"","origin":"paper","conf":0.75,"imp":1.1,"desc":0,"res":0,"nsteps":0,"tex":"Against this background, several comments are now in order: \u2022 First, the new statement is more general as it applies to all matrices, not just random\u2026","tex_name":"Comparison of Theorem 5.1 with the earlier result"},{"id":"DP16","type":"definition","name":"Principal angle cosine theta(F_T, F_T')","short":"Now let T and T' be two disjoint sets of respective sizes S and S' and consider \u03b8(F_T, F_(T')): \ var DETAILS = {"ProbP1":{"name":"Decoding problem (recover f from y = Af + e)","type":"problem","section":"1.1 Decoding of linear codes","statement":"This paper considers the model problem of recovering an input vector $f \\in {{\\mathbf{R}}}^n$ from corrupted measurements $y = A f + e$. Here, $A$ is an $m$ by $n$ matrix (we will assume throughout the paper that $m > n$), and $e$ is an arbitrary and unknown vector of errors. The problem we consider is whether it is possible to recover $f$ exactly from the data $y$. And if so, how?","statement_short":"Recover the input $f$ exactly from corrupted measurements $y=Af+e$ with $A$ an $m\\times n$ matrix and $e$ arbitrary errors.","rigor":"","confidence":0.85,"tags":["decoding","error_correction"],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["unknown","matrix","vector"]},"DP1":{"name":"Linear code","type":"definition","section":"1.1 Decoding of linear codes","statement":"In its abstract form, our problem is of course equivalent to the classical error correcting problem which arises in coding theory as we may think of $A$ as a linear code; a linear code is a given collection of codewords which are vectors $a_1,\\ldots, a_n \\in {{\\mathbf{R}}}^m$\u2014the columns of the matrix $A$.","statement_short":"","rigor":"","confidence":0.75,"tags":["coding_theory"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"standard (uncited)","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Vectors","matrix","error","Definition:Linear Code"]},"RP1":{"name":"Decoding impossible when half the entries are corrupted","type":"remark","section":"1.1 Decoding of linear codes","statement":"As is well-known, if the fraction of the corrupted entries is too large, then of course we have no hope of reconstructing $f$ from $Af+e$; for instance, assume that $m = 2n$ and consider two distinct plaintexts $f, f'$ and form a vector $g \\in {{\\mathbf{R}}}^m$ by setting half of its $m$ coefficients equal to those of $Af$ and half of those equal to those of $A f'$. Then $g = Af + e = Af' + e'$ where both $e$ and $e'$ are supported on sets of size at most $n = m/2$. This simple example shows that accurate decoding is impossible when the size of the support of the error vector is greater or equal to a half of that of the output $A f$.","statement_short":"If half of the entries of $Af$ can be corrupted, two plaintexts give the same corrupted ciphertext, so decoding is impossible.","rigor":"","confidence":0.7,"tags":["impossibility"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"standard (uncited)","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["error","vector","fraction"]},"AssumP1":{"name":"Sparse error assumption","type":"assumption","section":"1.1 Decoding of linear codes","statement":"Therefore, a common assumption in the literature is to assume that only a small fraction of the entries are actually damaged \\begin{equation} \\|e\\|_{\\ell_0} := |\\{i : e_i \\neq 0\\}| \\le \\rho \\cdot m. \\end{equation}","statement_short":"Only a fraction $\\rho$ of the entries of $e$ are nonzero: $\\|e\\|_{\\ell_0}\\le\\rho m$.","rigor":"","confidence":0.75,"tags":["sparsity"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"standard (uncited)","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[{"id":"EP1","statement":"\\|e\\|_{\\ell_0} := |\\{i : e_i \\neq 0\\}| \\le \\rho \\cdot m.","section":"1.1 Decoding of linear codes","context":"statement","parent_step":""}],"foundation_links":["error","equation","fraction"]},"DP2":{"name":"Annihilator matrix F","type":"definition","section":"1.1 Decoding of linear codes","statement":"We construct a matrix which annihilates the $m \\times n$ matrix $A$ on the left, i.e. such that $F A = 0$. This can be done in an obvious fashion by taking a matrix $F$ whose kernel is the range of $A$ in ${{\\mathbf{R}}}^m$, which is an $n$-dimensional subspace (e.g. $F$ could be the orthogonal projection onto the cokernel of $A$).","statement_short":"$F$ is a matrix with $FA=0$, e.g. the projection onto the cokernel of $A$.","rigor":"","confidence":0.8,"tags":["linear_algebra"],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Subspace","matrix","projection","Definition:Orthogonal Projection","Orthogonal","Range"]},"DP3":{"name":"Syndrome observation tilde y = F e","type":"definition","section":"1.1 Decoding of linear codes","statement":"We then apply $F$ to the output $y = A f + e$ and obtain \\begin{equation} \\tilde y = F(Af + e) = F e \\end{equation} since $F A = 0$.","statement_short":"","rigor":"","confidence":0.8,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[{"id":"EP2","statement":"\\tilde y = F(Af + e) = F e","section":"1.1 Decoding of linear codes","context":"statement","parent_step":""}],"foundation_links":["equation"]},"DP4":{"name":"Sparse vector","type":"definition","section":"1.1 Decoding of linear codes","statement":"Therefore, the decoding problem is reduced to that of reconstructing a sparse vector $e$ from the observations $F e$ (by sparse, we mean that only a fraction of the entries of $e$ are nonzero).","statement_short":"Decoding reduces to recovering a sparse $e$ (few nonzero entries) from $Fe$.","rigor":"","confidence":0.7,"tags":["sparsity"],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["vector","fraction"]},"TP1":{"name":"NP-hardness of sparsest solutions","type":"theorem","section":"1.2 Sparse solutions to underdetermined systems","statement":"Finding sparse solutions to underdetermined systems of linear equations is in general $NP$-hard [Natarajan, Equivl0l1].","statement_short":"","rigor":"","confidence":0.75,"tags":["complexity"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"Natarajan 1995; Donoho 2004","assumptions":[],"conclusions":["Finding sparse solutions to underdetermined systems of linear equations is in general $NP$-hard"],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[]},"ProbP2":{"name":"($P_0$) l0 minimization","type":"problem","section":"1.2 Sparse solutions to underdetermined systems","statement":"For example, the sparsest solution is given by \\begin{equation} (P_0) \\quad \\quad \\min_{d \\in {{\\mathbf{R}}}^m} \\|d\\|_{\\ell_0} \\quad subject to \\quad F d = \\tilde y \\,\\, ( = F e), \\end{equation} and to the best of our knowledge, solving this problem essentially require exhaustive searches over all subsets of columns of $F$, a procedure which clearly is combinatorial in nature and has exponential complexity.","statement_short":"$(P_0)$: minimize $\\|d\\|_{\\ell_0}$ subject to $Fd=\\tilde y$, which needs combinatorial search.","rigor":"","confidence":0.8,"tags":["optimization","sparsity"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"standard (uncited)","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[{"id":"EP3","statement":"(P_0) \\quad \\quad \\min_{d \\in {{\\mathbf{R}}}^m} \\|d\\|_{\\ell_0} \\quad \\mathrm{subject\\ to} \\quad F d = \\tilde y \\,\\, ( = F e),","section":"1.2 Sparse solutions to underdetermined systems","context":"statement","parent_step":""}],"foundation_links":["equation"]},"ProbP3":{"name":"Basis Pursuit","type":"problem","section":"1.2 Sparse solutions to underdetermined systems","statement":"This computational intractability has recently led researchers to develop alternatives to $(P_0)$, and a frequently discussed approach considers a similar program in the $\\ell_1$-norm which goes by the name of Basis Pursuit [BP]: \\begin{equation} (P_1)\\quad \\quad \\min_{x \\in {{\\mathbf{R}}}^m} \\|d\\|_{\\ell_1}, \\qquad F d = \\tilde y, \\end{equation} where we recall that $\\|d\\|_{\\ell_1} = \\sum_{i = 1}^m |d_i|$.","statement_short":"$(P_1)$: minimize $\\|d\\|_{\\ell_1}$ subject to $Fd=\\tilde y$.","rigor":"","confidence":0.85,"tags":["optimization","convex_relaxation"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"Chen, Donoho, Saunders 1999","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[{"id":"EP4","statement":"(P_1)\\quad \\quad \\min_{x \\in {{\\mathbf{R}}}^m} \\|d\\|_{\\ell_1}, \\qquad F d = \\tilde y,","section":"1.2 Sparse solutions to underdetermined systems","context":"statement","parent_step":""}],"foundation_links":["Basis","equation"]},"TP2":{"name":"Basis Pursuit is a linear program","type":"theorem","section":"1.2 Sparse solutions to underdetermined systems","statement":"It is also well-known [Bloomfield] that $(P_1)$ can be recast as a linear program (LP).","statement_short":"","rigor":"","confidence":0.7,"tags":["linear_programming"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"Bloomfield & Steiger 1983","assumptions":[],"conclusions":["$(P_1)$ can be recast as a linear program (LP)"],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Basis"]},"TP3":{"name":"l0/l1 equivalence for unions of two orthobases","type":"theorem","section":"1.2 Sparse solutions to underdetermined systems","statement":"Motivated by the problem of finding sparse decompositions of special signals in the field of mathematical signal processing and following upon the ground breaking work of Donoho and Huo [DonohoHuo], a series of beautiful articles [GribonvalNielsen, DonohoElad, EladBruckstein, Tropp03] showed exact equivalence between the two programs $(P_0)$ and $(P_1)$. In a nutshell, this work shows that for $m/2$ by $m$ matrices $F$ obtained by concatenation of two orthonormal bases, the solution to both $(P_0)$ and $(P_1)$ are unique and identical provided that in the most favorable case, the vector $e$ has at most $.914 \\sqrt{m/2}$ nonzero entries.","statement_short":"","rigor":"","confidence":0.7,"tags":["sparse_recovery","uncertainty_principle"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"Donoho & Huo 2001; Gribonval & Nielsen; Donoho & Elad; Elad & Bruckstein; Tropp","assumptions":["for $m/2$ by $m$ matrices $F$ obtained by concatenation of two orthonormal bases","the vector $e$ has at most $.914 \\sqrt{m/2}$ nonzero entries"],"conclusions":["the solution to both $(P_0)$ and $(P_1)$ are unique and identical"],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Signal Processing","series","vector","Orthonormal","field"]},"TP4":{"name":"l0/l1 equivalence for random matrices at sparsity m/log m","type":"theorem","section":"1.2 Sparse solutions to underdetermined systems","statement":"Using very different ideas and together with Romberg [CRT], the authors proved that the equivalence holds with overwhelming probability for various types of random matrices provided that provided that the number of nonzero entries in the vector $e$ be of the order of $m/\\log m$ [RandomBP, OptimalRecovery].","statement_short":"","rigor":"","confidence":0.7,"tags":["sparse_recovery","random_matrices"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"Candes, Romberg & Tao 2004; Candes & Romberg 2004; Candes & Tao 2004","assumptions":["the number of nonzero entries in the vector $e$ be of the order of $m/\\log m$"],"conclusions":["the equivalence holds with overwhelming probability for various types of random matrices"],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["number","probability","vector"]},"TP5":{"name":"Donoho's l0/l1 equivalence for Gaussian matrices","type":"theorem","section":"1.2 Sparse solutions to underdetermined systems","statement":"In the special case where $F$ is an $m/2$ by $m$ random matrix with independent standard normal entries, [Equivl0l1] proved that the number of nonzero entries may be as large as $\\rho \\cdot m$, where $\\rho > 0$ is some very small and unspecified positive constant independent of $m$.","statement_short":"","rigor":"","confidence":0.7,"tags":["sparse_recovery","random_matrices"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"Donoho 2004","assumptions":["$F$ is an $m/2$ by $m$ random matrix with independent standard normal entries"],"conclusions":["the number of nonzero entries may be as large as $\\rho \\cdot m$"],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["constant","positive","Random matrix","Standard normal","matrix","number"]},"DP5":{"name":"Restrictedly almost orthonormal system","type":"definition","section":"1.3 Innovations","statement":"This paper introduces the concept of a restrictedly almost orthonormal system\u2014a collection of vectors which behaves like an almost orthonormal system but only for sparse linear combinations.","statement_short":"","rigor":"","confidence":0.8,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Vectors","Orthonormal"]},"ProbP4":{"name":"(P'_1) l1 decoding program","type":"problem","section":"1.3 Innovations","statement":"To recover $f$ from corrupted data $y = Af + e$, we consider solving the following $\\ell_1$-minimizati ons":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[]},"LP3":{"name":"Dual sparse reconstruction property, l2 version","type":"lemma","section":"2.1 Exact reconstruction property","statement":"Let $S,S' \\geq 1$ be such that $\\delta_S < 1$, and $c$ be a real vector supported on $T \\subset J$ such that $|T| \\leq S$. Then there exists a vector $w \\in H$ such that $\\langle w, v_j \\rangle_H = c_j$ for all $j \\in T$. Furthermore, there is an \u201cexceptional set\u201d $E \\subset J$ which is disjoint from $T$, of size at most \\begin{equation} |E| \\leq S', \\end{equation} and with the properties $$ |\\langle w, v_j \\rangle| \\leq \\frac{\\theta_{S,S'}}{(1-\\delta_S)\\sqrt{S'}} \\cdot \\|c\\|  for all  j \\not \\in T \\cup E$$ and $$ (\\sum_{j \\in E} |\\langle w, v_j \\rangle|^2)^{1/2} \\leq \\frac{\\theta_S}{1 - \\delta_{S}} \\cdot \\|c\\|.$$ In addition, $\\|w\\|_H \\leq K \\cdot \\|c\\|$ for some constant $K > 0$ only depending upon $\\delta_S$.","statement_render":"Let $S,S' \\geq 1$ be such that $\\delta_S < 1$, and $c$ be a real vector supported on $T \\subset J$ such that $|T| \\leq S$. Then there exists a vector $w \\in H$ such that $\\langle w, v_j \\rangle_H = c_j$ for all $j \\in T$. Furthermore, there is an \u201cexceptional set\u201d $E \\subset J$ which is disjoint from $T$, of size at most \\begin{equation} |E| \\leq S', \\end{equation} and with the properties $$ |\\langle w, v_j \\rangle| \\leq \\frac{\\theta_{S,S'}}{(1-\\delta_S)\\sqrt{S'}} \\cdot \\|c\\| for all j \\not \\in T \\cup E$$ and $$ (\\sum_{j \\in E} |\\langle w, v_j \\rangle|^2)^{1/2} \\leq \\frac{\\theta_S}{1 - \\delta_{S}} \\cdot \\|c\\|.$$ In addition, $\\|w\\|_H \\leq K \\cdot \\|c\\|$ for some constant $K > 0$ only depending upon $\\delta_S$.","statement_short":"With $\\delta_S<1$ there is $w$ matching $c$ on $T$ whose correlations off $T$ are small except on an exceptional set of size $\\le S'$, which is small in $\\ell_2$.","rigor":"","con finite operator $F_T^* F_T$. In particular, since $\\delta_{|T|} < 1$, we see that $F_T^* F_T$ is invertible with \\begin{equation} \\| (F^*_T F_T)^{-1} \\| \\leq \\frac{1}{1 - \\delta_{S}}. \\end{equation}","statement_clean":"Property (Eq 7) gives $$ 1 - \\delta_{S} \\leq \\lambda_{\\min}(F_T^* F_T) \\leq \\lambda_{\\max}(F_T^* F_T) \\leq 1 + \\delta_{S},$$ where $\\lambda_{\\min}$ and $\\lambda_{\\max}$ are the minimum and maximum eigenvalues of the positive-definite operator $F_T^* F_T$. In particular, since $\\delta_{|T|} < 1$, we see that $F_T^* F_T$ is invertible with \\begin{equation} \\| (F^*_T F_T)^{-1} \\| \\leq \\frac{1}{1 - \\delta_{S}}. \\end{equation}","statement_short":"Isometry bound gives invertibility of $F_T^*F_T$ with (2.2)","name":"Isometry bound gives invertibility of $F_T^*F_T$ with (2.2)","subclass":"bound_estimate","step_order":2,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP8","statement":"Also note that $\\| F_T (F^*_T F_T)^{-1}\\| \\le \\sqrt{1 + \\delta_S}/(1-\\delta_S)$ and set $w \\in H$ to be the vector $$ w := F_T (F^*_T F_T)^{-1} c_T; $$ it is then clear that $F^*_T w = c_T$, i.e. $\\langle w, v_j \\rangle_H = c_j$ for all $j \\in T$. In addition, $\\|w\\| \\le K \\cdot \\|c_T\\|$ with $K = \\sqrt{1 + \\delta_S}/(1-\\delta_S)$.","statement_clean":"Also note that $\\| F_T (F^*_T F_T)^{-1}\\| \\le \\sqrt{1 + \\delta_S}/(1-\\delta_S)$ and set $w \\in H$ to be the vector $$ w := F_T (F^*_T F_T)^{-1} c_T; $$ it is then clear that $F^*_T w = c_T$, i.e. $\\langle w, v_j \\rangle_H = c_j$ for all $j \\in T$. In addition, $\\|w\\| \\le K \\cdot \\|c_T\\|$ with $K = \\sqrt{1 + \\delta_S}/(1-\\delta_S)$.","statement_short":"Define $w=F_T(F_T^*F_T)^{-1}c_T$, which matches $c$ on $T$ and has bounded norm","name":"Define $w=F_T(F_T^*F_T)^{-1}c_T$, which matches $c$ on $T$ and has bounded norm","subclass":"introduce_variable","step_order":3,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP9","statement":"Finally, if $T'$ is any set in $J$ disjoint from $T$ with $|T'| \\leq S'$ and $d_{T'} = (d_j)_{j \\in T'}$ is any sequence of real numbers, then (Eq 8) and (Eq 12) give \\begin{align*} |\\langle F^*_{T'} w, d_{T'} \\rangle_{\\ell_2(T')}| = |\\langle w, F_{T'} d_{T'} \\rangle_{\\ell_2(T')}| & = \\left|\\langle \\sum_{j \\in T} ((F^*_T F_T)^{-1} c_T)_j v_j, \\sum_{j \\in T'} d_j v_j \\rangle_H\\right| \\\\ &\\leq \\theta_{S,S'} \\cdot \\| (F^*_T F_T)^{-1} c_T \\| \\cdot \\| d_{T'} \\| \\\\ &\\leq \\frac{\\theta_{S,S'}}{1 - \\delta_S} \\| c_T \\| \\cdot \\|d_{T'}\\|; \\end{align*} since $d_{T'}$ was arbitrary, we thus see from duality that $$ \\| F^*_{T'} w \\|_{\\ell_2(T')} \\leq \\frac{\\theta_{S,S'}}{1 - \\delta_{S}} \\| c_T\\|.$$ In other words, \\begin{equation} (\\sum_{j \\in T'} |\\langle w, v_j \\rangle|^2)^{1/2} \\leq \\frac{\\theta_{S,S'}}{1 - \\delta_{S}} \\| c_T \\| \\text{ whenever } T' \\subset J \\backslash T \\text{ and } |T'| \\leq S'. \\end{equation}","statement_clean":"Finally, if $T'$ is any set in $J$ disjoint from $T$ with $|T'| \\leq S'$ and $d_{T'} = (d_j)_{j \\in T'}$ is any sequence of real numbers, then (Eq 8) and (Eq 12) give \\begin{align*} |\\langle F^*_{T'} w, d_{T'} \\rangle_{\\ell_2(T')}| = |\\langle w, F_{T'} d_{T'} \\rangle_{\\ell_2(T')}| & = \\left|\\langle \\sum_{j \\in T} ((F^*_T F_T)^{-1} c_T)_j v_j, \\sum_{j \\in T'} d_j v_j \\rangle_H\\right| \\\\ &\\leq \\theta_{S,S'} \\cdot \\| (F^*_T F_T)^{-1} c_T \\| \\cdot \\| d_{T'} \\| \\\\ &\\leq \\frac{\\theta_{S,S'}}{1 - \\delta_S} \\| c_T \\| \\cdot \\|d_{T'}\\|; \\end{align*} since $d_{T'}$ was arbitrary, we thus see from duality that $$ \\| F^*_{T'} w \\|_{\\ell_2(T')} \\leq \\frac{\\theta_{S,S'}}{1 - \\delta_{S}} \\| c_T\\|.$$ In other words, \\begin{equation} (\\sum_{j \\in T'} |\\langle w, v_j \\rangle|^2)^{1/2} \\leq \\frac{\\theta_{S,S'}}{1 - \\delta_{S}} \\| c_T \\| \\text{ whenever } T' \\subset J \\backslash T \\text{ and } |T'| \\leq S'. \\end{equation}","statement_short":"Bound correlations with disjoint sets via $\\theta_{S,S'}$ and duality, giving (2.3)","name":"Bound correlations with disjoint sets via $\\theta_{S,S'}$ and duality, giving (2.3)","subclass":"bound_estimate","step_order":4,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP10","statement":"If in particular if we set $$ E := \\{ j \\in J \\backslash T: |\\langle w, v_j \\rangle| > \\frac{\\theta_{S,S'}}{(1 - \\delta_{S})\\sqrt{S'}} \\cdot \\|c_T\\|\\}, $$ then $|E|$ must obey $|E| \\leq S'$, since otherwise we could contradict (Eq 13) by taking a subset $T'$ of $E$ of cardinality $S'$. The claims now follow.","statement_clean":"If in particular if we set $$ E := \\{ j \\in J \\backslash T: |\\langle w, v_j \\rangle| > \\frac{\\theta_{S,S'}}{(1 - \\delta_{S})\\sqrt{S'}} \\cdot \\|c_T\\|\\}, $$ then $|E|$ must obey $|E| \\leq S'$, since otherwise we could contradict (Eq 13) by taking a subset $T'$ of $E$ of cardinality $S'$. The claims now follow.","statement_short":"Define the exceptional set $E$ and bound its size by (2.3)","name":"Define the exceptional set $E$ and bound its size by (2.3)","subclass":"conclude","step_order":5,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75}],"equations":[{"id":"EP11","statement":"|E| \\leq S',","section":"2.1 Exact reconstruction property","context":"statement","parent_step":""},{"id":"EP12","statement":"\\| (F^*_T F_T)^{-1} \\| \\leq \\frac{1}{1 - \\delta_{S}}.","section":"2.1 Exact reconstruction property","context":"","parent_step":"PSP7"},{"id":"EP13","statement":"(\\sum_{j \\in T'} |\\langle w, v_j \\rangle|^2)^{1/2} \\leq \\frac{\\theta_{S,S'}}{1 - \\delta_{S}} \\| c_T \\| \\text{ whenever } T' \\subset J \\backslash T \\text{ and } |T'| \\leq S'.","section":"2.1 Exact reconstruction property","context":"","parent_step":"PSP9"}],"foundati ,2S} < 1$","$c$ be a real vector supported on $T \\subset J$ obeying $|T| \\le S$"],"conclusions":["there exists a vector $w \\in H$ such that $\\langle w, v_j \\rangle_H = c_j$ for all $j \\in T$","Furthermore, $w$ obeys"],"proof_info":["construction"],"input":[],"output":[],"steps":[{"id":"PSP11","statement":"We may normalize $\\sum_{j \\in T} |c_j|^2 = \\sqrt{S}$. Write $T_0 := T$.","statement_clean":"We may normalize $\\sum_{j \\in T} |c_j|^2 = \\sqrt{S}$. Write $T_0 := T$.","statement_short":"Normalize $c$ and set $T_0=T$","name":"Normalize $c$ and set $T_0=T$","subclass":"setup","step_order":1,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP12","statement":"Using Lemma Lem 3, we can find a vector $w_1 \\in H$ and a set $T_1 \\subseteq J$ such that \\begin{align*} T_0 \\cap T_1 &= \\emptyset\\\\ |T_1| &\\leq S \\\\ \\langle w_1, v_j \\rangle_H &= c_j \\text{ for all } j \\in T_0\\\\ |\\langle w_1, v_j \\rangle_H| &\\leq \\frac{\\theta_{S,S'}}{(1-\\delta_S)} \\text{ for all } j \\not \\in T_0 \\cup T_1 \\\\ (\\sum_{j \\in T_1} |\\langle w_1, v_j \\rangle_H|^2)^{1/2} &\\leq \\frac{\\theta_S}{1 - \\delta_{S}} \\sqrt{S}\\\\ \\|w_1\\|_H &\\leq K. \\end{align*}","statement_clean":"Using Lemma Lem 3, we can find a vector $w_1 \\in H$ and a set $T_1 \\subseteq J$ such that \\begin{align*} T_0 \\cap T_1 &= \\emptyset\\\\ |T_1| &\\leq S \\\\ \\langle w_1, v_j \\rangle_H &= c_j \\text{ for all } j \\in T_0\\\\ |\\langle w_1, v_j \\rangle_H| &\\leq \\frac{\\theta_{S,S'}}{(1-\\delta_S)} \\text{ for all } j \\not \\in T_0 \\cup T_1 \\\\ (\\sum_{j \\in T_1} |\\langle w_1, v_j \\rangle_H|^2)^{1/2} &\\leq \\frac{\\theta_S}{1 - \\delta_{S}} \\sqrt{S}\\\\ \\|w_1\\|_H &\\leq K. \\end{align*}","statement_short":"Apply Lemma 2.1 to get $w_1$, $T_1$","name":"Apply Lemma 2.1 to get $w_1$, $T_1$","subclass":"apply_lemma","step_order":2,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP13","statement":"Applying Lemma Lem 3 iteratively gives a sequence of vectors $w_{n+1} \\in H$ and sets $T_{n+1} \\subseteq J$ for all $n \\geq 1$ with the properties \\begin{align*} T_n \\cap (T_0 \\cup T_{n+1}) &= \\emptyset\\\\ |T_{n+1}| &\\leq S \\\\ \\langle w_{n+1}, v_j \\rangle_H &= \\langle w_n, v_j \\rangle_H \\text{ for all } j \\in T_n\\\\ \\langle w_{n+1}, v_j \\rangle_H &= 0 \\text{ for all } j \\in T_0\\\\ |\\langle w_{n+1}, v_j \\rangle_H| &\\leq \\frac{\\theta_S}{1 - \\delta_{S}} \\left(\\frac{\\theta_{S,2S}}{1-\\delta_S}\\right)^{n} \\text{ for all } j \\not \\in T_0 \\cup T_n \\cup T_{n+1} \\\\ (\\sum_{j \\in T_{n+1}} |\\langle w_{n+1}, v_j \\rangle|^2)^{1/2} &\\leq \\frac{\\theta_S}{1 - \\delta_{S}} \\left(\\frac{\\theta_{S,2S}}{1 - \\delta_{S}}\\right)^{n} \\sqrt{S}\\\\ \\| w_{n+1} \\|_H &\\leq \\left(\\frac{\\theta_S}{1 - \\delta_{S}}\\right)^{n-1} K. \\end{align*}","statement_clean":"Applying Lemma Lem 3 iteratively gives a sequence of vectors $w_{n+1} \\in H$ and sets $T_{n+1} \\subseteq J$ for all $n \\geq 1$ with the properties \\begin{align*} T_n \\cap (T_0 \\cup T_{n+1}) &= \\emptyset\\\\ |T_{n+1}| &\\leq S \\\\ \\langle w_{n+1}, v_j \\rangle_H &= \\langle w_n, v_j \\rangle_H \\text{ for all } j \\in T_n\\\\ \\langle w_{n+1}, v_j \\rangle_H &= 0 \\text{ for all } j \\in T_0\\\\ |\\langle w_{n+1}, v_j \\rangle_H| &\\leq \\frac{\\theta_S}{1 - \\delta_{S}} \\left(\\frac{\\theta_{S,2S}}{1-\\delta_S}\\right)^{n} \\text{ for all } j \\not \\in T_0 \\cup T_n \\cup T_{n+1} \\\\ (\\sum_{j \\in T_{n+1}} |\\langle w_{n+1}, v_j \\rangle|^2)^{1/2} &\\leq \\frac{\\theta_S}{1 - \\delta_{S}} \\left(\\frac{\\theta_{S,2S}}{1 - \\delta_{S}}\\right)^{n} \\sqrt{S}\\\\ \\| w_{n+1} \\|_H &\\leq \\left(\\frac{\\theta_S}{1 - \\delta_{S}}\\right)^{n-1} K. \\end{align*}","statement_short":"Apply Lemma 2.1 iteratively to get $w_{n+1}$, $T_{n+1}$","name":"Apply Lemma 2.1 iteratively to get $w_{n+1}$, $T_{n+1}$","subclass":"apply_lemma","step_order":3,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP14","statement":"By hypothesis, we have $\\frac{\\theta_{S,2S}}{1-\\delta_S} \\leq 1$. Thus if we set \\[ w := \\sum_{n=1}^\\infty (-1)^{n-1} w_n \\] then the series is absolutely convergent and, therefore, $w$ is a well-defined vector in $H$. We now study the coefficients \\begin{equation} \\langle w, v_j \\rangle_H = \\sum_{n=1}^\\infty (-1)^{n-1} \\langle w_n, v_j\\rangle_H \\end{equation} for $j \\in J$.","statement_clean":"By hypothesis, we have $\\frac{\\theta_{S,2S}}{1-\\delta_S} \\leq 1$. Thus if we set \\[ w := \\sum_{n=1}^\\infty (-1)^{n-1} w_n \\] then the series is absolutely convergent and, therefore, $w$ is a well-defined vector in $H$. We now study the coefficients \\begin{equation} \\langle w, v_j \\rangle_H = \\sum_{n=1}^\\infty (-1)^{n-1} \\langle w_n, v_j\\rangle_H \\end{equation} for $j \\in J$.","statement_short":"Define $w$ as the absolutely convergent alternating series","name":"Define $w$ as the absolutely convergent alternating series","subclass":"introduce_variable","step_order":4,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP15","statement":"Consider first $j \\in T_0$, it follows from the construction that $\\langle w_1, v_j \\rangle_H = c_j$ and $\\langle w_n, v_j \\rangle_H = 0$ for all $n \\geq 2$, and hence \\[ \\langle w, v_j \\rangle_H = c_j \\text{ for all } j \\in T_0. \\]","statement_clean":"Consider first $j \\in T_0$, it follows from the construction that $\\langle w_1, v_j \\rangle_H = c_j$ and $\\langle w_n, v_j \\rangle_H = 0$ for all $n \\geq 2$, and hence \\[ \\langle w, v_j \\rangle_H = c_j \\text{ for all } j \\in T_0. \\]","statement_short":"Case $j\\in T_0$: $\\langle w,v_j\\rangle=c_j$","name":"Case $j\\in T_0$: $\\langle w,v_j\\rangle=c_j$","subclass":"case_split","step_order":5,"type":"proof_step","depth":0,"parent_step":"","source_line_label":"","rigor":"","confidence":0.75},{"id":"PSP16","statement":"Second, fix $j$ with $j \\not \\in T_0$ and let $I_j := \\{ n \\geq 1: j \\in T_n \\}$. Since $T_n$ and $T_{n+1}$ are disjoint, we see that the integers in the set $I_j$ are spaced at least two apart. Now if $n \\in I_j$, then by definition $j \\in T_n$ and, therefore, \\[ \\langle w_{n+1}, v_j \\rangle_H = \\langle w_n, v_j \\rangle_H. \\] In other words, the $n$ and $n+1$ terms in (Eq 15) cancel each other out. Thus we have \\[ \\langle w, v_j \\rangle_H = \\sum_{n \\geq 1; n, n-1 \\not \\in I_j} (-1)^{n-1} \\langle w_n, v_j\\rangle_H. \\] On the other hand, if $n, n-1 \\not \\in I_j$ and $n \\neq 0$, then $j \\not \\in T_n \\cap T_{n-1}$ and $$ |\\langle w_{n}, v_j \\rangle| \\leq \\frac{\\theta_{S,S}}{1 - \\delta_{S}} \\left(\\frac{\\theta_{S,2S}}{1-\\delta_S}\\right)^{n-1}$$ which by the triangle inequality and the geometric series formula gives $$ |\\sum_{n \\geq 1; n, n-1 \\not \\in I_j} (-1)^{n-1} \\langle w_n, v_j\\rangle_H| \\leq \\frac{\\theta_{S,S}}{1 - \\delta_S - \\theta_{S,2S}}.$$ In conclusion, $$ |\\langle w, v_j \\rangle_H - 1_{0 \\in I_j} \\langle w_0, v_j \\rangle_H| \\leq \\frac{\\theta_{S,S}}{1 - \\delta_S - \\theta_{S,2S}},$$ and since $|T| \\leq S$, the claim follows.","statement_clean":"Second, fix $j$ with $j \\not \\in T_0$ and let $I_j := \\{ n \\geq 1: j \\in T_n \\}$. Since $T_n$ and $T_{n+1}$ are disjoint, we see that the integers in the set $I_j$ are spaced at least two apart. Now if $n \\in I_j$, then by definition $j \\in T_n$ and, therefore, \\[ \\langle w_{n+1}, v_j \\rangle_H = \\langle w_n, v_j \\rangle_H. \\] In other words, the $n$ and $n+1$ terms in (Eq 15) cancel each other out. Thus we have \\[ \\langle w, v_j \\rangle_H = \\sum_{n \\geq 1; n, n-1 \\not \\in I_j} (-1)^{n-1} \\langle w_n, v_j\\rangle_H. \\] On the other hand, if $n, n-1 \\not \\in I_j$ and $n \\neq 0$, then $j \\not \\in T_n \\cap T_{n-1}$ and $$ |\\langle w_{n}, v_j \\rangle| \\leq \\frac{\\theta tor $w \\in H$ with the following properties:  \u2022 $\\<w, v_j\\> = c_j$, for all $j \\in T$;  \u2022 and $|\\<w, v_j\\>| \\leq \\frac{1}{2}$ for all $j$ not in $T$. ","statement_render":"Second, a measurement matrix $F$ obeys the ERP with oversampling factor $\\lambda$ if for each fixed subset $T$ of size $|T| \\le S$ (Eq 26) and each `sign' vector $c$ defined on $T$, there exists with the same overwhelmingly large probability a vector $w \\in H$ with the following properties: \u2022 $\\<w, v_j\\> = c_j$, for all $j \\in T$; \u2022 and $|\\<w, v_j\\>| \\leq \\frac{1}{2}$ for all $j$ not in $T$.","statement_short":"","rigor":"","confidence":0.85,"tags":["duality"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"Candes & Tao 2004","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["Subset","factor","matrix","vector","probability"]},"TP13":{"name":"Candes-Tao Theorem 1.4 (UUP + ERP give optimal recovery)","type":"theorem","section":"5 Optimal Signal Recovery","statement":"Fix $\\alpha \\in {\\cal F}_s(B)$. [OptimalRecovery] argued that if a random matrix obeyed the UUP and the ERP both with oversampling factor $\\lambda$, then \\[ \\|\\alpha - \\alpha^\\sharp\\| \\le C \\cdot (K/\\lambda)^{-(s-1/2)}, \\] with inequality holding with the same probability as before.","statement_short":"","rigor":"","confidence":0.8,"tags":["compressed_sensing"],"inside":"","contains":[],"proofs":[],"origin":"external","origin_citation":"Candes & Tao 2004, Theorem 1.4","assumptions":["Fix $\\alpha \\in {\\cal F}_s(B)$.","a random matrix obeyed the UUP and the ERP both with oversampling factor $\\lambda$"],"conclusions":["\\[ \\|\\alpha - \\alpha^\\sharp\\| \\le C \\cdot (K/\\lambda)^{-(s-1/2)}, \\]"],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["factor","Random matrix","theorem","matrix","probability","Theorem 1","Theorem 1.4","inequality"]},"RP7":{"name":"Comparison of Theorem 5.1 with the earlier result","type":"remark","section":"5 Optimal Signal Recovery","statement":"Against this background, several comments are now in order:  \u2022 First, the new statement is more general as it applies to all matrices, not just random matrices.  \u2022 Second, whereas our previous statement argued that for each $\\alpha \\in {{\\mathbf{R}}}^m$, one would be able\u2014with high probability\u2014to reconstruct $\\alpha$ accurately, it did not say anything about the worst case error for a fixed measurement matrix $F$. This is an instance where the order of the quantifiers plays a role. Do we need different $F$'s for different objects? Theorem Thm 11 answers this question unambiguously; the same $F$ will provide an optimal reconstruction for all the objects in the class.  \u2022 Third, Theorem Thm 11 says that the ERP condition is redundant, and hence the hypothesis may be easier to check in practice. In addition, eliminating the ERP isolates the real reason for success as it ties everything down to the UUP. In short, the ability to recover an object from limited measurements depends on how close $F$ is to an orthonormal system, but only when restricting attention to sparse linear combinations of columns. ","statement_render":"Against this background, several comments are now in order: \u2022 First, the new statement is more general as it applies to all matrices, not just random matrices. \u2022 Second, whereas our previous statement argued that for each $\\alpha \\in {{\\mathbf{R}}}^m$, one would be able\u2014with high probability\u2014to reconstruct $\\alpha$ accurately, it did not say anything about the worst case error for a fixed measurement matrix $F$. This is an instance where the order of the quantifiers plays a role. Do we need different $F$'s for different objects? Theorem Thm 11 answers this question unambiguously; the same $F$ will provide an optimal reconstruction for all the objects in the class. \u2022 Third, Theorem Thm 11 says that the ERP condition is redundant, and hence the hypothesis may be easier to check in practice. In addition, eliminating the ERP isolates the real reason for success as it ties everything down to the UUP. In short, the ability to recover an object from limited measurements depends on how close $F$ is to an orthonormal system, but only when restricting attention to sparse linear combinations of columns.","statement_short":"Theorem 5.1 applies to all matrices, is uniform over the class for a fixed $F$, and shows the ERP hypothesis is redundant.","rigor":"","confidence":0.75,"tags":[],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["theorem","error","matrix","Theorem 5","addition","Orthonormal","probability","Theorem 5.1"]},"DP16":{"name":"Principal angle cosine theta($F_T$, $F_T$')","type":"definition","section":"6.2 Improvements","statement":"Now let $T$ and $T'$ be two disjoint sets of respective sizes $S$ and $S'$ and consider $\\theta(F_T, F_{T'})$: $\\theta(F_T, F_{T'})$ is the cosine of the principal angle between the two random subspaces spanned by the columns of $F_T$ and $F_{T'}$ respectively; formally \\[ \\theta(F_T, F_{T'}) = \\sup \\<u, u'\\>, \\qquad u \\in span(F_T), \\, u' \\in span(F_{T'}), \\, \\|u\\| = \\|u'\\| = 1. \\]","statement_short":"","rigor":"","confidence":0.8,"tags":["principal_angles"],"inside":"","contains":[],"proofs":[],"origin":"paper","origin_citation":"","assumptions":[],"conclusions":[],"proof_info":[],"input":[],"output":[],"steps":[],"equations":[],"foundation_links":["principal","angle","Definition:Disjoint Sets"]},"TP14":{"name":"Wachter's limit for principal angles","type":"theorem","section":"6.2 Improvements","statement":"Among other things, it is known [Wachter] that \\[ \\theta(F_T, F_{T'}) \\rightarrow \\sqrt{\\gamma(1-\\gamma')} + \\sqrt{\\gamma'(1-\\gamma
