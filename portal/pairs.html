<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pair alignments — SARANGA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
</head>
<body>
  <header class="site">
    <h1><a href="index.html" style="color:inherit;text-decoration:none">SARANGA Database</a></h1>
    <span class="crumbs">Pair alignments</span>
  </header>
  <main>
    <h2>Pair alignments</h2>
    <p style="color:#6a6a6a;margin-top:0">
      Cross-paper alignments from the master pair list. Status is
      <span class="status-pill status-annotated">annotated</span> when an
      alignment JSON exists,
      <span class="status-pill status-ready">ready</span> when both papers
      are extracted but no alignment yet,
      <span class="status-pill status-partial">partial</span> for one paper
      extracted, and
      <span class="status-pill status-pending">pending</span> for neither.
    </p>
    <div id="listing"></div>
  </main>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/contrib/auto-render.min.js"></script>
  <script src="js/common.js"></script>
  <script>window.AuthomathicsListConfig = { mode: "pairs" };</script>
  <script src="js/list.js"></script>
</body>
</html>
