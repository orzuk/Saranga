<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold candidates: review</title>
<style>
  :root { --bg:#fafaf8; --fg:#1d1d1b; --mute:#6b6b66; --line:#dcdcd6; --card:#fff; --acc:#2d5d8a;
          --ok:#2e7d4f; --bad:#b03a2e; --warn:#a86b00; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:10px 16px; border-bottom:1px solid var(--line); background:var(--card); display:flex; gap:12px;
           align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .sub { color:var(--mute); }
  a { color:var(--acc); }
  main { padding:12px 16px; }
  table { border-collapse:collapse; width:100%; background:var(--card); }
  th, td { border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top; }
  th { font-weight:600; background:#f0f0ec; position:sticky; top:0; }
  tr.row:hover { background:#f3f6fa; cursor:pointer; }
  .pill { display:inline-block; padding:1px 7px; border-radius:9px; font-size:12px; background:#eee; }
  .yes { background:#d8efe0; color:var(--ok); } .no { background:#f6dcd8; color:var(--bad); }
  .partly { background:#fbecd0; color:var(--warn); }
  .stats { display:flex; gap:18px; flex-wrap:wrap; margin:6px 0 12px; }
  .stats div { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  .stats b { font-size:16px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; height:62vh; min-height:420px; }
  .pane { background:var(--card); border:1px solid var(--line); border-radius:6px; display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); padding:4px 4px 0; flex-wrap:wrap; }
  .tabs button { border:1px solid var(--line); border-bottom:none; background:#f0f0ec; padding:4px 10px; cursor:pointer;
                 border-radius:5px 5px 0 0; font:inherit; }
  .tabs button.on { background:var(--card); font-weight:600; }
  .body { flex:1; min-height:0; overflow:auto; position:relative; }
  .body iframe { border:0; width:100%; height:100%; }
  .body img { max-width:100%; }
  pre { margin:0; padding:8px; white-space:pre-wrap; word-break:break-word; font-size:12px; }
  .review { margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  .review h3 { margin:4px 0 8px; font-size:14px; }
  .q { margin:6px 0; } .q label { margin-right:12px; }
  select, input[type=number], textarea { font:inherit; }
  textarea { width:100%; min-height:50px; }
  .muted { color:var(--mute); }
  .nav { margin-left:auto; display:flex; gap:8px; }
  button.save { background:var(--acc); color:#fff; border:0; padding:6px 16px; border-radius:5px; cursor:pointer; font:inherit; }
  .small { font-size:12px; }
  @media (max-width:900px) { .grid { grid-template-columns:1fr; height:auto; } .pane { height:60vh; } }
</style>
</head>
<body>
<header>
  <h1><a href="gold_review.html" style="color:inherit;text-decoration:none">Gold candidates</a></h1>
  <span class="sub" id="sub">author-drawn dependency diagrams, converted to our format</span>
  <span class="nav" id="nav"></span>
</header>
<main id="main">Loading…</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const params = new URLSearchParams(location.search);
const pid = params.get("id");
const D = "/gold_data/papers/";

// Scores of the free extractors against this gold (scripts/gold_candidates/score_gold.py)
const pct = x => x == null ? "–" : (100 * x).toFixed(0);
function scoreTable(s, title) {
  if (!s) return "";
  const rows = [];
  for (const [x, byP] of Object.entries(s)) for (const [p, v] of Object.entries(byP)) {
    const ci = k => v.ci95 && v.ci95[k] ? ` <span class="muted small">[${pct(v.ci95[k][0])}–${pct(v.ci95[k][1])}]</span>` : "";
    rows.push(`<tr><td>${esc(x)}${Object.keys(byP).length > 1 ? " · " + esc(p) : ""}</td>
      <td>${pct(v.node_P)} / ${pct(v.node_R)} / <b>${pct(v.node_F1)}</b>${ci("node_F1")}</td>
      <td>${pct(v.edge_P)} / ${pct(v.edge_R)} / <b>${pct(v.edge_F1)}</b>${ci("edge_F1")}</td>
      <td class="small">${v.edge_R_def != null ? `definitions ${pct(v.edge_R_def)}, results ${pct(v.edge_R_res)}` : ""}</td>
      <td class="small muted">${v.n_items ? v.n_items + " items, " : ""}${v.edge_n_gold ?? ""} gold dependencies</td></tr>`);
  }
  return `<details open class="review"><summary><b>${title}</b></summary><table><tr><th>extractor</th><th>nodes P / R / F1 (%)</th>
    <th>dependencies P / R / F1 (%)</th><th>dependency recall on</th><th></th></tr>${rows.join("")}</table></details>`;
}

async function getJSON(u) { const r = await fetch(u, {cache:"no-store"}); if (!r.ok) throw new Error(u); return r.json(); }

function summary(index, reviews) {
  const done = index.filter(p => reviews[p.id]);
  const v = {yes:0, partly:0, no:0};
  let nOk=0, nAll=0, eOk=0, eAll=0, eMiss=0, nMiss=0;
  for (const p of done) {
    const r = reviews[p.id];
    if (r.verdict in v) v[r.verdict]++;
    for (const x of Object.values(r.nodes || {})) { if (x === "skip") continue; nAll++; if (x === "correct") nOk++; }
    for (const x of Object.values(r.edges || {})) { if (x === "skip") continue; eAll++; if (x === "correct") eOk++; }
    eMiss += +r.missed_edges || 0; nMiss += +r.missed_nodes || 0;
  }
  const pct = (a,b) => b ? (100*a/b).toFixed(0)+"%" : "–";
  return `<div class="stats">
    <div>reviewed <b>${done.length}</b> / ${index.length}</div>
    <div>genuine: <b>${v.yes}</b> yes · ${v.partly} partly · ${v.no} no</div>
    <div>nodes mapped correctly <b>${pct(nOk,nAll)}</b> <span class="muted">(${nOk}/${nAll}; +${nMiss} missed)</span></div>
    <div>edges correct <b>${pct(eOk,eAll)}</b> <span class="muted">(${eOk}/${eAll}; +${eMiss} missed)</span></div>
  </div>`;
}

const cat = params.get("cat") || "";
let SAMPLE = null;                              // ?sample=1: the fixed random review sample only
const loadSample = async () => { if (params.get("sample")) SAMPLE = new Set((await getJSON("/gold_data/review_sample.json")).author); };
const inCat = p => (!SAMPLE || SAMPLE.has(p.id)) && (!cat || (p.category || "?") === cat ||
  (cat === "statistics" && /^(math\.ST|stat\.)/.test(p.category || "")) ||
  (cat === "math.CO+cs.DM" && /^(math\.CO|cs\.DM)$/.test(p.category || "")));
const catQ = () => (cat ? "&cat=" + encodeURIComponent(cat) : "") + (params.get("sample") ? "&sample=1" : "");

const showAll = params.get("all") === "1";
const sortKey = params.get("sort") || "category";
const listQ = extra => "?" + new URLSearchParams(Object.entries(Object.assign(
  {cat, all: showAll ? "1" : "", sort: sortKey === "category" ? "" : sortKey, sample: params.get("sample") || ""}, extra)).filter(e => e[1])).toString();

// diagram classes, most trustworthy first (the markers of gold_length_vs_diagram.png)
const CLASSES = ["results, reliable", "results, some boxes not results", "results, arrows reversed",
                 "results, arrow direction mixed", "mixed", "sections"];
const CLASS_RANK = p => { const i = CLASSES.indexOf(p.class); return i < 0 ? 99 : i; };
const CLASS_MARK = {"results, reliable": "○", "results, some boxes not results": "□", "results, arrows reversed": "△",
                    "results, arrow direction mixed": "△"};
const CLASS_HELP = {
  "results, reliable": "a dependency diagram of the paper's results: direction consistent (or undecided), >= 80% of boxes are results, no typed numbers",
  "results, some boxes not results": "under 80% of the boxes are the paper's results (sections, cited or unmatched boxes), or a box was matched only by a typed number",
  "results, arrows reversed": "the arrows point against the paper's own references (scored reversed)",
  "results, arrow direction mixed": "some arrows agree with the paper's references, some not: check",
  "mixed": "results and sections mixed", "sections": "a diagram of the paper's sections"};

async function listView() {
  await loadSample();
  const [all, reviews] = await Promise.all([getJSON("/gold_data/index.json"), getJSON("/gold/reviews")]);
  const pool = showAll ? all : all.filter(p => p.good);
  const counts = {};
  pool.forEach(p => counts[p.category || "?"] = (counts[p.category || "?"] || 0) + 1);
  const nStat = pool.filter(p => /^(math\.ST|stat\.)/.test(p.category || "")).length;
  const opts = [["", `all areas (${pool.length})`], ["statistics", `statistics: math.ST + stat.* (${nStat})`]]
    .concat(Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([c, n]) => [c, `${c} (${n})`]));
  const num = k => (a, b) => (b[k] ?? -1) - (a[k] ?? -1);
  const txt = k => (a, b) => String(a[k] || "").localeCompare(String(b[k] || "")) || a.id.localeCompare(b.id);
  const SORT = {category: txt("category"), arxiv: txt("id"), title: txt("title"), year: txt("year"),
    granularity: txt("granularity"), level: (a, b) => CLASS_RANK(a) - CLASS_RANK(b) || a.id.localeCompare(b.id), n_nodes: num("n_nodes"), n_resolved: num("n_resolved"), n_edges: num("n_edges")};
  const index = pool.filter(inCat).sort(SORT[sortKey] || SORT.category);
  const th = (k, t) => `<th><a href="${listQ({sort: k})}" style="color:inherit">${t}${k === sortKey ? " ▾" : ""}</a></th>`;
  const rows = index.map((p, i) => {
    const r = reviews[p.id];
    const st = r ? `<span class="pill ${esc(r.verdict)}">${esc(r.verdict || "saved")}</span>` : `<span class="muted">–</span>`;
    const prob = (p.problems || []).length ? `<div class="small" style="color:var(--bad)">${esc(p.problems.join("; "))}</div>` : "";
    const href = `?id=${encodeURIComponent(p.id)}${catQ()}${showAll ? "&all=1" : ""}`;
    return `<tr class="row" onclick="location='${href}'">
      <td>${i+1}</td><td><a href="${href}">${esc(p.arxiv)}</a>${p.pilot ? ' <span class="pill" title="in the random pilot of 30">pilot</span>' : ""}</td>
      <td>${esc(p.title)} ${prob}</td><td>${esc(p.category)}</td><td>${esc(p.year)}</td><td title="${esc(CLASS_HELP[p.class] || "")}">${CLASS_MARK[p.class] || ""} ${esc(p.class || p.level || p.granularity)}</td>
      <td>${p.n_nodes ?? "–"}</td><td>${p.n_resolved ?? "–"}</td><td>${p.n_edges ?? "–"}</td><td>${st}</td></tr>`;
  }).join("");
  const toggle = showAll
    ? `<a href="${listQ({all: ""})}">show only the ${all.filter(p => p.good).length} good result-level diagrams</a>`
    : `<a href="${listQ({all: "1"})}">show all ${all.length} (also section-level and lower-quality diagrams)</a>`;
  const sampleLink = params.get("sample") ? ` · <a href="${listQ({sample: ""})}">leave the review sample</a>`
                                          : ` · <a href="${listQ({sample: "1"})}">review sample (30 random)</a>`;
  $("#main").innerHTML =
    `<div class="q"><b>Area</b> <select id="catsel">${opts.map(([v, t]) => `<option value="${esc(v)}" ${v === cat ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
     <span class="muted small">${showAll ? "All candidates." : "Good quality: boxes at the level of results (≥ half are theorems, lemmas, ... of the paper, not sections), ≥ 3 boxes, ≥ 2 arrows, ≥ 70% of the boxes resolved."} ${toggle}${sampleLink}</span></div>` +
    summary(index, reviews) + scoreTable(await getJSON("/gold_data/scores_summary.json").then(s => {
      const o = {}; for (const [k, v] of Object.entries(s)) { const [x, p] = k.split("/"); (o[x] = o[x] || {})[p] = v; } return o; })
      .catch(() => null), "Free extractors against the good diagrams (pooled, 95% bootstrap intervals)") +
    `<table><tr><th>#</th>${th("arxiv", "arXiv")}${th("title", "Title")}${th("category", "Category")}${th("year", "Year")}${th("level", "Diagram of")}
     ${th("n_nodes", "Boxes")}${th("n_resolved", "Resolved")}${th("n_edges", "Arrows")}<th>Review</th></tr>${rows}</table>
     <p class="small">${toggle}${sampleLink}</p>`;
  $("#catsel").onchange = e => { location = listQ({cat: e.target.value}); };
}

function tabs(el, items) {
  const bar = el.querySelector(".tabs"), body = el.querySelector(".body");
  bar.innerHTML = items.map((t, i) => `<button data-i="${i}">${esc(t[0])}</button>`).join("");
  const show = i => { [...bar.children].forEach((b, j) => b.classList.toggle("on", i === j)); body.innerHTML = items[i][1](); };
  bar.onclick = e => { if (e.target.dataset.i) show(+e.target.dataset.i); };
  show(0);
}

async function paperView() {
  await loadSample();
  const [all, m, reviews] = await Promise.all([getJSON("/gold_data/index.json"), getJSON(D + pid + "/meta.json"), getJSON("/gold/reviews")]);
  const index = all.filter(p => (showAll || p.good) && inCat(p));
  let gold = null; try { gold = await getJSON(D + pid + "/gold.json"); } catch (e) {}
  const r0 = reviews[pid] || {};
  const k = index.findIndex(p => p.id === pid);
  const prev = index[k-1], next = index[k+1];
  $("#nav").innerHTML = `<a href="gold_review.html?${catQ().slice(1)}">list</a> ` + (prev ? `<a href="?id=${prev.id}${catQ()}">← prev</a>` : "") +
                        ` <span class="muted">${k+1} / ${index.length}${cat ? " in " + esc(cat) : ""}</span> ` +
                        (next ? `<a href="?id=${next.id}${catQ()}">next →</a>` : "");
  $("#sub").innerHTML = `${esc(m.arxiv)} · ${esc(m.title)} · <span class="muted">${esc(m.survey?.primary_category)} ${esc(m.survey?.year)}</span>`;
  const page = m.fig_page || 1;
  const names = {}; (gold?.nodes || []).forEach(n => names[n.id] = n.name || n.id);
  const nodeRows = (m.nodes || []).map(n => {
    const v = (r0.nodes || {})[n.gid] || "";
    const opt = ["", "correct", "wrong result", "not in the figure", "not in ours", "cited (external)", "skip"].map(o => `<option ${o===v?"selected":""}>${o}</option>`).join("");
    return `<tr><td>${esc(n.gid)}</td><td>${esc((n.printed || []).join(", "))}${n.printed && n.printed.length ? "<br>" : ""}<span class="small muted">${esc(n.box_text)}</span></td><td class="small">${esc(n.refs.join(", "))}</td>
      <td>${esc(n.maps_to.map((x,i) => x + " (" + n.our_types[i] + ")").join(", ")) || `<span class="muted">${esc(n.status)}</span>`}
      ${n.typed ? '<div class="small" style="color:var(--warn)" title="Matched by the number typed in the box, which can be stale; check the statement">by typed number</div>' : ""}
      ${n.by_title ? '<div class="small" style="color:var(--warn)" title="The box names the result by its title (no \\ref, no number); check the statement">by title</div>' : ""}
    ${m.n_drawings > 1 ? `<div class="small muted">diagram ${n.diagram}</div>` : ""}</td>
      <td><select data-node="${n.gid}">${opt}</select></td></tr>`;
  }).join("");
  const edgeRows = (m.edges || []).map((e, i) => {
    const key = e.source + "->" + e.target, v = (r0.edges || {})[key] || "";
    const opt = ["", "correct", "reversed", "not in the figure", "skip"].map(o => `<option ${o===v?"selected":""}>${o}</option>`).join("");
    return `<tr><td>${esc(names[e.source] || e.source)} <b>→</b> ${esc(names[e.target] || e.target)}
      ${e.directed ? "" : '<span class="muted small">(no arrowhead parsed)</span>'}${e.equivalence ? ' <span class="small" style="color:var(--warn)">⇔ drawn both ways (equivalence)</span>' : ""}${e.label ? ` <span class="small muted">[arrow label: ${esc(e.label)}]</span>` : ""}${e.stated_in_box ? ' <span class="small" style="color:var(--acc)">[from a "(uses …)" note in the box, not a drawn arrow]</span>' : ""}</td>
      <td><select data-edge="${esc(key)}">${opt}</select></td></tr>`;
  }).join("");
  const radio = (name, opts, cur) => opts.map(o => `<label><input type="radio" name="${name}" value="${o}" ${o===cur?"checked":""}> ${o}</label>`).join("");
  const sc = await getJSON(D + pid + "/scores.json").catch(() => null);
  $("#main").innerHTML = scoreTable(sc, "Free extractors against this diagram") + `
    ${(m.problems || []).length ? `<p style="color:var(--bad)">${esc(m.problems.join("; "))}</p>` : ""}
    ${m.direction && m.direction.detected !== "forward" && m.direction.detected !== "unknown" ? `<p class="small" style="color:var(--warn)"><b>Arrow direction:</b>
      ${m.direction.detected === "reversed" ? "the arrows point against the paper's own references" : "the arrows partly point against the paper's own references"}
      (${m.direction.agree} agree, ${m.direction.reversed} reversed)${m.direction.scored_reversed ? "; scored reversed" : ""}${m.direction.reviewer ? " (as reviewed)" : "; please check and answer 'an arrow A → B drawn by the authors means' below"}.</p>` : ""}
    ${m.n_drawings > 1 ? `<p class="small"><b>${m.n_drawings} diagrams</b> in this paper, each a section of the graph on the right (open one at a time), with its page on the left. A result drawn in several figures appears in each.</p>` : ""}
    <div class="grid">
      <div class="pane" id="left"><div class="tabs"></div><div class="body"></div></div>
      <div class="pane" id="right"><div class="tabs"></div><div class="body"></div></div>
    </div>
    <div class="review">
      <h3>Review</h3>
      <div class="q"><b>Is this the authors' dependency diagram of their own results/sections?</b>
        ${radio("verdict", ["yes", "partly", "no"], r0.verdict)}</div>
      <div class="q"><b>What it shows:</b> ${radio("granularity", ["results", "sections", "mixed", "other"], r0.granularity || m.survey?.granularity)}</div>
      <div class="q"><b>An arrow A → B drawn by the authors means:</b> ${radio("arrow_meaning", ["A is used to prove B", "B is used to prove A (reversed)", "unclear"], r0.arrow_meaning)}</div>
      <div class="q small muted">Counts are enough. Optionally, mark which rows are wrong in the two tables below (blank = correct).</div>
      <div class="q"><b>Our transcription:</b> boxes in the figure we missed
        <input type="number" id="missed_nodes" min="0" style="width:60px" value="${r0.missed_nodes ?? ""}">,
        arrows we missed <input type="number" id="missed_edges" min="0" style="width:60px" value="${r0.missed_edges ?? ""}"></div>
      <div class="q"><b>False positives:</b> boxes of ours not in the figure
        <input type="number" id="extra_nodes" min="0" style="width:60px" value="${r0.extra_nodes ?? ""}">,
        arrows of ours not in the figure <input type="number" id="extra_edges" min="0" style="width:60px" value="${r0.extra_edges ?? ""}">,
        boxes attached to the wrong result <input type="number" id="wrong_nodes" min="0" style="width:60px" value="${r0.wrong_nodes ?? ""}"></div>
      <details ${nodeRows ? "open" : ""}><summary><b>Boxes → our nodes</b> (${(m.nodes||[]).length})</summary>
        <table><tr><th>id</th><th>Box (printed name, text)</th><th>\\ref labels</th><th>Our node (type)</th><th>Mapping</th></tr>${nodeRows}</table></details>
      <details ${edgeRows ? "open" : ""}><summary><b>Arrows</b> (${(m.edges||[]).length})</summary>
        <table><tr><th>Arrow as parsed</th><th>Check</th></tr>${edgeRows}</table></details>
      <div class="q"><b>Notes</b><textarea id="notes">${esc(r0.notes || "")}</textarea></div>
      <button class="save" id="save">Save review</button> <span id="saved" class="muted small">${r0.saved_at ? "saved " + esc(r0.saved_at) : ""}</span>
      ${next ? ` <label class="small"><input type="checkbox" id="gonext" checked> go to next after saving</label>` : ""}
    </div>`;
  tabs($("#left"), [
    ["Figure page", () => (m.figpages || (m.figpage ? [m.figpage] : [])).length
        ? (m.figpages || [m.figpage]).map((f, i) => `<div class="muted small" style="padding:4px 8px">PDF page ${(m.figpage_nums || [])[i] || page + i}</div><img src="${D + pid}/${f}">`).join("")
        : `<p class="muted" style="padding:8px">Figure page not found; see the PDF tab.</p>`],
    ["PDF", () => m.pdf ? `<iframe src="${D + pid}/paper.pdf#page=${page}"></iframe>` : `<iframe src="https://arxiv.org/pdf/${m.arxiv}#page=${page}"></iframe>`],
    ["Figure LaTeX", () => `<pre><b>Caption:</b> ${esc(m.caption)}\n\n${esc(m.figure_latex)}</pre>`],
    ["Survey note", () => `<pre>${esc(JSON.stringify(m.survey, null, 1))}</pre>`],
  ]);
  tabs($("#right"), [
    ["Diagram in our format", () => m.gold_page ? `<iframe src="${D + pid}/${m.gold_page}"></iframe>` : `<p class="muted" style="padding:8px">No converted graph.</p>`],
    ["Gold JSON", () => `<pre>${esc(JSON.stringify(gold, null, 1))}</pre>`],
    ["Whole paper (our extractor)", () => m.full_page ? `<iframe src="${D + pid}/${m.full_page}"></iframe>` : "<p>–</p>"],
  ]);
  $("#save").onclick = async () => {
    const val = n => (document.querySelector(`input[name=${n}]:checked`) || {}).value || "";
    const review = {verdict: val("verdict"), granularity: val("granularity"), arrow_meaning: val("arrow_meaning"),
      missed_nodes: $("#missed_nodes").value, missed_edges: $("#missed_edges").value, notes: $("#notes").value,
      extra_nodes: $("#extra_nodes").value, extra_edges: $("#extra_edges").value, wrong_nodes: $("#wrong_nodes").value,
      nodes: Object.fromEntries([...document.querySelectorAll("select[data-node]")].map(s => [s.dataset.node, s.value])),
      edges: Object.fromEntries([...document.querySelectorAll("select[data-edge]")].map(s => [s.dataset.edge, s.value]))};
    const r = await fetch("/gold/review?id=" + encodeURIComponent(pid), {method:"POST", headers:{"Content-Type":"application/json"},
                                                                         body: JSON.stringify(review)});
    const j = await r.json();
    $("#saved").textContent = r.ok ? "saved " + j.saved_at : "save failed: " + (j.error || r.status);
    if (r.ok && next && $("#gonext")?.checked) location = "?id=" + next.id + catQ() + (showAll ? "&all=1" : "");
  };
}

(pid ? paperView() : listView()).catch(e => { $("#main").textContent = "Error: " + e.message; });
</script>
</body>
</html>
