.eq-item { background: #d4e6f1; border-left: 3px solid #5dade2; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; border-radius: 0 3px 3px 0; }
.orphan-item { background: #fef9e7; border-left: 3px solid #f39c12; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; }

_i^2 - \\sum_{i,j=1}^n f_i f_j w_{ij} \\\\ & = \\frac{1}{2}\\left( \\sum_{i=1}^n d_i f_i^2 - 2 \\sum_{i,j=1}^n f_i f_j w_{ij} + \\sum_{j=1}^n d_j f_j^2 \\right) = \\frac{1}{2} \\sum_{i,j=1}^n w_{ij} (f_i - f_j)^2. \\ea", "name": "Part (1)", "subclass": "R1", "step_order": 1, "type": "proof_step"}, {"id": "R1_s2", "statement": "The symmetry of $L$ follows directly from the symmetry of $W$ and $D$. The positive semi-definiteness is a direct consequence of Part (1), which shows that $f'L f \\geq 0$ for all $f \\in \\RR^n$", "statement_clean": "The symmetry of $L$ follows directly from the symmetry of $W$ and $D$. The positive semi-definiteness is a direct consequence of Part (1), which shows that $f'L f \\geq 0$ for all $f \\in \\RR^n$", "name": "Part (2)", "subclass": "R1", "step_order": 2, "type": "proof_step"}, {"id": "R1_s3", "statement": "Obvious", "statement_clean": "Obvious", "name": "Part (3)", "subclass": "R1", "step_order": 3, "type": "proof_step"}, {"id": "R1_s4", "statement": "is a direct consequence of Parts (1) - (3)", "statement_clean": "is a direct consequence of Parts (1) - (3)", "name": "Part (4)", "subclass": "R1", "step_order": 4, "type": "proof_step"}, {"id": "R3_s1", "statement": "can be proved similarly to Part (1) of Proposition \\ref{prop-unnorm}", "statement_clean": "can be proved similarly to Part (1) of Proposition \\ref{prop-unnorm}", "name": "Part (1)", "subclass": "R3", "step_order": 5, "type": "proof_step"}, {"id": "R3_s2", "statement": "can be seen immediately by multiplying the eigenvalue equation $L_{\\text{sym}} w = \\lambda w$ with $D^{-1/2}$ from the left and substituting $u = D^{-1/2}w$", "statement_clean": "can be seen immediately by multiplying the eigenvalue equation $L_{\\text{sym}} w = \\lambda w$ with $D^{-1/2}$ from the left and substituting $u = D^{-1/2}w$", "name": "Part (2)", "subclass": "R3", "step_order": 6, "type": "proof_step"}, {"id": "R3_s3", "statement": "follows directly by multiplying the eigenvalue equation $L_ j > 0), then f_i needs to equal f_j. With this argument we can see that f needs to be constant for all vertices which can be connected by a path in the graph. Moreover, as all vertices of a connected component in an undirected graph can be connected by a path, f needs to be constant on the whole connected component. In a graph consisting of only one connected component we thus only have the constant one vector 1 as eigenvector with eigenvalue 0, which obviously is the indicator vector of the connected component. \\\\ Now consider the case of k connected components. Without loss of generality we assume that the vertices are ordered according to the connected components they belong to. In this case, the adjacency matrix W has a block diagonal form, and the same is true for the matrix L: ba L = L_1 & & & \\\\ & L_2 & & \\\\ & & ddots & \\\\ & & & L_k\\\\ ea Note that each of the blocks L_i is a proper graph Laplacian on its own, namely the Laplacian corresponding to the subgraph of the i-th connected component. As it is the case for all block diagonal matrices, we know that the spectrum of L is given by the union of the spectra of L_i, and the corresponding eigenvectors of L are the eigenvectors of L_i, filled with 0 at the positions of the other blocks. As each L_i is a graph Laplacian of a connected graph, we know that every L_i has eigenvalue 0 with multiplicity 1, and the corresponding eigenvector is the constant one vector on the i-th connected component. Thus, the matrix L has as many eigenvalues 0 as there are connected components, and the corresponding eigenvectors are the indicator vectors of the connected components.", "The proof is analogous to the one of Proposition , using Proposition ."], "input": [], "output": [], "steps": [{"id": "R2_s1", "statement": "We start with the case $k=1$, that is the graph is connected. Assume that $f$ is an eigenvector with eigenvalue $0$. Then we know that", "statement_clean": "We start with the case $k=1$, that is the graph sqrt |A_j| & if v_i in A_j \\\\ 0 & otherwise hspace2cm \\; (i=1,hdots,n; \\; j = 1,hdots, k).", "statement_clean": "we define k indicator vectors h_j = (h_1,j,hdots,h_n,j)' by banum h_i,j = 1/sqrt |A_j| & if v_i in A_j \\\\ 0 & otherwise hspace2cm \\; (i=1,hdots,n; \\; j = 1,hdots, k).", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "step_info": [], "equations": [], "foundation_links": ["Vectors"]}, "D10": {"name": "f", "type": "definition", "section": "", "statement": "we define the cluster indicator vector f by banum f_i = sqrtfracvol(overline A)vol A & if v_i in A \\\\ - sqrtfracvol(A)vol(overline A) & if v_i in overline A.", "statement_clean": "we define the cluster indicator vector f by banum f_i = sqrtfracvol(overline A)vol A & if v_i in A \\\\ - sqrtfracvol(A)vol(overline A) & if v_i in overline A.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "step_info": [], "equations": [], "foundation_links": ["vector"]}, "P5": {"name": "$\\Ncut$ via transition probabilities", "type": "proposition", "section": "", "statement": "Let G be connected and non bi-partite. Assume that we run the random walk (X_t)_t in N starting with X_0 in the stationary distribution pi. For disjoint subsets A, B subset V, denote by P(B |A) := P(X_1 in B | X_0 in A). Then: ba Ncut(A,overline A) = P(overline A |A) + P(A|overline A). ea", "statement_clean": "Let G be connected and non bi-partite. Assume that we run the random walk (X_t)_t in N starting with X_0 in the stationary distribution pi. For disjoint subsets A, B subset V, denote by P(B |A) := P(X_1 in B | X_0 in A). Then: ba Ncut(A,overline A) = P(overline A |A) + P(A|overline A). ea", "origin": "paper", "origin_citation": "", "assumptions": ["Let G be connected and non bi-partite.", "Assume that we run the random walk (X_t)_t in N starting with X_0 in the stationary distribution pi.", "For disjoint subsets A, B subset V, denote by P(B |A) := P(X_1 in B | X_0 in A)."], "conclusions": ["Then: ba Ncut(A,overline A) = P(overline A |A) + P(A|overline A).", "ea"], "proof_info": ["First of all observe that ba & P(X_0 in A, X_1 in B) = sum_i in A, j in B P(X_0 = i, X_1 = j) \\; = sum_i in A, j in B pi_i p_ij \\\\ & = sum_i in A, j in B fracd_ivol(V) fracw_ijd_i \\; = frac1vol(V) sum_i in A, j in B w_ij. ea Using this we obtain ba & P(X_1 in B | X_0 in A) = fracP(X_0 in A, X_1 in B)P(X_0 in A) \\\\ & = left( frac1vol(V) sum_i in A, j in B w_ij right) left(fracvol(A)vol(V) right)^-1 = fracsum_i in A, j in B w_ijvol(A). ea Now the proposition follows directly with the definition of Ncut."], "input": [], "output": [], "steps": [{"id": "R5_s1", "statement": "First of all observe that \\ba & P(X_0 \\in A, X_1 \\in B) = \\sum_{i \\in A, j \\in B} P(X_0 = i, X_1 = j) \\; = \\sum_{i \\in A, j \\in B} \\pi_i p_{ij} \\\\ & = \\sum_{i \\in A, j \\in B} \\frac{d_i}{\\vol(V)} \\frac{w_{ij}}{d_i} \\; = \\frac{1}{\\vol(V)} \\sum_{i \\in A, j \\in B} w_{ij}. \\ea", "statement_clean": "First of all observe that \\ba & P(X_0 \\in A, X_1 \\in B) = \\sum_{i \\in A, j \\in B} P(X_0 = i, X_1 = j) \\; = \\sum_{i \\in A, j \\in B} \\pi_i p_{ij} \\\\ & = \\sum_{i \\in A, j \\in B} \\frac{d_i}{\\vol(V)} \\frac{w_{ij}}{d_i} \\; = \\frac{1}{\\vol(V)} \\sum_{i \\in A, j \\in B} w_{ij}. \\ea", "name": "", "subclass": "", "step_order": 1, "type": "proof_step"}, {"id": "R5_s2", "statement": "Using this we obtain \\ba & P(X_1 \\in B | X_0 \\in A) = \\frac{P(X_0 \\in A, X_1 \\in B)}{P(X_0 \\in A)} \\\\ & = \\left( \\frac{1}{\\vol(V)} \\sum_{i \\in A, j \\in B} w_{ij} \\right) \\left(\\frac{\\vol(A)}{\\vol(V)} \\right)^{-1} = \\frac{\\sum_{i \\in A, j \\in B} w_{ij}}{\\vol(A)}. \\ea Now the proposition follows directly with the definition of $\\Ncut$.", "statement_clean": "Using this we obtain \\ba & P(X_1 \\in B | X_0 \\in A) = \\frac{P(X_0 \\in A, X_1 \\in B)}{P(X_0 \\in A)} \\\\ & = \\left( \\frac{1}{\\vol(V)} \\sum_{i \\in A, j \\in B} w_{ij} \\right) \\left(\\frac{\\vol(A)}{\\vol(V)} \\right)^{-1} = \\frac{\\sum_{i \\in A, j \\in B} w_{ij}}{\\vol(A)}. \\ea Now the proposition follows directly with the definition of $\\Ncut$.", "name": "", "subclass": "", "step_order": 2, "type": "proof_step"}], "step_info": [{"id": "R5_s1", "statement": "First of all observe that \\ba & P(X_0 \\in A, X_1 \\in B) = \\sum_{i \\in A, j \\in B} P(X_0 = i, X_1 = j) \\; = \\sum_{i \\in A, j \\in B} \\pi_i p_{ij} \\\\ & = \\sum_{i \\in A, j \\in B} \\frac{d_i}{\\vol(V)} \\frac{w_{ij}}{d_i} \\; = \\frac{1}{\\vol(V)} \\sum_{i \\in A, j \\in B} w_{ij}. \\ea", "statement_clean": "First of all observe that \\ba & P(X_0 \\in A, X_1 \\in B) = \\sum_{i \\in A, j \\in B} P(X_0 = i, X_1 = j) \\; = \\sum_{i \\in A, j \\in B} \\pi_i p_{ij} \\\\ & = \\sum_{i \\in A, j \\in B} \\frac{d_i}{\\vol(V)} \\frac{w_{ij}}{d_i} \\; = \\frac{1}{\\vol(V)} \\sum_{i \\in A, j \\in B} w_{ij}. \\ea", "name": "", "subclass": "", "step_order": 1, "type": "proof_step"}, {"id": "R5_s2", "statement": "Using this we obtain \\ba & P(X_1 \\in B | X_0 \\in A) = \\frac{P(X_0 \\in A, X_1 \\in B)}{P(X_0 \\in A)} \\\\ & = \\left( \\frac{1}{\\vol(V)} \\sum_{i \\in A, j \\in B} w_{ij} \\right) \\left(\\frac{\\vol(A)}{\\vol(V)} \\right)^{-1} = \\frac{\\sum_{i \\in A, j \\in B} w_{ij}}{\\vol(A)}. \\ea Now the proposition follows directly with the definition of $\\Ncut$.", "statement_clean": "Using this we obtain \\ba & P(X_1 \\in B | X_0 \\in A) = \\frac{P(X_0 \\in A, X_1 \\in B)}{P(X_0 \\in A)} \\\\ & = \\left( \\frac{1}{\\vol(V)} \\sum_{i \\in A, j \\in B} w_{ij} \\right) \\left(\\frac{\\vol(A)}{\\vol(V)} \\right)^{-1} = \\frac{\\sum_{i \\in A, j \\in B} w_{ij}}{\\vol(A)}. \\ea Now the proposition follows directly with the definition of $\\Ncut$.", "name": "", "subclass": "", "step_order": 2, "type": "proof_step"}], "equations": [], "foundation_links": ["Stationary distribution",     var mb = document.getElementById("ghost-mathlib-btn");

    if (mb && !mb.disabled) mb.dataset.showing = "1";
    if (bb && !bb.disabled) bb.dataset.showing = "1";
  } else {
    btn.dataset.showing = "0";
    ghostEls.forEach(function(el) { el.style.display = "none"; });
    var mb = document.getElementById("ghost-mathlib-btn");
    var bb = document.getElementById("ghost-book-btn");
    if (mb && !mb.disabled) mb.dataset.showing = "0";
    if (bb && !bb.disabled) bb.dataset.showing = "0";
  }
}

// Port #1: Foundation subset toggles. Show/hide ghost elements whose gid
// suffix matches the subset's index list. Indices come from
// GHOST_BOOK_INDICES (book entries) / GHOST_OTHER_INDICES (mathlib/herald).
function _toggleGhostSubset(btnId, indices, prefix) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  var btn = document.getElementById(btnId);
  if (!btn || btn.disabled) return;
  var nextShowing = !(btn.dataset.showing === "1");
  btn.dataset.showing = nextShowing ? "1" : "0";
  indices.forEach(function(gi) {
    // Box, header, text, refs for this ghost
    ["box", "header", "text", "refs"].forEach(function(kind) {
      var el = svgEl.querySelector('[id="' + prefix + '_' + kind + '_' + gi + '"]');
      if (el) el.style.display = nextShowing ? "" : "none";
    });
    // Edges: <prefix>_edge_<gi>_<ti> — match all by gi prefix scan.
    var edges = svgEl.querySelectorAll('[id^="' + prefix + '_edge_' + gi + '_"]');
    edges.forEach(function(e) { e.style.display = nextShowing ? "" : "none"; });
  });
}
function toggleGhostsMathlib() {
  // Mathlib/proofwiki/herald entries use the "ghost" prefix.
  _toggleGhostSubset("ghost-mathlib-btn", GHOST_OTHER_INDICES, "ghost");
}
function toggleGhostsBook() {
  // Book entries use the "ghostbook" prefix.
  _toggleGhostSubset("ghost-book-btn", GHOST_BOOK_INDICES, "ghostbook");
}

// Port #1: "Has proof" toggle — highlight theorem-like nodes with a non-empty
// proof_info by toggling a CSS class on the body rect.
function toggleHasProof() {
  var btn = document.getElementById("has-proof-btn");
  if (!btn || btn.disabled) return;
  var nextShowing = !(btn.dataset.showing === "1");
  btn.dataset.showing = nextShowing ? "1" : "0";
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  HAS_PROOF_NODE_IDS.forEach(function(nid) {
    var safeNid = String(nid).replace(/ /g, "_");
    var body = svgEl.querySelector('[id="node_' + safeNid + '"]');
    if (!body) return;
    var pathEl = body.tagName === "path" ? body : body.querySelector("path");
    if (!pathEl) return;
    if (nextShowing) {
      pathEl.setAttribute("data-prev-stroke", pathEl.getAttribute("stroke") || "");
      pathEl.setAttribute("data-prev-strokewidth", pathEl.getAttribute("stroke-width") || "");
      pathEl.setAttribute("stroke", "#5D4037");
      pathEl.setAttribute("stroke-width", "3");
    } else {
      pathEl.setAttribute("stroke", pathEl.getAttribute("data-prev-stroke") || "");
      pathEl.setAttribute("stroke-width", pathEl.getAttribute("data-prev-strokewidth") || "");
    }
  });
}

// Port #4: Generic helper to hide/show a set of nodes by id.
// Bug 1 fix: also hide/show every edge incident to the toggled nodes via
// NODE_TO_EDGES, so we don't leave dangling arrows pointing into empty space.
function _setNodeVisibility(nodeIds, visible, extraClass) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  var edgeGids = {};  // collect unique edge gids touching any toggled node
  nodeIds.forEach(function(nid) {
    var safeNid = String(nid).replace(/ /g, "_");
    var body = svgEl.querySelector('[id="node_' + safeNid + '"]');
    if (body) {
      body.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) body.classList.add(extraClass); else body.classList.remove(extraClass);
      }
    }
    var sibs = svgEl.querySelectorAll('[id^="node_' + safeNid + '__"]');
    sibs.forEach(function(el) {
      el.style.display = visible ? "" : "none";
    });
    var incident = NODE_TO_EDGES[nid] || [];
    incident.forEach(function(g) { edgeGids[g] = true; });
  });
  Object.keys(edgeGids).forEach(function(g) {
    var el = svgEl.querySelector('[id="' + g + '"]');
    if (el) el.style.display = visible ? "" : "none";
  });
}

// Examples & Remarks toggle
function toggleAux() {
  var btn = document.getElementById("aux-btn");
  if (btn.disabled) return;
  var nextShowing = !(btn.dataset.showing === "1");
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(AUX_NODE_IDS, nextShowing, "node-aux-shown");
}

// Cited Results (External) toggle — also applies dashed border when shown,
// matching HEAD's visual differentiation of external nodes.
function toggleExternal() {
  var btn = document.getElementById("ext-btn");
  if (btn.disabled) return;
  var nextShowing = !(btn.dataset.showing === "1");
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(EXT_NODE_IDS, nextShowing);
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  EXT_NODE_IDS.forEach(function(nid) {
    var safeNid = String(nid).replace(/ /g, "_");
    var body = svgEl.querySelector('[id="node_' + safeNid + '"]');
    if (!body) return;
    var pathEl = body.tagName === "path" ? body : body.querySelector("path");
    if (!pathEl) return;
    if (nextShowing) {
      pathEl.setAttribute("stroke-dasharray", "6,3");
      pathEl.setAttribute("stroke-width", "2");
    } else {
      pathEl.removeAttribute("stroke-dasharray");
      pathEl.removeAttribute("stroke-width");
    }
  });
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all foundation ghost elements (mathlib AND book-derived).
    // The [id^="ghost"] selector covers both "ghost_*" and "ghostbook_*".
    var all = svgEl.querySelectorAll('[id^="ghost"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
  // Port #2: Cited Results (External) hidden by default — matches HEAD.
  _setNodeVisibility(EXT_NODE_IDS, false);
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() { currentZoom = 1.0; applyZoom(); }

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
