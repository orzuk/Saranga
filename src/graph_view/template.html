<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="saranga-graph-view-v2">
<title>{{TITLE}}</title>
{{MATHJAX}}
<style>
{{CLASSIC_CSS}}
</style>
<style>
{{VIEWER_CSS}}
</style>
</head>
<body>
<div id="header">
  <a id="home-link" href="/" title="Back to the SARANGA portal">&larr; SARANGA</a>
  <h1 id="title" title="{{TITLE}}">{{TITLE}}</h1>
  <div id="srclinks">{{SRCLINKS}}</div>
  <div id="controls">
    <button id="info-btn" onclick="showPaperInfo()" title="Extraction metadata: paper style, extractor comment and notes">Paper info</button>
    <button id="fit-btn" title="Fit the graph to the window">Fit</button>
    <button id="zin-btn" title="Zoom in">Zoom +</button>
    <button id="zout-btn" title="Zoom out">Zoom -</button>
  </div>
</div>
<div id="toolbar">
  <div class="group" id="level-group">
    <span class="toggle-label">Level:</span>
    <button class="seg" data-level="overview" title="One box per section; click a box to open it in place, click its frame (or Esc, or Overview again) to close it">Overview</button>
    <button class="seg" data-level="results" title="Definitions and results, each proof folded into its result">Results</button>
    <button class="seg" data-level="full" title="Every top-level node; double-click a result (or use its panel) to open its proof">Full</button>
  </div>
  <div class="group" id="focus-group">
    <span class="toggle-label">Focus:</span>
    <button class="toggle-btn" id="main-btn" title="The main results and everything they depend on (redundant edges removed)">Path to main results</button>
    <button class="toggle-btn" id="up-btn" title="Select a node, then show everything it rests on (redundant edges removed)">Path to this</button>
    <button class="toggle-btn" id="down-btn" title="Select a node, then show everything that rests on it (redundant edges removed)">Depends on this</button>
    <button class="toggle-btn" id="nbhd-btn" title="Select a node, then show what it uses and what uses it, k steps away">Neighbourhood</button>
    <span id="hop-ctl"><button class="mini" id="hop-minus" title="One step fewer">&minus;</button><span id="hop-k">1</span><button class="mini" id="hop-plus" title="One step more">+</button></span>
    <input id="search" type="search" placeholder="Search labels and statements" autocomplete="off">
    <span id="search-count"></span>
  </div>
  <div class="group" id="rows-group">
    <button class="toggle-btn mini-row" id="legend-btn" title="Show or hide the legend: node colours and edge styles">Legend</button>
    <button class="toggle-btn mini-row" id="filters-btn" title="Show or hide the filters: foundations, examples, cited results, edge kinds">Filters</button>
  </div>
</div>
<div class="legend" id="legend"></div>
<div class="legend" id="toggles">
  <span class="toggle-label">Toggle:</span>
</div>
<div id="main">
  <div id="cy-wrap"><div id="cy"></div><div id="status"></div><div id="busy">laying out&hellip;</div><button id="back-btn" title="One step back: close the last opened section, or leave the focus (Esc)">&larr; Close section</button><button id="ctx-btn" title="The sections linked to the open one, closed, around it"></button><button id="lay-btn" title="Place the boxes as the authors drew them, or lay the graph out by dependency depth"></button></div>
  <div id="detail-panel"></div>
</div>
<button id="orphan-toggle" onclick="toggleOrphans()"></button>
<div id="orphan-panel"><h3>Unconnected Equations</h3><div id="orphan-list"></div></div>
{{LIBS}}
<script type="application/json" id="graph-data">{{GRAPH_JSON}}</script>
<script>
// Side panel: the classic viewer's own code and data (visualize_annotation.py).
var _lastDetailNode = null;
{{PANEL_JS}}
</script>
<script>
{{VIEWER_JS}}
</script>
</body>
</html>
