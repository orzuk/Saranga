 "", "assumptions": [], "conclusions": ["The matrix L satisfies the following properties: item For every vector f in RR^n we have ba f'L f = frac12 sum_i,j=1^n w_ij (f_i - f_j)^2.", "ea item L is symmetric and positive semi-definite.", "item The smallest eigenvalue of L is 0, the corresponding eigenvector is the constant one vector 1.", "item L has n non-negative, real-valued eigenvalues 0 = lambda_1 leq lambda_2 leq hdots leq lambda_n."], "proof_info": ["\\\\ Part (1): By the definition of d_i, ba & f' L f = f'D f - f'W f = sum_i=1^n d_i f_i^2 - sum_i,j=1^n f_i f_j w_ij \\\\ & = frac12left( sum_i=1^n d_i f_i^2 - 2 sum_i,j=1^n f_i f_j w_ij + sum_j=1^n d_j f_j^2 right) = frac12 sum_i,j=1^n w_ij (f_i - f_j)^2. ea Part (2): The symmetry of L follows directly from the symmetry of W and D. The positive semi-definiteness is a direct consequence of Part (1), which shows that f'L f geq 0 for all f in RR^n. \\\\ Part (3): Obvious.\\\\ Part (4) is a direct consequence of Parts (1) - (3).", "Part (1) can be proved similarly to Part (1) of Proposition . \\\\ Part (2) can be seen immediately by multiplying the eigenvalue equation L_sym w = lambda w with D^-1/2 from the left and substituting u = D^-1/2w. \\\\ Part (3) follows directly by multiplying the eigenvalue equation L_rw u = lambda u with D from the left. \\\\ Part (4): The first statement is obvious as L_rw 1 = 0, the second statement follows from (2). \\\\ Part (5): The statement about L_sym follows from (1), and then the statement about L_rw follows from (2)."], "input": [], "output": [], "steps": [{"id": "R1_s1", "statement": "By the definition of $d_i$, \\ba & f' L f = f'D f - f'W f = \\sum_{i=1}^n d_i f_i^2 - \\sum_{i,j=1}^n f_i f_j w_{ij} \\\\ & = \\frac{1}{2}\\left( \\sum_{i=1}^n d_i f_i^2 - 2 \\sum_{i,j=1}^n f_i f_j w_{ij} + \\sum_{j=1}^n d_j f_j^2 \\right) = \\frac{1}{2} \\sum_{i,j=1}^n w_{ij} (f_i - f_j)^2. \\ea", "statement_clean": "By the definition of $d_i$, \\ba & f' L f = f'D f - f'W f = \\sum_{i=1}^n d_i f_i^2 - \\sum_{i,j=1}^n f_i f_j w_{ij} \\\\ & = \\frac{1}{2}\\left( \\sum_{i=1}^n d_i f_i^2 - 2 \\sum_{i,j=1}^n f_i f_j w_{ij} + \\sum_{j=1}^n d_j f_j^2 \\right) = \\frac{1}{2} \\sum_{i,j=1}^n w_{ij} (f_i - f_j)^2. \\ea", "name": "Part (1)", "subclass": "R1", "step_order": 1, "type": "proof_step"}, {"id": "R1_s2", "statement": "The symmetry of $L$ follows directly from the symmetry of $W$ and $D$. The positive semi-definiteness is a direct consequence of Part (1), which shows that $f'L f \\geq 0$ for all $f \\in \\RR^n$", "statement_clean": "The symmetry of $L$ follows directly from the symmetry of $W$ and $D$. The positive semi-definiteness is a direct consequence of Part (1), which shows that $f'L f \\geq 0$ for all $f \\in \\RR^n$", "name": "Part (2)", "subclass": "R1", "step_order": 2, "type": "proof_step"}, {"id": "R1_s3", "statement": "Obvious", "statement_clean": "Obvious", "name": "Part (3)", "subclass": "R1", "step_order": 3, "type": "proof_step"}, {"id": "R1_s4", "statement": "is a direct consequence of Parts (1) - (3)", "statement_clean": "is a direct consequence of Parts (1) - (3)", "name": "Part (4)", "subclass": "R1", "step_order": 4, "type": "proof_step"}, {"id": "R3_s1", "statement": "can be proved similarly to Part (1) of Proposition \\ref{prop-unnorm}", "statement_clean": "can be proved similarly to Part (1) of Proposition \\ref{prop-unnorm}", "name": "Part (1)", "subclass": "R3", "step_order": 5, "type": "proof_step"}, {"id": "R3_s2", "statement": "can be seen immediately by multiplying the eigenvalue equation $L_{\\text{sym}} w = \\lambda w$ with $D^{-1/2}$ from the left and substituting $u = D^{-1/2}w$", "statement_clean": "can be seen immediately by multiplying the eigenvalue equation $L_{\\text{sym}} w = \\lambda w$ with $D^{-1/2}$ from the left and substituting $u = D^{-1/2}w$", "name": "Part (2)", "subclass": "R3", "step_order": 6, "type": "proof_step"}, {"id": "R3_s3", "statement": "follows directly by multiplying the eigenvalue equation $L_{\\text{rw}} u = \\lambda u$ with $D$ from the left", "statement_clean": "follows directly by multiplying the eigenvalue equation $L_{\\text{rw}} u = \\lambda u$ with $D$ from the left", "name": "Part (3)", "subclass": "R3", "step_order": 7, "type": "proof_step"}, {"id": "R3_s4", "statement": "The first statement is obvious as $L_{\\text{rw}} \\mathbb{1} = 0$, the second statement follows from (2)", "statement_clean": "The first statement is obvious as $L_{\\text{rw}} \\mathbb{1} = 0$, the second statement follows from (2)", "name": "Part (4)", "subclass": "R3", "step_order": 8, "type": "proof_step"}, {"id": "R3_s5", "statement": "The statement about $L_{\\text{sym}}$ follows from (1), and then the statement about $L_{\\text{rw}}$ follows from (2)", "statement_clean": "The statement about $L_{\\text{sym}}$ follows from (1), and then the statement about $L_{\\text{rw}}$ follows from (2)", "name": "Part (5)", "subclass": "R3", "step_order": 9, "type": "proof_step"}], "step_info": [{"id": "R1_s1", "statement": "By the definition of $d_i$, \\ba & f' L f = f'D f - f'W f = \\sum_{i=1}^n d_i f_i^2 - \\sum_{i,j=1}^n f_i f_j w_{ij} \\\\ & = \\frac{1}{2}\\left( \\sum_{i=1}^n d_i f_i^2 - 2 \\sum_{i,j=1}^n f_i f_j w_{ij} + \\sum_{j=1}^n d_j f_j^2 \\right) = \\frac{1}{2} \\sum_{i,j=1}^n w_{ij} (f_i - f_j)^2. \\ea", "statement_clean": "By the definition of $d_i$, \\ba & f' L f = f'D f - f'W f = \\sum_{i=1}^n d_i f_i^2 - \\sum_{i,j=1}^n f_i f_j w_{ij} \\\\ & = \\frac{1}{2}\\left( \\sum_{i=1}^n d_i f_i^2 - 2 \\sum_{i,j=1}^n f_i f_j w_{ij} + \\sum_{j=1}^n d_j f_j^2 \\right) = \\frac{1}{2} \\sum_{i,j=1}^n w_{ij} (f_i - f_j)^2. \\ea", "name": "Part (1)", "subclass": "R1", "step_order": 1, "type": "proof_step"}, {"id": "R1_s2", "statement": "The symmetry of $L$ follows directly from the symmetry of $W$ and $D$. The positive semi-definiteness is a direct consequence of Part (1), which shows that $f'L f \\geq 0$ for all $f \\in \\RR^n$", "statement_clean": "The symmetry of $L$ follows directly from the symmetry of $W$ and $D$. The positive semi-definiteness is a direct consequence of Part (1), which shows that $f'L f \\geq 0$ for all $f \\in \\RR^n$", "name": "Part (2)", "subclass": "R1", "step_order": 2, "type": "proof_step"}, {"id": "R1_s3", "statement": "Obvious", "statement_clean": "Obvious", "name": "Part (3)", "subclass": "R1", "step_order": 3, "type": "proof_step"}, {"id": "R1_s4", "statement": "is a direct consequence of Parts (1) - (3)", "statement_clean": "is a direct consequence of Parts (1) - (3)", "name": "Part (4)", "subclass": "R1", "step_order": 4, "type": "proof_step"}, {"id": "R3_s1", "statement": "can be proved similarly to Part (1) of Proposition \\ref{prop-unnorm}", "statement_clean": "can be proved similarly to Part (1) of Proposition \\ref{prop-unnorm}", "name": "Part (1)", "subclass": "R3", "step_order": 5, "type": "proof_step"}, {"id": "R3_s2", "statement": "can be seen immediately by multiplying the eigenvalue equation $L_{\\text{sym}} w = \\lambda w$ with $D^{-1/2}$ from the left and substituting $u = D^{-1/2}w$", "statement_clean": "can be seen immediately by multiplying the eigenvalue equation $L_{\\text{sym}} w = \\lambda w$ with $D^{-1/2}$ from the left and substituting $u = D^{-1/2}w$", "name": "Part (2)", "subclass": "R3", "step_order": 6, "type": "proof_step"}, {"id": "R3_s3", "statement": "follows directly by multiplying the eigenvalue equation $L_{\\text{rw}} u = \\lambda u$ with $D$ from the left", "statement_clean": "follows directly by multiplying the eigenvalue equation $L_{\\text{rw}} u = \\lambda u$ with $D$ from the left", "name": "Part (3)", "subclass": "R3", "step_order": 7, "type": "proof_step"}, {"id": "R3_s4", "statement": "The first statement is obvious as $L_{\\text{rw}} \\mathbb{1} = 0$, the second statement follows from (2)", "statement_clean": "The first statement is obvious as $L_{\\text{rw}} \\mathbb{1} = 0$, the second statement follows from (2)", "name": "Part (4)", "subclass": "R3", "step_order": 8, "type": "proof_step"}, {"id": "R3_s5", "statement": "The statement about $L_{\\text{sym}}$ follows from (1), and then the statement about $L_{\\text{rw}}$ follows from (2)", "statement_clean": "The statement about $L_{\\text{sym}}$ follows from (1), and then the statement about $L_{\\text{rw}}$ follows from (2)", "name": "Part (5)", "subclass": "R3", "step_order": 9, "type": "proof_step"}], "equations": [], "foundation_links": ["positive", "Eigenvector", "vector", "Symmetry", "Eigenvalue", "constant", "equation", "proposition", "matrix"]}, "P2": {"name": "Number of connected components and the spectrum of $L$", "type": "proposition", "section": "", "statement": "Let G be an undirected graph with non-negative weights. Then the multiplicity k of the eigenvalue 0 of L equals the number of connected components A_1, hdots, A_k in the graph. The eigenspace of eigenvalue 0 is spanned by the indicator vectors 1_A_1, hdots, 1_A_k of those components.", "statement_clean": "Let G be an undirected graph with non-negative weights. Then the multiplicity k of the eigenvalue 0 of L equals the number of connected components A_1, hdots, A_k in the graph. The eigenspace of eigenvalue 0 is spanned by the indicator vectors 1_A_1, hdots, 1_A_k of those components.", "origin": "paper", "origin_citation": "", "assumptions": ["Let G be an undirected graph with non-negative weights."], "conclusions": ["Then the multiplicity k of the eigenvalue 0 of L equals the number of connected components A_1, hdots, A_k in the graph.", "The eigenspace of eigenvalue 0 is spanned by the indicator vectors 1_A_1, hdots, 1_A_k of those components."], "proof_info": ["We start with the case k=1, that is the graph is connected. Assume that f is an eigenvector with eigenvalue 0. Then we know that ba 0 = f' L f = sum_i,j=1^n w_ij (f_i - f_j)^2. ea As the weights w_ij are non-negative, this sum can only vanish if all terms w_ij(f_i - f_j)^2 vanish. Thus, if two vertices v_i and v_j are connected (i.e., w_ij > 0), then f_i needs to equal f_j. With this argument we can see that f needs to be constant for all vertices which can be connected by a path in the graph. Moreover, as all vertices of a connected component in an undirected graph can be connected by a path, f needs to be constant on the whole connected component. In a graph consisting of only one connected component we thus only have the constant one vector 1 as eigenvector with eigenvalue 0, which obviously is the indicator vector of the connected component. \\\\ Now consider the case of k connected components. Without loss of generality we assume that the vertices are ordered according to the connected components they belong to. In this case, the adjacency matrix W has a block diagonal form, and the same is true for the matrix L: ba L = L_1 & & & \\\\ & L_2 & & \\\\ & & ddots & \\\\ & & & L_k\\\\ ea Note that each of the blocks L_i is a proper graph Laplacian on its own, namely the Laplacian corresponding to the subgraph of the i-th connected component. As it is the case for all block diagonal matrices, we know that the spectrum of L is given by the union of the spectra of L_i, and the corresponding eigenvectors of L are the eigenvectors of L_i, filled with 0 at the positions of the other blocks. As each L_i is a graph Laplacian of a connected graph, we know that every L_i has eigenvalue 0 with multiplicity 1, and the corresponding eigenvector is the constant one vector on the i-th connected component. Thus, the matrix L has as many eigenvalues 0 as there are connected components, and the corresponding eigenvectors are the indicator vectors of the connected components.", "The proof is analogous to the one of Proposition , using Proposition ."], "input": [], "output": [], "steps": [{"id": "R2_s1", "statement": "We start with the case $k=1$, that is the graph is connected. Assume that $f$ is an eigenvector with eigenvalue $0$. Then we know that", "statement_clean": "We start with the case $k=1$, that is the graph is connected. Assume that $f$ is an eigenvector with eigenvalue $0$. Then we know that", "name": "", "subclass": "R2", "step_order": 1, "type": "proof_step"}, {"id": "R2_s2", "statement": "\\ba 0 = f' L f = \\sum_{i,j=1}^n w_{ij} (f_i - f_j)^2. \\ea", "statement_clean": "\\ba 0 = f' L f = \\sum_{i,j=1}^n w_{ij} (f_i - f_j)^2. \\ea", "name": "", "subclass": "R2", "step_order": 2, "type": "proof_step"}, {"id": "R2_s3", "statement": "As the weights $w_{ij}$ are non-negative, this sum can only vanish if all terms $w_{ij}(f_i - f_j)^2$ vanish. Thus, if two vertices $v_i$ and $v_j$ are connected (i.e., $w_{ij} > 0$), then $f_i$ needs to equal $f_j$. With this argument we can see that $f$ needs to be constant for all vertices which can be connected by a path in the graph. Moreover, as all vertices of a connected component in an undirected graph can be connected by a path, $f$ needs to be constant on the whole connected component. In a graph consisting of only one connected component we thus only have the constant one vector $\\mathbb{1}$ as eigenvector with eigenvalue 0, which obviously is the indicator vector of the connected component.", "statement_clean": "As the weights $w_{ij}$ are non-negative, this sum can only vanish if all terms $w_{ij}(f_i - f_j)^2$ vanish. Thus, if two vertices $v_i$ and $v_j$ are connected (i.e., $w_{ij} > 0$), then $f_i$ needs to equal $f_j$. With this argument we can see that $f$ needs to be constant for all vertices which can be connected by a path in the graph. Moreover, as all vertices of a connected component in an undirected graph can be connected by a path, $f$ needs to be constant on the whole connected component. In a graph consisting of only one connected component we thus only have the constant one vector $\\mathbb{1}$ as eigenvector with eigenvalue 0, which obviously is the indicator vector of the connected component.", "name": "", "subclass": "R2", "step_order": 3, "type": "proof_step"}, {"id": "R2_s4", "statement": "Now consider he stationary distribution pi.", "For disjoint subsets A, B subset V, denote by P(B |A) := P(X_1 in B | X_0 in A)."], "conclusions": ["Then: ba Ncut(A,overline A) = P(overline A |A) + P(A|overline A).", "ea"], "proof_info": ["First of all observe that ba & P(X_0 in A, X_1 in B) = sum_i in A, j in B P(X_0 = i, X_1 = j) \\; = sum_i in A, j in B pi_i p_ij \\\\ & = sum_i in A, j in B fracd_ivol(V) fracw_ijd_i \\; = frac1vol(V) sum_i in A, j in B w_ij. ea Using this we obtain ba & P(X_1 in B | X_0 in A) = fracP(X_0 in A, X_1 in B)P(X_0 in A) \\\\ & = left( frac1vol(V) sum_i in A, j in B w_ij right) left(fracvol(A)vol(V) right)^-1 = fracsum_i in A, j in B w_ijvol(A). ea Now the proposition follows directly with the definition of Ncut."], "input": [], "output": [], "steps": [{"id": "R5_s1", "statement": "First of all observe that \\ba & P(X_0 \\in A, X_1 \\in B) = \\sum_{i \\in A, j \\in B} P(X_0 = i, X_1 = j) \\; = \\sum_{i \\in A, j \\in B} \\pi_i p_{ij} \\\\ & = \\sum_{i \\in A, j \\in B} \\frac{d_i}{\\vol(V)} \\frac{w_{ij}}{d_i} \\; = \\frac{1}{\\vol(V)} \\sum_{i \\in A, j \\in B} w_{ij}. \\ea", "statement_clean": "First of all observe that \\ba & P(X_0 \\in A, X_1 \\in B) = \\sum_{i \\in A, j \\in B} P(X_0 = i, X_1 = j) \\; = \\sum_{i \\in A, j \\in B} \\pi_i p_{ij} \\\\ & = \\sum_{i \\in A, j \\in B} \\frac{d_i}{\\vol(V)} \\frac{w_{ij}}{d_i} \\; = \\frac{1}{\\vol(V)} \\sum_{i \\in A, j \\in B} w_{ij}. \\ea", "name": "", "subclass": "", "step_order": 1, "type": "proof_step"}, {"id": "R5_s2", "statement": "Using this we obtain \\ba & P(X_1 \\in B | X_0 \\in A) = \\frac{P(X_0 \\in A, X_1 \\in B)}{P(X_0 \\in A)} \\\\ & = \\left( \\frac{1}{\\vol(V)} \\sum_{i \\in A, j \\in B} w_{ij} \\right) \\left(\\frac{\\vol(A)}{\\vol(V)} \\right)^{-1} = \\frac{\\sum_{i \\in A, j \\in B} w_{ij}}{\\vol(A)}. \\ea Now the proposition follows directly with the definition of $\\Ncut$.", "statement_clean": "Using this we obtain \\ba & P(X_1 \\in B | X_0 \\in A) = \\frac{P(X_0 \\in A, X_1 \\i n_links": ["image", "Eigenvalue", "The Spectrum", "Davis-Kahan", "projection", "Subset", "interval", "Frobenius norm"]}, "DIST_P1": {"name": "DIST_P1", "type": "problem", "section": "", "statement": "in choosing a partition $A_1,\\hdots,A_k$ which minimizes\n\\Cut(A_1,\\hdots,A_k) := \\frac{1}{2}\\sum_{i=1}^k W(A_i, \\overline A_i).", "statement_clean": "in choosing a partition $A_1,\\hdots,A_k$ which minimizes\n\\Cut(A_1,\\hdots,A_k) := \\frac{1}{2}\\sum_{i=1}^k W(A_i, \\overline A_i).", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "step_info": [], "equations": [], "foundation_links": ["partition"]}, "DIST_P2": {"name": "DIST_P2", "type": "problem", "section": "", "statement": "$\\Ncut$ by the equivalent problem\nnum\n\n\\min_{A} {f' L f} \\; subject to \\; \nf as in (), \\; \nD f \\perp \\mathbb{1}, \\; \nf'Df = \\vol(V).", "statement_clean": "$\\Ncut$ by the equivalent problem\nnum\n\n\\min_{A} {f' L f} \\; subject to \\; \nf as in (), \\; \nD f \\perp \\mathbb{1}, \\; \nf'Df = \\vol(V).", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "step_info": [], "equations": []}, "DIST_P3": {"name": "DIST_P3", "type": "problem", "section": "", "statement": "the problem of minimizing $\\Ncut$ as\n\\min_{A_1,\\hdots,A_k} \\Tr(H'LH) subject to \nH'DH = I, \\; \n H as in .", "statement_clean": "the problem of minimizing $\\Ncut$ as\n\\min_{A_1,\\hdots,A_k} \\Tr(H'LH) subject to \nH'DH = I, \\; \n H as in .", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "step_info": [], "equations": []}, "DIST_P4": {"name": "DIST_P4", "type": "problem", "section": "", "statement": "namely the $\\MinmaxCut$ criterion introduced by :\n\\MinmaxCut(A_1, \\hdots,A_k):= \\sum_{i=1}^k \\frac{\\Cut(A_i,\\overline\n A_i)}{W(A_i,A_i)}.", "statement_clean": "namely the $\\MinmaxCut$ criterion introduced by :\n\\MinmaxCut(A_1, \\hdots,A_k):= \\sum_{i=1}^k \\frac{\\Cut(A_i,\\overline\n A_i)}{W(A_i,A_i)}.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "step_info": [], "equations": []}, "DIST_T1": {"name": "DIST_T1", "type": "theorem", "section": "", "statement": "To implement spectral clustering in practice one has to compute the\nfirst $k$ eigenvectors of a potentially large graph Laplace matrix.\nLuckily, if we use the $k$-nearest neighbor graph or the\n$\\ensuremath{\\varepsilon}$-neighborhood graph, then all those matrices are sparse.\nEfficient methods exist to compute the first eigenvectors of sparse\nmatrices, the most popular ones being the power method or Krylov\nsubspace methods such as the Lanczos method . The\nspeed of convergence of those algorithms depends on the size of the\neigengap (also called spectral gap) $\\gamma_k\n= |\\lambda_k - \\lambda_{k+1}|$. The larger this eigengap is, the\nfaster the algorithms computing the first $k$ eigenvectors converge. \\\\\n\nNote that a general problem occurs if one of the eigenvalues under\nconsideration has multiplicity larger than one. For example, in the\nideal situation of $k$ disconnected clusters, the eigenvalue $0$ has\nmultiplicity $k$. As we have seen, in this case the eigenspace is\nspanned by the $k$ cluster indicator vectors. But unfortunately, the\nvectors computed by the numerical eigensolvers do not necessarily\nconverge to those particular vectors. Instead they just converge to\nsome orthonormal basis of the eigenspace, and it usually depends on\nimplementation details to which basis exactly the algorithm converges.\nBut this is not so bad after all. Note that all vectors in the space\nspanned by the cluster indicator vectors $\\mathbb{1}_{A_i}$ have the\nform $u = \\sum_{i=1}^k a_i \\mathbb{1}_{A_i}$ for some coefficients\n$a_i$, that is, they are piecewise constant on the clusters. So the\nvectors returned by the eigensolvers still encode the information\nabout the clusters, which can then be used by the $k$-means\nalgorithm to reconstruct the clusters. \\\\\n\n\\subsection{The number of clusters} \n\nChoosing the number $k$ of clusters is a general problem for all\nclustering algorithms, and a variety of more or less successful\nmethods have been devised for this problem. In model-based clustering\nsettings there exist well-justified criteria to choose the number of\nclusters from the data. Those criteria are usually based on the\nlog-likelihood of the data, which can then be treated in a frequentist\nor Bayesian way, for examples see . In settings where\nno or few assumptions on the underlying model are made, a large\nvariety of different indices can be used to pick the number of\nclusters. Examples range from ad-hoc measures such as the ratio of\nwithin-cluster and between-cluster similarities, over\ninformation-theoretic criteria (), the gap statistic\n(), to stability approaches (;\n; ). Of course all those\nmethods can also be used for spectral clustering. Additionally, one\ntool which is particularly designed for spectral clustering is the\neigengap heuristic, which can be used for all three graph\nLaplacians. Here the goal is to choose the number $k$ such that all\neigenvalues $\\lambda_1, \\hdots, \\lambda_k$ are very small, but\n$\\lambda_{k+1}$ is relatively large.\n\nThere are several justifications for this procedure. The first one is\nbased on perturbation theory, where we observe that in the ideal case\nof $k$ completely disconnected clusters, the eigenvalue $0$ has\nmultiplicity $k$, and then there is a gap to the $(k+1)$th eigenvalue\n$\\lambda_{k+1} > 0$. Other explanations can be given by spectral\ngraph theory. Here, many geometric invariants of the graph can be\nexpressed or bounded with the help of the first eigenvalues of the\ngraph Laplacian. In particular, the sizes of cuts are closely related\nto the size of the first eigenvalues. For more details on this topic\nwe refer to , and . \\\\\n\nWe would like to illustrate the eigengap heuristic on our toy example\nintroduced in Section . For this purpose we\nconsider similar data sets as in Section , but to\nvary the difficulty of clustering we consider the Gaussians with\nincreasing variance. The first row of Figure \nshows the histograms of the three samples. We construct the 10-nearest\nneighbor graph as described in Section , and plot\nthe eigenvalues of the normalized Laplacian $L_{rw}$ on\nthe different samples (the results for the unnormalized Laplacian are\nsimilar). The first data set consists of four well separated clusters,\nand we can see that the first 4 eigenvalues are approximately 0. Then\nthere is a gap between the 4th and 5th eigenvalue, that is $|\\lambda_5 -\n\\lambda_4|$ is relatively large. According to the eigengap heuristic,\nthis gap indicates that the data set contains 4 clusters. The same\nbehavior can also be observed for the results of the fully connected\ngraph (already plotted in Figure ). So we\ncan see that the heuristic works well if the clusters in the data are\nvery well pronounced.\n\nHowever, the more noisy or overlapping the clusters are, the less\neffective is this heuristic. We can see that for the second data set\nwhere the clusters are more ``blurry'', there is still a gap between\nthe 4th and 5th eigenvalue, but it is not as clear to detect as in the\ncase before. Finally, in the last data set, there is no well-defined\ngap, the differences between all eigenvalues are approximately the\nsame. But on the other hand, the clusters in this data set overlap so\nmuch that many non-parametric algorithms will have difficulties to\ndetect the clusters, unless they make strong assumptions on the underlying\nmodel. In this particular example, even for a human looking at the\nhistogram it is not obvious what the correct number of clusters should\nbe. This illustrates that, as most methods for choosing the number of\nclusters, the eigengap heuristic usually works well if the data\ncontains very well pronounced clusters, but in ambiguous cases it also\nreturns ambiguous results.\\\\", "statement_clean": "To implement spectral clustering in practice one has to compute the\nfirst $k$ eigenvectors of a potentially large graph Laplace matrix.\nLuckily, if we use the $k$-nearest neighbor graph or the\n$\\ensuremath{\\varepsilon}$-neighborhood graph, then all those matrices are sparse.\nEfficient methods exist to compute the first eigenvectors of sparse\nmatrices, the most popular ones being the power method or Krylov\nsubspace methods such as the Lanczos method . The\nspeed of convergence of those algorithms depends on the size of the\neigengap (also called spectral gap) $\\gamma_k\n= |\\lambda_k - \\lambda_{k+1}|$. The larger this eigengap is, the\nfaster the algorithms computing the first $k$ eigenvectors converge. \\\\\n\nNote that a general problem occurs if one of the eigenvalues under\nconsideration has multiplicity larger than one. For example, in the\nideal situation of $k$ disconnected clusters, the eigenvalue $0$ has\nmultiplicity $k$. As we have seen, in this case the eigenspace is\nspanned by the $k$ cluster indicator vectors. But unfortunately, the\nvectors computed by the numerical eigensolvers do not necessarily\nconverge to those particular vectors. Instead they just converge to\nsome orthonormal basis of the eigenspace, and it usually depends on\nimplementation details to which basis exactly the algorithm converges.\nBut this is not so bad after all. Note that all vectors in the space\nspanned by the cluster indicator vectors $\\mathbb{1}_{A_i}$ have the\nform $u = \\sum_{i=1}^k a_i \\mathbb{1}_{A_i}$ for some coefficients\n$a_i$, that is, they are piecewise constant on the clusters. So the\nvectors returned by the eigensolvers still encode the information\nabout the clusters, which can then be used by the $k$-means\nalgorithm to reconstruct the clusters. \\\\\n\n\\subsection{The number of clusters} \n\nChoosing the number $k$ of clusters is a general problem for all\nclustering algorithms, and a variety of more or less successful\nmethods have been devised for this problem. In model-based clustering\nsettings there exist well-justified criteria to choose the number of\nclusters from the data. Those criteria are usually based on the\nlog-likelihood of the data, which can then be treated in a frequentist\nor Bayesian way, for examples see . In settings where\nno or few assumptions on the underlying model are made, a large\nvariety of different indices can be used to pick the number of\nclusters. Examples range from ad-hoc measures such as the ratio of\nwithin-cluster and between-cluster similarities, over\ninformation-theoretic criteria (), the gap statistic\n(), to stability approaches (;\n; ). Of course all those\nmethods can also be used for spectral clustering. Additionally, one\ntool which is particularly designed for spectral clustering is the\neigengap heuristic, which can be used for all three graph\nLaplacians. Here the goal is to choose the number $k$ such that all\neigenvalues $\\lambda_1, \\hdots, \\lambda_k$ are very small, but\n$\\lambda_{k+1}$ is relatively large.\n\nThere are several justifications for this procedure. The first one is\nbased on perturbation theory, where we observe that in the ideal case\nof $k$ completely disconnected clusters, the eigenvalue $0$ has\nmultiplicity $k$, and then there is a gap to the $(k+1)$th eigenvalue\n$\\lambda_{k+1} > 0$. Other explanations can be given by spectral\ngraph theory. Here, many geometric invariants of the graph can be\nexpressed or bounded with the help of the first eigenvalues of the\ngraph Laplacian. In particular, the sizes of cuts are closely related\nto the size of the first eigenvalues. For more details on this topic\nwe refer to , and . \\\\\n\nWe would like to illustrate the eigengap heuristic on our toy example\nintroduced in Section . For this purpose we\nconsider similar data sets as in Section , but to\nvary the difficulty of clustering we consider the Gaussians with\nincreasing variance. The first row of Figure \nshows the histograms of the three samples. We construct the 10-nearest\nneighbor graph as described in Section , and plot\nthe eigenvalues of the normalized Laplacian $L_{rw}$ on\nthe different samples (the results for the unnormalized Laplacian are\nsimilar). The first data set consists of four well separated clusters,\nand we can see that the first 4 eigenvalues are approximately 0. Then\nthere is a gap between the 4th and 5th eigenvalue, that is $|\\lambda_5 -\n\\lambda_4|$ is relatively large. According to the eigengap heuristic,\nthis gap indicates that the data set contains 4 clusters. The same\nbehavior can also be observed for the results of the fully connected\ngraph (already plotted in Figure ). So we\ncan see that the heuristic works well if the clusters in the data are\nvery well pronounced.\n\nHowever, the more noisy or overlapping the clusters are, the less\neffective is this heuristic. We can see that for the second data set\nwhere the clusters are more ``blurry'', there is still a gap between\nthe 4th and 5th eigenvalue, but it is not as clear to detect as in the\ncase before. Finally, in the last data set, there is no well-defined\ngap, the differences between all eigenvalues are approximately the\nsame. But on the other hand, the clusters in this data set overlap so\nmuch that many non-parametric algorithms will have difficulties to\ndetect the clusters, unless they make strong assumptions on the underlying\nmodel. In this particular example, even for a human looking at the\nhistogram it is not obvious what the correct number of clusters should\nbe. This illustrates that, as most methods for choosing the number of\nclusters, the eigengap heuristic usually works well if the data\ncontains very well pronounced clusters, but in ambiguous cases it also\nreturns ambiguous results.\\\\", "origin": "external", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "step_info": [], "equations": [], "foundation_links": ["number", "Graph Laplacian", "graph", "Orthonormal", "Basis", "nearest neighbor", "Variance", "connected", "histogram", "Range", "matrix", "clustering", "Definition:Orthonormal Basis", "Spectral Clustering", "constant", "Definition:Graph Theory", "Subspace", "Definition:Perturbation Theory", "Log Likelihood", "Vectors", "Eigenvalue", "Algorithms", "Convergence", "Measures", "ratio", "algorithm"]}, "DIST_D1": {"name": "Both matrices are closely related to each other and", "type": "definition", "section": "", "statement": "Both matrices are closely related to each other and are defined as \\ba & L_{\\text{sym}} := D^{-1/2} L D^{-1/2} = I - D^{-1/2} W D^{-1/2}\\\\ & L_{\\text{rw}} := D^{-1} L = I - D^{-1} W. \\ea We denote the first matrix by $L_{\\text{sym}}$ as it is a symmetric matrix, and the second one by $L_{\\text{rw}}$ as it is closely related to a random walk.", "statement_clean": "Both matrices are closely related to each other and are defined as \\ba & L_{\\text{sym}} := D^{-1/2} L D^{-1/2} = I - D^{-1/2} W D^{-1/2}\\\\ & L_{\\text{rw}} := D^{-1} L = I - D^{-1} W. \\ea We denote the first matrix by $L_{\\text{sym}}$ as it is a symmetric matrix, and the second one by $L_{\\text{rw}}$ as it is closely related to a random walk.", "origin": "paper", "origin_citation": "", "assumptions": [], "conclusions": [], "proof_info": [], "input": [], "output": [], "steps": [], "step_info": [], "equations": [], "foundation_links": ["matrix", "Random walk", "Definition:Symmetric Matrix"]}};

    _lastDetailNode = null;

  _lastDetailNode = nodeId;
  // Special case: orphan/misc node
  if (nodeId === '__orphan__') {
    var h = '<h3 style="margin:0 0 8px;font-size:16px;">Misc: Unconnected Equations</h3>';

  // Origin badge — paper (default) or external (cited prior result)

  // Pre-build equation maps by context
  var eqsByCtx = {statement:[], assumption:[], conclusion:[], orphan:[]};
  var eqsByStep = {};
  if (d.equations) {
    d.equations.forEach(function(e) {
      if (e.parent_step) {
        if (!eqsByStep[e.parent_step]) eqsByStep[e.parent_step] = [];
        eqsByStep[e.parent_step].push(e);
      } else if (e.context && eqsByCtx[e.context]) {
        eqsByCtx[e.context].push(e);
      } else {
        eqsByCtx.orphan.push(e);
      }
    });
  }
  var eqTag = function(e) { return '<span style="color:#2471A3;font-size:11px;"> (' + e.id + ')</span>'; };
  var eqBlock = function(e) { return '<div style="margin:2px 0 2px 12px;padding:3px 8px;background:#EBF5FB;border-left:2px solid #5DADE2;font-size:12px;">' + esc(e.id) + ': ' + esc(e.statement) + '</div>'; };

  // Statement + inline statement equations
  if (d.statement) {
    h += '<div class="detail-section"><h4>Statement</h4><div style="font-size:14px;">' + esc(d.statement) + '</div>';
    eqsByCtx.statement.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Assumptions + inline assumption equations
  if ((d.assumptions && d.assumptions.length > 0) || eqsByCtx.assumption.length > 0) {
    h += '<div class="detail-section"><h4>Assumptions</h4>';
    if (d.assumptions) d.assumptions.forEach(function(a) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(a) + '</div>'; });
    eqsByCtx.assumption.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Conclusions + inline conclusion equations
  if ((d.conclusions && d.conclusions.length > 0) || eqsByCtx.conclusion.length > 0) {
    h += '<div class="detail-section"><h4>Conclusions</h4>';
    if (d.conclusions) d.conclusions.forEach(function(c) { h += '<div style="font-size:13px;padding:2px 0 2px 10px;">&bull; ' + esc(c) + '</div>'; });
    eqsByCtx.conclusion.forEach(function(e) { h += eqBlock(e); });
    h += '</div>';
  }
  // Proof strategy
  if (d.proof_info && d.proof_info.length > 0) {
    h += '<div class="detail-section"><h4>Proof Strategy</h4>';
    d.proof_info.forEach(function(p) {
      if (Array.isArray(p)) {
        p.forEach(function(item) { h += '<div style="font-size:13px;font-style:italic;">&bull; ' + esc(item) + '</div>'; });
      } else {
        h += '<div style="font-size:13px;font-style:italic;">' + esc(p) + '</div>';
      }
    });
    h += '</div>';
  }
  // Algorithm input/output
  if (d.input && d.input.length > 0) {
    h += '<div class="detail-section"><h4>Input</h4>';
    d.input.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  if (d.output && d.output.length > 0) {
    h += '<div class="detail-section"><h4>Output</h4>';
    d.output.forEach(function(x) { h += '<div style="font-size:13px;">&bull; ' + esc(x) + '</div>'; });
    h += '</div>';
  }
  // Proof / algorithm steps with inline equations. v2: algorithm_step folded
  // into parent algorithm; render same panel but title by parent type.
  // Port #5: heading mirrors HEAD's "Decomposition (N steps)" wording.
  if (d.steps && d.steps.length > 0) {
    var stepKind = (d.type === 'algorithm') ? 'Decomposition' : 'Decomposition';
    h += '<div class="detail-section"><h4>' + stepKind + ' (' + d.steps.length + ' steps)</h4>';
    d.steps.forEach(function(s, i) {
      var ord = (s.step_order || (i + 1));
      var label = s.name ? esc(s.name) : esc(s.id || ('Step ' + ord));
      var body = s.statement_clean || s.statement || '';
      h += '<div class="step-item"><strong>' + ord + '. ' + label + '</strong>';
      if (s.subclass) {
        h += ' <span style="font-size:11px;font-style:italic;color:#666;">[' + esc(s.subclass) + ']</span>';
      }
      if (body) {
        h += '<div style="font-size:12px;color:#444;margin-top:2px;">' + esc(body) + '</div>';
      }
      if (eqsByStep[s.id]) {
        eqsByStep[s.id].forEach(function(e) { h += eqBlock(e); });
      }
      h += '</div>';
      if (i < d.steps.length - 1) h += '<div class="step-arrow">&#8595;</div>';
    });
    h += '</div>';
  }
  // Orphan equations (collapsible)
  if (eqsByCtx.orphan.length > 0) {
    h += '<div class="detail-section"><h4 style="cursor:pointer;" onclick="toggleEqPanel(this)">Unplaced Equations (' + eqsByCtx.orphan.length + ') &#9660;</h4>';
    h += '<div style="display:none;">';
    eqsByCtx.orphan.forEach(function(e) {
      h += '<div class="eq-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>';
    });
    h += '</div></div>';
  }
  panel.innerHTML = h;
  panel.className = "open";
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([panel]).catch(function(){});
}
function resetView() {
  document.getElementById("detail-panel").className = "";
  document.getElementById("detail-panel").innerHTML = "";
}
function toggleOrphans() {
  var p = document.getElementById("orphan-panel");
  if (p.style.display === "block") { p.style.display = "none"; return; }
  var h = "";
  ORPHANS.forEach(function(e) { h += '<div class="orphan-item"><strong>' + e.id + '</strong> (Sec ' + e.section + '): ' + esc(e.statement) + '</div>'; });
  document.getElementById("orphan-list").innerHTML = h;
  p.style.display = "block";
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([p]).catch(function(){});
}
// Ghost nodes (Foundation) — selector covers both "ghost_*" and "ghostbook_*"
// so a single toggle hides/shows the entire foundation overlay (mathlib AND book).
function toggleGhosts() {
  var svgEl = document.querySelector("#svg-container svg");
  var ghostEls = svgEl ? svgEl.querySelectorAll('[id^="ghost"]') : [];
  var btn = document.getElementById("ghost-btn");
  var isShowing = btn.dataset.showing === "1";
  if (!isShowing) {
    btn.dataset.showing = "1";
    ghostEls.forEach(function(el) { el.style.display = ""; });
    // Reflect subset toggles to "on" too.
    var mb = document.getElementById("ghost-mathlib-btn");
    var bb = document.getElementById("ghost-book-btn");
    if (mb && !mb.disabled) mb.dataset.showing = "1";
    if (bb && !bb.disabled) bb.dataset.showing = "1";
  } else {
    btn.dataset.showing = "0";
    ghostEls.forEach(function(el) { el.style.display = "none"; });
    var mb = document.getElementById("ghost-mathlib-btn");
    var bb = document.getElementById("ghost-book-btn");
    if (mb && !mb.disabled) mb.dataset.showing = "0";
    if (bb && !bb.disabled) bb.dataset.showing = "0";
  }
}

// Port #1: Foundation subset toggles. Show/hide ghost elements whose gid
// suffix matches the subset's index list. Indices come from
// GHOST_BOOK_INDICES (book entries) / GHOST_OTHER_INDICES (mathlib/herald).
function _toggleGhostSubset(btnId, indices, prefix) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  var btn = document.getElementById(btnId);
  if (!btn || btn.disabled) return;
  var nextShowing = !(btn.dataset.showing === "1");
  btn.dataset.showing = nextShowing ? "1" : "0";
  indices.forEach(function(gi) {
    // Box, header, text, refs for this ghost
    ["box", "header", "text", "refs"].forEach(function(kind) {
      var el = svgEl.querySelector('[id="' + prefix + '_' + kind + '_' + gi + '"]');
      if (el) el.style.display = nextShowing ? "" : "none";
    });
    // Edges: <prefix>_edge_<gi>_<ti> — match all by gi prefix scan.
    var edges = svgEl.querySelectorAll('[id^="' + prefix + '_edge_' + gi + '_"]');
    edges.forEach(function(e) { e.style.display = nextShowing ? "" : "none"; });
  });
}
function toggleGhostsMathlib() {
  // Mathlib/proofwiki/herald entries use the "ghost" prefix.
  _toggleGhostSubset("ghost-mathlib-btn", GHOST_OTHER_INDICES, "ghost");
}
function toggleGhostsBook() {
  // Book entries use the "ghostbook" prefix.
  _toggleGhostSubset("ghost-book-btn", GHOST_BOOK_INDICES, "ghostbook");
}

// Port #1: "Has proof" toggle — highlight theorem-like nodes with a non-empty
// proof_info by toggling a CSS class on the body rect.
function toggleHasProof() {
  var btn = document.getElementById("has-proof-btn");
  if (!btn || btn.disabled) return;
  var nextShowing = !(btn.dataset.showing === "1");
  btn.dataset.showing = nextShowing ? "1" : "0";
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  HAS_PROOF_NODE_IDS.forEach(function(nid) {
    var safeNid = String(nid).replace(/ /g, "_");
    var body = svgEl.querySelector('[id="node_' + safeNid + '"]');
    if (!body) return;
    var pathEl = body.tagName === "path" ? body : body.querySelector("path");
    if (!pathEl) return;
    if (nextShowing) {
      pathEl.setAttribute("data-prev-stroke", pathEl.getAttribute("stroke") || "");
      pathEl.setAttribute("data-prev-strokewidth", pathEl.getAttribute("stroke-width") || "");
      pathEl.setAttribute("stroke", "#5D4037");
      pathEl.setAttribute("stroke-width", "3");
    } else {
      pathEl.setAttribute("stroke", pathEl.getAttribute("data-prev-stroke") || "");
      pathEl.setAttribute("stroke-width", pathEl.getAttribute("data-prev-strokewidth") || "");
    }
  });
}

// Port #4: Generic helper to hide/show a set of nodes by id.
// Bug 1 fix: also hide/show every edge incident to the toggled nodes via
// NODE_TO_EDGES, so we don't leave dangling arrows pointing into empty space.
function _setNodeVisibility(nodeIds, visible, extraClass) {
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  var edgeGids = {};  // collect unique edge gids touching any toggled node
  nodeIds.forEach(function(nid) {
    var safeNid = String(nid).replace(/ /g, "_");
    var body = svgEl.querySelector('[id="node_' + safeNid + '"]');
    if (body) {
      body.style.display = visible ? "" : "none";
      if (extraClass) {
        if (visible) body.classList.add(extraClass); else body.classList.remove(extraClass);
      }
    }
    var sibs = svgEl.querySelectorAll('[id^="node_' + safeNid + '__"]');
    sibs.forEach(function(el) {
      el.style.display = visible ? "" : "none";
    });
    var incident = NODE_TO_EDGES[nid] || [];
    incident.forEach(function(g) { edgeGids[g] = true; });
  });
  Object.keys(edgeGids).forEach(function(g) {
    var el = svgEl.querySelector('[id="' + g + '"]');
    if (el) el.style.display = visible ? "" : "none";
  });
}

// Examples & Remarks toggle
function toggleAux() {
  var btn = document.getElementById("aux-btn");
  if (btn.disabled) return;
  var nextShowing = !(btn.dataset.showing === "1");
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(AUX_NODE_IDS, nextShowing, "node-aux-shown");
}

// Cited Results (External) toggle — also applies dashed border when shown,
// matching HEAD's visual differentiation of external nodes.
function toggleExternal() {
  var btn = document.getElementById("ext-btn");
  if (btn.disabled) return;
  var nextShowing = !(btn.dataset.showing === "1");
  btn.dataset.showing = nextShowing ? "1" : "0";
  _setNodeVisibility(EXT_NODE_IDS, nextShowing);
  var svgEl = document.querySelector("#svg-container svg");
  if (!svgEl) return;
  EXT_NODE_IDS.forEach(function(nid) {
    var safeNid = String(nid).replace(/ /g, "_");
    var body = svgEl.querySelector('[id="node_' + safeNid + '"]');
    if (!body) return;
    var pathEl = body.tagName === "path" ? body : body.querySelector("path");
    if (!pathEl) return;
    if (nextShowing) {
      pathEl.setAttribute("stroke-dasharray", "6,3");
      pathEl.setAttribute("stroke-width", "2");
    } else {
      pathEl.removeAttribute("stroke-dasharray");
      pathEl.removeAttribute("stroke-width");
    }
  });
}
function showGhostDetail(nameOrEl) {
  var name = (typeof nameOrEl === 'string') ? nameOrEl : nameOrEl;
  var panel = document.getElementById("detail-panel");
  var refs = GHOSTS[name] || [];
  var h = '<h3 style="margin:0 0 8px;font-size:16px;">' + esc(name) + '</h3>';
  h += '<div style="font-size:12px;color:#795548;margin-bottom:10px;">External dependency (from Foundation Graph)</div>';
  h += '<div class="detail-section"><h4>Referenced by</h4>';
  refs.forEach(function(nid) {
    var d = DETAILS[nid];
    var label = d ? (nid + ': ' + (d.name || d.type)) : nid;
    h += '<div style="font-size:13px;padding:2px 0 2px 10px;cursor:pointer;color:#2471A3;" data-nid="' + nid + '" onclick="showDetail(this.dataset.nid)">&bull; ' + esc(label) + '</div>';
  });
  h += '</div>';
  panel.innerHTML = h;
  panel.className = "open";
}


function toggleEqPanel(el) {
  var panel = el.nextElementSibling;
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
function esc(t) { return t ? t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : ""; }

// Hide ghost elements on load (wait for SVG to render)
window.addEventListener("load", function() {
  var svgEl = document.querySelector("#svg-container svg");
  if (svgEl) {
    // Hide all foundation ghost elements (mathlib AND book-derived).
    // The [id^="ghost"] selector covers both "ghost_*" and "ghostbook_*".
    var all = svgEl.querySelectorAll('[id^="ghost"]');
    all.forEach(function(el) { el.style.display = "none"; });
  }
  // Port #2: Cited Results (External) hidden by default — matches HEAD.
  _setNodeVisibility(EXT_NODE_IDS, false);
});

var currentZoom = 1.0;
var svgEl = document.querySelector("#svg-container svg");
function applyZoom() {
  if (svgEl) svgEl.style.transform = "scale(" + currentZoom + ")";
}
function zoomIn() { currentZoom = Math.min(currentZoom * 1.3, 5.0); applyZoom(); }
function zoomOut() { currentZoom = Math.max(currentZoom / 1.3, 0.2); applyZoom(); }
function zoomFit() { currentZoom = 1.0; applyZoom(); }

// Mouse wheel zoom on the SVG container
document.getElementById("svg-container").addEventListener("wheel", function(e) {
  e.preventDefault();
  if (e.deltaY < 0) { currentZoom = Math.min(currentZoom * 1.1, 5.0); }
  else { currentZoom = Math.max(currentZoom / 1.1, 0.2); }
  applyZoom();
}, {passive: false});
</script>
